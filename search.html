原2.5.3-優良4)\n5.「交付」處方箋有加印二維條碼功能。(原 2.5.3-優良5)\n[註]\n1.高警訊藥品如抗癌藥劑、降血糖針劑、抗凝血劑、毛地黃針劑、高濃度氯化鉀(KCl)及肌肉鬆弛劑針劑等。\n2.特殊需求族群，如：智能障礙者、文盲、外籍看護或移工(外籍勞工)等。\n評量方法及建議佐證資料：\n1.藥品辨識作業規範。(符合)\n2.藥品管理作業規範。(符合/優良)","cs":"符合項目 4，以西藥藥包查核為原則。","p":217,"ch":"2.5"},{"n":"2.5.5","tags":[],"t":"處方醫令系統或類似機制應設有防止用藥錯誤及不適當之機制","ev":"目的：藥品處方前後能利用各種警示及稽核機制，防止用藥錯誤。\n符合項目：\n1.在處方的醫令系統(physician order entry system)或類似機制上有防止錯誤用藥或不適當之警示機制，如：極量管制、重覆、交互作用、過敏等之警告。(原2.5.4-符合1)\n2.建立醫師與藥師溝通合作機制，如：電話溝通、書面照會等，以討論不適當處方。(原2.5.4-符合2)\n優良項目：(下述項目(不含試評項目)僅限一項未達成)\n1.對於特殊需求者(如孕婦、老人或兒童等)醫令系統能有處方防誤機制。(原 2.5.4-優良1)\n2.有其他強化醫令系統之機制或功能，如：用藥史(medication history)、藥品過敏史及藥品不良反應史、不當處方之改善成效列為系統自動稽核項目或程序。(原2.5.4-優良2)\n3.對於處方醫令系統警示機制之實施，有定期評估檢討、改善。(原2.5.4-優良 3)\n4.針對門診病人設置多重用藥之監管系統，如是老人與小兒等敏感族群，適時回饋資訊給醫師與藥師，並建立用藥整合機制，以減少藥物副作用與管控藥物浪費。(試)\n5.醫師處方系統，導入智慧化檢核資訊及時整合病人相關數據，提供醫療決策之參考。(試)\n[註]\n優良項目 4、5列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.處方的醫令系統警示機制。(符合)\n2.處方用藥稽核機制及檢討紀錄。(符合/優良)","cs":"","p":218,"ch":"2.5"},{"n":"2.5.6","tags":[],"t":"藥品庫存管理訂有辦法，並確實執行","ev":"目的：醫院應有完善的藥品管理制度，確保藥品品質、效期及數量，提供醫院臨床用藥需求。\n符合項目：\n1.藥品庫存管理應由藥事人員負責，對於院內藥品建立庫存存量及效期管制機制，確保醫院用藥品質。(原2.5.5-符合1、3併)\n2.訂有藥品採購、驗收辦法，並有專責人員負責之。(原2.5.5-符合1修)\n3.災害(地震或天災等)發生時院內緊急治療及處置所需之藥品需列表並保有適當之庫存量。(原2.5.5-符合2)\n4.特殊需冷藏藥品需有健全管理。(原2.5.5-符合 4)\n5.疫苗儲存不可與其他藥品混雜，要有明確清楚標示。(原 2.5.5-符合5)\n6.醫院應制訂藥品不良品通報機制，並指定專責單位或人員負責，包含退貨與換貨程序。(試)\n優良項目：(下述項目僅限一項未達成)\n1.藥庫之藥品庫存量及進出量，應與調劑單位一致，並據以設定適當的訂購量及訂購時間間隔。(原2.5.5-優良1)\n2.定期檢查各種藥品之品質及保管，並有紀錄可查。(原2.5.5-優良2)\n3.電腦化管理藥品庫存及效期，使用適當的庫存管理系統，維持適當庫存週轉率。(原2.5.5-優良3修)\n4.使用條碼輔助藥庫作業系統。(原2.5.5-優良 3修)\n[註]\n1.一般及特殊藥品管理均應依政府相關規定辦理，放射性製劑及化療藥品之儲存、運送、配置及廢棄物處理，應符合相關法規並定有規章規範。\n2.藥品管理包含：\n(1)能依藥品種類存放，並應注意環境溫度、濕度管理，且應注意環境清潔。\n(2)藥品儲存環境具符合標準之安全措施(如防盜、防火、防爆、防蟲等)。\n(3)藥用酒精應存放於通風良好及有消防設備之場所，並須與危險性或易燃性物品隔離，以策安全。\n(4)防腐劑、外用藥、消毒劑等藥品與內服藥、注射劑分區儲存。\n(5)藥品名稱、外觀或外包裝相似之藥品，應分開放置並作明確標示。\n3.通報欄位可參考衛生福利部食品藥物管理署官方網站公告之藥品不良品通報表。\n4.符合項目 6列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.藥品庫存管理辦法。(符合/優良)\n2.藥品採購、驗收相關辦法。(符合)\n3.環境溫濕度紀錄表。(符合)\n4.冷藏藥品冰箱溫度監測紀錄。(符合)\n5.藥品不良品通報紀錄。(符合)\n6.藥品品質及保管相關之定期檢查紀錄。(優良)","cs":"1.符合項目 1所指「藥事人員」，依藥事法第 15條規定，藥師業務包含藥品販賣或管理、藥品儲備、供應及分裝之監督等，故藥品庫存管理應由藥事人員負責(包含藥師及藥劑生；惟管制藥品應由藥師負責管理)，另得在藥事人員監督下，由輔助人力協助庫存管理。\n2.評量項目[註]2-(3)所提藥用酒精之存放環境，雖未特別規定須使用防爆箱，惟建議應注意通風良好，並宜有固定裝置(防傾倒設計)，且與危險性或易燃性物品隔離。","p":219,"ch":"2.5"},{"n":"2.5.7","tags":["合"],"t":"依「藥品優良調劑作業準則」訂定調劑作業程序，並確實執行","ev":"目的：落實「藥品優良調劑作業準則」，防止調劑疏失，保障用藥安全。\n符合項目：符合「藥品優良調劑作業準則」(Good Dispensary Practice, GDP)條文，符合下述條件且有調劑品質監測：(原2.5.6-符合)門急診調劑：\n1.處方箋上印載之項目完整。\n2.接受處方後，評估及確認處方之適當性。\n3.發現問題處方即刻知會醫師處理，且留有紀錄，並做統計分析及有改進措施。\n4.調劑作業雙重覆核。\n5.應有門診病人直接取得處方箋之設計。\n6.實施病人用藥指導。\n7.藥袋之標示完整，符合衛生福利部公告規定。\n8.調劑後藥事人員於處方箋上簽名或蓋章。住院調劑：\n1.住院與急診暫留之紙本或電子醫囑記載完整或單一劑量所給予之藥品均標示藥品名稱、含量等。(原2.5.6住院調劑-符合1修)\n2.接受處方或藥囑後，須有病人完整藥歷核對以評估處方之適當性。\n3.發現問題處方即刻知會醫師處理，且留有紀錄，並做統計分析及有改進措施。\n4.能對病人實施用藥指導服務。\n5.有自動停止給藥之設計。\n6.調劑作業雙重覆核。\n7.若實施單一劑量(UDD)作業，藥師接受醫師直接的醫囑，依完整的藥歷調劑以確保用藥適當性及正確性。\n[註]\n1.調劑品質監測、管制措施包含調劑疏失之控管，包含實施調劑疏失預防措施、調劑疏失之紀錄與統計分析、即時通知相關單位補正調劑疏失及相關改善成效評估與宣導。\n2.處方內容應包括病人基本資料、疾病診斷、就診科別、及藥品名稱、劑型、劑量、用法、使用天數等資訊，並應有醫師之簽章。\n3.藥袋標示應符合醫療法第 66 條規定及衛生福利部(原行政院衛生署)99年 10月5日衛署醫字第0990211898 號函示，醫院、診所對於診治之病人交付藥劑時，應於容器或包裝上載明病人姓名，性別，藥品(包含學名及商品名)、劑量、數量、用法、作用或適應症、警語或副作用、醫療機構名稱與地點、調劑者姓名及調劑年、月、日；中藥藥袋標示應包括「原方劑名」「商品名」。\n評量方法及建議佐證資料：\n1.藥品優良調劑作業準則。(符合)\n2.門診調劑：處方箋及藥袋。(符合)\n3.住院調劑：處方醫囑及藥歷。(符合)","cs":"","p":221,"ch":"2.5"},{"n":"2.5.8","tags":[],"t":"訂定化學治療藥品及特殊混合注射藥品之調劑及給藥作業程序","ev":"目的：訂定特殊混合注射藥品之作業規範，保障病人及醫療照護團隊的用藥安全。\n符合項目：\n1.特殊混合注射藥品(化學治療藥品、全靜脈注射營養(Total Parenteral Nutrition, TPN)、病人自控式止痛(Patient-Controlled Analgesia, PCA))之調劑業務應由藥師執行，且應有無菌調劑足夠設備及有效之防護措施。(原2.5.7-符合1)\n2.執行藥師需具備藥品管理、用藥禁忌及調配步驟操作等知識，並有危機處理流程與訓練。(原2.5.7-符合2)\n3.藥師應評估化學治療藥囑之適當性，並應訂有調劑作業手冊，例行作業也有紀錄可查。(原2.5.7-符合3)\n4.化學治療藥品給藥前須再確認病人藥歷，並評估病人生理狀況之合適性，如：肝腎功能等。(原2.5.7-符合4)\n5.化學治療藥品及其他特殊藥品之給藥途徑、方法及注意事項，應預先提供資訊予醫療照護團隊參考。(原2.5.7-符合5)\n優良項目：(下述項目僅限一項未達成)\n1.無菌製劑調製應有標準作業流程，符合相關規定並定期查核。(原2.5.7-優良 1)\n2.藥師應與醫療照護團隊討論且有紀錄可查。(原2.5.7-優良2)\n3.化療針劑或輸液調配完成後，應符合密閉系統概念，得以保護相關工作同仁，例如使用密閉裝置配製給藥。(原2.5.7-優良3)\n4.醫院應提供化學治療藥品調配及給藥之醫事人員健康維護措施，包括定期健康檢查。(原2.5.7-優良4)\n[註]病患自控式止痛法(PCA)使用成癮性麻醉藥品指引暨管理注意事項(衛生福利部食品藥物管理署 107 年 12 月 4 日 FDA 管字第 1071800821號公告)。\n評量方法及建議佐證資料：\n1.藥品優良調劑作業準則(含特殊混合注射藥品調劑作業規範)。(符合/優良)","cs":"","p":222,"ch":"2.5"},{"n":"2.5.9","tags":["合"],"t":"訂定正確用藥標準作業程序並落實正確給藥","ev":"目的：醫療人員給藥前應檢核病人藥歷，協助病人彙整用藥，落實正確給藥。\n符合項目：\n1.訂定正確給藥標準作業程序、執行策略及內容。(原2.5.8-符合1)\n2.應對病人所接受的治療與之前的處方用藥進行連貫性審視，且有紀錄。(原 2.5.8-符合2)\n3.能正確依醫囑給藥，給藥時確認病人姓名、藥品名稱、劑量、用法、途徑、時間，並有紀錄。(原2.5.8-符合3)\n4.門診交付藥品時應訂定確認領藥人之標準作業流程及機制。(原2.5.8-符合 4)\n5.住院病人之內服、注射藥等，應由醫療人員遵照相關標準作業規定，依給藥紀錄核對藥品名稱，並確認給藥量、單位含量、劑型、給藥方法、病人姓名、途徑、時間正確，才能給藥。(原2.5.8-符合5)\n6.明訂退藥或藥品更改機制。(原2.5.8-符合6)\n7.住院病人若有自備藥品時，醫院應有自備藥品使用規範。(原 2.5.8-符合 7 修)\n8.多劑量包裝的注射劑型藥品在開封後應標註開封日期，並應依廠商說明使用，超過開封後可使用期限應立即丟棄；若廠商說明書未載明開封後可使用期限，應依藥典規範或根據操作環境、流程及藥品特性，審慎訂定使用期限，則最長不可超過 28天。(試)\n[註]\n1.可查看給藥紀錄(完成每位病人每次給藥後，立即逐筆簽名或蓋章)、治療紀錄，並可詢問醫療人員執行情形，必要時可詢問病人。\n2.符合項目 8列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.正確用藥標準作業程序。(符合)\n2.自備藥品使用規範。(符合)","cs":"","p":224,"ch":"2.5"},{"n":"2.5.10","tags":[],"t":"提供適當之臨床藥學服務且提供適當藥品資訊","ev":"目的：藥劑部門應提供醫療人員藥品諮詢及臨床藥學服務，提升藥事作業品質。\n符合項目：\n1.提供療劑監測(Therapeutic Drug Monitoring, TDM)服務。(原2.5.9-優良3修)\n2.設有藥物不良反應工作小組或類似組織，執行藥物不良反應通報及宣導(Adverse Drug Reaction, ADR)。(原2.5.9-符合1)\n3.有藥品交互作用評估機制。(原2.5.9-符合2)\n4.應執行藥品使用評估(Medication Use Evaluation, MUE)。(原2.5.9-符合3)\n5.對於提供臨床藥學服務有定期評估、檢討與改善。(原2.5.9-優良4)\n6.提供醫療專業人員即時、正確的藥品諮詢服務，並有紀錄。(原2.5.9-符合4)\n7.編有醫院處方集並適時更新。(原2.5.9-符合 5)\n8.訂有適當、適量的期刊、雜誌、電子資料庫及參考書等，且存放於方便藥師取用之執業場所，以提供適切的諮詢服務。(原2.5.9-符合6)\n優良項目：(下述項目(不含試評項目)僅限一項未達成)\n1.專責藥師負責藥物不良反應(Adverse Drug Reaction, ADR)通報及分析檢討。(試)\n2.提供病人個別化之藥品治療評估。(原2.5.9-優良2)\n3.提供之療劑監測(Therapeutic Drug Monitoring, TDM)服務，有藥品療效之後續追蹤評估，提出建議獲醫師接受。(原2.5.9-優良3修)\n4.能適時更新藥品資訊系統，以供醫療人員、病人及民眾即時參考。(原2.5.9-優良5)\n5. 制 定 政 策 與 指 引 ， 藥 師 適 時 提 供 用 藥 連 貫 性 (medication reconsciliation)服務，如新入院、轉入/轉出加護病房或出院準備之複雜用藥病人。(試)\n6.加護病房配置持續固定參與醫療團隊，提供臨床藥事照護之專責藥師。(試)\n7.提供藥師門診服務。(試)\n[註]\n1.藥品交互作用評估包含：\n(1)有紀錄。\n(2)有通知。\n(3)有檢討改進。\n(4)有預防措施。\n2.提供病人個別化之藥品治療評估包含：\n(1)時效性良好。\n(2)用藥劑量之計算正確。\n(3)服藥間隔之調整適當。\n(4)對建議事項接受度之檢討。\n(5)對藥品療效作後續追蹤評估。\n3.療劑監測(Therapeutic Drug Monitoring, TDM)包含藥品血中濃度監測：\n(1)抽血時間正確。\n(2)監測建議報告時效性良好。\n(3)提供劑量與頻次調整建議。\n(4)對TDM 建議事項之醫師接受度檢討。\n(5)作藥品療效之後續追蹤評估。\n4.提供用藥連貫性(medication reconciliation)服務包含：\n(1)在病人轉換照護單位時，了解病人目前所有用藥，必要時協助辨識藥品。\n(2)評估用藥的適當性。\n(3)偵測並處理藥品治療問題。\n(4)確保應使用的藥品持續使用。\n(5)調整或停用造成問題的藥品，確保應停用的藥品不再使用。\n(6)將資訊傳達到下一個照護單位。\n5.藥師門診係指於醫院設立藥師専責之特別門診，門診病人經專科醫師轉介或病人自行掛號，由藥師提供使用特定藥品/疾病病人門診臨床藥事服務，此藥療照護管理模式需有具體成效並有藥事服務紀錄併同病歷保存。\n6.優良項目 1、5、6、7 列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.臨床藥學服務手冊。(符合/優良)\n2.處方集(含電子處方集)。(符合)\n3.臨床藥學相關期刊、雜誌、電子資料庫及參考書。(符合)","cs":"","p":225,"ch":"2.5"},{"n":"2.5.11","tags":[],"t":"病房及各部門的藥品供應，訂有妥善配送制度，並有緊急用藥之因應措施","ev":"目的：藥劑部門能適切提供院內各部門藥品需求並掌握存量。\n符合項目：\n1.提供病房及各部門的藥品應有妥善配送制度及監督管理機制，病房給藥實施單一劑量配送制度，採用物流系統時，應與各部門協調議訂配送計畫，依計畫配送。(原2.5.10-符合 1)\n2.有24 小時之藥事作業服務(含急診、住院)。(原2.5.10-符合2)\n3.具有常備藥品管理制度。(原2.5.10-符合3)\n4.定期由藥師查核病房及各部門的藥品保存狀況，並有紀錄。(原2.5.10-符合4)\n5.應有緊急調撥藥品的處理機制。(原2.5.10-優良1)\n優良項目：(下述項目僅限一項未達成)\n1.緊急藥品供應機制暢通。(原2.5.10-優良2)\n2.緊急時，藥師能即時提供藥事服務。(原2.5.10-優良3)\n3.內部有滿意度調查，定期檢討單一劑量或物流供應流程，提出改進措施並確實執行，具體提升各單位對配送制度滿意。(原2.5.10-優良4)\n[註]常備藥品管理制度一般包含：\n1.要求各單位應將一般藥品與高警訊藥品分開放置，並按程序管理與使用，以保障病人給藥安全。\n2.原則上儘量減少品項及數量，專科病房以不超過 10 項為原則(不含急救車上藥品、大量點滴及 1-3 級管制藥品、置於自動調配藥櫃(automated dispensing cabinets)的藥品、非單一病人計價藥品，如消毒液、軟膏或耗材藥品)，並應定期檢討。\n3.常備藥均能標示有效日期。\n4.由藥師定期查核各單位常備藥品使用及保存情形並有紀錄。\n評量方法及建議佐證資料：\n1.常備藥品管理規範。(符合)\n2.緊急調撥藥品處理機制。(符合/優良)\n3.藥師查核病房及各部門藥品的紀錄。(符合)","cs":"1.評量項目[註]1，高警訊藥品應區隔放置，並明顯標示(可避免誤取)。\n2.評量項目[註]2：\n(1)各類胰島素相關製劑 NPH 及 RI可以不需分開列計。\n(2)可不列計消毒液、軟膏或耗材藥品。\n3.若病房有設有冰箱存放藥品(含血液製劑)，如需同時放置檢體或冰寶等，應至少分層分開置放，並明確區隔及標示，勿混合交錯放置，且嚴禁置放食物與飲料。","p":227,"ch":"2.5"},{"n":"2.5.12","tags":[],"t":"確實執行病人用藥教育","ev":"目的：落實病人用藥教育，協助病人正確用藥，保障用藥安全。\n符合項目：\n1.建立慢性病人長期用藥監測機制，防止重複用藥或藥品交互作用，應提供病人適當的用藥指導，必要時提供病人用藥紀錄。(原2.5.11-符合1)\n2.設有多元化病人用藥諮詢管道，如藥品諮詢、專題衛教、藥品諮詢查詢網站、電話專線、e-mail 等，提供病人藥品使用資訊，或反映藥品使用問題，以加強病人對所用藥品的認識並提高病人對醫囑的遵從性。(原2.5.11-符合2)\n3.藥師應提供病人用藥指導，且視病人情況修正病人不當用藥行為，並留下紀錄。(原2.5.11-符合3)\n優良項目：(下述項目(不含試評項目)僅限一項未達成)\n1.交付藥品給病人前應主動提供用藥指導並確認病人已暸解，說明內容包含藥品名稱、劑型、用藥方式、服用時間、藥品作用及副作用。(原2.5.11-優良1)\n2.實施病人用藥教育指導，必要時應做後續追蹤評估，統計分析及檢討改進措施，並有紀錄。(原2.5.11-優良2)\n3.有評估檢討病人用藥教育成效，進行改善。(原2.5.11-優良3)\n4.實施病人用藥教育指導時，若病人有多重用藥情形，應加強與病人之溝通，提供正確用藥教育。(試)\n[註]\n優良項目 4列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.病人用藥指導紀錄。(符合/優良)","cs":"","p":229,"ch":"2.5"},{"n":"2.5.13","tags":["合"],"t":"病人對藥品使用的反應及病情變化，醫療人員應正確且迅速處理","ev":"目的：醫療人員應告知用藥之副作用及不良反應，監測病人用藥療效及副作用，並能立即處理及通報，減少傷害。\n符合項目：\n1.高警訊藥品等需要注意給藥速度、給藥量等，應在給藥中及給藥後觀察病人之狀況，出現異常時，須通知醫師並記錄。(原2.5.12-符合1)\n2.對於病人使用藥品後應觀察反應，若有不良反應發生時，應適當處理並予以通報及記錄。(原2.5.12-符合2)\n3.應適當提供病人與家屬有關藥品使用之副作用、應注意事項等之諮詢，且能確認病人或家屬對藥品作用清楚並了解。(原2.5.12-符合3)\n4.要注意病人個別特異性，給藥前，給予用藥指導；在給藥後，應觀察病人反應，如有異常反應，應與醫師確認且有紀錄。(原2.5.12-符合4)\n5.對異常反應有詳實記錄並檢討改善。(原2.5.12-符合5)\n評量方法及建議佐證資料：\n1.臨床藥學服務手冊。(符合)\n2.ADR 通報規範及相關表單。(符合)","cs":"","p":230,"ch":"2.5"},{"n":"2.6.1","tags":["合"],"t":"適當之手術、麻醉部門體制及人力配置","ev":"目的：配置適當的手術、麻醉照護人力，確保病人獲得專業的醫療服務。\n符合項目：\n1.應明訂手術、麻醉部門之體制及專責人員。(原2.6.1-符合1)\n(1)有負責的醫師。\n(2)有負責的護理長。\n(3)麻醉病例年平均 1,500 次以上應有1名專任麻醉專科醫師。\n(4)麻醉專科醫師執行之重度鎮靜麻醉業務，病例年平均每 4,500 人次應有 1名專任麻醉專科醫師。(試)\n(5)訂有機制監測麻醉診療品質，以確保病人安全，如手術室總數與專任麻醉專科醫師總數比例不超過 2。(試)\n(6)麻醉專科醫師需具備一般醫學(general medicine)與手術全期照護之專業能力，能處理重症照護的病人，並有適當之專業分工，如：疼痛或心臟胸腔麻醉分科。(試)\n2.若手術醫師或麻醉醫師為兼任者，須有合宜的訓練與考核，其職務行使權應比照專任專科醫師。(試)\n3.工作人員排班表適當且確實執行。(原2.6.1-符合3)\n4.麻醉護理人員人力配備應具有一年(含)以上之麻醉專業訓練並領有訓練合格證書者。(試)\n[註]\n符合項目 1-(4)、1-(5)、1-(6)、2、4列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.組織架構。(符合)\n2.班表。(符合)\n3.手術業務統計。(符合)\n4.麻醉業務統計。(符合)\n5.重度鎮靜與麻醉統計表。(符合)\n6.麻醉護理人員麻醉專業訓練合格證書。(符合)","cs":"符合項目 1-(3)係指麻醉病例年平均每 1,500 人次要 1 名麻醉專科醫師，惟麻醉病例列計範圍，係由麻醉專科醫師所執行之向健保署申報麻醉給付案例計算。","p":231,"ch":"2.6"},{"n":"2.6.2","tags":[],"t":"備齊手術相關設施、設備及儀器，並應定期保養、維護與清潔，且有紀錄可查","ev":"目的：定期保養、檢查手術相關設施、設備及儀器，維持其功能正常，確保手術作業的清潔及安全。\n符合項目：\n1.手術室相關設施、設備及儀器應符合醫療機構設置標準、滿足手術量及診療科別需求，且手術儀器設備等資源能整合運用。(原 2.6.2-符合1)\n2.手術室、器材準備室、更衣室、討論室、休息室有足夠使用的空間。(原2.6.2-符合2)\n3.有全身麻醉機可自動監控測定血壓計、心電圖、呼吸數、氧氣飽和度或二氧化碳濃度等數據(手術室應至少有一台去震顫器defibrillator)，並設置麻醉氣體排放系統，功能良好。(原 2.6.2-符合4)\n4.有專責人員負責手術室設施、設備及儀器之保養、檢查的排程與執行，且有計畫性的汰舊換新。(原2.6.2-符合 5)\n5.由專業人員定期施行氧氣、笑氣等配管及空調的安全檢查。(原2.6.2-符合6)\n6.設置異常管理手冊，以因應儀器設備如發生故障時之作業流程。(原2.6.2-符合 7)\n7.在大規模醫院應配置專任的醫工人員。(原 2.6.2-符合8)\n8.有明確手術室分區作業管理辦法、標示及整潔規則。(原 2.6.2-符合9)\n9.手術室及恢復室有符合感染管制原則的清潔管理且有紀錄可查，如：(原2.6.2-符合10)\n(1)定期水質監測。\n(2)空調系統及除塵設備，定期維護。\n(3)污物處理設備，功能良好且定期維護。\n10.手術室管理單位應訂有政策，檢討手術煙霧之減量與排除，視需要提供工作人員呼吸防護具，如：N95等級以上口罩。(試)\n優良項目：(下述項目僅限一項未達成)\n1.有HEPA 過濾、高規格之手術室，且手術室內保持正壓(室內壓力高於室外)，至少一年確認正壓一次。(原2.6.2-優良1)\n2.每一手術房間應可監測 End-tidal CO ，且應有體溫測量及麻醉氣體2和脈搏血氧飽和分析儀(pulse oximeter)。(原 2.6.2-優良 2)\n3.應有適量專用 fibrobronchoscopy 及其他困難插管之相關設備與 TEE和麻醉深度監測儀。(原2.6.2-優良3)\n4.執行手術室清潔查核，有感染管制的環境監測機制，並依據查核結果檢討改善。(原2.6.2-優良4)\n5.手術室動線規劃良好，工作人員進入手術室更換手術室服裝，手術室內外服裝未混合穿著，且落實執行。(原 2.6.2-優良5)\n[註]\n1.手術器械數量足夠與否，可用快消使用頻率來監測。\n2.符合項目 10列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.異常管理手冊。(符合)\n2.儀器設備的保養排程。(符合/優良)\n3.手術室環境動線。(符合)\n4.水質監測報告。(符合)\n5.空調、除塵及汙物處理設備維護紀錄。(符合)\n6.清潔管理查核紀錄及檢討會議改善紀錄。(優良)","cs":"1.符合項目 7 所提「專任醫工人員」非指手術室使用人員，而為醫院配置專責醫工人員。\n2.符合項目 9-(1)所提「定期水質監測」，其監測時間及監測規範請由醫院自行定義。\n3.優良項目 3，fibrobronchoscopy可視醫院狀況進行設置，以能因應緊急使用為原則。","p":232,"ch":"2.6"},{"n":"2.6.3","tags":[],"t":"具手術室工作手冊及手術室日誌且定期召開手術室管理委員會，並有會議紀錄檢討手術及麻醉相關品質","ev":"目的：藉由手術室管理委員會議，有效管理手術室作業，提升手術醫療品質。\n符合項目：\n1. 具有工作手冊並定期更新。手術室日誌應記錄完整，且有統計分析。手術室日誌的內容應提報至手術室管理會議定期檢討。(原 2.6.3-符合1)\n2. 需成立管理委員會，成員應包括手術、麻醉部門負責醫師、手術室負責護理人員、執行手術的診療科別及行政管理單位代表。(原2.6.3-符合2)\n3. 至少每 3 個月召開一次手術室管理委員會並有紀錄可查。(原 2.6.3-符合3)\n4.會議紀錄內容應包含手術排程表的調整、手術室日誌內容、手術室之安全管理、清潔管理、儀器之購置保養、檢查，及維修情形。(原2.6.3-符合 4)\n5.定期召開手術全期(peri-operative)跨領域團隊會議：(試)\n(1)對於高風險病例，外科系與麻醉科部應於術前召開會議或有相互溝通的機制，討論治療策略與共識。(試)\n(2)外科系與麻醉科部定期舉行手術全期併發症術後檢討會議，應提出改善機制。(試)\n(3)必要時應與他科(如：急診、加護重症照護單位、感染科、營養、藥劑等部門)共同檢討提升手術全期照護品質。(試)\n優良項目：(下述項目僅限一項未達成)\n1.針對會議結果有檢討、追蹤及執行改善紀錄。(原2.6.3-優良1)\n2.針對手術全期(peri-operative)跨領域團隊會議結果，術前會議結論能被有效執行，並預防意外事件的發生；術後會議有確實檢討、決議有追蹤及執行改善。(原2.6.3-優良1修)\n3.應有手術及麻醉品質及病人安全監測指標，並有定期改善計畫及紀錄；持續進行品質提升及病人安全活動，例如：手術病人辨識、手術部位註記、手術及麻醉同意書之填寫。(原2.6.3-優良2)\n4.手術室管理委員會有具體管理成效。(原2.6.3-優良3)\n[註]\n1.手術品質指標：手術死亡率(術後 48 小時內死亡率)、手術感染率、剖腹產率及同次住院期間非計畫相關重返手術室。\n2.麻醉品質指標：\n(1)科部具有對於麻醉前評估、麻醉中併發症、恢復室不良事件之麻醉品質有定期監測之機制與成果。\n(2)針對上述監測定期(每月)召開全科部檢討會議並提出改善方案。\n(3)定期討論並修正上述品質內容與標準閾值。\n3.符合項目 5列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.手術室日誌。(符合)\n2.手術室管理委員會會議紀錄。(符合/優良)\n3.手術排程作業規範。(符合)\n4.指標監測紀錄。(優良)\n5.改善成效。(優良)","cs":"","p":234,"ch":"2.6"},{"n":"2.6.4","tags":[],"t":"手術排程管理適當，對於緊急手術有適當的因應措施","ev":"目的：藉由適當的手術排程，確保病人於合理時間獲得適切手術治療。\n符合項目：\n1.有負責手術排程作業之專責人員，不因手術室的排程計畫不當，以致為等候手術而延長住院日。(原2.6.4-符合 1)\n2.在工作時間外及休假日亦可依病情需要適時施行緊急手術。(原2.6.4-符合 2)\n3.遇大量傷患時，應有應變措施方案或應變計畫。每位麻醉、手術及護理人員對應變計畫均瞭解並能執行。(原 2.6.4-符合3)\n優良項目：(下述項目僅限一項未達成)\n1.第 1 台手術可準時開始，且常規手術(elective surgery)可在預定時間內執行；臨時排常規手術(elective surgery)定期於手術管理委員會定期檢討。(原2.6.4-優良 1)\n2.緊急手術有資深醫師執行或在場指導。(原 2.6.4-優良2修)\n3.訂有危急病人緊急手術的明確定義及其合理等候時間。急診手術等候時間合理，且有定期檢討改善。(原2.6.4-優良3修)\n4.手術排程管理有具體改善成效。(原2.6.4-優良 4)\n評量方法及建議佐證資料：\n1.手術排程作業規範。(符合)\n2.臨時緊急手術的因應機制。(符合)\n3.排程管理改善實例。(優良)","cs":"1.符合項目 2 所提「緊急手術」對象涵蓋急診與住院的危急病人。\n2.優良項目 1，由醫院自行訂定臨時排常規手術之管控機制，並有檢討紀錄。\n3.優良項目 2所提「資深醫師」，由醫院自行訂定。\n4.優良項目 3 所提「急診手術等候時間合理」，由醫院自訂合理時間。","p":236,"ch":"2.6"},{"n":"2.6.5","tags":[],"t":"應於手術前向病人充分說明，取得同意，並簽署同意書","ev":"目的：取得手術同意書前應向病人、家屬溝通及詳盡說明。\n符合項目：\n1.手術前應說明手術方式及其優缺點、手術或非手術等之其他替代治療方法。(原2.6.5-符合 1)\n2.說明手術、麻醉、處置的必要性及不做時之利害、得失，且具體說明危險性及合併症，並說明萬一發生時之處置方法。(原2.6.5-符合2)\n3.對於服用可能影響手術麻醉安全之藥品的病人，如抗凝血劑與抗血小板製劑，醫師應與原診療醫師或相關專科醫師討論停藥之合宜性與時機，並向病人家屬充分說明，取得其同意。(試)\n4.上列各項，以淺顯易懂的言辭向病人及家屬說明，並鼓勵其發問。(原2.6.5-符合3)\n5.說明後，並經病人同意，簽具手術同意書，前項同意書之簽具，病人為未成年人或無法親自簽具者，得由其法定代理人、配偶、親屬或關係人簽具。(原2.6.5-符合4)\n優良項目：(下述項目(不含試評項目)須全部達成)\n1.利用圖及影像或其他輔具，以淺顯易懂的方式說明手術方法，並提供書面資料。特定高風險之手術或麻醉，應以醫病共享決策模式進行說明，以達成醫病共識。(原2.6.5-優良1 修)\n2.能以資訊系統協助搜尋病人是否服用可能影響手術麻醉安全之藥品，如抗凝血劑與抗血小板製劑，以提示醫師停藥。(試)\n3.針對術前訪視有病人滿意度調查，定期檢討改善，且具有成效。(原2.6.5-優良 2)\n[註]\n1.應使用衛生福利部 106 年 11 月 2 日衛部醫字第 1061665692 號公告之手術、麻醉同意書為原則。\n2.符合項目 3 及優良項目 2 列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.標準作業規範。(符合)\n2.抽查病歷紀錄之手術及麻醉同意書。(符合)\n3.改善成效。(優良)","cs":"","p":237,"ch":"2.6"},{"n":"2.6.6","tags":[],"t":"麻醉醫師於術前探視病人並確立麻醉計畫","ev":"目的：麻醉醫師執行麻醉前評估，瞭解病情及評估風險，確立安全合適的麻醉計畫。\n符合項目：\n1.麻醉醫師麻醉前應執行麻醉前評估，評估麻醉風險與解釋風險並建議可能之麻醉方式。(原2.6.6-符合1修)\n2.由麻醉科專科醫師負責執行麻醉作業，應以淺顯易懂的方式向病人或其家屬說明麻醉方式、可能副作用、相關注意事項等，並鼓勵其發問及取得麻醉同意書。依上列結果檢討選擇最適當的麻醉方法。(原2.6.6-符合2)\n優良項目：(下述項目(不含試評項目)僅限一項未達成)\n1.訂立麻醉計畫，並可由診療紀錄查閱，且麻醉計畫內容紀錄詳實且執行品質優良。(原2.6.6-優良1)\n2.術前及術後訪視確實執行並有紀錄及檢討。有進行滿意度調查，定期檢討改善，成效良好。(原2.6.6-優良2)\n3.應針對高危險病人進行術前預防措施，定期檢討改善，成效良好。(原2.6.6-優良3)\n4.手術前，因外科或麻醉風險而延遲或取消手術應有統計及檢討。(試)\n5.常規排程手術之麻醉前評估，應事先完成溝通解釋，避免於當日手術室等候區或入口進行。(試)\n[註]\n1.應使用 106年11月2日衛福部公告之新版麻醉同意書為原則。\n2.優良項目 4、5列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.標準作業規範。(符合)\n2.查核紀錄。(優良)\n3.改善成效。(優良)\n4.抽查病歷紀錄之麻醉說明書及同意書。(符合/優良)","cs":"","p":238,"ch":"2.6"},{"n":"2.6.7","tags":[],"t":"確實落實手術病人辨識程序，確保病人身分、手術項目與手術部位正確無誤","ev":"目的：訂定並落實執行手術病人的辨識作業程序，確保病人及手術部位之正確性。\n符合項目：\n1.應明確訂定手術室進出標準，並落實執行。(原2.6.7-符合1)\n2.交接病人時，採取下列具體對策確認病人身分：(原2.6.7-符合2)\n(1)如病人能表達，應讓病人說出自己的姓名。\n(2)帶識別帶、手環。\n(3)如病人意識不清時，應有其他辨識病人機制。\n3.有確認手術部位之機制，落實於進入手術室前完成手術部位標記。(原2.6.7-符合3修)\n4.於所有手術後應執行 sign-out，如棉球、紗布、尖銳物品、器械等數量正確，組織檢體內容物及數量、標籤正確。(試)\n優良項目：(下述項目須全部達成)\n1.於所有手術及處置前應執行作業靜止(Time out)，由手術室所有成員共同再次確認(包含病人身分、手術方式及手術部位)。(原2.6.7-優良1)\n2.手術病人辨識有持續性稽核及檢討改善，以確保病人安全。(原2.6.7-優良2)\n[註]\n符合項目 4列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.標準作業規範。(符合)\n2.查核紀錄。(優良)\n3.改善成果。(優良)\n4.病歷紀錄之相關表單。(符合/優良)","cs":"","p":239,"ch":"2.6"},{"n":"2.6.8","tags":["合"],"t":"手術室以外之麻醉與鎮靜作業應適當執行","ev":"目的：落實手術室外執行麻醉與鎮靜標準作業程序，維護病人安全。\n符合項目：\n1.麻醉作業應於手術室執行，如於手術室外其他地點執行麻醉或中度以上鎮靜作業，醫院應訂有管理政策與標準作業流程，並有病人安全之相關監測機制，確實執行。(原2.6.8-符合 1修)\n2.手術室以外之麻醉或重度鎮靜，必須由麻醉專科醫師執行，且應遵從與手術室相當之相關作業要求，含術前評估、術中監測及術後照顧。(試)\n3.訂定鎮靜作業之政策與標準作業程序，並規範執行輕度、中度鎮靜作業時，醫師與護理人員的資格與訓練要求。(試)\n[註]\n1.在中度、輕度鎮靜下進行複雜或長時間之手術(檢查)，如果鎮靜風險提高，執行中度、輕度鎮靜的醫師及協助執行之護理人員應與手術(檢查)醫師及協助手術(檢查)之護理人員應分開不同人執行。\n2.符合項目 2、3列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.手術室外麻醉作業之相關規範。(符合)\n2.監測儀器設備與急救設備。(符合)\n3.麻醉(鎮靜)前評估、麻醉(鎮靜)中監測及麻醉(鎮靜)後恢復準則。(符合)\n4.鎮靜作業之規範或標準作業程序。(符合)\n5.執行鎮靜作業之手術室以外地點總表。(符合)\n6.手術室以外執行之鎮靜作業，應提供品質監測、異常事件與檢討改善措施。(符合)","cs":"1.醫院應實際作業情形，自行訂定監測範圍及內容，且基於病人安全考量，於手術室以外地點執行中度、輕度鎮靜之醫師，應有麻醉鎮靜相關訓練，其相關時數則由醫院自行認定；另，目前並未規定須定期更新相關訓練證照。\n2.急診、加護病房或病人緊急狀況時，不在此限。","p":240,"ch":"2.6"},{"n":"2.6.9","tags":[],"t":"詳實記載麻醉紀錄及手術紀錄","ev":"目的：藉由手術及麻醉紀錄的即時性、正確性及完整性，並對紀錄有統計分析、檢討改善，保證照護的醫療品質。\n符合項目：\n1.手術紀錄、麻醉紀錄應於術後 24小時完成，並註明日期及記錄者簽名。(原 2.6.9-符合1)\n2.手術內容應根據事實詳實紀錄，必要時佐以圖畫及清楚易懂的說明。(原2.6.9-符合2)\n3.手術護理紀錄應包含器械清點及紗布、刀片及縫針數量核計結果之記載無誤。(原2.6.9-符合3)\n4.手術檢體應正確標記病人身分、部位及數量等。(原2.6.9-符合4修)\n優良項目：(下述項目須全部達成)\n1.手術、麻醉紀錄完整，並有統計分析及檢討。(原2.6.9-優良1)\n2.能藉統計分析，改善品質，且具有成效。(原2.6.9-優良2)\n評量方法及建議佐證資料：\n1.手術、麻醉紀錄。(符合)\n2.檢體處理紀錄。(符合)\n3.相關統計報表。(優良)\n4.改善成效。(優良)","cs":"","p":241,"ch":"2.6"},{"n":"2.6.10","tags":[],"t":"訂定手術前後之護理照護常規及處置步驟，確實執行、製成護理紀錄及適時修正","ev":"目的：藉由手術前、後護理作業規範之訂定及落實執行，彰顯護理照護品質。\n符合項目：\n1.明訂手術前、中及後的護理照護常規及處置步驟，確實遵行，並有護理紀錄。(原2.6.10-符合)\n優良項目：(下述項目須全部達成)\n1.護理照護紀錄內容詳實，有檢討改善。(原 2.6.10-優良1)\n2.護理人員有依病人特性(高危險性、較嚴重、老年人、小孩等)在術前施行病人訪談，並紀錄詳實。(原2.6.10-優良 2)\n評量方法及建議佐證資料：\n1.護理照護常規。(符合)\n2.查核紀錄。(優良)\n3.抽查病歷中之手術護理紀錄。(符合/優良)","cs":"","p":242,"ch":"2.6"},{"n":"2.6.11","tags":[],"t":"手術後恢復過程應適切管理，且明訂術後恢復室等之使用基準及步驟","ev":"目的：藉由手術恢復室照護標準的訂定，落實術後病人的照護管理。\n符合項目：\n1.設有供術後病人麻醉後恢復之照護場所，且備有所需之監測儀器設備。(原 2.6.11-符合1)\n2.設有專人負責病人麻醉後恢復之照護。(原 2.6.11-符合2)\n3.訂有具體評估標準以資判斷術後恢復過程(意識狀態、血壓、呼吸狀況等)。(原2.6.11-符合 3)\n4.訂定恢復室中病人的照護標準和步驟(含病人交接程序)，並落實執行。(原 2.6.11-符合4)\n優良項目：(下述項目須全部達成)\n1.應有麻醉或手術恢復室病人的照護紀錄及檢討。(原2.6.11-優良1)\n2.有恢復室發生併發症之紀錄及檢討。(原2.6.11-優良2)\n評量方法及建議佐證資料：\n1.標準作業規範。(符合)\n2.恢復室病人的照護紀錄。(符合/優良)\n3.併發症檢討紀錄。(優良)","cs":"","p":242,"ch":"2.6"},{"n":"2.7.1","tags":["重"],"t":"成立感染管制會，有定期開會並有紀錄，且確實執行會議決議事項","ev":"目的：醫院應設立感染管制相關單位，並確實執行感染管制各項業務，以達感染管制目的。\n符合項目：\n1.設有感染管制會(以下簡稱感管會)，具有組織章程及成員資料備查。感管會主席為醫院主管(院長或副院長，且為醫師)；成員至少應包含內科、外科、急診部門、行政部門、職安部門、護理部門、醫檢部門等代表，如有設置中醫、牙醫部門亦須納入。(原2.7.2-符合1修)\n2.感管會負責醫院內感染管制政策擬定及督導事宜，至少每 3 個月召開一次會議並有會議紀錄備查，會議紀錄均由院長批示，且決議事項均照會相關單位執行。(原2.7.2- 3修)\n3.醫院需訂有感染管制年度工作計畫(program)及執行情形，包括前次查核不符合事項改善情形及建議事項參採情形與相關因應策略，應提交感管會報告，監督執行情形。(試)\n優良項目：(下述項目須全部達成)\n1.感管會成員中有1位曾接受流行病訓練者。(原2.7.2-優良1)\n2.依醫院規模、特殊疫情或院內發生突發感染事件等，適當增加開會之頻率。(原2.7.2-優良 3)\n[註]\n符合項目 3列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.感管會組織章程及成員資料。(符合)\n2.感管會會議紀錄。(符合)\n3.感染管制年度工作計畫(program)及執行情形。(符合)\n4.前次查核不符合事項改善情形及建議事項參採情形。(符合)\n5.流行病學訓練相關證明。(優良)\n6.增加臨時加開之開會會議紀錄。(優良)","cs":"評鑑委員可參考受評醫院上次之感染管制查核結果及意見。","p":244,"ch":"2.7"},{"n":"2.7.2","tags":[],"t":"應設立感染管制單位，聘有合格且足夠之感染管制人力負責業務推行","ev":"目的：醫院應有足夠之感染管制人力負責執行感染管制各項業務，以提升感染管制品質。\n符合項目：\n1.設有感染管制部門，應明訂工作職責及組織圖之定位，並對感染管制部門的業務執行，在經費、人力、空間及資訊需求都能有實質的支援。(原2.7.1-符合1 修)\n2.依規定置有下列人員，負責感染管制業務推行；總床數 500床以上：每500床應有接受感染症醫學訓練之專任專科醫師1人以上；每300床應有專任感染管制護理人員 1 人以上；全院專責感染管制醫檢人員1人以上。(原2.7.1-符合2、3併)\n3.上述人員前一年參加專業學會認可之感染管制訓練需達 20 學分以上。(原 2.7.1-符合2、3併)\n優良項目：(下述項目(不含試評項目)須全部達成)\n1.感染管制部門為直接隸屬於院本部(院長室)下的獨立單位。(原2.7.1-優良1 修)\n2.增加感染管制單位人力配置，負責感染管制業務推行：總床數 500床以上：\n(1)每300 床聘有接受感染症醫學訓練之專任專科醫師 1人以上；每250 床聘有專任感染管制護理人員 1 人以上；全院專任感染管制醫檢人員 1人以上。(原2.7.1-優良2、3 併)\n(2)每200 床聘有專任感染管制護理人員 1人以上。(試)\n[註]\n1.病床數之計算係指醫事管理系統登錄開放之總病床數；若受評機構為合併評鑑之醫院，此處感染管制人員數之計算係採本院與合併院區或分院於醫事管理系統登錄開放之總病床數加總列計。\n2.名詞定義：\n(1)接受感染症醫學訓練之專任專科醫師：係指執業登記於本院之醫師，經疾病管制署認可之專業學會甄審感染管制訓練合格，負責推行並執行感染管制相關業務。\n(2)接受感染症醫學訓練之兼任專科醫師：係指聘請他院經疾病管制署認可之專業學會甄審感染管制訓練合格的醫師，協助推行感染管制相關業務；且須有正式聘書及衛生單位之支援報備相關證明。\n(3)專任感染管制護理人員：係指執業登記於本院，經疾病管制署認可之專業學會甄審感染管制訓練合格的護理師或護士，全職負責執行感染管制相關業務。\n(4)專任感染管制醫檢人員：係指執業登記於本院，經疾病管制署認可之專業學會甄審感染管制訓練合格的醫檢師(生)，全職負責辦理感染管制相關業務。\n(5)專責感染管制醫檢人員：係指聘請經疾病管制署認可之專業學會甄審感染管制訓練合格的醫檢師(生)，平時除本職業務外，協助推行感染管制相關業務。\n3.專供診治兒童之綜合醫院之感染管制人員數，得連同既有綜合醫院之規模合併計算，分別登記於各醫院。\n4.優良項目 2-(2)列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.感染管制部門工作職責及組織圖之定位。(符合)\n2.醫院對於感染管制所執行的實質支援紀錄。(符合)\n3.感染症專科醫師證書、學分證明及執業登記相關資料。(符合/優良)\n4.感染管制師(護理師、醫檢師)證書、學分證明及執業登記相關資料。(符合/優良)","cs":"評鑑委員可參考受評醫院上次之感染管制查核結果及意見。","p":245,"ch":"2.7"},{"n":"2.7.3","tags":[],"t":"制訂及更新感染管制手冊，並辦理教育訓練使員工落實執行；定期收集國內外國際疫情傳達員工知悉","ev":"目的：制訂感染管制手冊並適時更新，以提供醫院內各部門執行感染管制措施之依據。辦理教育訓練，使全院員工(含外包人員)知悉感染管制對策方法與步驟。\n符合項目：\n1.制訂感染管制手冊(設有牙醫及中醫部門者須納入)並定期修訂；手冊應記述具體感染管制對策及相關人員的感染處理對策，針對醫院服務特性，訂定如：侵入性醫療處置組合式照護、陪病及探病、院內用餐、購物環境或商店街、兒童遊戲區域等感染管制措施；並提供給相關部門，且依部門及工作人員特性提供相關教育訓練，使全院員工(含外包人員)清楚各項感染管制措施且落實執行。(原2.7.3-符合1、3併)\n2.建立全院病房陪病人員管理機制(如：運用資訊化管理或採實名制登錄等)。(試)\n3.手冊記載標準防護措施(standard precaution)，含不同感染途徑之防護措施，如：空氣傳染、飛沫傳染、接觸傳染等。(原2.7.3-符合2修)\n4.感染管制部門人員能定期利用文獻檢索或網際網路，取得最新疫情資訊，並傳達醫院各單位；工作人員清楚知道可從何處獲得最新感染管制相關資訊。(原2.7.3-符合3)\n優良項目：(下述項目須全部達成)\n1.有專人定期蒐集國內外感染管制的相關規定，參考有科學根據之建議事項，並依據醫療院所特性，適時訂定或修訂感染管制手冊。(原2.7.3-優良 1)\n2.規劃網路資訊平台定期更新傳染病與感染管制相關資訊。針對感染管制措施執行情形有定期評核及改善作為。(原2.7.3-優良3、5併)\n[註]\n1.科學根據定義如：衛生福利部疾病管制署公布之指引與工作手冊、其他國際組織(如：WHO)、國家衛生部門或國內外專業學會等公布之相關指引與建議、相關文獻(如：MMWR)等。\n2.符合項目2所提「實名制登錄」，可使用衛生福利部「護產人員暨機構管理資訊系統」登錄各病房陪病人員實名制資料，或使用醫院自行建置之系統登錄後上傳至護產系統。\n3.符合項目2列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.感染管制手冊(含牙醫及中醫感染管制作業程序)。(符合/優良)\n2.感染管制查核督導紀錄(含組合式照護等感染管制措施的遵從性稽核評估、相關改善方案的執行紀錄及成果等)。(符合)\n3.侵入性醫療感染管制標準作業程序。(符合)\n4.年度員工在職及新進人員感染管制教育訓練(包含新興與再浮現傳染病防治教育訓練)。(符合)\n5.最新疫情資訊或感染管制相關網路資訊平台。(符合/優良)","cs":"評鑑委員可參考受評醫院上次之感染管制查核結果及意見。","p":247,"ch":"2.7"},{"n":"2.7.4","tags":["重"],"t":"院內應有充足且適當之洗手設備，訂有手部衛生作業程序且有管控與稽核機制","ev":"目的：設置適當且足夠的洗手設備及訂有手部衛生作業程序，俾利醫療照護人員落實手部衛生。利用管控與稽核機制提升手部衛生遵從性與正確性。\n符合項目：\n1.濕洗手設備之位置及數量合乎實際需要且功能良好，並於濕洗手設備旁有正確洗手步驟之標示。(原2.7.4-符合 1)\n2.醫療照護相關單位濕洗手設備應設置非手控式水龍頭，如：肘動式、踏板式或感應式水龍頭等，並備有液態皂、手部消毒劑及擦手紙，或備有具去污作用之手部消毒劑及擦手紙。(原2.7.4-符合2)\n3.備有方便可及、數量足夠且功能良好之酒精性乾性洗手液(得採固定裝置或隨身瓶)，如：公共區域(醫院民眾出入口、電梯等候區、掛號櫃檯等)、急診、門診及重要節點等。(原2.7.4-符合3 修)\n4.醫療照護人員在：(1)接觸病人之前、(2)執行清潔/無菌操作技術之前、\n(3)有暴露病人體液風險之後、(4)接觸病人之後、(5)接觸病人週遭環境之後，應確實洗手(洗手可包括乾洗手)。(原2.7.4-符合4)\n5.訂有手部衛生稽核機制，定期稽核手部衛生遵從性及正確性等指標，手部衛生遵從性應達80%、正確性應達70%，稽核結果回饋受稽核單位，並留有紀錄備查。(原2.7.4-符合6修)\n優良項目：(下述項目僅限一項未達成)\n1.由副院長級以上主管推動全院手部衛生運動或臨床單位曾以品管手法，如：品管圈、標竿學習、專案改善等方式推動手部衛生。(原2.7.4-優良1 修)\n2.提報手部衛生正確率與遵從率，並進行分析檢討改進。(原 2.7.4-優良2)\n3.使用資訊系統或輔助機制提升手部衛生成效。(原2.7.4-優良3)\n評量方法及建議佐證資料：\n1.擦手紙、手部消毒劑及酒精性乾洗手液的採購量和使用量的統計資料。(符合)\n2.手部衛生遵從性及正確性、洗手設備完整性及功能性等稽核紀錄。(符合)\n3.院務層級會議紀錄或全院發表資料。(優良)\n4.以品管手法推動者應有完整的執行方案與成果報告等資料。(優良)\n5.資訊系統或輔助機制提升手部衛生成效相關資料。(優良)","cs":"評鑑委員可參考受評醫院上次之感染管制查核結果及意見。","p":249,"ch":"2.7"},{"n":"2.7.5","tags":["重"],"t":"應訂有合適之隔離措施及動線規劃，且訂有大規模感染事件發生之應變計畫，並確實執行","ev":"目的：針對各種預期可能發生的感染事件有應變計畫，且有合適的隔離措施及動線規劃。訂有合宜的個人防護裝備使用標準且定期辦理實際穿脫演練，使第一線工作人員熟悉瞭解。\n符合項目：\n1.急診、門診就醫病人分流機制及就診動線規劃適當，且張貼明顯告示，提醒就醫民眾與陪病者，出入醫療院所應佩戴口罩，並有協助未佩戴口罩就診病人佩戴口罩之措施。(原2.7.8-符合1修)\n2.對急診檢傷病人及發燒或疑似感染之門診病人有詢問並記錄旅遊史(travel history)、職業別(occupation)、接觸史(contact history)及是否群聚(cluster)之機制。(原2.7.8-符合2)\n3.依感染風險訂定適當的個人防護裝備(personal protection equipments, PPE)使用標準，如：急救插管及不明原因發燒病人等不同狀況的個人防護裝備，且第一線工作人員均瞭解；門診、急診、加護病房及負壓隔離病房定期辦理PPE教育訓練(含實際穿脫演練及密合度測試)。(原2.7.8-符合3、優良2併)\n4.訂有疑似或確定傳染病個案之分流、隔離措施及接觸者疫調追蹤標準作業程序；收治疑似或確定傳染病病人，其病人運送、人員(包含醫護人員及環境清潔等相關工作人員)穿脫PPE進出及廢棄物清理之動線規劃適當，並有適當的配套處理措施。若有負壓隔離病室，應能明確顯示負壓狀況及負壓值，並有維護保養檢測紀錄。(原2.7.8-符合4修)\n5.訂定新興傳染病疫情或大規模感染事件發生之應變計畫，並定期更新，計畫內容應包含收治隔離措施、後送機制、擬定支援單位及人員的原則及序位、疑似個案監測、清潔與消毒、緊急關閉、清空計畫、院內群聚事件作業規範、持續營運計畫及人力備援計畫，並辦理實地或桌上演練；如有新興傳染病疫情或大規模感染事件發生時，應依照衛生主管單位的最新規定，執行防疫措施及動線規劃。(原2.7.8-符合5修)\n6.於發生新興傳染病疫情或大規模感染事件(含院內群聚事件)時，針對疑似或確定傳染病之住院病人訂有分流機制，且住院服務落實良好動線規劃。(試)\n7.建立因應新興傳染病疫情或院內發生大規模感染事件成立應變團隊機制，並定期更新，由院內跨部門組成團隊，醫院主管(院長)擔任應變團隊召集人。(試)\n優良項目：(下述項目(不含試評項目)須全部達成)\n1.擬定及執行新興傳染病疫情或大規模感染事件(含院內群聚事件)發生時，支援單位及人員的訓練課程及受訓計畫。(原2.7.8-優良1修)\n2.主動協助社區內其他醫療院所及人口密集機構(含照護機構)等單位之感染管制及新興傳染疾病之病人收治，並協助防疫工作。(原2.7.8-優良3修) (試)\n3.確實執行並定期檢討修訂相關機制及因應措施。(原2.7.8-優良3)\n[註]\n符合項目 6、7 及優良項目 2 列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.急診就診流程和急診檢傷詢問病人TOCC之機制與紀錄。(符合)\n2.門診發燒或有疑似感染症狀病人的標準處置作業流程與TOCC詢問紀錄。(符合)\n3.因應不同狀況病人之個人防護裝備標準及教育訓練紀錄。(符合)\n4.疑似或確定之傳染病個案隔離措施及接觸者疫調追蹤標準作業。(符合)\n5.負壓隔離房檢測/維護紀錄。(符合)\n6.醫院因應新興傳染病疫情或大規模感染事件之應變計畫、會議紀錄及實地或桌上演練紀錄。(符合)\n7.疑似或確定傳染病住院病人分流機制及動線規劃作業原則或紀錄。(符合)\n8.因應新興傳染病疫情或院內發生大規模感染事件成立應變團隊之機制及更新紀錄。(符合)\n9.新興傳染病疫情或大規模感染事件應變計畫支援人力名冊及在職教育紀錄。(優良)\n10.與照護機構訂定之感染管制服務合約、照護機構感染管制人員實務訓練計畫或社區防疫工作紀錄。(優良)","cs":"1.評鑑委員可參考受評醫院上次之感染管制查核結果及意見。\n2.符合項目 1 所提「病人就診動線規劃適當」，動線規劃建議應以「減少交叉感染」為優先考量，再依據硬體空間、病人隱私進行調整。","p":250,"ch":"2.7"},{"n":"2.7.6","tags":[],"t":"定期對醫療照護相關感染的發生及其動向開會檢討分析，並訂定改善方案","ev":"目的：掌握院內重要之感染指標、菌種變化，導入組合式照護措施，並回饋照護團隊檢討改善後，以控制感染。有計畫且持續進行醫療照護相關感染監測及改善方案。隨時能掌握醫院醫療照護相關感染的最新狀況，採取具體且適當的感染管制措施。\n符合項目：\n1.依醫院之機能及規模，能掌握手術部位感染率、加護病房等重症單位之血流感染、泌尿道感染、肺炎及侵入性導管相關感染密度等重要感染指標。(原2.7.7-符合1修)\n2.明確訂定迅速察知病房的菌種變化機制，並且採取因應措施。(原2.7.7-符合 2)\n3.定期於院內感染管制會報告監測成果，且感染管制指標及感染個案能回饋相關醫護人員，以致力於改善措施，並制訂具體的改善方案且確實實施。(原2.7.7-符合3修)\n4.訂有院內群聚或群突發感染發生之危機處理標準作業流程，並針對發生之院內群聚或群突發感染事件有調查處理報告。(原 2.7.7-符合4)\n5.將醫療照護相關感染資料通報至衛生福利部疾病管制署「台灣醫院感染管制與抗藥性監測管理系統」。(原2.7.7-優良3修)\n優良項目：(下述項目須全部達成)\n1.確實分析數據及感染個案發生的原因，並定期檢討修訂相關機制、對應措施、感染指標種類等。(原2.7.7-優良 1 修)\n2.落實執行修訂之方案或改善計畫。(原2.7.7-優良4)\n評量方法及建議佐證資料：\n1.醫療照護相關感染的統計報表。(符合)\n2.院內群聚或群突發感染發生之處理標準作業流程及調查處理報告。(符合)\n3.疾病管制署台灣醫院感染管制與抗藥性監測管理系統的通報統計表。(符合)","cs":"評鑑委員可參考受評醫院上次之感染管制查核結果及意見。","p":253,"ch":"2.7"},{"n":"2.7.7","tags":["重"],"t":"確實執行衛材、器械、機器與內視鏡之滅菌及清潔管理","ev":"目的：建立並落實衛材與器械清潔、消毒、滅菌之標準作業程序，確實監測管理執行情形。\n符合項目：\n1.自行執行衛材、器械、機器與內視鏡之滅菌及清潔者(設有牙醫及中醫部門者須納入)：(原 2.7.14-符合1修)\n(1)各類物品之清洗、包裝、消毒、滅菌及有效期間均訂有標準。(原2.7.14-符合1-(1)修)\n(2)處理物品時，工作人員需穿戴適當的個人防護裝備。\n(3)自行滅菌之衛材包、器械包，每包內側及外側均應有化學性指示器(如：包外化學指示劑、包內化學指示劑)及標示有效日期，並讓使用者知悉。(原2.7.14-符合1-(3)修)\n(4)以高壓蒸氣滅菌時，生物指示劑至少每週施行 1次，若為抽真空式滅菌器，抽真空測試應每個開鍋日施行，並有紀錄可查。(原2.7.14-符合1-(2)修)\n(5)環氧乙烷(ethylene oxide gas, EO)滅菌時，每鍋次均使用生物指示劑(如：快速判讀生物培養苗)，設置場所應有 EO濃度監測儀或警示儀(detector)，以防止EO外洩並能及時處理。(原 2.7.14-符合1-\n(4)修)\n(6)電漿鍋依滅菌監測感染控制措施指引進行監測並有相關紀錄。(原2.7.14-符合1-(5))\n(7)滅菌過程發生異常，應有相關處理規範(含回收機制)。(原2.7.14-符合 1-(6))\n(8)消毒/滅菌相關設備應制訂維護保養規範並定期保養，若發生故障時，可迅速處理；且留存保養及維修紀錄備查。(原 2.7.14-符合1-\n(7)、1-(8)併)\n(9)軟式內視鏡(包括腸胃鏡、氣管鏡等)相關器械、設備之清洗消毒或滅菌及儲存訂有標準作業流程，並由專人負責且確實執行。(原2.7.13-符合2-(1)修)\n(10)依照說明書建議監測軟式內視鏡等相關器械、設備之清洗消毒液有效濃度，並有紀錄。(原2.7.13-符合 2-(2))\n2.消毒/滅菌過的物品應保管於清潔且空調較佳處之架子上或有門扇之櫥櫃內；並依物品名稱及消毒先後適當置放；消毒/滅菌過的物品需使用清潔並加蓋之推車搬運及配送(消毒/滅菌物品和回收物品之置放車要區分)。(原2.7.14-符合2修)\n3.衛材、器械之滅菌業務外包，或租賃手術器械，應妥善監控品質、設有管理辦法及進行例行性稽查，並有紀錄備查。(原2.7.14-符合3)\n4.各項監測有持續性紀錄；且工作人員清楚各項指標意義及處理異常情況。(原2.7.14-符合4、5併)\n優良項目：(下述項目須全部達成)\n1.訂有立即使用器械的管理機制(如：高壓蒸氣滅菌鍋)且執行成效良好；包括：確保僅限於器械緊急需要時使用，醫材於滅菌完成後立即使用且紀錄詳實(含：器械使用狀況、手術日期、病人資料、追蹤狀況等)。(原2.7.14-優良1修)\n2.定期檢討及分析消毒/滅菌過程(含內視鏡清洗消毒作業)或外包業務(含租賃手術器械)，如有異常情況應進行檢討及改善。(原 2.7.14-優良2修)\n評量方法及建議佐證資料：\n1.供應室以外之消毒/滅菌物品(含採購之無菌醫耗材)集中貯存區溫濕度監測紀錄。(符合)\n2.過期物品登記表。(符合)\n3.滅菌監測標準作業手冊、滅菌失敗物品處理機制流程、及各類滅菌監測結果(含生物監測、化學監測、抽真空監測等)與審核紀錄(含臨床單位寄消品)。(符合)\n4.高壓蒸氣滅菌鍋每日作業檢點表。(符合)\n5.環氧乙烷每日作業檢點表、監測分析報告及洩漏之緊急處理。(符合)\n6.滅菌失敗物品回收紀錄。(符合)\n7.滅菌設備保養維修紀錄與故障處理機制。(符合)\n8.內視鏡安全作業指引。(符合)\n9.內視鏡採檢流程。(符合)\n10.內視鏡或器械消毒劑有效濃度監測紀錄。(符合)\n11.外包業務(含租賃手術器械)管理辦法及品質監控稽查紀錄。(符合)\n12.立即使用器械(如：高壓蒸氣滅菌鍋等)管理機制、使用紀錄及檢討。(優良)\n13.消毒/滅菌(含外包業務)異常原因檢討與改善措施會議紀錄。(優良)\n14.內視鏡品管監測結果及改善措施與檢討會議紀錄。(優良)","cs":"1.評鑑委員可參考受評醫院上次之感染管制查核結果及意見。\n2.符合項目 1-(1)，評鑑委員需查證相關單位之消毒、滅菌物品是否於有效期限內。","p":254,"ch":"2.7"},{"n":"2.7.8","tags":[],"t":"供應室應配置適當人力，清潔區及污染區應做區隔且動線規劃合宜","ev":"目的：確保衛材與器械消毒與管理之作業程序。\n符合項目：\n1.確保必要人力之充足並有專責人員負責衛材、器械之消毒與管理業務，若設有滅菌設備，應由合格人員操作，並有護理人員監督。(原2.7.15-符合1、3併)\n2.主管應出席感染管制會，必要時專責人員應共同出席。(原2.7.15-符合2修)\n3.供應室環境整潔，清潔區及污染區應有適當的區隔；定期監測供應室滅菌物品貯存區滅菌物品溫度及濕度，並有紀錄備查。(原2.7.15-符合6、7併)\n4.醫院之衛材與器械未集中於供應室清洗、消毒與滅菌者，應依供應室之作業指引及流程辦理之。(試)\n5.針對供應室及執行軟式內視鏡清潔消毒之新進人員與在職工作人員訂有教育訓練課程，並留有紀錄備查。(試)\n優良項目：(下述項目僅限一項未達成)\n1.供應室有合宜的動線規劃和人員管理辦法。(原2.7.15-優良1)\n2.建立機制有監測數據，定期探討及分析，如有異常情況應進行檢討及改善。(原2.7.15-優良2)\n3.落實供應室之溫度及濕度控管，空調設置符合感染管制原則，並有佐證資料。(原2.7.15-優良3修)\n[註]\n1.中央主管機關指定之具有危險性設備，可參考勞動部公告之「危險性機械及設備安全檢查規則」。\n2.符合項目 4、5列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.供應室單位人員排班表。(符合)\n2.設有中央主管機關指定之具有危險性設備者，相關操作人員應具有合格證明文件，如：第一種壓力容器操作人員合格證書等。(符合)\n3.感染管制會會議紀錄。(符合)\n4.供應室工作規範。(符合)\n5.供應中心之感染管制措施。(符合)\n6.滅菌物品貯存區溫濕度監測紀錄。(符合)\n7.供應室及執行軟式內視鏡清潔消毒之新進人員與工作人員教育訓練計畫書及員工個別教育訓練紀錄文件。(符合)\n8.供應室消毒及滅菌監測小組會議紀錄。(優良)","cs":"評鑑委員可參考受評醫院上次之感染管制查核結果及意見。","p":256,"ch":"2.7"},{"n":"2.7.9","tags":["重"],"t":"落實環境清潔消毒及管理","ev":"目的：落實環境清潔工作的標準作業程序，確實管理執行情形。\n符合項目：\n1.對於環境清潔工作訂有標準作業程序並設有查檢表，且有相關機制教育環境清潔人員熟悉內容。(原2.7.13-符合1修)\n2.若設有氣管鏡室者，應具負壓或抽風等設備，且有維護保養紀錄。若有牙科診間，其診療環境應保持清潔，器械清洗完善，醫療廢棄物有妥善分類、處理；每天進行牙科治療台清潔、管路保養及消毒，並有紀錄。(原2.7.13-符合2、3併)\n3.若有加護病房或器官移植及骨髓移植等高風險病人居住的區域，訂有醫院退伍軍人病防治計畫。(原2.7.13-符合 4)\n4.針對特殊感染事件或群聚事件等異常情形發生時，具有加強環境清潔應變機制，且教育工作人員熟悉相關內容。(原2.7.13-優良5)\n優良項目：(下述項目僅限一項未達成)\n1.肺功能室具負壓或抽風等設備，且有維護保養紀錄。(原2.7.13-優良1)\n2.對監測結果定期檢討，研訂改進措施並確實落實，有紀錄備查。(原2.7.13-優良2)\n3.對於環境清潔執行情形應使用客觀之環境清潔評估工具(如螢光檢測、ATP 冷光儀測試或細菌培養等)進行環境清潔成效評估，訂有定期查核抽檢機制，將查檢結果回饋相關單位，並定期提報院內感染管制會，且有檢討流程並進行改善措施。(原2.7.13-優良4修)\n4.依據衛生福利部疾病管制署公布之「醫院退伍軍人菌環境檢測作業及其相關因應指引措施」執行供水系統之監測及採檢並有報告及檢討機制。(原2.7.13-優良3修)\n[註]器官移植係指心臟、胰臟、腎臟、肝臟、肺臟、小腸移植。\n評量方法及建議佐證資料：\n1.環境清潔工作標準作業程序、查檢表與教育訓練紀錄。(符合)\n2.氣管鏡室與肺功能室空調(抽風負壓)設備維修保養紀錄。(符合/優良)\n3.牙科治療台清潔、管路保養及消毒紀錄。(符合)\n4.醫院退伍軍人病防治計畫。(符合)\n5.環境清潔執行情形之查核抽檢結果與改善措施紀錄。(優良)\n6.退伍軍人菌環境監測及採檢報告及檢討。(優良)","cs":"評鑑委員可參考受評醫院上次之感染管制查核結果及意見。","p":258,"ch":"2.7"},{"n":"2.7.10","tags":[],"t":"抗生素管理計畫之領導與責任","ev":"目的：落實跨部門醫療團隊合作，提升抗生素管理成效。\n符合項目：\n1.醫院應設立跨部門抗生素管理小組或委員會等組織，並由副院長級以上主管擔任主席；小組成員至少應包含醫師、藥師、醫檢師、護理師及資訊人員等，每季至少開會1次。(試)\n2.每半年至少辦理1次以上全院性「適當使用抗生素」之相關講習或線上課程，且臨床醫師護理人員、藥師每年至少參加一次。(原2.7.9-符合1修)\n3.每半年至少辦理1次以上全院性「適當使用抗生素」相關講習，且臨床醫師、護理人員、醫檢師、藥師每年至少參加1次。(試)\n4.醫院應訂有抗生素管理計畫，對於計畫執行所須之經費、人力等資源都能有實質的支援。(試)\n優良項目：\n1.依據醫院特性及實務需要，定期檢討修訂抗生素管理計畫，並落實執行修訂之計畫內容。(試)\n[註]\n符合項目 1、3、4及優良項目 1列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.抗生素管理小組成員名單、出席紀錄表及會議紀錄。(符合)\n2.抗生素教育訓練課程講義及出席紀錄表。(符合)\n3.抗生素管理計畫(含執行方式、人力、資源、成效評估等)。(符合)\n4.醫院對於抗生素管理計畫執行的實質支援紀錄。(符合)\n5.歷次修訂版本之抗生素管理計畫(含修訂之年月日)。(優良)\n6.抗生素管理計畫執行情形及成果。(優良)","cs":"評鑑委員可參考受評醫院上次之感染管制查核結果及意見。","p":259,"ch":"2.7"},{"n":"2.7.11","tags":["重"],"t":"抗生素使用監測管理機制","ev":"目的：優化抗生素使用之監測及管理機制，提升抗生素合理使用。\n符合項目：\n1.醫院訂有抗生素使用管制措施，且醫師可隨時查閱如何適當使用抗生素之資料。(原2.7.9-符合2)\n2.對抗生素使用量訂有適當的監測機制，並定期進行統計分析。(原2.7.9-優良2修)\n3.定期隨機審查病歷，各項有關病人使用抗生素之情形，應於病歷中詳載，並有評估病人抗生素使用適當性之機制。(原2.7.9-符合3修)\n4.醫院設置抗生素檢核資訊系統，於醫師開立抗生素處方時有提醒機制，以提升抗生素開立處方品質。(原2.7.9-優良3修)\n5.對抗生素不合理使用之情況能回饋臨床醫師或科部，並提出改善措施確實執行，且有具體改善成效呈現。(原2.7.9-優良1修)\n優良項目：\n1.設置抗生素處方審核與回饋及統計分析資訊系統。(試)\n[註]\n1.「管制性抗生素」指全民健康保險第一線以外之抗微生物製劑。\n2.優良項目1列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.抗生素使用管制措施及相關作業流程。(符合)\n2.各類別抗生素病歷抽樣審查紀錄。(符合)\n3.抗生素使用量(如:defined daily dose)分析報告及改善回饋紀錄。(符合)\n4.不適當的抗生素使用量或全院抗生素使用量之改善情形紀錄。(符合/優良)\n5.有關病人非管制性抗生素使用之情形，建立機制以防範下列情形發生：\n(1)重症病人無正當理由仍然使用第一線狹效抗生素。\n(2)第一線狹效抗生素使用 3天無效，無正當理由仍然繼續使用。\n(3)未依感染部位選用適當抗生素。\n(4)社區感染無正當理由仍使用明顯療效不足之藥物。\n(5)使用的劑量未考慮到病人體重及肝腎功能。\n6.有關病人管制性抗生素使用之情形，建立機制以防範下列情形發生：\n(1)臨床狀況明顯為輕症或無症狀，但使用廣效抗生素，且無正當理由。\n(2)無正當理由同時使用 3種以上抗生素。\n(3)使用藥物的種類不符合國內外抗生素治療指引。\n(4)使用的劑量未考慮病人體重及肝腎功能。\n7.有關病人手術預防性抗生素使用之情形，建立下列機制：\n(1)需用手術預防性抗生素時，應在手術劃刀前 1小時內，給予第一劑手術預防性抗生素(使用vancomycin及fluoroquinolones者可於劃刀前 2小時內給予手術預防性抗生素；剖腹產則可在臍帶結紮前後立即給予手術預防性抗生素)。\n(2)手術預防性抗生素使用時機及選藥時應符合國內外抗生素使用指引。\n(3)劑量應與體重相符並有考慮病人肝腎機能。\n(4)一般清淨手術後，於術後不再繼續使用抗生素，重大手術抗生素使用符合國內外抗生素使用指引。\n(5)手術中視必要(考慮藥品動態學)追加抗生素。\n8.有關病人門診抗生素使用之情形，建立下列機制：\n(1)有需要才用抗生素；使用抗生素時，病歷上應說明用藥理由。\n(2)一般明顯急性感冒不可使用抗生素。\n(3)抗生素使用種類及劑量合理，並有考慮病人體重及肝腎機能。\n(4)抗生素使用期間合理，如有異常時，應於病歷上說明。","cs":"評鑑委員可參考受評醫院上次之感染管制查核結果及意見。","p":260,"ch":"2.7"},{"n":"2.7.12","tags":["重"],"t":"抗藥性微生物之監測診斷及隔離防治措施","ev":"目的：確保抗藥性微生物檢驗品質，輔助抗生素合理使用，並優化其監測及管理機制，減少抗藥性微生物之發生及傳播。\n符合項目：\n1.訂有微生物實驗室檢驗標準作業程序，並有內、外部品管計畫。針對微生物實驗室內、外部品管監測異常結果，執行問題調查與原因分析，並對須改善之事項，提出具體解決的對策。(試)\n2.每年定期製作全院臨床分離菌種抗生素抗藥性圖譜(antibiogram)報告(統計期間歸人計算)，並將最新報告提供給臨床醫師開立處方參考或於院內網路公告，醫師可隨時查閱。(原2.7.12-符合2修)\n3.每年定期依據檢體種類及病房別且對感染菌種之分離件數、抗生素之感受性等資料製作分析報告，特別是多重抗藥性微生物(如：CRE、CRAB、VRE、MRSA等)，並進行抗藥性趨勢與抗生素用量之相關性分析。(原2.7.12-符合1、優良3併)\n4.針對分離出多重抗藥性微生物(如：CRE、CRAB、VRE、MRSA等)之個案，應於微生物報告上註記或解釋，並即時通知臨床單位進行適當隔離及標示。(原2.7.12-符合3修)\n5.將實驗室檢出菌株與抗生素抗藥性檢測結果等相關監測資料通報至衛生福利部疾病管制署「台灣醫院感染管制與抗藥性監測管理系統」。(原2.7.12-符合4修)\n優良項目：(下述項目(不含試評項目)須全部達成)\n1.根據前揭統計分析報告，研擬防治對策並付諸實行，且有具體改善成效。(原2.7.12-優良4修)\n2.建置自動化通報機制，持續將實驗室檢出菌株與抗生素抗藥性檢測結果等相關監測資料通報至衛生福利部疾病管制署「台灣醫院感染管制與抗藥性監測管理系統」，自開始通報月須持續通報、每月通報之細菌種類需達10項菌屬/種以上且實驗室通報完整率達100%。(試)\n[註]\n符合項目 1及優良項目2列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.微生物實驗室檢驗標準作業程序文件及品管紀錄。(符合)\n2.內、外部品管監測異常之改善方案或對策。(符合/優良)\n3.抗生素抗藥性圖譜統計報告。(符合)\n4.多重抗藥性微生物感染或移生個案之隔離管理政策及相關作業流程。(符合)\n5.抗藥性趨勢與抗生素用量之相關性分析報告。(符合/優良)\n6.多重抗藥性微生物防治對策及執行成效。(優良)","cs":"評鑑委員可參考受評醫院上次之感染管制查核結果及意見。","p":262,"ch":"2.7"},{"n":"2.7.13","tags":["重"],"t":"訂有醫療照護人員預防接種、體溫監測及胸部X光檢查等保護措施，並據以落實執行","ev":"目的：有保健措施，並落實執行，以保護醫療照護人員避免遭受感染。\n符合項目：\n1.依據我國相關指引與建議，訂有全院疫苗接種計畫，由領導階層帶領，並執行醫療照護人員預防接種防疫措施，其中應包括：B 型肝炎疫苗、流感疫苗、麻疹、腮腺炎、德國麻疹混合(Measles、Mumps、Rubella；MMR)疫苗與新興傳染病疫苗接種，如：COVID-19疫苗。若B 型肝炎表面抗原及表面抗體為陰性者，則應評估施行 B 型肝炎疫苗；醫事及非醫事人員流感疫苗接種率應達 80%以上；1981年以後出生之高風險單位、全院新進人員須提出麻疹及德國麻疹抗體陽性證明或完成 MMR 疫苗接種紀錄，應達 80%；完成醫事及非醫事人員新興傳染病疫苗接種紀錄，如：COVID-19疫苗。(原2.7.6-符合1修)\n2.訂有院內全體工作人員(含外包人員)體溫監測計畫，並有體溫異常追蹤及處理機制。(原2.7.6-符合3修)\n3.每年至少 90%與病人直接接觸之醫療照護人員及其他常駐工作人員(含外包人力)完成胸部 X 光檢查，並有檢查結果異常的追蹤及處理紀錄。(原2.7.6-符合4)\n4.對於因暴露於傳染病人而遭受感染之醫療照護人員，醫院應立即為該員進行緊急處理，給予必要預防感染藥物，並列管追蹤。(原2.7.6-符合2)\n優良項目：(下述項目(不含試評項目)僅限一項未達成)\n1.胸部 X 光檢查達成率達95%以上。(原2.7.6-優良1)\n2.檢討因暴露於傳染病人而遭受感染之醫療照護人員被感染原因，避免或減少類似事件發生。(原2.7.6-優良2)\n3.依據我國相關指引與建議執行疫苗注射等措施，增加預防接種計畫的適用對象或項目，例如：全院醫療照護工作人員 MMR 疫苗接種、水痘疫苗等。(原2.7.6-優良3修)\n4.針對未完成疫苗接種之工作人員，訂有相關健康監測與管理機制，及提高接種率等強化措施，以提升人員保護。(試)\n[註]\n優良項目 4列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.全院疫苗接種計畫及領導階層帶領之會議紀錄或相關紀錄。(符合)\n2.體溫異常追蹤及處理紀錄。(符合)\n3.員工被感染事件調查及處理紀錄。(符合)\n4.胸部 X 光檢查達成率、胸部 X 光檢查異常的追蹤及處理紀錄。(符合/優良)\n5.醫療照護人員預防接種紀錄(如：B 型肝炎、流感疫苗、MMR 疫苗與新興傳染病疫苗接種紀錄，如：COVID-19 疫苗)。(符合)","cs":"評鑑委員可參考受評醫院上次之感染管制查核結果及意見。","p":264,"ch":"2.7"},{"n":"2.7.14","tags":["重"],"t":"對於暴露於病人血液、體液及尖銳物品扎傷事件的預防及處置(包含切傷等其他出血)訂有作業流程","ev":"目的：訂有員工遭病人血液、體液暴露後及尖銳物品扎傷事件的預防及處置作業流程，並落實執行，以保護工作人員健康。\n符合項目：\n1.醫療人員執行肌肉、皮下或皮內注射、進行採血或靜脈穿刺，或處理血液、體液等檢體時，應遵循標準防護措施採取感染管制對策。(原2.7.5-符合2修)\n2.工作人員有可能接觸，或被病人的血液、體液或分泌物飛濺之風險時，工作人員應依其風險穿戴防護用具，如：面罩、眼罩(eye-shield)或護眼鏡(goggle)、隔離衣(必要時要有防水)等。(原2.7.5-符合3)\n3.各醫療單位、病房及護理站有能安全處理感染性廢棄物及針類廢棄物的容器；且工作人員應明確知悉使用後的尖銳物品之處理步驟。(原2.7.5-符合4)\n4.應明確訂定暴露於 HIV危險環境時之相關處理流程，受針扎者應依醫囑儘速依「愛滋病防治工作手冊」之「職業暴露愛滋病毒處理原則」進行處理並有追蹤紀錄。(原2.7.5-符合 5)\n5.對尖銳物品扎傷通報進行統計分析，並應有詳盡的列管追蹤紀錄，檢討發生原因與追蹤機制，確實執行。(原 2.7.5-優良2修)\n優良項目：\n1.將尖銳物品扎傷統計分析結果回饋各單位，並研擬防治對策付諸實行，且有具體改善成效。(試)\n[註]\n優良項目 1列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.醫院針對預防員工發生尖銳物品扎傷及血液體液暴觸事件所採取之措施。(符合)\n2.尖銳物品扎傷或與血液/體液接觸處理流程。(符合)\n3.員工被血液、體液暴露及尖銳物扎傷事件的調查及處理紀錄。(符合)\n4.血液、體液暴露及尖銳物扎傷事件報告統計分析和檢討。(符合/優良)","cs":"評鑑委員可參考受評醫院上次之感染管制查核結果及意見。","p":265,"ch":"2.7"},{"n":"2.8.1","tags":[],"t":"具備合宜的醫事檢驗設備，並能確保其正常運作與環境安全","ev":"目的：維護醫事檢驗設備與環境的安全管理，確保檢驗品質與執業安全。\n符合項目：\n1.應依醫院規模、機能及整體病人照護條件設置相關醫事檢驗之設備，提供正確檢驗結果，以符合一般醫療的需求。(原2.8.1-符合1)\n2. 具備之設施、設備規模足夠處理院內大部分每日常規檢驗需求，並備有快速檢驗設備，其功能可提供必要的檢驗項目及符合時效的結果報告，以因應急診醫療的需求。(原2.8.1-優良1)\n3.與檢驗相關之設備(含檢驗科室以外之檢驗儀器(如：血糖機、血液氣體分析儀(blood gas analyzer)等))，必須遵照功能維護要求，依照所訂定的程序，進行必要的查驗、保養、維修或校正等措施，以確保其運作正常，且每項設備留有維護紀錄可查。(原2.8.1-符合2修)\n4.依照法規訂有安全管理機制，對生物及化學危害物質有妥善的處理、監測，並留有記錄。(原2.8.1-符合3修)\n優良項目：(下述項目僅限一項未達成)\n1.緊急檢驗之設施、設備因發生重大事故，無法因應急診醫療服務的需求時，有建立合適與有效的備援計畫或機制。(原2.8.1-優良2)\n2.詳細記錄與檢驗品質有關之重要設備故障或失靈原因、維護對策，並能連同處理結果妥善保存，以有助於日後設備查驗、保養、維修或校正等措施的穩定。(原2.8.1-優良3)\n3.針對檢驗工作環境的安全管理機制，應訂定完備之安全及應變計畫，並執行實際演練，相關執行紀錄內容完整，並妥善保存。(原 2.8.1-優良4)\n[註]安全計畫對象包括感染性物質、危險及有害物質的處理。\n評量方法及建議佐證資料：\n1.醫療儀器、設備查驗、保養、維修或校正作業標準及查檢紀錄。(符合)\n2.快速檢驗作業流程。(符合)\n3.生物及化學危害物質相關安全規範及管理資料。(符合)\n4.重要醫療儀器、設備故障時之備援計畫或機制。(優良)\n5.重要醫療儀器、設備等故障之原因分析及改善紀錄。(優良)\n6.各相關單位之緊急應變計畫及演練紀錄。(優良)","cs":"","p":267,"ch":"2.8"},{"n":"2.8.2","tags":[],"t":"具備符合標準之醫事檢驗作業程序，並確實執行","ev":"目的：制訂與執行各項醫事檢驗作業程序與品管政策，確保檢驗品質。\n符合項目：\n1.應訂定符合病人及檢驗檢體辨識、登錄、傳送、檢測、報告等作業的安全性、時效性與結果正確性要求之標準作業程序。(原 2.8.2-符合1)\n2.醫事檢驗報告內容正確，報告時效符合臨床醫療需求，且不同類型檢體或檢驗項目的報告完成時間以及檢驗生物參考區間，能夠具有臨床溝通機制，依臨床需求據以實施。(原 2.8.3-符合1)\n3.檢驗後的檢體儲存及安全的棄置管理辦法，其內容完整並能確實執行。(原 2.8.2-符合3)\n4.檢驗服務項目須借助委外檢驗方式完成者，應制訂作業程序評估與選擇具有能力，且合乎品質要求的受委託檢驗單位。(原 2.8.2-符合4修)\n5.檢驗科室以外之檢驗儀器(如：血糖機、血液氣體分析儀(blood gas analyzer)等)訂有作業程序與品質管理機制。(原2.8.3-優良4)\n優良項目：(下述項目(不含試評項目)須全部達成)\n1.相關作業程序留有紀錄，執行狀況良好，並有檢討改善，成效良好。(原2.8.3-優良1修)\n2.醫院對於門診抽血櫃台於尖峰時間有因應對策，縮短等候時間，成效良好。(試)\n3.導入自動化與資訊化系統、流程改善或設備改良以提升各項醫事檢驗作業程序效率與品質，成效良好。(試)\n4.有建置智能化檢驗相關設備，以提升人力運用效能及品質安全。(試)\n[註]\n優良項目 2、3、4列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.檢驗檢體辨識、登錄、傳送、檢測、報告等作業規範或作業程序及紀錄。(符合/優良)\n2.檢驗後之檢體管理辦法(含儲存、棄置時之作業規範等)。(符合)\n3.委外檢驗之評估、履約管理、品質管理等作業程序及相關會議紀錄。(符合)","cs":"","p":268,"ch":"2.8"},{"n":"2.8.3","tags":[],"t":"醫事檢驗作業具有完備的品質保證措施","ev":"目的：制訂醫事檢驗作業品質指標，定期稽核管理與檢討。\n符合項目：\n1.依照醫事檢驗品質需求，制訂適用的品管政策與程序，內容包括內部品管、外部品管。內、外部品管監測結果發現異常時，應能執行問題調查與原因分析。(原2.8.2-符合3、原 2.8.3-優良1併)\n2.應至少使用二種不同濃度之品管物質，進行檢驗作業流程之內部品管措施。(原2.8.3-符合 2)\n3.應定期參與能力試驗之外部品管活動，若檢驗項目無能力試驗可供參與時，應建立適當的比對機制，或必要時以實驗室間比對機制替代，可對檢驗之能力與品質，進行客觀性評估與系統性監測，且能力試驗結果回覆報告，有加註檢討說明或審核意見，並能妥善保存。(原2.8.3-符合3)\n4.實施委外檢驗者，應定期要求受託檢驗單位提供精確度評估或接受外部能力評鑑之相關結果或證明。(原2.8.3-符合4)\n優良項目：(下述項目(不含試評項目)須全部達成)\n1.每一年度均針對病人照護與醫事檢驗作業品質相關指標(如：報告時效監測，客訴意見處理、檢驗品質與安全調查等)進行分析，並有相關統計報告。發現異常狀況時，能進行相關因應措施，及留有紀錄可供檢討。(原2.8.3-優良2修)\n2.應建立品質保證執行過程之管理會議或稽核制度，定期與臨床照護單位召開檢驗服務流程與品質檢討會議，並有執行或會議紀錄可供審查。定期檢討評估，訂有改善方案，且改善成效良好。(原2.8.3-優良3修)\n3.實驗室通過品質認證(如財團法人全國認證基金會(Taiwan Accreditation Foundation, TAF)或美國病理學會(The College of American Pathologists, CAP)等國際認證)。(試)\n[註]\n1.委外管理包括本身醫療需求委外檢驗或以醫院名義承攬業務等監督責任。\n2.優良項目 3列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.醫事檢驗之品質管理政策與程序，及相關會議紀錄。(符合)\n2.主要檢驗項目有定期執行品質校正紀錄。(符合)\n3.委外檢驗之評估、履約管理、品質管理等作業程序及相關會議紀錄。(符合)\n4.檢驗相關品質指標監測紀錄、統計資料及稽核制度之紀錄。(優良)\n5.檢驗相關品質指標會議討論紀錄。(優良)\n6.與臨床照護單位召開檢驗服務流程與品質檢討會議紀錄。(優良)\n7.品質改善方案實例佐證資料，如：品管圈、教案教學、得獎紀錄等。(優良)\n8.實驗室通過(國際)認證相關文件。(優良)","cs":"優良項目 1 所提「安全調查」係指：發現有危害病人生命安全之不良事件時，應有主動提出「調查分析」之作為，以及研議「避免再發生之預防措施」的檢討說明。","p":269,"ch":"2.8"},{"n":"2.8.4","tags":[],"t":"設有合宜之血品供應單位及供輸血作業程序，並能確實執行","ev":"目的：制訂與執行合宜的血品管理與輸血作業程序，確保病人用血安全。\n符合項目：\n1.明確設置血品之保管、供應或訂購的負責人員或部門，並明訂工作職責。(原2.8.4-符合1 修)\n2.血品供應單位(血庫)應以附有連續溫度記錄功能，或可產生溫度異常警訊的冷藏及冷凍設備保管血液及血液製劑，並須定期定時查核相關紀錄。(原2.8.4-符合 2)\n3.與血品使用前檢驗及庫存相關之設備(尤其是具有溫控及離心功能者)，須依照所訂定的程序，定期進行查驗、保養、維修或校正等措施，以確保其運作正常，且每項設備留有維護紀錄可查。(原 2.8.4-符合3)\n4.明訂血液及血液製劑之供應作業程序及交付領用步驟，包括檢體辨識、使用前檢驗(交叉試驗等)、登錄、檢測、報告、血品傳送等，作業時效性與結果正確性要求之標準作業程序。(原2.8.4-符合4)\n5.檢驗後檢體的儲存及安全棄置，應有管理辦法並符合法規規定，其內容完整並能確實執行。(原2.8.4-符合5)\n6.對於緊急輸血及夜間、休假日的血品供應服務，應明訂有關血品對外訂購及院內申請使用之作業程序，並明確宣導全院醫護單位人員。(原2.8.4-符合6)\n7.血品供應單位必須評估血品於病房及手術室暫存保管之作業方式的適當性，並依照所使用保存設備的功能，訂有包括輸注前可存放的時間，及未輸注可退回的時間與條件等規範，提供相關醫護單位人員遵循。(原2.8.4-符合 7)\n8.血品使用前之檢驗須借助委外檢驗方式完成者，應制訂作業程序評估與選擇具有能力，且合乎品質要求的受委託檢驗單位。(原 2.8.4-符合8 修)\n優良項目：(下述項目僅限一項未達成)\n1.血品使用前之檢驗與庫存相關設施、設備，若發生故障時，修復紀錄除要附註故障原因、維護對策之外，並要有執行品管監測結果紀錄佐證驗收。(原2.8.4-優良1)\n2.與供應緊急輸血相關之設施、設備因發生重大事故，無法因應急診醫療服務的需求時，血品供應單位應建立備援計畫或機制。(原2.8.4-優良2)\n3.相關作業程序留有紀錄，執行狀況良好，並有檢討改善，成效良好。(原2.8.4-優良3修)\n評量方法及建議佐證資料：\n1.血品儲存設備之溫度監控系統紀錄(含校正程序及紀錄)。(符合)\n2.血品相關設備查驗、保養、維修或校正作業標準及查檢紀錄。(符合)\n3.血品相關辨識、登錄、檢測、報告、血品傳送等作業規範或作業程序及相關紀錄。(符合)\n4.檢驗後之檢體管理辦法(含儲存、棄置時之作業規範等)。(符合)\n5.緊急輸血及夜間、休假日的血品對外訂購及院內申請使用作業程序。(符合)\n6.血品暫存保管作業規範或流程及相關時效規定。(符合)\n7.血品退回之標準作業流程。(符合)\n8.委外檢驗之評估、履約管理、品質管理等作業程序及相關會議紀錄。(符合)\n9.重要醫療儀器、設備等故障之原因分析及改善紀錄。(優良)\n10.重要醫療儀器、設備故障時之備援計畫或機制。(優良)","cs":"","p":271,"ch":"2.8"},{"n":"2.8.5","tags":[],"t":"血品供應作業具有品質保證措施","ev":"目的：制訂與執行合宜的品管政策與程序，確保血品與用血的品質與安全。\n符合項目：\n1.應依照規則，確實執行血品供應流程相關紀錄，並保存所用血品批號7年。(原2.8.5-符合 1)\n2.血品供應時效符合臨床醫療需求，且不同血品的申請領用時間，能夠經由與臨床協議後有明確的訂定，而據以實施。(原2.8.5-符合2)\n3.依照血品使用前檢驗品質需求，制訂適用的品管政策與程序，內容包括內部品管、外部品管。(原2.8.5-符合3)\n4.針對血品供應，訂有內、外部品管監測指標，當結果發現異常時，應執行問題調查與原因分析。(原2.8.5-優良1)\n5.血庫能提供血品使用單位人員，對於血液及血液製劑供應相關諮詢的教育訓練，以共同提升輸血醫療的品質與安全。(原2.8.5-優良5)\n優良項目：(下述項目僅限一項未達成)\n1.應設有輸血委員會，定期檢討輸血用血液製劑，尤其是血漿、血小板等之適應症及使用標準。(原2.8.5-優良2)\n2.每一年度定期(至少每年 2 次)舉行輸血委員會議，針對病人照護品質相關指標(如：供應時效監測，客訴意見處理、供應品質與安全調查等)，及防止副作用等有關保障病人輸血安全的成效進行分析，並有相關統計報告，且發現異常狀況時，能進行相關因應措施，及留有紀錄可供檢討。(原2.8.5-優良3)\n3.確實掌握訂購輸血用血液製劑之種類、使用及退還狀況，並致力減少退還情況。(原2.8.5-優良4)\n評量方法及建議佐證資料：\n1.血品供應(含退還)之標準作業流程及相關紀錄。(符合)\n2.血品使用前之品管政策與程序。(符合)\n3.血品使用單位人員相關教育訓練資料。(符合)\n4.輸血委員會設置辦法及會議紀錄。(優良)\n5.血品相關品質指標監測紀錄、統計資料及稽核制度之紀錄。(優良)","cs":"1.優良項目 2所提「安全調查」係指：發現有危害病人生命安全之不良事件時，應有主動提出「調查分析」之作為，以及研議「避免再發生之預防措施」的檢討說明。\n2.實地評鑑時，委員將加強查核醫院對於輸血不良反應通報的機制，以及相關發生案例之檢討。","p":273,"ch":"2.8"},{"n":"2.8.6","tags":[],"t":"具備合宜的病理診斷設備，並能確保其正常運作與環境安全","ev":"目的：維護病理診斷設備與環境安全管理，確保診斷品質與執業安全。\n符合項目：\n1.應依醫院規模、機能及整體病人照護條件設置相關病理診斷之設備，提供正確病理診斷結果，以符合一般醫療的需求。(原2.8.6-符合1)\n2.具備之設施、設備規模足夠處理院內大部分病理診斷，備有快速病理診斷之設備，且能提供手術中之快速病理診斷(如：冰凍切片 frozen section)需求。(原2.8.6-優良1、2併)\n3.與病理診斷相關之設備，必須遵照功能維護要求，依照所訂定的程序，進行必要的查驗、保養、維修或校正等措施，以確保其運作正常，且每項設備留有維護紀錄可查。(原2.8.6-符合2)\n4.依照法規訂有安全管理機制，針對生物及化學危害物質(如：揮發性有機物質)有妥善的處理、監測，並留有記錄。(原2.8.6-符合3修)\n優良項目：(下述項目(不含試評項目)須全部達成)\n1.整體之設施、設備規模足夠自行處理院內各類病理診斷需求，並有備援計畫或機制，對於急診手術亦能提供快速病理診斷。(原 2.8.6-優良3)\n2.針對病理工作環境的生物及化學危害物質安全管理機制，應訂定完備之安全及應變計畫，並執行實際演練，相關執行紀錄內容完整，並妥善保存。(試)\n[註]\n優良項目 2列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.快速病理診斷之作業流程或數量統計資料。(符合)\n2.病理診斷相關儀器與設備之查驗、保養、維修或校正作業標準及查檢紀錄。(符合)\n3.生物及化學危害物質相關安全規範及管理資料。(符合)\n4.重要醫療儀器、設備之備援計畫或機制。(優良)","cs":"","p":274,"ch":"2.8"},{"n":"2.8.7","tags":[],"t":"具備符合標準之病理診斷作業程序，並確實執行","ev":"目的：制訂與執行各項標準病理診斷作業程序，確保診斷品質。\n符合項目：\n1.醫院應明訂哪些取自人體之組織檢體或手術切除器官，應送病理檢查。病理檢查紀錄完整，足供臨床醫師診斷及治療用。(原 2.8.7-符合1修)\n2.應訂定符合病理檢體辨識、登錄、傳送、診斷、報告等作業的安全性、時效性與結果正確性要求之標準作業程序。(原2.8.7-符合2)\n3.病理檢體之儲存與棄置，應有管理辦法並符合法規規定，其內容完整並能確實執行。(原2.8.7-符合3修)\n4.病理診斷服務項目須借助委外檢驗方式完成者，應制訂有效的作業程序，以評估與選擇具有能力，且合乎品質要求的受委託檢驗單位。(原2.8.7-符合4)\n優良項目：(下述項目(不含試評項目)須全部達成)\n1.相關作業程序執行狀況良好，留有紀錄可供檢討。(原2.8.7-優良1)\n2.導入資訊化或智能化系統以提升病理檢體處理與儲存作業程序效率與品質，成效良好。(試)\n[註]\n1.衛生福利部(原行政院衛生署)於 77 年 2 月 4 日衛署醫字第 715562號函，已明確界定器官之範圍；所稱「器官」係指：\n(1)消化系統：口腔、唇、舌、咽喉、食道、胃、十二指腸、闌尾、肝臟、膽囊、膽道、胰臟、大腸、小腸、直腸、肛門、腸系膜、腹膜。\n(2)呼吸系統：鼻竇、副鼻竇、鼻咽、聲帶、喉、氣管、支氣管、肺臟、肋膜。\n(3)心臟血管系統：血管(動脈、靜脈)、心臟、 心包膜。\n(4)泌尿系統：腎臟、輸尿管、尿道、膀胱、前列腺。\n(5)內分泌系統：甲狀腺、副甲狀腺、腎上腺、腦下垂體、胸腺。\n(6)造血淋巴系統：骨髓、脾臟。\n(7)骨骼與肌肉系統：骨骼截除、肢體截除。\n(8)神經系統：腦、脊髓、神經、腦膜。\n(9)生殖器官：子宮、卵巢、輸卵管、陰道、乳房、輸精管、睪丸、陰囊、陰莖。\n(10)感官器官：眼、中耳、內耳。\n2.優良項目 2列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.醫院自訂哪些取自人體之組織檢體或手術切除器官，應送病理檢查。(符合)\n2.每月各項病理診斷之服務量統計資料。(符合)\n3.檢驗檢體辨識、登錄、傳送、診斷、報告等作業規範或作業程序。(符合)\n4.檢驗後之檢體管理辦法(含儲存、棄置時之作業規範等)。(符合)\n5.委外檢驗之評估、履約管理、品質管理等作業程序。(符合)\n6.相關作業程序檢討紀錄資料。(優良)","cs":"醫療機構所採取之組織檢體，或取自人體之異物，若與病灶有關，或臨床上有需要，均應送請病理檢查，此處所指之組織檢體由醫院自訂。","p":275,"ch":"2.8"},{"n":"2.8.8","tags":[],"t":"病理診斷作業具有完備的品質保證措施","ev":"目的：病理診斷作業訂有品管指標，並定期稽核管理及檢討。\n符合項目：\n1.病理診斷報告內容完整，報告時效符合臨床醫療需求，且不同類型檢體的報告完成時間，能夠經由與臨床協議後有明確的訂定，而據以實施。(原2.8.8-符合 1)\n2.組織病理委員會定期召開，並有會議紀錄可查。病理診斷報告應有審查及檢討評估機制(醫療法第65條)。(原 2.8.8-符合2、優良1併)\n3.依照病理診斷品質需求，制訂適用的品管政策與程序，內容包括內部品管、外部品管或建立適當的比對機制。(原2.8.8-符合3)\n4.實施委外檢驗者，應定期要求受託檢驗單位提供上述之資料。(原2.8.8-符合 4)\n優良項目：(下述項目(不含試評項目)僅限一項未達成)\n1.每一年度均針對病理診斷品質相關指標進行分析，並有相關統計報告留有紀錄，有檢討改善。(原2.8.8-優良2 修)\n2.病理作業流程設有個案結果比對、報告時效監測，以及客訴意見處理等機制，發現異常狀況時，能進行相關因應措施留有紀錄可供檢討改善，成效良好。(原2.8.8-優良3修)\n3.與臨床照護單位召開病理服務流程與品質檢討會議，並有執行或會議紀錄可供審查。定期檢討評估，訂有改善方案，且改善成效良好。(原2.8.8-優良4修)\n4.癌症診斷報告格式符合需求，且應有雙重檢核機制(Double check)。(原2.8.8-優良5)\n5.針對其他醫院的特殊案例，能提供病理諮詢服務，且有具體佐證。(試)\n6.實驗室通過品質認證(如財團法人全國認證基金會(Taiwan Accreditation Foundation, TAF)或美國病理學會(The College of American Pathologists, CAP) 等國際認證)。(試)\n[註]\n優良項目 5、6列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.組織病理委員會章程及會議紀錄。(符合)\n2.病理診斷結果與報告完成作業規範。(符合)\n3.病理診斷之品管政策與程序。(符合)\n4.病理診斷報告(含癌症診斷報告等)審查及檢討評估相關資料。(符合/優良)\n5.病理相關品質指標監測紀錄及統計資料。(優良)\n6.異常事件報告與紀錄。(優良)\n7.與臨床照護單位召開病理服務流程與品質檢討會議紀錄。(優良)\n8.品質改善方案實例，如：品管圈、教案教學、得獎紀錄等。(優良)\n9.實驗室通過(國際)認證相關文件。(優良)","cs":"","p":277,"ch":"2.8"},{"n":"2.8.9","tags":[],"t":"具備合宜的放射診斷(含核子醫學)設備，並能確保其功能正常運作與環境安全","ev":"目的：維護放射診斷(含核子醫學)設備與受檢環境的規劃及管理，以確保放射影像品質與環境安全。\n符合項目：\n1.應依醫院規模、機能及整體病人照護條件設置相關放射診斷(含核子醫學)之設備，且除攝影室外，亦須具備適當的閱片設備、候診空間、更衣室及影像資料檔案室等空間。其功能可提供必要的檢查結果，以符合一般醫療的需求。(原2.8.9-符合1)\n2.與檢查相關之設備，必須遵照功能維護要求，依照所訂定的程序，進行必要的查驗、保養、維修或校正等措施，以確保其運作正常，且每項設備留有維護紀錄可查。有關設備及儀器之維護要求，若無法自行完成者，應與廠商訂定維修保養合約，並應訂有檢查標準操作手冊。(原2.8.9-符合 2)\n3.放射線診斷及核子醫學檢查室的設計與設備，須符合游離輻射防護法規之規範。工作環境的游離輻射防護，必須依照法規訂定安全管理計畫，以執行妥善的防護、監測與紀錄；如有廢片或污染廢棄物須處理時，應符合國家法規訂定相關作業規範。(原2.8.9-符合3)\n4.設有放射診斷、核子醫學、放射治療之任二項診療業務者，應設置輻射防護管理委員會，每年至少召開二次會議，並發揮委員會功能，且有會議紀錄可查。(原2.8.9-符合4)\n5.檢查過程所需之急救設備完善，且檢查室內外之規劃設計，能以病人隱私為考量，提供安全、舒適的檢查環境。(原2.8.9-符合5)\n6.應具有輻射防護專業之人員；且輻射從業人員每人每年至少應接受3小時輻防之繼續教育與健檢。(原2.8.9-符合 6)\n優良項目：(下述項目(不含試評項目)僅限一項未達成)\n1.配有各項輻射防護偵測設備及假體，並訂有標準作業流程。醫院應訂有輻射物質意外事件應變計畫，並落實各項安全查核工作，相關執行紀錄內容完整，及妥善保存。(原2.8.9-優良2修)\n2.儀器設備依照服務內容及作業品質評估，適當汰舊換新。(原 2.8.9-優良3)\n3.全院醫事放射人員，10%以上應領有游離輻射防護人員證書。(原2.8.9-優良 4修)\n4.緊急檢查之設施、設備因發生重大事故，無法因應緊急醫療服務需求時，檢查部門應建立備援計畫或機制，包括數位化影像醫學儀器應有不斷電或緊急發電設備與影像傳送機制。(原2.8.9-優良5修)\n5.應有專責醫事放射師負責放射影像品質及輻射安全作業。(試)\n[註]\n1.依照國家相關法規之規範，醫院在符合相關規定的前提下，可依實際需求自行評估與規劃其設備及所需環境。\n2.依游離輻射防護法第七條第三項規定，於 91 年 12 月 11 日訂定之「輻射防護管理組織及輻射防護人員設置標準」規定，相關內容摘要如下：\n(1)第2 條：依游離輻射防護法第七條第一項所稱之輻射防護管理組織，係指輻射防護業務單位及輻射防護管理委員會。\n(2)第4 條：設施經營者具有附表一(醫療院所屬範圍內事業類別，包含「從事放射診斷、核子醫學、放射治療三項診療業務者」或「設有放射診斷、核子醫學、放射治療任二項診療業務者」)所列設備、業務或規模者，應設立輻射防護管理組織，並依表列名額配置輻射防護業務單位之各級輻射防護人員。\n(3)第5 條：設施經營者具有附表二(醫療院所屬範圍內事業類別，包含「僅從事放射治療業務者」或「僅從事核子醫學業務者」或「僅從事放射診斷業務者」)所列設備、業務或規模者，應依表列名額配置各級輻射防護人員。\n(4)第 12 條規定輻射防護管理委員會委員組成及應至少每 6 個月開一次會。\n3.優良項目 5列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.醫療儀器、設備查驗、保養、維修或校正作業標準及查檢紀錄。(符合/優良)\n2.醫療儀器外包廠商管理辦法及相關合約。(符合)\n3.符合法規之輻射防護安全管理計畫。(符合)\n4.輻射安全作業，例如儀器、環境及輻防器具等安全檢測。(符合)\n5.輻射防護管理委員會設置辦法、會議紀錄。(符合)\n6.急救設備平時保養、點班紀錄。(符合)\n7.輻射防護師(員)證照，輻射防護人員與從業人員資格資料(含繼續教育訓練及健檢)。(符合)\n8.輻射偵測設備及假體作業程序、輻射物質意外事件應變計畫及相關紀錄。(優良)\n9.重要醫療儀器之備援計畫或機制。(優良)","cs":"1.優良項目 1，實地評鑑時，委員將加強輻射物質意外事件應變計畫。\n2.依醫療機構設置標準之醫院設置基準表，醫療服務設施之『放射線設施』第 3 項規定，實施注射對比劑之檢查室應備有下列急救設備(可共用)：(1)插管。(2)基本急救藥物。\n(3)氧氣供給。(4)電擊器。","p":279,"ch":"2.8"},{"n":"2.8.10","tags":[],"t":"具備符合標準之放射診斷(含核子醫學)作業程序，並確實執行","ev":"目的：制訂與執行各項完備的放射診斷(含核子醫學)作業程序與品管政策，確保放射診斷品質。\n符合項目：\n1.應訂定符合檢查需求之病人辨識、登錄、運送、檢查、報告等作業時效性與結果正確性要求之標準作業程序，同時須包括全部檢查過程的病人安全防護管理及應變機制，其內容完整且能確實執行。(原2.8.10-符合1)\n2.依照放射診斷(含核子醫學)作業品質需求，制訂適用影像品質品管政策與程序。(原2.8.10-符合2)\n3.核子醫學若有執行 RIA，則依照核子醫學檢驗品質需求，制訂適用的品管政策與程序，內容包括內部品管、外部品管(能力試驗)，若檢驗項目無外部品管(能力試驗)活動可供參與準確度評估時，應建立適當的比對機制。(原2.8.10-符合3)\n4.檢查服務項目須借助委外檢驗方式完成者，應制訂管理作業程序評估與選擇具有能力，且合乎品質要求的受委託檢查單位。(原2.8.10-符合4 修)\n5.應與相關診療科醫師舉行病例檢討，並留有紀錄可查。(原2.8.10-符合5)\n優良項目：(下述項目僅限一項未達成)\n1.相關作業程序執行狀況良好，留有紀錄可供審查。(原 2.8.10-優良1)\n2.迅速提供正確的影像診療報告，且配合轉診、轉檢或轉院等需求。(原2.8.10-優良2)\n3.配合衛生福利部政策上傳醫療影像及參與交換機制，建立特定檢查資源共享模式。(原2.8.10-優良3修)\n4.定期舉行聯合討論會(如：與相關診療科醫師舉行病例檢討會)，且紀錄詳實。(原2.8.10-優良4)\n評量方法及建議佐證資料：\n1.檢查病人辨識、登錄、運送、檢查、報告等作業規範或作業程序及紀錄。(符合)\n2.放射診斷作業之品管政策與程序。(符合)\n3.委外檢驗之評估、履約管理、品質管理等作業程序及相關會議紀錄。(符合)\n4.放射診斷作業執行狀況檢討紀錄或相關管理會議紀錄。(優良)\n5.轉診、轉檢或轉院時影像診療報告之作業流程。(優良)\n6.聯合討論會(如：與相關診療科醫師舉行病例檢討會)會議紀錄。(優良)","cs":"","p":281,"ch":"2.8"},{"n":"2.8.11","tags":[],"t":"放射診斷(含核子醫學)作業具有完備的品質保證措施","ev":"目的：訂定相關品質指標及監測，確保放射診斷(含核子醫學)作業品質。\n符合項目：\n1.放射診斷(含核子醫學)報告內容完整，報告時效符合臨床醫療需求，且不同檢查項目的報告完成時間，能夠經由與臨床協議後有明確的訂定，而據以實施。(原2.8.11-符合1)\n2.影像診療報告應由放射線(診斷)科專科醫師或核子醫學科專科醫師製作；報告內容需適當詳實。(原2.8.11-符合 2)\n3.放射診斷(含核子醫學)相關影像檔案管理適當。(原2.8.10-符合3)\n優良項目：(下述項目(不含試評項目)僅限一項未達成)\n1.品質監測結果發現異常時，應能執行問題調查與原因分析。(原2.8.11-優良1)\n2.每一年度均針對病人照護品質相關指標(如：報告時效監測、客訴意見處理、檢查品質、報告正確性與病人安全調查等)進行分析，並有相關統計報告，且發現異常狀況時，能進行相關因應措施，及留有紀錄可供審查。(原2.8.11-優良2)\n3.報告內容完整，且有適當影像會診機制，能協助臨床診療。(原2.8.11-優良3)\n4.有建置自動化影像設備，以提升人力運用效能及品質者。(試)\n5.定期與臨床照護單位召開服務流程品質檢討會議，並建立品質保證執行過程之管理會議或稽核制度。(原2.8.11-優良4)\n[註]\n優良項目 4列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.放射診斷檢查結果與報告完成作業規範。(符合)\n2.放射診斷影像檔案管理機制。(符合)\n3.放射診斷相關品質指標監測紀錄、統計資料及稽核制度之紀錄。(優良)\n4.排班照會系統或班表。(優良)\n5.自動化，例如自動收件機協助分配工作、移動式數位 X光機即時上傳影像等。運用自動化設備的工作資料。(優良)\n6.與臨床照護單位召開服務流程品質檢討會議紀錄。(優良)","cs":"","p":283,"ch":"2.8"},{"n":"2.8.12","tags":[],"t":"具備合宜的放射治療(含核子醫學)設備，並能確保其正常運作與環境安全","ev":"目的：維護完備的放射治療(含核子醫學)設備與受檢環境的規劃與管理，確保放射治療品質與環境安全。\n符合項目：\n1.應依醫院規模、機能及整體病人照護條件設置相關放射治療(含核子醫學)設備，且除治療室外，亦須具備適當的觀察設備、更衣室及檔案室等空間。其功能可提供必要的治療結果，以符合一般醫療的需求。(原 2.8.12-符合1 修)\n2.與治療相關之設備，必須遵照功能維護要求，依照所訂定的程序，進行必要的查驗、保養、維修或校正等措施，以確保其運作正常，且每項設備留有維護紀錄可查。有關設備及儀器之維護要求，若無法自行完成者，應與廠商訂定維修保養合約，並應訂有檢查標準操作手冊。(原2.8.12-符合2)\n3.放射線或核子醫學治療室的設計，須符合游離輻射防護法規之規範。工作環境的游離輻射防護設置與措施，必須依照法規訂有安全管理計畫，以執行妥善的防護、監測與記錄；如有污染性廢棄物須處理時，應符合國家法規訂定相關作業規範。(原2.8.12-符合3)\n4.設有放射診斷、核子醫學、放射治療之任二項診療業務者，應設置輻射防護管理委員會，每年至少召開二次會議，並發揮委員會功能，且有會議紀錄可查。(原2.8.12-符合4修)\n5.治療過程所需之急救設備完善，且治療室內外之規劃設計，能以病人隱私為考量，提供安全、舒適的就醫環境。(原2.8.12-符合5)\n6.應具有輻射防護之專業人員；放射治療(腫瘤)部門，需具備領有輻射防護師資格之人員，且輻射從業人員每人每年至少應接受 3 小時輻防之繼續教育與健檢。(原2.8.12-符合6)\n優良項目：(下述項目僅限一項未達成)\n1.配有各項輻射防護偵測設備及假體，並訂有標準作業流程，以落實各項安全查核工作，相關執行紀錄內容完整，及妥善保存。(原2.8.12-優良2)\n2.儀器設備依照服務內容及作業品質評估，適當汰舊換新。(原2.8.12-優良3)\n3.全院醫事放射人員，10%以上應領有游離輻射防護人員證書。(原2.8.12-優良4)\n4.治療之設施、設備因發生重大事故，無法因應緊急醫療服務的需求時，治療部門應建立備援計畫或機制，包括治療中因停電停止供電時，可供治療中病人治療床緊急下降移出病人之備援。(原2.8.12-優良5修)\n[註]\n1.依照國家相關法規之規範，醫院在符合相關規定的前提下，可依實際需求自行評估與規劃其設備及所需環境。\n2.依游離輻射防護法第七條第三項規定，於 91 年 12 月 11 日訂定之「輻射防護管理組織及輻射防護人員設置標準」規定，相關內容摘要如下：\n(1)第2 條：依游離輻射防護法第七條第一項所稱之輻射防護管理組織，係指輻射防護業務單位及輻射防護管理委員會。\n(2)第4 條：設施經營者具有附表一(醫療院所屬範圍內事業類別，包含「從事放射診斷、核子醫學、放射治療三項診療業務者」或「設有放射診斷、核子醫學、放射治療任二項診療業務者」)所列設備、業務或規模者，應設立輻射防護管理組織，並依表列名額配置輻射防護業務單位之各級輻射防護人員。\n(3)第5 條：設施經營者具有附表二(醫療院所屬範圍內事業類別，包含「僅從事放射治療業務者」或「僅從事核子醫學業務者」或「僅從事放射診斷業務者」)所列設備、業務或規模者，應依表列名額配置各級輻射防護人員。\n(4)第 12 條規定輻射防護管理委員會委員組成及應至少每 6 個月開一次會。\n評量方法及建議佐證資料：\n1.醫療儀器、設備查驗、保養、維修或校正作業標準及查檢紀錄。(符合/優良)\n2.醫療儀器外包廠商管理辦法及相關合約。(符合)\n3.符合法規之輻射防護安全管理計畫，及監測紀錄。(符合)\n4.輻射安全作業，例如儀器、環境及輻防器具等安全檢測。(符合)\n5.輻射防護管理委員會設置辦法及會議紀錄。(符合)\n6.急救設備平時保養、點班紀錄。(符合)\n7.輻射防護師(員)證照，輻射工作人員資格資料(含繼續教育訓練及健檢)。(符合)\n8.輻射偵測設備及假體作業程序及相關紀錄。(優良)\n9.重要醫療儀器之備援計畫或機制。(優良)","cs":"依醫療機構設置標準之醫院設置基準表提及醫療服務設施之『放射線設施』第 3 項規定載明，實施注射對比劑之檢查室應備有下列急救設備(可共用)：(1)插管。(2)基本急救藥物。(3)氧氣供給。(4)電擊器。","p":284,"ch":"2.8"},{"n":"2.8.13","tags":[],"t":"具備符合標準之放射治療(含核子醫學)作業程序，並確實執行","ev":"目的：制訂與執行各項完備的放射治療(含核子醫學)作業程序與品管政策，確保放射治療品質。\n符合項目：\n1.應訂定符合治療需求之病人辨識、登錄、運送、治療等作業時效性與結果正確性要求之標準作業程序，同時須包括全部治療過程的病人安全防護管理及應變機制，其內容完整且能確實執行。(原2.8.13-符合1)\n2.依照放射治療(含核子醫學)品質保證需求，制訂適用放射治療之品管政策與程序。(原2.8.13-符合2)\n3.放射線治療的計畫、實施及其結果判定，必須由放射腫瘤專科醫師簽核。(原2.8.13-符合 3修)\n4.放射線治療檢討會須定期舉行，並納入每位病人治療計畫內施行。(原2.8.13-符合4)\n5.應與相關診療科醫師舉行病例檢討會，並留有紀錄可查。(原2.8.13-符合5)\n優良項目：(下述項目須全部達成)\n1.相關作業程序執行狀況良好，留有紀錄可供審查。(原 2.8.13-優良1)\n2.放射線治療檢討會之經過及結果應記錄於病人診療紀錄內；當病人需要轉科或轉院時，應將檢討結果、放射治療計畫及摘要，妥善轉予相關科別或醫院。(原2.8.13-優良2、3併)\n評量方法及建議佐證資料：\n1.放射治療病人辨識、登錄、運送、治療等作業規範或作業程序及紀錄。(符合)\n2.放射治療作業之品管政策與程序。(符合)\n3.抽查放射治療診療相關病歷資料(如：治療計畫、病歷摘要等)。(符合)","cs":"","p":287,"ch":"2.8"},{"n":"2.8.14","tags":[],"t":"放射治療(含核子醫學)作業具有完備的品質保證措施","ev":"目的：相關品質指標的監測與分析，確保放射治療(含核子醫學)作業的品質。\n符合項目：\n1.診療報告應由放射腫瘤專科醫師或核子醫學科專科醫師製作，且應符合時效，內容詳實。(原2.8.14-符合1修)\n2.放射治療(含核子醫學)相關影像檔案管理適當。(原2.8.14-符合2)\n優良項目：(下述項目僅限一項未達成)\n1.品質監測結果發現異常時，應能執行問題調查與原因分析。(原2.8.14-優良1)\n2.每一年度均針對病人照護品質相關指標(如：診療時效監測、客訴意見處理、檢查品質、診療時效與安全調查等)進行分析，並有相關統計報告，且發現異常狀況時，能進行相關因應措施，及留有紀錄可供檢討。(原2.8.14-優良2)\n3.應建立品質保證執行過程之管理會議或稽核制度。(原2.8.14-優良3)\n4.診療紀錄內容完整，且有適當會診機制，能協助臨床診療。(原2.8.14-優良4)\n5.定期與臨床照護單位召開科際聯合檢討會議，並有會議紀錄可查。(原2.8.14-優良5)\n評量方法及建議佐證資料：\n1.放射治療診療報告完成作業規範。(符合)\n2.放射治療影像檔案管理機制。(符合)\n3.放射治療相關品質指標監測紀錄、統計資料及稽核制度之紀錄。(優良)\n4.排班照會系統或班表。(優良)\n5.與臨床照護單位召開科際聯合檢討會議紀錄。(優良)","cs":"優良項目 2 所提「安全調查」係指：發現有危害病人生命安全之不良事件時，應有主動提出「調查分析」之作為，以及研議「避免再發生之預防措施」的檢討說明。","p":288,"ch":"2.8"}]};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CS={q:'',ch:'',tag:'',inn:'',limit:20};
const TAGN={'重':'重點條文','必':'必要條文','可':'可免評','合':'符合／待改善','試':'試評條文'};
const NUMRE=/^\d+(\.\d+)+\.?$/;
const csNorm=t=>String(t).normalize('NFKC').replace(/[！-～]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/　/g,' ').replace(/臺/g,'台').toLowerCase();
const csNat=(a,b)=>{const x=a.split('.').map(Number),y=b.split('.').map(Number);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d}return 0};
const CSEC=/^(目的：|符合項目|優良項目|\[註\]|評量方法)/;
const chm=Object.fromEntries(STD.CH.map(c=>[c.no,c]));
const CSI=STD.CL.map(c=>{
  let sec='';const ev=c.ev.split('\n').filter(Boolean).map(p=>{const m=p.match(CSEC);if(m)sec=m[1]==='目的：'?'目的':m[1]==='[註]'?'註':m[1];return {p,sec,head:!!m,n:csNorm(p)}});
  const cs=c.cs.split('\n').filter(Boolean).map(p=>({p,sec:'委員共識',head:false,n:csNorm(p)}));
  return Object.assign({},c,{chObj:chm[c.ch],evP:ev,csP:cs,nt:csNorm(c.t)});
});
const csTokens=q=>csNorm(q).split(/[\s,，、;；]+/).filter(Boolean);
const txtToks=toks=>toks.filter(t=>!NUMRE.test(t));
function csHL(text,toks){
  if(!toks.length)return esc(text);
  const n=csNorm(text),marks=new Array(text.length).fill(false);
  toks.forEach(t=>{let i=0;while((i=n.indexOf(t,i))>-1){for(let j=i;j<i+t.length;j++)marks[j]=true;i+=t.length}});
  let out='',on=false;for(let i=0;i<text.length;i++){if(marks[i]!==on){out+=on?'</mark>':'<mark class="hl">';on=marks[i]}out+=esc(text[i])}
  return out+(on?'</mark>':'');
}
function csMatch(x,toks){
  let score=0;const hits=new Set();
  const paras=CS.inn==='t'?[]:CS.inn==='ev'?x.evP:CS.inn==='cs'?x.csP:x.evP.concat(x.csP);
  for(const t of toks){
    if(NUMRE.test(t)){const tt=t.replace(/\.$/,'');if(x.n===tt){score+=200;continue}if((x.n+'.').startsWith(tt+'.')){score+=60;continue}return null}
    let ok=false;
    if(CS.inn!=='ev'&&CS.inn!=='cs'&&x.nt.includes(t)){score+=25;ok=true}
    if(!CS.inn&&x.chObj&&csNorm(x.chObj.t).includes(t)){score+=4;ok=true}
    paras.forEach(pp=>{if(pp.n.includes(t)){hits.add(pp);ok=true}});
    if(!ok)return null;
  }
  return {score:score+hits.size*3,hits};
}
function paraHTML(pp,toks,hits){
  const sub=!pp.head&&/^(\(\d+\)|[a-z]\.)/.test(pp.p);
  return `<p class="${pp.head?'sec':''}${sub?' sub':''}${hits&&hits.has(pp)?' hit':''}">${csHL(pp.p,toks)}</p>`;
}
function fullHTML(x,toks,hits){
  return `<div class="cs-full"><div class="cs-col"><h4>評量項目</h4>${x.evP.map(pp=>paraHTML(pp,toks,hits)).join('')}</div><div class="cs-col"><h4>委員共識</h4>${x.csP.length?x.csP.map(pp=>paraHTML(pp,toks,hits)).join(''):'<p class="noref">無</p>'}</div></div>`;
}
function tocHTML(){
  const parts=[...new Set(STD.CH.map(c=>c.pn+'|'+c.pt))];
  return `<details class="cs-intro"><summary>凡例(條文分類與評量等級說明)</summary>${STD.intro.split('\n').map(p=>`<p>${esc(p)}</p>`).join('')}</details>`+
    parts.map(pp=>{const [pn,pt]=pp.split('|');return `<h3>第 ${pn} 篇　${esc(pt)}</h3><div class="cs-toc">${STD.CH.filter(c=>c.pn===pn).map(c=>{const n=CSI.filter(x=>x.ch===c.no).length,k=CSI.filter(x=>x.ch===c.no&&x.tags.includes('重')).length;return `<button type="button" data-toc="${c.no}"><span class="pn">第 ${c.no} 章</span><span class="nm">${esc(c.t)}</span><span class="ct">${n} 條${k?`(重點條文 ${k} 條)`:''}</span></button>`}).join('')}</div>`}).join('');
}
function render(){
  const toks=csTokens(CS.q),tt=txtToks(toks);
  if(!toks.length&&!CS.ch&&!CS.tag){
    $('cs-sum').innerHTML=`共 <b>${STD.CH.length}</b> 章、<b>${CSI.length}</b> 條。輸入關鍵字即時搜尋全文，多個關鍵字以空白分隔(須同時符合)；或點選章節瀏覽。`;
    $('cs-res').innerHTML=tocHTML();return;
  }
  const list=CSI.filter(x=>(!CS.ch||x.ch===CS.ch)&&(!CS.tag||x.tags.includes(CS.tag)));
  const res=list.map(x=>({x,m:toks.length?csMatch(x,toks):{score:0,hits:new Set()}})).filter(r=>r.m);
  if(toks.length)res.sort((a,b)=>b.m.score-a.m.score||csNat(a.x.n,b.x.n));
  const nP=res.reduce((s,r)=>s+r.m.hits.size,0);
  const chHead=CS.ch?(()=>{const c=chm[CS.ch];return `<details class="cs-chd"${toks.length?'':' open'}><summary><b>第 ${c.no} 章　${esc(c.t)}</b>　重點說明</summary>${c.d.split('\n').map(p=>`<p>${csHL(p,tt)}</p>`).join('')}</details>`})():'';
  const more=res.length>CS.limit?`；先列出前 ${CS.limit} 條`:'';
  $('cs-sum').innerHTML=toks.length?`找到 <b>${res.length}</b> 條符合「${esc(CS.q)}」${nP?`，共 <b>${nP}</b> 段含關鍵字(已標示)`:''}${more}`:`共 <b>${res.length}</b> 條${more}`;
  if(!res.length){$('cs-res').innerHTML=chHead+'<p class="empty">找不到符合的條文。可減少關鍵字、改用同義詞(例如「交接」→「交班」)，或放寬章節、類別與搜尋範圍。</p>';return}
  const tagHTML=x=>x.tags.map(t=>`<span class="badge${t==='重'?' key':''}">${TAGN[t]||t}</span>`).join('');
  $('cs-res').innerHTML=chHead+res.slice(0,CS.limit).map(({x,m})=>{
    const hit=[...m.hits],show=hit.slice(0,6);
    const hitsHTML=show.length?`<ul class="cs-hits">${show.map(pp=>`<li><span class="rl">${esc(pp.sec)}</span>${csHL(pp.p,tt)}</li>`).join('')}${hit.length>6?`<li class="noref">……另有 ${hit.length-6} 段，請展開完整條文</li>`:''}</ul>`:'';
    const open=!toks.length?'':(hit.length?'':' open');
    return `<article class="cs-item${x.tags.includes('重')?' key':''}"><div class="cs-head"><span class="cs-no">${csHL(x.n,toks)}</span><span class="cs-t">${csHL(x.t,tt)}</span>${tagHTML(x)}<span class="cs-ch">第 ${x.ch} 章　${esc(x.chObj?x.chObj.t:'')}　(原文第 ${x.p} 頁)</span></div>${hitsHTML}<details${open}><summary>完整條文(評量項目、委員共識)</summary>${fullHTML(x,tt,m.hits)}</details></article>`;
  }).join('')+(res.length>CS.limit?`<button type="button" class="btn cs-more" id="cs-more">再顯示 ${Math.min(20,res.length-CS.limit)} 條(尚有 ${res.length-CS.limit} 條)</button>`:'');
  const mb=$('cs-more');if(mb)mb.addEventListener('click',()=>{CS.limit+=20;render()});
}
(function init(){
  $('cs-ch').insertAdjacentHTML('beforeend',STD.CH.map(c=>`<option value="${c.no}">第 ${c.no} 章　${esc(c.t)}</option>`).join(''));
  const sug=['交班','同意書','病人辨識','高警訊','抗生素','約束','管路','疼痛','出院準備','輸血','DNR','2.4'];
  $('cs-sug').insertAdjacentHTML('beforeend',sug.map(k=>`<button type="button" class="chip" data-kw="${esc(k)}">${esc(k)}</button>`).join(''));
  let t;const go=()=>{CS.limit=20;render();try{history.replaceState(null,'',CS.q?'#q='+encodeURIComponent(CS.q):location.pathname)}catch(e){}};
  $('cs-q').addEventListener('input',e=>{CS.q=e.target.value.trim();clearTimeout(t);t=setTimeout(go,150)});
  $('cs-q').addEventListener('keydown',e=>{if(e.key==='Enter'){clearTimeout(t);go()}});
  $('cs-ch').addEventListener('change',e=>{CS.ch=e.target.value;go()});
  $('cs-tag').addEventListener('change',e=>{CS.tag=e.target.value;go()});
  $('cs-in').addEventListener('change',e=>{CS.inn=e.target.value;go()});
  $('cs-sug').addEventListener('click',e=>{const b=e.target.closest('[data-kw]');if(!b)return;$('cs-q').value=CS.q=b.dataset.kw;go();$('cs-q').focus()});
  $('cs-res').addEventListener('click',e=>{const tc=e.target.closest('[data-toc]');if(tc){CS.ch=tc.dataset.toc;$('cs-ch').value=CS.ch;go();window.scrollTo(0,0)}});
  const h=location.hash.match(/^#q=(.*)$/);if(h){try{CS.q=decodeURIComponent(h[1])}catch(e){}$('cs-q').value=CS.q}
  render();
})();
</script>
