<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>113 年度醫院評鑑基準全文搜尋(醫學中心適用)</title>
<style>

/* layout: 上方情境選擇器(病人流路徑＋事件標籤)，下方三區：條文｜指標 並排，提問清單全寬 */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --sunken:#e9eeec; --ink:#16282b; --muted:#5a6d70; --line:#d3dcda;
  --accent:#0d6b63; --accent-ink:#ffffff; --accent-soft:#d9efeb;
  --key:#a4530b; --key-soft:#fbe9d2; --proc:#2b5c9e; --proc-soft:#dfeaf8; --outc:#7a3b78; --outc-soft:#f3e2f2;
  --display:Arial,"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",sans-serif;
  --body:Arial,"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1a1b; --surface:#172527; --sunken:#1e3033; --ink:#e6efed; --muted:#9bb0b1; --line:#2c4144;
  --accent:#5fcdbd; --accent-ink:#06211e; --accent-soft:#153d39;
  --key:#f0b068; --key-soft:#3f2c12; --proc:#8fb8f0; --proc-soft:#1b2f4a; --outc:#dba3d8; --outc-soft:#3b2139;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1a1b; --surface:#172527; --sunken:#1e3033; --ink:#e6efed; --muted:#9bb0b1; --line:#2c4144;
  --accent:#5fcdbd; --accent-ink:#06211e; --accent-soft:#153d39;
  --key:#f0b068; --key-soft:#3f2c12; --proc:#8fb8f0; --proc-soft:#1b2f4a; --outc:#dba3d8; --outc-soft:#3b2139;
  color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 64px;display:flex;flex-direction:column;gap:20px}
header h1{font-family:var(--display);font-size:26px;line-height:1.3;margin:0 0 6px;text-wrap:balance}
header p{margin:0;color:var(--muted);max-width:68ch}
h2{font-family:var(--display);font-size:18px;margin:0;text-wrap:balance}
h3{font-size:14px;margin:0;font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px}
.panel-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;justify-content:space-between}
.hint{color:var(--muted);font-size:13px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13.5px;display:inline-flex;gap:6px;align-items:center}
.chip:hover{border-color:var(--accent)}
select,input[type=search]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:13.5px}
.btn:hover{border-color:var(--accent)}
.badge{display:inline-block;font-size:11px;border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:1px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.key{background:var(--key-soft);color:var(--key);border-color:transparent;font-weight:700}
.empty{color:var(--muted);padding:18px 0}
.noref{font-size:13px;color:var(--muted)}
footer{color:var(--muted);font-size:12.5px;max-width:78ch}
header a{color:var(--accent)}

/* 評鑑基準全文搜尋 */
.cs-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cs-bar input[type=search]{flex:1 1 320px;font-size:16px;padding:10px 14px;border-radius:8px}
.cs-bar label{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.cs-sum{font-size:13.5px;color:var(--muted)}
.cs-sum b{color:var(--ink);font-variant-numeric:tabular-nums}
.cs-res{display:flex;flex-direction:column;gap:12px}
.cs-item{border:1px solid var(--line);border-left:3px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.cs-item.key{border-left-color:var(--key)}
.cs-head{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.cs-no{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;color:var(--accent)}
.cs-t{font-weight:700;font-size:15.5px}
.cs-ch{font-size:12.5px;color:var(--muted)}
.cs-hits{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.cs-hits li{background:var(--sunken);border-radius:6px;padding:6px 10px;font-size:14px}
.cs-hits .rl{display:inline-block;font-weight:700;font-size:12px;color:var(--muted);margin-right:8px}
.cs-item details summary{cursor:pointer;font-size:13px;color:var(--accent);margin:2px 0}
.cs-item details[open]>summary{margin-bottom:6px}
.cs-full{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:12px}
.cs-col{background:var(--sunken);border-radius:8px;padding:10px 12px;font-size:14px}
.cs-col h4{margin:0 0 6px;font-size:13px;color:var(--muted)}
.cs-col p{margin:0 0 4px}
.cs-col p.sec{font-weight:700;margin-top:8px;color:var(--ink)}
.cs-col p.sub{padding-left:1.4em}
.cs-col p.hit{background:var(--surface);border-radius:4px}
@media (max-width:760px){.cs-full{grid-template-columns:minmax(0,1fr)}}
mark.hl{background:#ffe27a;color:#16282b;border-radius:2px;padding:0 1px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) mark.hl{background:#8a6d00;color:#fff}}
:root[data-theme="dark"] mark.hl{background:#8a6d00;color:#fff}
.cs-more{align-self:center}
.cs-toc{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.cs-toc button{text-align:left;background:var(--sunken);border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.cs-toc button:hover{border-color:var(--accent)}
.cs-toc .pn{font-size:11.5px;color:var(--muted)}
.cs-toc .nm{font-weight:700}
.cs-toc .ct{font-size:12px;color:var(--muted)}
.cs-chd{background:var(--sunken);border-radius:8px;padding:10px 14px;font-size:14px}
.cs-chd p{margin:0 0 6px}
.cs-intro{font-size:13.5px}
.cs-intro p{margin:0 0 4px}

</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>113 年度醫院評鑑基準全文搜尋</h1>
  <p>醫院評鑑基準及評量項目、委員共識(醫學中心適用)。輸入關鍵字或條號，即時搜尋條文、評量項目與委員共識全文。</p>
</header>
<section class="panel" aria-label="評鑑基準全文搜尋">
  <div class="cs-bar">
    <input type="search" id="cs-q" placeholder="輸入關鍵字或條號，例如：交班、同意書 病人、2.4.3" aria-label="搜尋評鑑基準" autocomplete="off" autofocus>
  </div>
  <div class="cs-bar">
    <label for="cs-ch">章節<select id="cs-ch"><option value="">全部章節</option></select></label>
    <label for="cs-tag">條文類別<select id="cs-tag"><option value="">全部</option><option value="重">重點條文</option><option value="必">必要條文</option><option value="可">可免評條文</option><option value="合">符合／待改善條文</option><option value="試">試評條文</option></select></label>
    <label for="cs-in">搜尋範圍<select id="cs-in"><option value="">條文、評量項目及委員共識</option><option value="t">只搜條文名稱</option><option value="ev">只搜評量項目</option><option value="cs">只搜委員共識</option></select></label>
  </div>
  <div class="chips" id="cs-sug"><span class="hint" style="align-self:center">常用關鍵字：</span></div>
  <div class="cs-sum" id="cs-sum" aria-live="polite"></div>
  <div class="cs-res" id="cs-res"></div>
</section>
<footer>內容整理自衛生福利部「113 年度醫院評鑑基準及評量項目、委員共識(醫學中心適用)」，共 2 篇、16 章、195 條；排版經重新整理，正式評鑑請以當年度公告版本為準。</footer>
</div>
<script>
const STD={"intro":"一、 衛生福利部依據醫療法第 28 條規定辦理醫院評鑑，並訂定「醫院評鑑及教學醫院評鑑作業程序」(以下稱作業程序)及「醫院評鑑基準及評量項目(醫學中心適用)」(以下稱本基準)；本基準供申請醫學中心評鑑之醫院參考及使用。\n二、 本基準內容之編排，區分為篇、章、條、項、款、目六個層級，共計有 2 篇、16 章、195 條。其中章號使用二碼數字，條號使用三碼數字。引用條文規定時，可略去篇名與章名。\n三、 本基準之條文，分類方式如下：\n1. 「可免評之條文」：醫院可依提供之服務項目而選擇免評之條文，於條號前以「可」字註記。\n2. 「符合/待改善條文」：於條號前以「合」字註記。\n3. 「必要條文」：此類條文規範基本的醫事人員之人力標準，於條號前以「必」字註記。\n4. 「重點條文」：此類條文規範醫院環境與設備安全、風險管理、防火安全、緊急應變管理、護病比及感染管制等標準，於條號前以「重」字註記。\n5. 「試評條文」：於條號前以「試」字註記。\n四、 本基準依評量等級分為「優良、符合、待改善」，評量等級認定原則如下：\n1. 優良：同條文中，所有符合及優良評量項目(僅限一項未達成者不在此限)均達成。\n2. 符合：同條文中，所有符合評量項目均達成。\n3. 待改善：同條文中，1 項(含)以上符合評量項目未達成。\n五、 有關醫院評鑑成績之核算，請參照作業程序「附件五、醫院評鑑及教學醫院評鑑合格基準及成績核算方式」之規定。","CH":[{"pn":"1","pt":"經營管理","no":"1.1","t":"醫院經營策略","d":"醫院經營管理實務中，經營策略決定醫院的定位及政策，透過每項政策的規劃、實質的領導，建構符合醫院定位的文化，發展以病人為中心的醫療，確保所提供之醫療服務為民眾所需要的。在策略規劃過程中，醫院的監督或治理團隊(Governing body，可包含董事會、主管機關等，依個別醫院架構可自行決定)負責邀集經營團隊(Executive team)(可包含院長、副院長、資深主管、部科或醫療團隊主管，個別醫院可自行定位)共同設定醫院宗旨、願景及目標，明訂組織架構及指揮系統，落實分層負責與分工。監督或治理團隊尋求必要資源，經營團隊遵循宗旨、願景及目標，擬訂計畫與策略，型塑病人安全及醫療品質之文化，建立內部病安、品質促進及管理機制，提供病人真正需要、適度且不浪費的醫療照護。依宗旨、願景及目標所訂定之短中長期計畫，應以團隊概念共同建構，在策略規劃過程中應將服務區域民眾之需求納入，以符合醫院永續發展之需要。另外，經營團隊成員應具備執行職務所必須之知識、技能及素養，定期收集病人安全、醫療品質與經營管理相關之全院指標並進行分析，醫院之監督或治理團隊與經營團隊間應定期共同針對相關資料之分析結果進行討論，以確認需改善之相關議題。會計、成本管理與財務管理作業等亦是確保醫院永續經營所不可或缺之經營策略支援系統。為確保醫院經營績效符合醫院之宗旨及目標，監督或治理團隊與經營團隊應定期溝通與檢討，由經營團隊提出解決方案並進行改善。"},{"pn":"1","pt":"經營管理","no":"1.2","t":"人力資源管理","d":"人力資源管理工作範疇，包括：工作分析、招募甄選、訓練發展、績效評估、薪資福利及員工關係管理等六大部分。妥善的員工管理與支持制度除可讓醫院的經營符合法規及實務的需要，透過人事管理制度，可確保醫院人員的專業資格(適當的學經歷及專業執照)、人力的妥善運用(專責、專職、專任、兼任、外包之搭配運用)、完整的教育訓練、妥適的工作環境與情緒支持等，營造最適醫院定位之工作環境與條件。醫院首先需建立人事管理制度，依醫院規模、屬性配置適當人員或成立相關單位，依法及醫院實務需要設計招募、徵選、薪資規定等辦法，招募符合各單位需求、職掌的合適人力，考量員工工作負荷，且依業務量變化適時調整人力，給予多元化且因應業務發展及個人職涯所需之教育訓練，並設計適用的評核與升遷制度，提供員工持續進步、發揮所長之動機，並評估各項資源投入與產出、期待與實際之差異，找出造成差異的原因及確定改善方向。醫院是一高度壓力工作場所，醫院除建構安全、適合工作的環境外，在員工支持方面，應重視工作人員健康防護、健康促進與福利，有健康、滿意的工作人員才有專業、有品質的醫療服務。另外，應提供工作人員適當的意見反應管道(如：滿意度調查、主管信箱等)及心理支持及輔導機制，釐清工作同仁所提問題予以適當處理，協助員工調適，定期辦理紓壓或情緒支持相關講座或活動，提升員工心理衛生相關知能，甚至有互助機制，減輕員工面臨困境或醫療糾紛時之壓力。"},{"pn":"1","pt":"經營管理","no":"1.3","t":"人力需求管理","d":"在人力資源制度之管理與執行方面，希望引導醫院及主管瞭解院內應定期評估人員能力、適當配置人員、給予適切工作內容及合理之工作量，由此確保人員不致承受過多、過重之責任、壓力與業務範圍，確保醫療品質及提升病人安全。醫院應評估醫師及各類醫事人員之專業能力及監測醫療品質；另外，醫院應確保主管之適任性(包括臨床及行政經驗之評估等)。目前醫院有許多支援系統係採外包方式委託專業組織或人員提供服務，醫院應負監督管理責任，對外包業務及人員有適當管理機制，以茲確保外包人員確實具備工作相關專業證照或資格條件及人力素質適當，對於外包業務內容及範圍亦應適當委託，以不影響醫療品質並納入統一管理為原則。\n【必要條文評量共識】\n1.若評鑑基準等同醫療機構設置標準時，參考地方衛生主管機關認定結果。\n2.若評鑑基準高於醫療機構設置標準時，不適用前項原則，委員仍應依評鑑基準內容進行查證。\n3.有關必要條文(人力配置)之評量方式及合格要件，須符合醫院評鑑及教學醫院評鑑作業程序「附件五、醫院評鑑合格基準及成績核算方式」之規定。\n4.評量項目所提「年平均佔床率」共有下列二種認計原則，由醫院擇一採計，並提供予評鑑委員參考，惟各職類人力計算應採同一認計原則：\n(1)近三年之年平均佔床率。\n(2)實地評鑑前之月平均佔床率：期間自 109 年1月至實地評鑑前，或自開業日期起至實地評鑑前。"},{"pn":"1","pt":"經營管理","no":"1.4","t":"病歷、資訊與溝通管理","d":"病歷之妥善管理，對醫院醫療品質有很大的影響，將評估病歷管理應用之體制是否完善，包括：\n1.病人的病歷應統一合併，妥善管理(編號、登記、歸類)，以利其他專業診療參考，避免重複診療。\n2.應明確掌握病歷行蹤及品質，訂有防止遺失及質與量審查等品質確保機制。\n3.使用統一之病歷號，避免同名或同姓病人錯置。\n4.能快速檢索符合特定條件的病歷。\n5.門診病歷送到診間之即時性評估。\n6.應對病歷內容有完善之保密措施。\n7.電子病歷相關管理確依 111年7月18日公告修正之醫療機構電子病歷製作及管理辦法辦理。\n8.定期利用病歷製作、效率及業務評估的指標資料。在資訊與溝通管理方面，醫院應明訂資訊管理及安全相關政策與作業規範，確保資訊具有「保密性」、「安全性」、「可用性」與「完整性」等必備條件，防止病人資料遺失、誤用，明確訂定病人資訊保密相關措施。隨著網際網路和人工智慧快速進展，如何在兼顧保密和隱私下，逐步發展智能醫院，提升病人服務，行政效能和安全品質照顧，並藉資訊化數據收集與分析，強化疾病管理、診斷技術開發，和實證分析研究，是病歷、資訊與溝通管理的重要趨勢。"},{"pn":"1","pt":"經營管理","no":"1.5","t":"安全的環境與設備","d":"本章重點旨在引導與檢視醫學中心透過完善醫院經營管理機制達成下列目標：\n1.創造安全友善就醫環境，樹立醫院主客觀口碑與評價。\n2.營造病人與員工安心舒適的醫療與工作環境。\n3.主動預防火災及相關複合性災害危機，建立醫療界標竿學習模式。依據美國健康照護研究與品質管理局(Agency for Healthcare Research and Quality, AHRQ)之建議「要提升病人安全必須確保醫療照護過程不會發生任何意外或可預防性之傷害」，因此醫院經營者在規劃醫院建築與相關硬體設施時即應將員工工作環境與病人就醫環境之安全納入考量，並審視是否符合相關法規之要求，如建築法、公共安全、防火安全、勞工安全、感染管制、身心障礙相關設施規定等，若發現有違相關法令之規定，應立即改善以確保員工與就醫病人及其家屬之安全。為提升病人就醫之方便性與可近性，以達成「以病人為中心」之目標，醫院應提供病人或民眾來院之交通、候車與停車規劃、用餐、購物等資訊。此外，應重視身心障礙病人或其家屬之就醫權利，醫院應確保符合法規之無障礙環境與相關設施，如扶手、斜坡道、輪椅、身心障礙專用之浴廁等，且須依照設置科別、病人及其家屬需要，建置適當規格之廁所(如：坐式、蹲式、輪椅用等種類)、其數量除應符合一般病人及家屬之需要外，亦須提供親子適用之設施設備、浴廁等；為確保病人安全與權益，應考量設施設備之可用性(如：輪椅加附點滴架進入浴廁)，並設置急救鈴與建立相關之維護與保養機制。對於就診空間與病房應設定音量管制、維持適當之溫度與濕度以提供合宜舒適之就醫環境。醫院之照護環境安全主要涉及下列兩個層面，包括(一)安全(Safety)：應避免建築與相關硬體設施因設計與維修不當或人為疏忽造成病人、訪客與員工之傷害；(二)保全(Security)：避免人為蓄意破壞、偷竊、暴力攻擊、縱火等威脅病人、家屬與員工生命財產之安全。為協助醫院建立安全防護體系，本章之評鑑基準亦包括提供安全及安靜的病室環境(如：設有機制定期檢查急救鈴或緊急呼救系統、扶手及防滑設施之功能)、訂定安全管理作業規範，提供病人及員工安全的環境(如：設有保全監測設備、警民連線、防止電梯墜落、用電安全管理等)。為避免病人在接受診療過程中因醫療儀器之使用與教育訓練不足(如：將只適合成人使用之醫療技術或器材誤用於小兒科與新生兒病人)、維修保養不當(特別是對於高風險之醫療儀器，如：電擊器、生理監視器與輸液幫浦等未建立預防性保養制度)或相關之基礎設施維修保養不當(如：電力或醫療氣體)導致侵襲性檢查突然中斷(如：心導管檢查)或維持生命之儀器突然停止運作(如：呼吸器)而造成病人傷害或死亡，醫院應定期執行醫療儀器或相關器材與基礎設施(包括機電、安全、消防、供水、緊急供電、醫用氣體等)或系統等之維護、檢查、測試、保養或校正作業。另為避免員工在工作中受到暴力之攻擊，醫院應採必要措施，以確保醫事人員執行醫療業務時之安全。考量住院病人在住院期間之需求，醫院應依病人之特性設置病床，並應保持病房之清潔與安全性，包括定期檢查床欄之安全性、床墊與所使用之床單應定期清潔與消毒，以防止如：疥瘡之群聚感染。另為確保醫院之飲食安全，醫院之廚房與供餐作業應符合膳食安全衛生管理作業之規範，如：危害分析與重要管制點(Hazard Analysis and Critical Control Point, HACCP)之認證規定或ISO22000食品安全管理之認證。"},{"pn":"1","pt":"經營管理","no":"1.6","t":"病人導向之服務與管理","d":"醫院應提供親切合宜，以病人為導向的醫療服務，包括醫院應安排諮詢場所，方便民眾諮詢。另配置適當之服務人員及引導人員。另外，如與病人及家屬建立互信關係及明確醫病間的責任歸屬；提供及評估合宜的掛號、住出院、候診、候檢、領藥及批價等服務，同時能考量身障病人及高齡長者之特殊需求並提供協助。相關作業流程管理，應建立定期檢討及改善機制，如適時導入智能化設計，方便病人就醫及提升服務品質及效率，都為醫院確保醫療服務符合以病人為中心的各種可能作法。病床的有效利用，不僅是善用社會資源，且自醫院經營穩定的觀點而言，亦為重要的指標，無論是急性或長期療養床，應依各醫院特性，有效的運用病床。另外，醫院應考量其功能、環境、及社區特性，提供合宜的醫療環境及方便有效的就醫流程。透過使用者之意見回饋，是醫院評估各項作為最直接的資訊來源。醫院可設有方便病人及家屬提供意見的管道，如：設置意見箱(考量方便使用之設置數量及地點)、善用調查工具等，亦可利用住院須知、院內刊物及公告欄等作為病人意見表達之管道。病人、其家屬及院內同仁改善之建議，均為醫院持續性品質改善的重要參據。為了讓改善活動更符合病人、醫院及同仁需要，應依據醫院的目標與策略方針，設定醫療品質改善之主題及目標；評估相關作業是否確實執行及檢討服務成效；採取 Plan-Do-Check-Act (PDCA cycle：計畫－執行－檢核－活動)步驟，並確認Check 及Act 部分的成效。尤其對於病人或家屬的意見、抱怨、申訴應建置專責處理模式與流程，以提升案件之處理時效，對於病人或家屬訪客用餐、購物環境或相關資訊，亦應妥善安排，使病人及其家屬、訪客均能方便取得所需之服務。"},{"pn":"1","pt":"經營管理","no":"1.7","t":"風險管理","d":"為確保員工與就醫病人及其家屬之安全，醫院應建立風險管理架構，且應成立專責組織(如：風險或危機管理委員會)或指定專責人員負責醫院之風險管理事宜，包括運用風險分析工具(如：災害脆弱度分析)評估與辨識醫院可能發生之災害，如人為災害(如：火災、誘拐幼童、恐怖攻擊等)、技術災害(如：輻射意外、化學危害)、天然災害(如：地震、風災、水災等)與複合式災難(如：地震引起之火災)等，並依據危害分析結果研擬減災、預防與準備措施。醫院面對可能或已發生之醫療爭議時，應以誠實的態度，指定專責人員或單位妥善因應，對外回應醫療爭議。為防範事件再發生，醫院應釐清事故發生原因及真相，正確掌握事件發展，並應有檢討紀錄及防範事件再發生之措施，作為改善之參考依據。另外，對於相關受影響之醫院同仁亦應提供支援互助機制，共同從經驗中學習。"},{"pn":"1","pt":"經營管理","no":"1.8","t":"建立緊急應變管理機制","d":"為確保員工與就醫病人及其家屬在面臨醫院緊急災害時之安全，醫院應建立緊急應變管理機制，且依據緊急應變需要儲備或即時取得災害所需之醫療用品、通訊器材及其他資源，並有檢討改善機制。醫院在建立緊急應變管理機制時應成立專責組織或指定專責人員統籌醫院緊急應變管理事宜，包括依據風險分析結果研擬緊急管理計畫(Emergency Management Program, EMP)，以提升醫院之緊急災害應變能力。為提升醫院面對災害事件發生時之緊急應變能力以減少災害之衝擊，對突發災害事件應建立健全之全災害應變管理系統。緊急災害應變計畫應整合緊急應變指揮系統(如：HICS)，並依據災害事件之衝擊大小與應變期間(Operation Period)長短決定緊急事故應變團隊(Incident Management Team, IMT)之動員規模、任務與目標。緊急災害應變計畫須包含災害事件發生至結束之週期內(Life Cycle Stages of an Incident)各階段(災害確認、通知/啟動、動員、應變、歸建與復原)之緊急應變作業程序。對於火災、風災、水災、地震等緊急災害，應訂有符合醫院與災害特性之緊急災害應變計畫與作業程序，並落實演練。此外，為防止災難發生時衍生之院內與院外(社區)大量傷患救護需求，醫院應設置大量傷患緊急應變處理小組與健全指揮系統，每年定期與地方政府或相關團體共同辦理大量傷患處理之訓練，以滿足所在社區發生災害時之救護需求。"},{"pn":"2","pt":"醫療照護","no":"2.1","t":"病人及家屬權責","d":"每一位病人都具有獨特性，有著不同的需求、價值觀和信仰。故當病人就醫時，應該受到奠基在醫學倫理基礎下的妥適照護，此為病人基本的權利。為保障病人就醫的權利，醫院應以病人的觀點，明確訂定有關病人權利的相關政策、規範，並公開倡導，讓病人及家屬能充份瞭解其權利並參與醫療決策；同時也要教育員工理解及尊重病人的自主性和價值觀，提供維護病人尊嚴且周到的醫療服務。讓醫院、員工與病人家屬共同營造一個重視病人就醫權利的優質照護環境。因此本章的重點有下列幾項：\n1.醫院應明訂維護病人權利的政策或規範，並向病人、家屬及員工宣導、說明相關就醫權利的内容。\n2.教育院內工作人員在執行醫療照護與服務時，應向病人充份說明、溝通，並隨時留意尊重及保護病人權利。\n3.病人接受診療時，醫療照護團隊應向病人進行說明，特別是進行侵入性檢查或治療前，應提供書面說明以確保內容正確被瞭解，並取得病人簽署完整的同意書。\n4.應鼓勵病人及其家屬參與醫療決策，工作人員以病人及家屬能理解之語言，解說病人的健康及醫療相關的資訊，如病人欲尋求其他醫療人員之意見時，醫院應主動協助。\n5.為維護及尊重病人的醫療自主權，醫院能對病人、家屬提供有關生命末期醫療抉擇的相關資訊，並制定相關規範或標準作業程序，以利工作人員遵循。\n6.在醫療過程中應隨時注意病人隱私的維護，如：檢查時應避免不必要的身體暴露；在檢體採集及運送有適當的安排；診療過程產生的資料不論紙本、聲音、照片或電子檔案等，均應尊重病人的隱私權予以適當保密。"},{"pn":"2","pt":"醫療照護","no":"2.2","t":"醫療照護品質與安全管理","d":"醫療照護品質及病人安全是每日常規醫療照護的根本。此信念必須深植於每位醫療工作人員的心中，從不間斷的醫療照護品質精進，使醫療照護效率提昇、更充分利用資源並減少病人於醫療照護中所承受之風險。主管對品管及病安的重視為成功的首要條件，經由良好之全院醫療照護品質管理計畫，進而建立醫療組織文化中對品質及病人安全的關注。利用各種資料分析及改善計畫，達成醫療品質的持續進步。因此本章規範之目的有下列幾項：\n1.醫院管理者須規劃醫療照護品質管理計畫：醫療照護品質的提升需要醫療專業及行政管理之協助，同時有良好的全院管理架構及計畫；醫院管理者應建立品質管理架構、推動品質精進計畫及監督此系統之運作以達成目標，有醫院管理者之重視及支持，才能塑造出醫院品質及病安文化。\n2.訂定出適當之醫療品質指標以保障病人安全：醫院應利用收集之資訊，針對危急、高風險、易出錯等方面，建立適當之醫療品質指標，藉由指標分析，尋求優先的品質改善項目，以保障病人安全。\n3.建立品質及病人安全的組織文化：定期將醫療品質及病人安全資訊傳遞給全體員工，鼓勵及教育員工參與醫療品質持續改善活動，建立品質及病人安全的組織文化；透過醫療照護團隊的溝通，將醫療品質改善成果加入醫療照護常規或技術手冊中，確保改善成果用於提升照護品質。\n4.對醫療不良事件之事前預防及事後分析檢討：醫院對於各種可能發生醫療不良事件之高危險情境，宜訂定預防措施以維護病人安全，對於發生之醫療不良事件，應明訂發生時的處理方式，並鼓勵通報；醫療不良事件發生後，應作根本原因分析，以避免類似事件再發生。\n5.分析各類品質資料和其他醫院分享成果，共同提升醫療照護品質：醫療照護團隊間藉由全院性研究或會議報告等，互相理解院內各部門診療活動；利用品管資料，經由分析研究，於討論會提出報告或發表於雜誌期刋，以提供臨床醫學或醫院管理上之實證，與醫界分享成果，共同提升醫療照護品質。"},{"pn":"2","pt":"醫療照護","no":"2.3","t":"醫療照護之執行與評估","d":"醫療機構最重要的目的是為提供病人所希望且最適切的醫療照護，這需要醫療機構內各領域的員工有良好的協調及溝通。在執行醫療照護計畫時，宜以實證醫學為基礎，檢討醫療照護之適當性，動態評估病人對照護計畫的反應，並視需要隨時修正計畫。醫院對於病人所提供之照護為整體醫療照護的一個環節，完成階段性醫療照護後，應考慮病人之病情安排持續性照護服務。如此不僅能有效的使用醫療資源，並能提供病人所需之照護且改善病人之健康狀態。本章規範之目的有下列幾項：\n1.明訂醫療照護團隊人員權責，並有良好的團隊運作以提供病人醫療照護。\n2.醫療照護團隊成員應將病人評估及醫療照護計畫，詳細記載於病歷中，並確實傳遞病人照護相關資訊。\n3.以實證醫學為基礎研訂作業常規，以利醫囑之執行。\n4.依病情之需要，適切照會相關之醫療照護團隊，各種領域間有良好的協調及溝通，以達高水準之醫療照護。\n5.病人轉出至其他單位時，應提供醫療照護摘要，以達持續性照護之目的。\n6.應依病人需要協助轉診，轉診之安排應考量病人安全，注意轉診過程中必要的醫療照護安排。病人轉出或出院至其他單位時，應提供醫療照護摘要，以達持續性照護目標。\n7.醫療照護團隊應提供病人出院準備及後續照護計畫，包含出院病人用藥指導、營養指導、復健指導、回診預約與出院摘要等資訊，醫院亦應與後續照護服務之單位建立連繫及合作關係，確保病人獲得適切之後續照護。\n8.住院病人之照護應朝向整合醫學照護制度發展。"},{"pn":"2","pt":"醫療照護","no":"2.4","t":"特殊照護服務","d":"在醫療照護中，面對處於高危險情境(如：急診、加護病房)的病人，醫療照護的執行與評估十分重要，因此醫院必須特別對此訂定適宜之標準流程及規定，以提供適宜的照護品質。另外，特殊的醫療照護亦應有特殊之規範，如精神醫療、呼吸器使用、透析照護、中醫及牙科照護，以提供完整、一致、安全的醫療照護。本章規範之目的有下列幾項：\n1.急診及加護病房之病人，均為危急之病情，病人之醫療照護執行與評估均應有特殊之要求。醫院對執行醫療照護的設備器材及人員之人力、資格、訓練均應符合規定。\n2.照護精神科病人之醫療照護人員之人力、資格、訓練均應符合規定，並能提供適宜的精神照護內容。\n3.透析照護與呼吸照護應由適當的醫療照護團隊提供，制定並落實設施設備維護的管理，以建置安全的照護環境。\n4.提供牙科與中醫照護時，應配置適當且訓練完備的照護人力，並落實設施設備維護的管理與病人安全措施。\n5.針對上述病人照護應有合宜的醫療品質管理，亦應設定相關之醫療及病人照護品質指標，定期檢討、分析及改善，以提升照護的品質。\n6.精神病人為特殊族群，常無法有自主權，其權利容易受到傷害。對於強制住院之精神病人應經合法鑑定及住院程序。"},{"pn":"2","pt":"醫療照護","no":"2.5","t":"用藥安全","d":"藥品對疾病之預防、治療及症狀緩解均占有十分重要的角色。藥品管理是醫院對藥品使用過程中整體流程之監測，需要醫療機構內各種領域員工的協調配合。醫院對藥品選擇、採購、儲存、處方、調劑、配送、給藥、記錄及效用追蹤等，均應訂定標準流程並持續品質監測改善，以提昇用藥安全。本章規範之目的有下列幾項：\n1.醫院應確保藥品品質，藥品必須有良好保存管理，藥品存放之必要的硬體設備及設施，必須維持正常狀況。\n2.在藥品的庫存管理上，應依據醫療的需要採用合適藥品。醫院應訂有藥品採用原則之標準化作業程序，以實際需要及病人用藥安全管理為考量決定採購藥品類別及掌握適當的庫存量，並確保使用之藥品均於有效期限中。\n3.處方上應妥善記載藥名、含量、劑型、用量、用法、給藥方法、給藥期間。若處方內容不完整，藥事部門應可適當查詢建議修正，並宜有藥師指導或監視機制以防止處方之重複與浪費。建議建立相關資訊系統以供醫師在開立處方時能隨時檢索必要的藥品資訊，規範特定藥品的使用方針及步驟及設定防止醫師開立錯誤處方之機制。\n4.在藥品調劑流程及環境、設備，建議可參考「藥品優良調劑作業準則」等相關規範，訂有明確的門診及住院調劑作業程序。對於高警訊藥品、特殊混合注射藥品應有特殊的保存、調劑流程，以保障用藥安全。\n5.為達正確的給藥，應確實執行標準作業程序，且給藥前應瞭解藥效、副作用、使用量及病人是否有藥品過敏等情形。於給藥中、給藥後應注意病人反應，如有需要須正確且迅速處理。\n6.組織內有如藥事委員會或病人用藥安全相關機制等之設置狀況及其機能，以確保病人的用藥安全。在機制之執行上，用藥安全的報告，應構築在非追究個人責任而是組織系統改進的態度及所謂「安全文化」之營造。各項病人用藥安全調查結果應回饋於系統流程之改善，透過在職及新進人員訓練，以改善用藥安全。\n7.醫療照護團隊應提供病人用藥指導，並對民眾提供各項藥品相關資料。"},{"pn":"2","pt":"醫療照護","no":"2.6","t":"麻醉及手術","d":"麻醉及手術在醫院是非常複雜且重要的醫療處置。麻醉及手術需要有完整的病人評估、整合性的照顧、持續病人監測及安全的轉送，才能對病人提供安全及合宜的醫療照護。醫院應有系統性的組織管理相關軟硬體，以符合法令規範及病人需求。本章規範之目的有下列幾項：\n1.醫院應確保適當之手術、麻醉部門體制及人力配置，手術、麻醉相關設施應由具有專業知識及技巧之人員負責保養管理，並有適當的手術排程管理。醫院應收集手術麻醉、鎮靜與手術後疼痛控制等相關之資訊，加以分析、統計、管理，以保障病人安全及提昇醫療品質。\n2.手術前應完整評估病人，向病人解釋麻醉及手術方式，與病人討論後選擇最適當的麻醉及手術方式。\n3.確實遵照適當的病人辨識程序，確保病人身分、手術項目與手術部位之正確無誤。\n4.詳實且即時記載麻醉紀錄及手術紀錄。\n5.訂定手術前、中、後之護理照護常規及處置步驟，確實遵行並詳實紀錄。"},{"pn":"2","pt":"醫療照護","no":"2.7","t":"感染管制","d":"感染管制的目的在預防和降低病人、家屬、工作人員及其他出入醫院人員在醫院內得到感染，防止病原體在院內之散佈，並在發生醫療照護相關感染時迅速察知，予以因應。有效之感染管制須有感染管制專家的領導及訓練有素的感染管制人員，利用資料分析，主動察覺感染風險並能及早因應。並應訂定適當計畫整合各部門工作及教育全院員工做好份內的感染管制相關工作。本章規範之目的有下列幾項：\n1.醫院應設立感染管制相關單位，且確實執行各項業務以達感染管制目的。並有計畫且持續進行感染管制監測及改善方案。\n2.應對各種預期可能發生之感染事件有應變計畫，訂有感染管制手冊以提供醫院內各部門執行感染管制之根據。加強員工的感染管制教育，使所有工作人員知悉感染管制對策方法及步驟。\n3.適當且足夠的防護設備及洗手設備。\n4.訂有員工保護措施，並落實執行。\n5.隨時能掌握醫院醫療照護相關感染的最新狀況，採取具體且適當的感染管制措施。\n6.建立抗生素管理機制促進抗生素適當及合理之使用。\n7.衛材、器械之清潔管理、滅菌消毒、儲存、動線、租賃及配送等步驟及管理方法，均應符合感染管制原則。"},{"pn":"2","pt":"醫療照護","no":"2.8","t":"檢驗、病理與放射作業","d":"對病人做正確合宜的評估才能作出最適切的醫療照護計畫。病人的評估為一持續性的工作，包括收集資訊、分析各種資料，如：身體、實驗室及影像等各種檢查結果。這些評估需要醫療照護團隊成員共同的參與，整合出最適切的醫療照護計畫。醫院應必須對各種檢驗、檢查訂定適宜之標準流程及規定，以提供適宜的照護品質及確保醫療照護團隊能有效的溝通及整合。本章規範之目的有下列幾項：\n1.醫事檢驗、解剖病理、血品供應單位及放射影像的各種檢查及治療應訂定運作規範，以確保安全及病人的評估資訊正確。\n2.醫事檢驗、解剖病理、血品供應及放射影像等單位，執行檢查及治療之各種儀器設備必須遵照功能維護要求，依照所訂定的程序，進行必要時的查驗、保養、維修或校正等措施，以確保其運作正常。同時對於設備所產生的工作環境安全問題，應有妥善的處理方式與監測機制。"}],"CL":[{"n":"1.1.1","tags":[],"t":"訂定適當之策略與計畫，經執行結果達到醫院宗旨、願景及目標","ev":"目的：醫院應依據宗旨、願景與目標，訂定適當的執行計畫，以提升病人安全、醫療品質，尊重病人權益的文化，確實履行在服務區域之角色與任務。\n符合項目：\n1.醫院之監督或治理團隊與經營團隊共同訂定醫院之宗旨、願景及目標，並適當向員工宣導使其瞭解。(原1.1.1-符合1、優良2併)\n2.所訂定之宗旨、願景及目標，能營造以病人為中心的文化：追求病人安全及醫療品質、尊重病人權利、提供的醫療照護是病人所真正需要的。(原1.1.1-符合 2修)\n3.依據醫院之宗旨、願景、目標及服務區域民眾需求分析結果，由經營團隊擬訂策略與短、中、長期計畫。(原 1.1.1-符合3、優良3併)\n優良項目：(下述項目(不含試評項目)僅限一項未達成)\n1.醫院之監督或治理團隊審查及核准為達成醫院宗旨、願景與目標所需之相關計畫及預算。(原1.1.1-優良4修)\n2.監督或治理團隊會議必須有員工代表及社會公正人士的參與機制。(原1.1.1-優良1修)\n3.監督或治理團隊定期檢討醫院之宗旨、願景與目標，俾符合國家政策、法令與社區民眾之需求。(原1.1.1-優良 5 修)\n4.各部門主管有設定部門目標及擬訂發展計畫，且皆能符合醫院之總目標，以利於達成醫院之願景。(試)\n5.對目標與計畫之執行成效，有妥善追蹤及評量之機制，並定期檢討調整。(原1.1.1-優良6 修)\n[註]本條用詞定義如下：\n1.監督或治理團隊(Governing body)係指監督醫院營運或治理醫院之最高層級組織或個人，可包含如董事會、主管機關等，以下簡稱監督團隊。\n2.經營團隊(Executive team)係指依監督或治理團隊之決議或指示，實際負責醫院營運者，可包含如院長、副院長、資深主管、部科或醫療團隊主管等。\n3.優良項目 3所提「國家政策」，宜包含分級醫療、長期照護及生醫產業。\n4.優良項目 4列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.可呈現醫院監督或治理團隊及經營團隊之章程、組織圖。(符合)\n2.醫院之監督或治理團隊及經營團隊皆參與訂定宗旨、願景及目標之相關資料。(符合)\n3.醫院在病人安全及醫療品質、以病人為中心、尊重病人權利、提供的醫療照護是病人所真正需要之執行成果。(符合)\n4.服務區域需求之分析結果。(符合)\n5.醫院之角色、功能、目標與計畫之書面資料。(符合)\n6.部門的目標及計畫。(優良)\n7.對目標與計畫執行成效之追蹤與改善資料。(優良)","cs":"1.監督或治理團隊，可包含如：董事會、退輔會、軍醫局、醫學院、衛福部醫管會、公立醫院主管機關等。\n2.評鑑委員於實地評鑑時，將了解醫院之監督或治理團隊有無授權機制(醫院自行舉證)。\n3.請醫院之監督或治理團隊派員列席實地評鑑，且於「委員與醫院代表面談」時段，應至少有 1 位代表出席。","p":2,"ch":"1.1"},{"n":"1.1.2","tags":[],"t":"醫院之監督或治理團隊與經營團隊應積極主動提升醫療品質、病人安全及經營管理成效，並營造重視醫療品質及病人安全之文化","ev":"目的：監督或治理團隊與經營團隊定期針對病人安全、醫療品質與經營管理相關議題進行討論，並責成經營團隊依其專業研擬改善方案，定期追蹤改善成效，提升醫療品質、病人安全及經營管理成效。\n符合項目：\n1.經營團隊執行病人安全、醫療品質與經營管理之相關成員，應具備職務所必須之知識、技能及素養。(原1.1.2-符合1修)\n2.經營團隊定期收集病人安全、醫療品質與經營管理相關之全院資料並進行分析。(原1.1.2-符合2修)\n3.經營團隊能建立有效機制以促進院內同仁對醫療品質、病人安全之改善共識，且該共識能傳達給同仁周知。(原1.1.2-優良3修)\n4.經營團隊定期針對全院病人安全、醫療品質與經營管理相關之年度計畫目標呈送監督或治理團隊報備，並獲得共識。(原 1.1.2-符合 2修)\n5.經營團隊對於病人安全、醫療品質與經營管理之解決方案，應定期呈送監督或治理團隊進行討論及指示調整。(原1.1.2-符合3修)\n優良項目：(下述項目(不含試評項目)須全部達成)\n1.經營團隊與監督或治理團隊能建立機制定期討論如何妥善運用外部機構提供之醫療品質與病人安全資料，訂定關鍵績效指標，確實執行並有效達成目標。(原1.1.2-優良1修)\n2.定期檢討與改善醫療品質、病人安全與經營管理之執行成效並有追蹤及改善機制。(原1.1.2-優良2修)\n3.能運用智能化設計方式提升醫療品質、病人安全及經營管理成果，足為標竿。(試)\n[註]\n1.優良項目 1 之「外部機構提供之醫療品質與病人安全資料」係如：健保品質指標、TCPI、THIS、TCHA或外部認證等。\n2.優良項目 3列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.經營團隊中負責醫療品質與病人安全之主管學經歷文件。(符合)\n2.監督或治理團隊與經營團隊溝通之內容與相關之會議紀錄。(符合)\n3.經營團隊定期收集病人安全、醫療品質與經營管理相關之關鍵績效指標，及全院資料與分析結果。(符合/優良)\n4.運用外部機構提供之醫療品質與病人安全資料，訂定提升醫療品質與病人安全之目標之會議紀錄。(優良)\n5.列舉醫院在醫療品質、病人安全與經營與營造重視醫療品質及病人安全文化成效之檢討與改善紀錄。(優良)\n6.列舉醫院運用智能化設計提升醫療品質、病人安全及經營管理成果。(優良)","cs":"","p":4,"ch":"1.1"},{"n":"1.1.3","tags":[],"t":"明訂組織架構及指揮系統，落實分層負責與分工","ev":"目的：明訂組織架構、指揮系統及管理制度，各部門及跨部門整合團隊據以推動各項業務及資料管理。\n符合項目：\n1.訂有清楚之醫院組織架構圖及各類規範能適時檢討、修正更新，並公告周知或傳達院內相關同仁。(原1.1.3-符合 1、3、4併)\n2.訂有組織章程(包含各單位於醫院經營管理、醫療照護及一般業務推動之權責)、辦事細則(工作手冊)、內部管理規章、分層負責明細等，各部門並據以訂定作業規範或程序。(原1.1.3-符合2修)\n3.依組織架構圖各部門單位能落實分工及分層負責。(原 1.1.3-符合 3修)\n4.醫院應有適當的單位負責病人安全、倫理、法律之管理，確保病人之權益。(試)\n5.全院文件資料有管理機制(包含紀錄保存、發行及更新)，並據以執行。(原1.1.3-符合5)\n優良項目：\n1.醫院組織結構，有利於人員溝通，訂定計畫及服務品質的監測。(試)\n2.設有跨部門整合團隊之指揮、分工、協調與整合成效良好。(試)\n3.各部門有獨立人事編制，作為各部門執行依據，及各部門定期召開業務會議。(試)\n[註]\n1.落實分工及分層負責，如：表單之設計可呈現分工及分層負責者，各部門、層級成員清楚其業務內容、權責範圍及授權等相關事項。\n2.跨部門整合團隊從各部門徵調常設性的成員，針對解決各種不同的協調問題而設立，如：癌症中心、腦中風中心、心血管中心等。(不含委員會或臨時性專案團隊)。\n3.符合項目 4 及優良項目 1、2、3 列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.醫院組織架構圖、組織章程。(符合)\n2.各單位辦事細則(工作手冊)、作業規範或程序相關檢討之會議紀錄。(符合)\n3.組織調整規章修正之公告相關資料。(符合)\n4.各部門及跨部門整合團隊任務及業務會議紀錄。(優良)","cs":"符合項目 5，文件管理機制不限定於ISO。","p":5,"ch":"1.1"},{"n":"1.1.4","tags":[],"t":"訂定醫療業務指標、內部作業指標，定期分析及檢討改善","ev":"目的：收集醫療業務管理及內部作業流程等相關指標，並建立定期檢討與改善機制，提升醫院經營管理績效。\n符合項目：\n1.有專責人員或部門負責收集醫療業務管理及內部作業流程相關指標，定期收集資料並分析，且至少每季有一次報告及檢討。(原1.1.4-符合1 修)\n2.收集醫療業務管理相關指標至少 5 項，並應包含佔床率、他院轉入病人數、轉出病人數及住院手術人次等。(原1.1.4-符合2修)\n3.收集內部作業指標至少包含：平均住院日、等候住院時間(含急診病人及一般病人等候住院時間)、等候檢查時間(醫院可自行選定核心檢查項目)、門診等候時間、領藥等候時間等。(原1.1.4-符合3修)\n優良項目：(下述項目須全部達成)\n1.依指標資料之分析及檢討結果，進行改善且成效良好。(原 1.1.4-優良1修)\n2.設有品質內控(或異常管理)機制，如：因門診人次過高，以致每一病人之平均診療時間極短者，能監測並改善其診療品質；或如：實施較高風險之侵入性檢查(或治療)，但診斷結果為陰性之比率，有異常者能予以監測並設法改善。(原1.1.4-優良2 修)\n3.定期選擇適當管理工具實施年度性醫院內部作業流程指標分析及檢討，並視情形改善，成效良好。(原1.1.4-優良 3)\n[註]\n1.醫療業務管理相關指標，如：門診人次、初診人次變化、急診人次、佔床率(急性病床、慢性病床分開計算)、住院人日、他院轉入病人數、轉出病人數、門診手術人次、住院手術人次、疾病與手術排名變化、死亡率(粗、淨率)等。\n2.較高風險之侵入性或放射性等檢查(或治療)，醫院可自行選定監測之檢查(或治療)項目，如：上消化道內視鏡檢查、心導管檢查、電腦斷層掃描等。\n評量方法及建議佐證資料：\n1.醫療業務指標與內部作業指標收集結果。(符合)\n2.醫療業務指標與內部作業指標之執行成效與改善紀錄。(優良)\n3.高門診人次之醫療品質與較高風險之侵入性或放射性檢查(或治療)之品質監測指標與相關檢討之會議紀錄。(優良)","cs":"1.符合項目 3 所提「等候住院時間」及「等候檢查時間」之分析檢討，鑑於各醫院之認定標準不一，故由評鑑委員於實地評鑑時，依醫院現況進行認定。\n2.優良項目 2：\n(1)醫院自行訂定各科醫師合理門診量，並有檢討及追蹤機制。\n(2)高風險檢查及治療設有監控機制。\n3.優良項目 3，醫院內部作業流程指標應有過去 3 年資料，並有比較資料(與院內單位/科部別或同儕醫院)。","p":7,"ch":"1.1"},{"n":"1.1.5","tags":[],"t":"如期提報醫院評鑑持續性監測系統之量性指標及質性文件","ev":"目的：定期提報醫療品質相關量性指標及質性文件，達到持續性之內部改善及自我管理，並確保醫療品質。\n符合項目：\n1.需定期於「醫院評鑑持續性監測系統」中提報量性指標及質性文件。(原1.1.11-符合1)\n2.量性指標中必填指標平均每年提報完成率需大於等於 90%，且質性文件平均每年上傳完成率需大於等於 80%。(原1.1.11-符合2)\n優良項目：(下述項目(不含試評項目)須全部達成)\n1.量性指標中必填指標平均每年提報完成率達 100%，及質性文件平均每年上傳完成率達 100%且品質良好。(原1.1.11-優良 1)\n2.品質管理專責單位積極培訓各部門品管人員有關指標訓練課程(指標收集、分析與檢討)，並定期舉辦指標管理之標竿學習研討會。(試)\n[註]\n1.量性指標：\n(1)臨床照護指標：採每月提報，系統每月提報截止日為當月結束後1 個月，如 3月指標截止日為4月30日、4月指標截止日為5月31 日、5月指標截止日為6月30日，以此類推。\n(2)醫事人力指標：採每月提報，系統每月提報截止日為當月結束後10 日，如 3 月指標截止日為 4 月 10 日、4 月指標截止日為 5 月10 日、5月指標截止日為6月10日，以此類推。\n2.量性指標提報完成率計算：分母為每年必填指標項數×應完成月份，分子為每年實際完成提報之總指標項數。\n3.質性文件：採每年提報。\n4.質性文件上傳完成率計算：分母為每年需繳交之質性文件數，分子為每年實際完成上傳之文件數。\n5.優良項目 2列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.平均每年指標提報完成率。(符合/優良)\n2.平均每年質性文件上傳完成率。(符合/優良)\n3.指標訓練紀錄、學習研討會紀錄。(優良)","cs":"資料收集期間自 104 年 4 月 1 日起開始填列。補充說明\n1. 衛生福利部於 106 年 2 月 17 日修正核備「醫院評鑑持續性監測指標操作型定義手冊」，量性指標依醫院評鑑基準條文、醫院層級、屬性及是否有提供服務列為「必填」。\n2. 量性指標自 106 年起新增「醫事人力」指標共計 13項，於106年4月開放填報，並回溯填報 1 月至 3 月資料。\n3. 量性指標填報率計算方式如下：\n(1) 104 年 4 月至 106年 3月以原有之必填指標(9項)計算。\n(2) 106 年 4 月起依醫院有提供之服務項目(含臨床指標及醫事人力)計算。","p":9,"ch":"1.1"},{"n":"1.1.6","tags":[],"t":"健全之會計組織及制度，並有財務內控及外部查核機制","ev":"目的：建立健全會計制度與相關財務內控及外部查核機制，定期檢討改善，提升財務管理成效及確保醫院財務健全，並有適當的成本會計制度。\n符合項目：\n1.設置會計業務單位或專責人員。專責人員應熟悉一般公認會計原則，據以執行會計業務。(原1.1.5-符合1)\n2.會計制度完備，如：有符合一般公認會計原則或醫療法人財務報告編製準則之會計報告格式、會計科目、簿籍、憑證、會計事務處理程序、內控機制等。(原1.1.5-符合2)\n3.建立並執行內控機制，並依內控結果修正相關機制與作業。(原1.1.5-符合3、優良5併)\n4.建立成本會計制度，掌握部門別(科別、單位別)收入及費用，並有相關報表。(原1.1.5-優良 4修)\n5.有進行分析，訂定關鍵項目與「去年同期」、「前期」或「單位間」作比較，並分析差異原因。(試)\n優良項目：(下述項目(不含試評項目)僅限一項未達成)\n1.定期編製符合一般公認會計原則之各種相關財務報表，應包含損益表(收支餘絀表)、資產負債表、現金流量表等，於年度結(決)算後適時提供醫院決策參考。(原1.1.5-優良1修)\n2.編製年度預算書與結(決)算書，應符合醫院年度工作計畫。(原1.1.5-優良2)\n3.委請外部會計師財務報表簽證(或經政府審計單位審查)，至少一年1次，並依照外部會計師財務報表簽證報告(或審查結果)修正相關機制與作業。(原1.1.5-優良 3)\n4.運用分析結果，定期與部門別(科別、單位別)檢討重大差異原因及改善策略，且改善成效良好。(原1.1.5-優良4 修)\n5.建立有效的財務風險管理制度，以防止發生財務風險。(試)\n[註]\n符合項目 5及優良項目5列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.會計部門組織與章程與負責主管之資料。(符合)\n2.醫院之會計制度及各部門之成本分析報表(月、季與年)。(符合)\n3.成本會計相關報表。關鍵項目與「去年同期」、「前期」或「單位間」比較表。(符合)\n4.運用各種相關財務報表，應包含損益表(收支餘絀表)、資產負債表、現金流量表等，協助醫院決策，成效良好足以成為其他醫院楷模之事證。(優良)\n5.年度工作計畫及年度預算。(優良)\n6.內部稽核制度與稽核結果之書面資料會計師簽證報告與依據簽證報告進行之改善結果。(優良)\n7.財務風險管理制度。(優良)","cs":"優良項目 3，考量私立醫院較少實行會計師簽證，故本項得以「年度財務報表會計師查核報告書」之文件代替。","p":10,"ch":"1.1"},{"n":"1.1.7","tags":[],"t":"配合國家衛生政策及其他相關政策之情形","ev":"目的：建立相關衛生醫療政策宣導機制，並定期檢視各項政策之落實執行。\n符合項目：\n1.對國家衛生政策及其他相關政策，能舉辦講座或透過院刊、公告欄、電視、醫院網站等媒體，協助宣導播放。(原1.1.7-符合1)\n2.醫院之健保 IC 卡讀卡機，可讀取器官捐贈意願及安寧緩和醫療意願註記之資料。(原1.1.7-符合2)\n3.將器官捐贈及安寧療護照護等相關資訊納入住院須知(可參考衛生福利部公告之「醫院住院須知參考範例」)。(原1.1.7-符合3)\n4.有專責人員負責結核病個案管理工作。(原 1.1.7-符合4)\n5.訂定院內罕見疾病個案通報標準作業流程，並指定專責人員落實執行。(試)\n6.配合國家消除 C 肝政策綱領，辦理有關篩檢、診斷與治療追蹤之具體措施，且有具體成效。(試)\n優良項目：(下述項目(不含試評項目)僅限一項未達成)\n1.醫院已建置全院性癌症篩檢門診電腦提示系統，主動提醒民眾做癌症篩檢，建立監測機制，並定期檢討改進。(原1.1.7-優良1)\n2.訂有器官捐贈勸募及安寧緩和醫療推廣之執行計畫，包括對民眾及員工辦理有關器官捐贈及安寧緩和醫療之宣導活動，並提供同意捐贈之簽署管道且有具體成效。(原1.1.7-優良 2)\n3.有設立女性整合性門診，提供婦女較隱私且整合性之就醫環境。(原1.1.7-優良 3)\n4.對分級醫療有採取具體執行措施，並有成效。(試)\n5.協助推動長期照護政策，並有成效。(試)\n[註]\n1.國家衛生政策及其他相關政策，如：分級醫療、長期照護政策、健保政策、安寧緩和醫療、器官捐贈宣導、基層醫療保健、衛教宣導、醫藥分業、醫療網計畫、營造雙語環境、推動母嬰親善、電子病歷及自殺防治、癌症防治政策、愛滋病防治政策、C 型肝炎消除政策、鼓勵採購生技新藥產業發展條例審議通過之新興藥品及醫療器材，完成研發並已核發許可證者(以不違反我國締結之條約或協定為前提)、節能減碳政策等。\n2.器官捐贈宣導及勸募之執行及改善成效，可以依醫院歷年器官捐贈勸募案例數、勸募成功案例數及器捐意願 IC 卡註記人數之成長情形做評估。\n3.女性整合性門診可就相關醫療專業領域(診療科別)、就醫空間及流程進行整合(如：女性癌症篩檢與診療整合到女性單一門診中、設立常見婦女健康問題的整合門診、設置更年期問題特別門診等)。\n4.長期照護係指出院準備銜接長照服務、其他參與長照服務，如失智共同照護中心、居家醫療整合計畫等。\n5.符合項目 5、6 及優良項目 4、5 列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.對國家衛生政策及其他相關政策，舉辦講座或透過院刊、公告欄、電視、醫院網站等媒體，協助宣導播放之資料。(符合)\n2.醫院之健保 IC 卡讀卡機，可讀取器官捐贈意願及安寧緩和醫療意願註記之資料。(符合)\n3.將器官捐贈及安寧療護照護等相關資訊納入住院須知。(符合)\n4.負責結核病個案管理及衛教工作之人員學經歷與結核病個案管理及衛教相關資料。(符合)\n5.罕見疾病個案通報作業規範。(符合)\n6.C 肝篩檢、診斷與治療追蹤之具體措施，有具體成效之資料。(符合)\n7.針對篩檢服務促進措施，建立監測機制，並定期分析檢討改善資料。(優良)\n8.主動提醒民眾做癌症篩檢，成效良好，足以成為其他同級醫院之楷模之事證。(優良)\n9.器官捐贈勸募及安寧緩和醫療推廣之執行計畫。(優良)\n10.分級醫療及協助推動長期照護政策之具體措施及配合轉診制度、門診減量計畫。(優良)","cs":"","p":12,"ch":"1.1"},{"n":"1.1.8","tags":[],"t":"積極參與社區健康促進","ev":"目的：依據社區民眾之需求，訂定健康促進年度工作計畫及明確之目標，落實執行與定期檢討改善，促進民眾健康。\n符合項目：\n1.設置有專責部門及人員負責辦理社區健康活動，指導社區民眾正確的健康觀念及知識，提供健康諮詢與衛生教育。(原1.1.8-符合1修)\n2.訂有社區健康促進年度工作計畫、年度預算以及明確之目標，落實執行。(原1.1.8-符合2 修)\n3.舉辦以社區民眾為對象的多元化活動。(原 1.1.8-符合3修)\n4.能定期透過各項文宣、網頁或公開活動將醫院之社區健康促進活動告知社區民眾。(原1.1.8-優良2修)\n優良項目：(下述項目(不含試評項目)須全部達成)\n1.能依服務區域民眾之就醫及健康需求分析結果納入社區健康促進年度工作計畫中。(原1.1.8-優良1修)\n2.落實執行醫院之社區健康促進計畫，對民眾健康改善有具體成效。(試)\n3.對於社區工作計畫的推展有定期檢討改善，並依民眾滿意度適當調整，成效良好。(原1.1.8-優良3修)\n4.推動健康照護機構參與健康促進工作計畫獲有認證。(試)\n[註]\n優良項目 2、4列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.社區健康促進年度工作計畫、年度預算與依計畫進行之相關活動，如舉辦以社區民眾為對象的演講、健康教室、研討會、電話諮商等或研討會之紀錄。(符合)\n2.社區健康促進計畫經執行對民眾健康的具體成效資料。(優良)\n3.對於社區工作計畫的推展有定期檢討改善紀錄。(優良)","cs":"","p":14,"ch":"1.1"},{"n":"1.1.9","tags":[],"t":"醫院有志工之設置，並有明確之管理辦法及教育訓練","ev":"目的：設置志工減少病人就醫障礙，提供志工應具備安全與服務之教育訓練，確保服務品質。\n符合項目：\n1.設有志工，應有專人督導、管理及訓練。(原1.4.5-符合1修)\n2.訂有明確的志工管理辦法。(原1.4.5-符合2)\n3.訂有相關教育訓練計畫與課程。(原1.4.5-符合 3)\n優良項目：(下述項目(不含試評項目)僅限一項未達成)\n1.志工教育訓練落實執行，並有具體紀錄。(原1.4.5-優良1修)\n2.持續定期評估及追蹤志工服務品質，並作為改善參考。(原 1.4.5-優良2)\n3.定期辦理志工活動，對熱心服務病人或特殊傑出表現志工予以獎勵。(原1.4.5-優良3)\n4.志工創新服務，成效良好。(試)\n[註]\n優良項目 4列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.志工管理規章制度。(符合)\n2.志工管理相關資料。(符合)\n3.志工教育訓練計畫與課程資料。(符合)\n4.志工參加教育訓練出席率統計資料。(優良)\n5.志工評估考核及輔導紀錄資料。(優良)\n6.志工創新服務事項。(優良)","cs":"","p":15,"ch":"1.1"},{"n":"1.1.10","tags":["合"],"t":"對上次醫院評鑑之建議改善事項，能具體檢討改善","ev":"目的：針對改善事項進行檢討，提出改善措施並落實執行，提升病人安全與經營管理成效。\n符合項目：\n1.對上次醫院評鑑之改善事項，應逐項進行檢討並能依醫院情形提出改善措施。(原1.1.9-符合1修)\n2.對未完成改善之事項有改善計畫或方案。(原1.1.9-符合2修)\n3.所有改善事項皆完成改善，並有具體事證。(原1.1.9-優良1修)\n[註]上次醫院評鑑無改善事項者，本條為符合。\n評量方法及建議佐證資料：\n1.針對上次醫院評鑑之建議改善事項之改善措施。(符合)\n2.對未完成改善之事項之改善計畫或方案。(符合)\n3.所有建議改善事項皆完成改善之具體事證。(符合)","cs":"1.上次評鑑為本、分院(或院區)合併評鑑之醫院，若於本次評鑑時，其分院(或院區)裁撤或未申請合併評鑑，則上次評鑑改善事項可不呈現該分院(或院區)資料。\n2.本條文所指「上次評鑑之建議改善事項」係包含醫院評鑑結果意見表中之「改善事項」及「建議事項」，醫院應有相關改善作為(如檢討、擬定措施等)，並依規劃時程進行改善。","p":16,"ch":"1.1"},{"n":"1.2.1","tags":[],"t":"設置人事管理專責單位，各部門的職掌及職務規範明確，人事制度健全","ev":"目的：建立人事管理制度，明確規範各部門的職掌及職務，配置適當人員，營造最適醫院定位之工作環境與條件。\n符合項目：\n1.應有專責人事管理部門，訂定權責明確之人事管理規章及員工工作規範。(原1.2.1-符合1 修)\n2.各醫事職類應視需要設有各管理階層職缺，並訂有醫師、護理、醫事、行政各部門之職掌及業務規範或業務手冊，包括各級主管、人員之管轄業務內容、權責範圍及授權等相關事項。(原 1.2.1-符合 2修)\n3.應有完善之職務代理人制度。(原1.2.1-符合 3)\n4.員工檔案完整且全院一致性，人員異動與人事資料隨時更新，每年定期查驗與記載專業執照異動狀況。(原1.2.1-符合4)\n5.對勞動檢查單位檢查之缺失有具體改善。(試)\n優良項目：(下述項目僅限一項未達成)\n1.人事管理規章所列各項管理辦法或工作規範，內容完整，並能定期修正或審閱。(原1.2.1-優良1)\n2.相關員工工作規則之修正有基層員工代表參與，且修正內容公告周知，方便員工隨時查閱。(原1.2.1-優良2修)\n3.各部門、層級成員清楚其業務內容、權責範圍及授權等相關事項，並落實執行。(原1.2.1-優良3)\n4.專責人事部門，組織健全，定期檢視員工離職因素、薪資結構及實際休假情形等，改善成效良好。(原1.2.1-優良 4修)\n[註]\n1.醫院員工包含所有醫事及行政人員(含約聘僱及計畫項下雇用人員)。\n2.有關職務代理人制度之查證著重醫師。\n3.員工工作規則，如：上班時間表、排班制度、工作說明書等，且符合相關規定。\n4.同一醫療體系受評時，仍應以符合該分院之規章辦法接受評量。\n5.於公立醫院之聘任(用)人員，依其相關規定辦理。\n6.符合項目 5列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.人事管理規章、員工工作規範。(符合)\n2.各部門之職掌及職務規範或業務手冊。(符合)\n3.各類人員員工檔案。(符合)\n4.勞動檢查機構結果改善紀錄。(符合)\n5.人事管理規章、員工工作規則、職務規範檢討之會議紀錄。(優良)\n6.董事會或院務會議之會議紀錄，及相關規章制度修訂及公告文件。(優良)\n7.員工離職因素、薪資結構及實際休假情形等，檢討及改善資料。(優良)","cs":"符合項目 3 所提「職務代理人制度」係指所有工作應有人員代理。","p":18,"ch":"1.2"},{"n":"1.2.2","tags":[],"t":"訂有明確之員工晉用及薪資制度且執行合宜","ev":"目的：依需要建立員工晉用與薪資等制度，以利招募符合各單位用人需求，並依工作負荷與業務量變化適時調整人力，提升人力資源管理效能。\n符合項目：\n1.訂定員工招募辦法。(原1.2.2-符合1)\n2.訂定員工任用資格條件辦法。(原1.2.2-符合 2修)\n3.依據相關法令訂定適當的薪資制度，並有規範加薪、獎金或晉級等事項。(原1.2.2-符合3)\n4.訂有醫師合理晉升、薪資管理、貢獻與獎懲之管理辦法。(原 1.2.2-符合4)\n5.訂定員工晉用及薪資制度能適時修訂，每次修訂均公告周知。(原1.2.2-符合 5)\n優良項目：(下述項目僅限一項未達成)\n1.參考各部門業務量所必要的職類、人員及離職率，並編制人力配置計畫書及相關薪資配套，確實執行。(原1.2.2-優良1)\n2.醫師薪資設計除醫師臨床貢獻度外，應包括公共事務與醫院活動參與度為依據，能定期檢討及改善。(原1.2.2-優良2)\n3.考量員工工作負荷，並依業務量變化適時調整人力，以確保品質。(原1.2.2-優良3)\n4.薪資制度之設計有助於醫療品質提升。(原 1.2.2-優良4)\n5.考量醫院盈餘，適時調增人力或薪資。(原 1.2.2-優良5)\n[註]\n1.醫院員工包含所有醫事及行政人員(含約聘僱人員)。\n2.任用資格條件係指各職類醫事人員應具備之學歷、科系、證照、訓練等條件。\n3.人力配置計畫書包含因應業務人力需求評估、各職類人員編制與員額設定標準、預定任用職類人員數及資格要求、升遷制度等。\n評量方法及建議佐證資料：\n1.員工招募的規章制度。(符合)\n2.各職類員工任用資格條件規章制度。(符合)\n3.員工薪資的規章制度。(符合)\n4.薪資調整、獎金發放檢討報告等評量方法及建議佐證資料。(符合)\n5.近 3 年全院或部門人力配置計畫書及人力編制增編檢討核准報告等資料。(優良)\n6.有助於醫療品質、病人安全提升之相關薪資制度及執行紀錄。(優良)","cs":"優良項目 4「薪資制度之設計有助於醫療品質提升」，指有鼓勵員工提升醫療品質或參與活動，列入員工薪資、獎金、加給等福利，並能具體呈現醫療品質改善成果。","p":20,"ch":"1.2"},{"n":"1.2.3","tags":[],"t":"設置員工教育訓練專責部門，負責院內員工教育及進修","ev":"目的：統籌管理及推動全院員工教育訓練，訂定各職類人員教育訓練課程，確保教育訓練課程符合醫院與員工需求。\n符合項目：\n1.有設置全院性教育訓練專責部門，負責員工年度在職教育及進修計畫之擬訂及追蹤。(原1.4.1-符合1修)\n2.訂有訓練管理制度，且有機制了解員工出席狀況與學習成效。(原1.4.1-符合 2)\n3.訂有機制收集各職類醫事人員繼續教育積分，並適時提醒。(原1.4.1-符合3)\n4.明訂員工年度在職教育訓練時數和時程表，課程內容應包括病人權利、病人安全、醫療倫理、全人醫療、感染管制、危機處理及衛生醫療法令等重要議題。(原1.4.1-符合4修)\n5.醫院全體員工(含外包人員)依其特性每人每年至少應有 3 小時感染管制及傳染病教育訓練，且符合標準的比率≧90%。(原1.4.1-符合5修)\n優良項目：(下述項目僅限一項未達成)\n1.員工年度在職教育訓練、進修計畫完整及編列年度費用，並確實執行且成效良好。(原1.4.1-優良1修)\n2.訂有機制(含運用資訊化管理)，定期收集分析員工參加教育訓練之情形、反應與學習心得建議，定期評估檢討，並據以修正教育訓練及進修計畫。(原1.4.1-優良2修)\n3.依據員工參與教育訓練狀況，納入員工考核範圍，且紀錄詳實。(原1.4.1-優良 3)\n4.訂有鼓勵員工進修、參加國內、外醫學相關會議(含繼續教育課程、研討會等)制度，並確實執行。(原1.4.1-優良 4修)\n5.參加院外的教育訓練、進修者，安排於院內報告、或以其他形式(如：院內刊物刊載、院內知識庫)，以利與其他員工交流或學習。(原1.4.1-優良5)\n[註]\n1.員工年度在職教育訓練及進修計畫應包括教育訓練目的、知識或技術課程內容、評價方法、教育資源(含師資及教材等軟、硬體設施)及預算等。\n2.符合項目 5 所提「傳染病教育訓練」係因應國內外疫情訂有新興與再浮現傳染病之防治教育訓練計畫，每年針對如新型 A型流感、伊波拉病毒感染及中東呼吸症候群冠狀病毒感染症等新興傳染病辦理教育訓練課程時數至少達 1小時。\n評量方法及建議佐證資料：\n1.近三年教育訓練及進修計畫書(含配合主管機關政策調整之法規、品質、病安、感染管制及傳染病教育訓練內容等)及訓練結果報告。(符合)\n2.訓練管理制度。(符合)\n3.員工年度在職教育訓練時數和時程表。(符合)\n4.全體員工(含外包人員)每年接受感染管制及傳染病與病人安全教育訓練紀錄。(符合)\n5.近三年參加院外的教育訓練、進修人數及經費統計資料。(優良)\n6.各職類員工教育訓練有定期評估檢討報告。(優良)\n7.參加醫學相關會議或在職進修獎勵制度。(優良)","cs":"符合項目 5：\n1.評鑑委員可參考受評醫院近期之感染管制查核結果。\n2.教育訓練時數可認計線上數位學習時數，惟實體課程至少 1小時。","p":21,"ch":"1.2"},{"n":"1.2.4","tags":[],"t":"對於新進員工辦理到職訓練，並有評估考核","ev":"目的：訂定新進員工到職訓練計畫與落實執行，使新進員工充份瞭解醫院宗旨、願景與所屬部門的作業特性、職責與能力需求，確保新進員工具備職務所需的資格及能力。\n符合項目：\n1.訂有新進員工到職訓練計畫，且每位新進員工均需參加到職訓練。(原1.4.2-符合1)\n2.新進員工到職訓練內容應包括醫院宗旨與願景、醫院及部門介紹、職位及職責說明、人事規章、員工權益、職業安全、消防安全、倫理規範、感染管制等。(原1.4.2-符合2修)\n3.訂有新進員工教育訓練評估考核制度。(原 1.4.2-符合3)\n4.明訂到職教育訓練時數和時程表，新進員工半年內應完成 6 小時之感染管制及傳染病(含TB 防治等)教育訓練。(原1.4.2-符合4修)\n優良項目：(下述項目僅限一項未達成)\n1.新進員工到職訓練時數至少 16小時且在三個月內完成訓練，訓練內容詳實，並有評估考核學習效果之機制。(原1.4.2-優良 1)\n2.新進人員任用後進行職前訓練考核，對於未符合標準者，有安排加強訓練之輔導。(原1.4.2-優良2)\n3.訓練內容置於院內知識庫，提供網路學習管道。(原1.4.2-優良3)\n4.定期檢討評估教學訓練成果，並有適時修訂改善成效良好。(原1.4.2-優良4 修)\n評量方法及建議佐證資料：\n1.新進員工教育訓練內容或課程表。(符合)\n2.新進員工教育訓練評估考核制度。(符合)\n3.近三年各職類新進員工參加到職訓練出席率統計表。(符合)\n4.新進員工完成 6 小時感染管制及傳染病(含 TB 防治等)教育訓練紀錄。(符合)\n5.新進員工評估考核及輔導紀錄資料。(優良)\n6.院內知識庫網路學習資訊畫面及操作說明；年度有彙整分析。(優良)","cs":"1.「新進員工」係指到職半年內(含試用)之人員。\n2.符合項目 4：評鑑委員可參考受評醫院近期之感染管制查核結果。","p":23,"ch":"1.2"},{"n":"1.2.5","tags":[],"t":"訂定各職類人員之教育訓練與進修計畫，並能協助人員職涯發展輔導","ev":"目的：建立各職類人員專業能力訓練機制，具備職務所需的資格及能力並協助員工職涯發展。\n符合項目：\n1.依照醫院整體發展目標及各職類人員的需求，訂定教育訓練及進修計畫，包含到職/在職訓練、鼓勵/支持措施、學習效果評估。(原1.4.3-符合1 修)\n2.有專人負責各項培訓活動之審核、推動、協調及評估，確實執行並適時修正。(原1.4.3-符合2修)\n優良項目：(下述項目(不含試評項目)僅限一項未達成)\n1.各職類人員教育訓練與進修計畫之內容周全，能配合醫院發展目標及醫學發展趨勢。(原1.4.3-優良1修)\n2.評估內容完整，如：評估項目包括參加人員的學習效果及滿意度、課程內容等，必要時應修訂及改進，以用於提升各職類專業能力及病人照護品質。(原1.4.3-優良3修)\n3.能依據評估結果檢討、修訂或改進教育訓練及進修制度，有效運用於各階層各職類人員，且能與薪資、升遷結合。(原1.4.3-優良4修)\n4.能依各職類人員專業需求，建立職涯發展計畫，並提供規劃與輔導，有具體成效。(試)\n[註]\n優良項目 4列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.各職類人員教育訓練及進修計畫資料。(符合)\n2.各職類人員教育訓練及評估結果資料。(優良)\n3.評估結果檢討改善相關資料。(優良)\n4.各職類人員職涯發展計畫，及其規劃與輔導成效。(優良)","cs":"","p":24,"ch":"1.2"},{"n":"1.2.6","tags":[],"t":"建立合理的人事考核及升遷制度","ev":"目的：訂定適用及公開透明的人事評核與升遷制度，提升員工工作熱誠與降低離職率。\n符合項目：\n1.設有人事評核委員會或類似功能之組織，運作正常且備有紀錄可查。(原1.2.3-符合1)\n2.訂定各種人事評核辦法，並公告周知。(原 1.2.3-符合2)\n3.依據考核結果有適度的獎懲。(原1.2.3-符合 3)\n4.訂定各職類或各單位人事升遷制度。(試)\n優良項目：(下述項目(不含試評項目)僅限一項未達成)\n1.人事升遷考核制度訂定過程及人事評核委員會議有基層員工代表參與。(原 1.2.3-優良1修)\n2.人事考核與獎懲執行過程公開透明且有雙向回饋機制。(原 1.2.3-優良2修)\n3.雙向回饋之標準作業程序及輔導制度，有定期檢討且備有紀錄。(原1.2.3-優良 3)\n4.升遷制度有助於服務品質提升或激勵員工潛能發展與士氣。(試)\n[註]\n1.醫院員工包含所有醫事及行政人員(含約聘僱人員)。\n2.「雙向回饋」係指主管能就人事評核結果向員工(受評核者)說明，並聽取其對評核結果之意見。\n3.符合項目 4 及優良項目 4 列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.人事評核委員會的規章制度。(符合)\n2.員工評核的規章制度。(符合)\n3.人事評核委員會會議紀錄。(符合)\n4.員工考核結果及檢討資料。(優良)\n5.雙向回饋作業制度及雙向回饋紀錄。(優良)\n6.升遷制度及執行成效。(符合/優良)","cs":"","p":25,"ch":"1.2"},{"n":"1.2.7","tags":[],"t":"設立職業安全衛生專責組織、人員，並訂定職業安全衛生管理計畫，及確實執行員工意外事件防範措施","ev":"目的：重視職業安全，設置相關組織和人員，落實執行職業安全衛生管理計畫並定期檢討，以避免員工發生意外事件，並符合政府相關法令之規定要求。\n符合項目：\n1.依據職業安全衛生法令之規定設置職業安全衛生組織及人員；職業安全衛生委員會應每 3個月至少開會一次。(原1.2.4-符合1修)\n2.訂定醫院職業安全衛生管理計畫，並有執行紀錄可查。(原 1.2.4-符合2)\n3.職業安全衛生管理計畫，每年定期檢討或修正。(原1.2.4-符合3)\n4.明訂各項工作完成之期限，並確實追蹤辦理情形。(原1.2.4-符合4)\n5.訂定員工意外事故防範辦法，且周知員工確實遵守，並對所訂辦法定期檢討修正。(原1.2.4-符合5修)\n優良項目：(下述項目(不含試評項目)僅限一項未達成)\n1.針對會影響員工安全的高風險區域有適切之規劃及管理。(原 1.2.4-優良1)\n2.聯絡機制及程序明確，並依據所規範之聯絡機制及程序執行，備有紀錄可查。(原1.2.4-優良2)\n3.職業安全衛生管理計畫落實執行成效良好。(試)\n4.能主動進行高風險區域職業安全衛生事件之預防措施。(試)\n5.事後進行原因分析，且能檢討事故發生原因，有避免重複再犯之對策，並公告周知全體員工。(原1.2.4-優良 3)\n[註]\n1.「職業安全衛生管理辦法」第 10 條規定，醫院勞工人數在 300(含)人以上者，應設置職業安全衛生委員會。另依據醫院員工人數，應設置之職業安全衛生人員類別及人數，請參照同辦法「附表二、各類事業之事業單位應設置職業安全衛生人員表」；至於應設置之職業安全衛生管理單位，請參照同辦法第 2-1條。\n2.優良項目 1所提之「高風險區域」，如：急診室、隔離病室、放射線區域、實驗室、病歷室、感染性垃圾儲存區域、施工區域、油槽或液氧槽區域、管道間、機房、鍋爐房、水塔等。\n3.優良項目 3、4列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.醫院職業安全衛生組織章程。(符合)\n2.醫院職業安全衛生管理計畫。(符合)\n3.職業安全衛生委員會會議紀錄。(符合)\n4.員工意外事故防範辦法或規章。(符合)\n5.醫院高風險區域評估紀錄及相關管理規章。(優良)\n6.院內發生職業安全衛生之事件及後續之處理機制與結果或相關預防措施。(優良)","cs":"符合項目 5所提「定期檢討」之週期，以至少2 年1次為原則。","p":26,"ch":"1.2"},{"n":"1.2.8","tags":[],"t":"致力於建置完善合宜之工作環境，訂有且執行員工健康促進活動與福利制度","ev":"目的：建構安全、適合工作的環境，並重視性別平權及員工健康防護、健康促進與福利，確保員工身心健康。\n符合項目：\n1.提供員工整潔明亮且空間、設施充足之工作環境。(原1.2.5-符合1)\n2.建立性別平權及友善之工作環境，設計及數量應考量實際兩性需要(如：廁所、更衣室、休息室、哺(集)乳室等)，並符合法令規定。(原1.2.5-符合 2修)\n3.提供身心障礙員工相關設施設備及環境合宜、適用。(原 1.2.5-符合3)\n4.訂有健康促進與福利措施並周知員工。(原 1.2.5-符合4)\n5.確實實施健康促進活動、有效提升員工士氣之福利措施並有紀錄可查。(原 1.2.5-符合5)\n6.醫院訂有職業災害補償機制，並能積極協助遭受職業災害之員工復工。(試)\n優良項目：(下述項目(不含試評項目)須全部達成)\n1.具備適當用餐、休閒、健康促進、運動、托嬰服務等設施。(原1.2.5-優良1)\n2.醫院訂有員工健康促進與福利措施年度計畫，且均有員工代表參與。(原1.2.5-優良2修)\n3.有編列適當經費確實執行醫院員工健康促進與福利措施，定期檢討調整。(原1.2.5-優良2 修)\n4.設立員工意見反應機制，蒐集員工建議並檢討改善工作環境。(原1.2.5-優良 3)\n5.健康促進活動成效良好，並可作為學習標竿。(試)\n[註]\n1.為維護婦女於公共場所哺育母乳之權利，並提供有意願哺育母乳之婦女無障礙哺乳環境，符合項目 2「哺(集)乳室」之設置應依 108年4月24 日總統華總一義字第10800039351 號令公布「公共場所母乳哺育條例」之規範施行，若有違反，亦需接受相關罰則。\n2.健康促進活動，如：減重、戒菸、推廣健康飲食、C 型肝炎篩檢防治、慢性病防治、預防篩檢、預防注射及健康體能促進(請參考國民健康署全民身體活動指引)等活動之落實。\n3.福利措施，如：政府法令規定的福利事項(保險、薪資、休息及休假、退休、職業災害補償、工作時間等)，非政府法令規定的福利事項(軟硬體設備輔助、相關資訊諮詢服務、相關補貼、獎金、家庭支持、旅遊、教育訓練等)。\n4.有關女性醫師於妊娠期間之值班規定，為保障孕婦健康，應比照勞動基準法第 51條「女工在妊娠期間，如有較為輕易之工作，得申請改調，雇主不得拒絕，並不得減少其工資」，及職業安全衛生法第 31條第 1 項「中央主管機關指定之事業，雇主應對有母性健康危害之虞之工作，採取危害評估、控制及分級管理措施；對於妊娠中或分娩後未滿一年之女性勞工，應依醫師適性評估建議，採取工作調整或更換等健康保護措施，並留存紀錄」規定辦理。\n5.符合項目 6 及優良項目 5 列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.廁所數量、更衣室、休息室、哺(集)乳室等配置及數量資料。(符合)\n2.身心障礙設施設備資料。(符合)\n3.健康促進與福利措施資料。(符合)\n4.用餐、休閒、運動等設施資料。(優良)\n5.健康促進活動年度計畫、經費及執行結果紀錄。(優良)\n6.員工建議工作環境事項及檢討措施資料。(優良)","cs":"優良項目 1所提「托嬰服務」，可委託鄰近適當機構辦理，並有合約佐證；惟放置於院內嬰兒室等照護單位，不得認列為具備該項服務。","p":28,"ch":"1.2"},{"n":"1.2.9","tags":[],"t":"實施新進員工及在職員工健康管理","ev":"目的：保障員工，依其健康檢查結果進行追蹤，提供健康管理服務或改善工作條件，避免產生職業病。\n符合項目：\n1.配置符合資格之醫師及護理人力從事勞工健康服務。(原 1.2.6-符合1)\n2.依「勞工健康保護規則」及「食品良好衛生管理準則」辦理新進員工及在職員工一般(特殊)體格(健康)檢查，以及特殊作業勞工一般(特殊)體格(健康)檢查(如：放射線工作人員、調配化學治療藥品之藥師、膳食服務人員等)。(原1.2.6-符合2修)\n3.設置專責人員，並負責健康檢查結果異常之員工提供追蹤或健康管理之服務。(原1.2.6-符合3)\n4.針對員工健康檢查發現之問題，有檢討分析並推展各項健康促進計畫。(原 1.2.6-符合4)\n優良項目：\n1.醫院定期實施員工一般(特殊)體格(健康)檢查，且能落實執行。(試)\n2.一般(特殊)體格(健康)檢查項目除法令規定外，能依醫院政策及實際需求提供特殊檢查。(試)\n3.依一般(特殊)體格(健康)檢查結果提供健康管理，且有具體成效。(試)\n4.員工身心健康保護如：母性健康管理、重複性作業人員健康管理、疲勞管理等，成效良好。(試)\n[註]\n1.勞工健康保護規則：\n(1)第17 條：「雇主對在職勞工，應依下列規定，定期實施一般健康檢查：\n一、年滿六十五歲以上者，每年檢查一次。\n二、年滿四十歲以上未滿六十五歲者，每三年檢查一次。\n三、未滿四十歲者，每五年檢查一次。前項所定一般健康檢查項目與檢查紀錄，應依附表九及附表十一規定辦理。但經檢查為先天性辨色力異常者，得免再實施辨色力檢查。」\n(2)第27 條：「依癌症防治法規定，對於符合癌症篩檢條件之勞工，於事業單位實施勞工健康檢查時，得經勞工同意，一併進行口腔癌、大腸癌、女性子宮頸癌及女性乳癌之篩檢。前項之檢查結果不列入健康檢查紀錄表。前二項所定篩檢之對象、時程、資料申報、經費及其他規定事項，依中央衛生福利主管機關規定辦理。」\n2.優良項目 4所提「母性健康管理」，可參考勞動部職業安全衛生法第30 條、第 31 條及該法授權訂定之「妊娠與分娩後女性及未滿十八歲勞工禁止從事危險性或有害性工作認定標準」、「女性勞工母性健康保護實施辦法」。\n3.優良項目 1、2、3、4列為試評項目，評量結果不列為評鑑成績計算。\n評量方法及建議佐證資料：\n1.員工健康促進計畫資料。(符合)\n2.配置勞工健康服務護理人員資料。(符合)\n3.員工一般(特殊)體格(健康)檢查的政策或規章制度。(符合/優良)\n4.員工健康諮詢紀錄。(符合)\n5.一般(特殊)體格(健康)檢查結果異常員工追蹤資料。\n6.員工一般(特殊)體格(健康)檢查結果及分析評估資料。(符合/優良)","cs":"","p":30,"ch":"1.2"},{"n":"1.2.10","tags":[],"t":"有關懷輔導機制對院內員工提供心理及情緒等支持，並有員工申訴管道","ev":"目的：提供員工適當的意見反應管道、心理支持與輔導機制及提升心理衛生相關知能，減輕員工面臨困境時之壓力。\n符合項目：\n1.建立員工關懷、輔導機制，對院內員工提供心理及情緒支持，如：提升韌性(Resilience)，並公告周知。(原1.2.7-符合1修)\n2.建立員工申訴管道，訂有標準作業程序，公告周知，且有完整之申訴個案紀錄。(原1.2.7-符合2)\n3.定期辦理員工滿意度調查。(原1.2.7-符合3)\n4.辦理員工紓壓或情緒支持相關講座或活動。(原1.2.7-符合4)\n優良項目：(下述項目僅限一項未達成)\n1.員工心理及持續支持之措施或管道，有專人負責並能提供相關專業服務。(原1.2.7-優良1 修)\n2.對於員工滿意度調查結果進行統計、分析，且檢討滿意度較低項目之改善措施，並將調查結果及改善情形轉告相關單位。(原 1.2.7-優良2)\n3.各級主管有接受員工關懷之教育訓練。(原 1.2.7-優良3)\n4.確實實施，定期分析各類人員常見問題，提出改善預防措施及支持、輔導計畫，確實執行，執行成效良好。(原 1.2.7-優良 4)\n[註]醫院員工包含所有醫事及行政人員(含約聘僱及計畫項下雇用人員)。\n評量方法及建議佐證資料：\n1.員工關懷輔導的規章。(符合)\n2.員工申訴管道作業程序或規章。(符合)\n3.員工申訴個案紀錄。(符合)\n4.員工滿意度調查資料。(符合)\n5.員工紓壓或情緒支持相關活動計畫及結果報告資料。(優良)\n6.員工滿意度各選項分析檢討改善資料。(優良)\n7.員工意見處理及檢討改善紀錄。(優良)","cs":"符合項目 3「定期辦理員工滿意度調查」，係指每年至少實施乙次","p":32,"ch":"1.2"},{"n":"1.3.1","tags":["必"],"t":"適當醫師人力配置","ev":"目的：配置適當的醫師人力，確保醫療服務品質，並符合政府相關法令之規定。\n符合項目：\n1.每10床應有醫師 1人(含)以上。(原1.3.1-符合 1)\n2.各診療科均有專科醫師 1人(含)以上。(原 1.3.1-符合2)\n優良項目：(下述項目須全部達成)\n1.專任主治醫師(包括主任在內)，每8床應有 1人。(原1.3.1-優良2)\n[註]\n1.本條為必要條文，必須達符合項目(含)以上。\n2.病床數以一般病床與特殊病床合計(不包含手術恢復床、急診觀察床及性侵害犯罪加害人強制治療病床)，並依登記開放病床數計。\n3.依醫療機構設置標準第二十條規定事先報准之時數，每週達 44小時者，得折算醫師人力 1人。\n4.嬰兒床以三分之一折算。\n5.血液透析床，以 15床折算。\n6.亞急性呼吸照護病床，以 15 床折算；慢性呼吸照護病床，以 20 床折算。\n7.醫師人力係指西醫師。\n8.優良項目中專任主治醫師之計算，以執業登記且實質參與診療業務。\n評量方法及建議佐證資料：\n1.專任醫師及醫師執業登記名冊。(符合)","cs":"1.評量項目[註]2之病床數包含：急性一般病床、精神急性一般病床、慢性一般病床、精神慢性一般病床、加護病床、精神科加護病床、燒傷加護病床、燒傷病床、亞急性呼吸照護病床、慢性呼吸照護病床(呼吸病床)、隔離病床、骨髓移植病床、安寧病床、嬰兒病床、嬰兒床、血液透析床、腹膜透析床、急性後期照護病床、整合醫學病床。\n2.醫院如同時申請醫學中心評鑑及兒童醫院評鑑者，本條文須併同兒童醫院條文合併審查。","p":34,"ch":"1.3"},{"n":"1.3.2","tags":[],"t":"對醫師的診療品質及工作量，定期作客觀的評估","ev":"目的：定期評估醫師合理的工作量、專業能力及監測診療品質，確保醫療品質及病人安全。\n符合項目：\n1.工作量之評估應包含：診療的病人數、手術件數、檢查判讀報告件數等。(原1.3.2-符合1)\n2.針對醫師之診療品質有定期評核機制。(原 1.3.2-符合2)\n優良項目：(下述項目僅限一項未達成)\n1.訂定各科醫師之合理醫療服務量(如：每診看診人數、每週看診診次、每週手術量、每月值班時數等)，對於超量者，須評估其醫療品質、病人安全風險與工作量之合理性。(原1.3.2-優良1)\n2.對於執行高風險或高技術醫療行為之醫師，有明確界定其可在醫院內執行之項目範圍。(原1.3.2-優良2)\n3.對於醫師之診療品質，訂有評核機制，定期檢討改善。(原 1.3.2-優良3)\n評量方法及建議佐證資料：\n1.醫師門診時間表、病人數、手術件數、檢查判讀報告件數等服務量統計資料。(符合)\n2.醫師合理醫療服務量規範及檢討報告資料。(優良)\n3.高風險或高技術之醫療行為規範及檢討報告資料。(優良)\n4.醫師診療品質關鍵指標項目(KPI，如：抗生素使用、感染率、併發症、判讀正確率等)結果及相關檢討紀錄資料。(優良)","cs":"1.優良項目 1，因各醫院之規模、特色不一，故由醫院自行訂定「合理」的範圍。對超量者，醫院應有進行檢討並改善措施。\n2.優良項目 2，對於執行高風險或高技術 之 醫 療 行 為 應 有 執 行 權 限(privilege)之規範及評估。","p":35,"ch":"1.3"},{"n":"1.3.3","tags":["必"],"t":"應有適當的醫師、醫事放射人力配置，並由適當訓練及經驗人員執行診療檢查及了解其臨床意義","ev":"目的：配置適當的醫事放射人員及合理工作量，確保放射診療檢查服務品質，並符合政府相關法令之規定。\n符合項目：\n1.放射線作業人員相關訓練、指導(包含輻射安全、病人安全等)等須符合相關法規之規定。(原1.3.3-符合1)\n2.由醫師、醫事放射人員執行放射診療檢查業務。(原1.3.3-符合2)\n3.醫事放射人員：(原1.3.3-符合3)\n(1)申請地區醫院評鑑者：急性一般病床 500床以上醫院：每35 床應有1人以上。急性一般病床 250 床以上 499 床以下醫院：每 40 床應有 1 人以上。急性一般病床 249床以下醫院：每45 床應有1人以上。\n(2)申請區域醫院評鑑者：急性一般病床 500床以上醫院：每35 床應有1人以上。急性一般病床 499床以下醫院：每40 床應有1人以上。\n(3)申請醫學中心評鑑者：急性一般病床每 30 床應有 1 人以上(專任醫事放射人員人數之計算不包含心導管、牙科、泌尿科碎石機、及腸胃科)。應有專任放射腫瘤之醫學物理人員 1人以上。\n(4)設加護病房者，每 20床應有1人以上。\n(5)有提供 24小時緊急放射診斷作業：每 8 小時一班，全天24小時均有醫事放射人員提供服務。\n優良項目：(下述項目須全部達成)\n1.醫事放射人員人力達符合項目 3-(3)-項之 1.10 倍。(原 1.3.3-優良1-(3))\n2.至少5名專任放射診斷專科醫師參與執行放射診療工作(每150床至少1人)。(原1.3.3-優良2)\n3.專任放射腫瘤專科醫師至少 2 人(每 500 床至少 1 人)。(原 1.3.3-優良3)\n4.核子醫學專科醫師至少 2人(每650床至少 1人)。(原1.3.3-優良4)\n5.人員服務年資、訓練資歷充足，服務品質優良，且落實訓練計畫，成效良好，並有評量方法及建議佐證資料。(原1.3.3-優良5)\n6.各種立即通報機制且效果良好，對臨床醫師診療確實有實際功效。(原1.3.3-優良6)\n[註]\n1.本條為必要條文，必須達符合項目(含)以上。\n2.醫事放射人員包括醫事放射師及醫事放射士。\n3.各類病床數以登記開放數計，並依實際設置情形計算人力。\n4.人力計算時：\n(1)人力計算結果不得低於醫療機構設置標準之規定。\n(2)若評鑑基準高於醫療機構設置標準，病床數得可考量年平均佔床率計算，並以四捨五入取至整位數。\n(3)同類別人力之各項計算結果，加總後以四捨五入取至整數位。\n評量方法及建議佐證資料：\n1.醫事放射專任醫師、醫事放射人員及執業登記名冊。(符合)\n2.放射線作業人員訓練計畫及訓練結果資料。(符合)\n3.立即通報機制及時效統計檢討資料。(優良)","cs":"醫院如同時申請醫學中心評鑑及兒童醫院評鑑者，本條文須併同兒童醫院條文合併審查。","p":36,"ch":"1.3"},{"n":"1.3.4","tags":[],"t":"提供之解剖病理服務應能滿足病人醫療需求，且符合法令規定","ev":"目的：配置適當的解剖病理科醫師或醫事檢驗人員，或簽訂合約委託檢驗，確保病理檢驗時效及服務品質，並符合政府相關法令之規定。\n符合項目：\n1.人員配置及服務內容須符合醫療機構設置標準及相關法規之規定。(原1.3.4-符合1)\n2.委託病理檢查需訂有合約，明訂時效及品質規範。(原1.3.4-符合2)\n優良項目：(下述項目僅限一項未達成)\n1.解剖病理專科醫師5人(含)以上及具醫事檢驗師證照人員6人(含)以上。(原 1.3.4-優良2)\n2.例假日亦能提供立即診斷服務。(原1.3.4-優良 3)\n[註]\n1.醫療機構設置標準：各診療科均應有專科醫師 1人以上。\n2.若醫院設有解剖病理科，則需依評分說明內容評量解剖病理專科醫師人力。\n評量方法及建議佐證資料：\n1.病理科專任醫師、醫事檢驗師人員及執業登記名冊。(符合)\n2.委託檢驗合約及相關監測時效品質資料。(符合)\n3.病理科服務量統計資料。(優良)","cs":"醫院未提供解剖病理服務者，則符合項目1不列入評核。","p":38,"ch":"1.3"},{"n":"1.3.5","tags":["必"],"t":"適當之醫事檢驗服務(或臨床病理)服務組織與人力配置","ev":"目的：配置適當的醫事檢驗人員及合理工作量，確保醫事檢驗時效及服務品質，並符合政府相關法令之規定。\n符合項目：\n1.醫事檢驗服務(或臨床病理服務)，訂有相關作業規定。(原1.3.5-符合1)\n2.若有執行臨床病理，由院內具有臨床病理專科醫師執行，或委託院外單位執行。(原1.3.5-符合2)\n3.醫事檢驗人員：(原1.3.5-符合3)\n(1)申請地區醫院評鑑者：急性一般病床每 50床應有醫事檢驗人員2人以上。100床以上之醫院應有專任醫事檢驗師 2人以上。\n(2)申請區域醫院評鑑者：急性一般病床每 25 床應有專任醫事檢驗師 1 人。\n(3)申請醫學中心評鑑者：急性一般病床每 20 床應有專任醫事檢驗師 1 人。\n(4)有提供 24小時緊急檢驗作業：每 8小時一班，全天 24小時均有醫事檢驗人員提供服務。\n(5)設有血液透析床者，每 50床應有醫事檢驗人員 1人以上。\n(6)設有血庫者，應有專人管理。\n4.委託檢驗需訂有合約，明訂時效及品質規範。(原1.3.5-符合4)\n優良項目：(下述項目須全部達成)\n1.醫事檢驗人員人力達符合項目 3-(3)項之 1.10 倍。(原 1.3.5-優良 1-\n(3))\n2.有專職醫事檢驗師或臨床病理專科醫師擔任主管。(原1.3.5-優良2)\n[註]\n1.本條為必要條文，必須達符合項目(含)以上。\n2.「有資格者」即「有執照之人員」，醫事檢驗人力及資格均應符合醫療機構設置標準，而「負責管理」則是責任與職務的分派。\n3.醫事檢驗人員包括醫事檢驗師及醫事檢驗生。\n4.各類病床數以登記開放數計，並依實際設置情形計算人力。\n5.人力計算時：\n(1)人力計算結果不得低於醫療機構設置標準之規定。\n(2)若評鑑基準高於醫療機構設置標準，病床數得可考量年平均佔床率計算，並以四捨五入取至整位數。\n(3)同類別人力之各項計算結果，加總後以四捨五入取至整數位。\n評量方法及建議佐證資料：\n1.醫事檢驗人員執業登記名冊。(符合)\n2.委託檢驗機構合約及相關監測時效及品質資料。(符合)","cs":"醫院如同時申請醫學中心評鑑及兒童醫院評鑑者，本條文須併同兒童醫院條文合併審查。","p":39,"ch":"1.3"},{"n":"1.3.6","tags":["必"],"t":"依據病房特性配置適當護產人力","ev":"目的：配置適當的護產人員，確保照護品質及病人安全，並符合政府相關法令之規定。\n符合項目：\n1.申請地區醫院評鑑者：(原1.3.6-符合1)\n(1)急性一般病床，49 床以下者，每 4 床應有 1 人以上；50 床以上者，每 3床應有1人以上。\n(2)設下列部門者，其人員並依其規定計算：手術室：每床應有 2人以上。加護病房：每床應有 1.5人以上。產房：每產台應有 2人以上。燒傷病房、亞急性呼吸照護病房：每床應有 1.5人以上。手術恢復室、急診觀察室、嬰兒病床、安寧病房：每床應有 1人以上。門診：每診療室應有 1人以上。嬰兒室：每床應有 0.4人以上。血液透析室、慢性呼吸照護病房：每 4床應有1人以上。\n2.申請區域醫院評鑑者：(原1.3.6-符合2)\n(1)急性一般病床每 2.5 床應有1人以上。\n(2)設下列部門者，其人員並依其規定計算：手術室：每班每床 2人以上。加護病房：每床應有 2人以上。產房：每產台應有 2人以上。燒傷病房、亞急性呼吸照護病房：每床應有 1.5人以上。手術恢復室：每班每床 0.5人以上。急診觀察室、嬰兒病床、安寧病房：每床應有 1人以上。門診：每診療室應有 1人以上。嬰兒室：每床應有 0.4人以上。血液透析室：每 4 人次 1 人以上。慢性呼吸照護病房：每 4 床應有 1人以上。精神科日間照護單位，每 16名服務量應有 1人以上。\n3.申請醫學中心評鑑者：(原1.3.6-符合3)\n(1)急性一般病床每 2床應有 1人以上。\n(2)設下列部門者，其人員並依其規定計算：手術室：每班每床 2.5人以上。加護病房：每床應有 2.5人以上。產房：每產台應有 2人以上。燒傷病房、亞急性呼吸照護病房：每床應有 1.5人以上。手術恢復室：每班每床 0.5人以上。急診觀察室、嬰兒病床、安寧病房：每床應有 1人以上。門診：每診療室應有 1人以上。嬰兒室：每床應有 0.4人以上。血液透析室：每 4 人次 1 人以上。慢性呼吸照護病房：每 4 床應有 1人以上。精神科日間照護單位，每 15名服務量應有 1人以上。\n4.精神急性一般病房：每 3床應有1人以上。(原1.3.6-符合4)\n5.精神慢性一般病房：每 12床應有1人以上。(原1.3.6-符合5)\n優良項目：(下述項目須全部達成)\n1.護產人力達符合項目 3項之1.10倍。(原1.3.6-優良1-(3))\n2.能依業務特性及需求作彈性調配。(原1.3.6-優良2)\n3.除符合上述護產人力標準外，並有輔助人力協助護理人員執行非專業護理工作。(原1.3.6-優良3)\n[註]\n1.本條為必要條文，必須達符合項目(含)以上。\n2.護產人員包括護理師、護士、助產師及助產士，並應辦理執業登記；護佐、照顧服務員、書記等不列計。\n3.各類病床數以登記開放數計，並依實際設置情形計算人力。\n4.開業後之門診護產人員，依診療室之實際使用率計。其計算方式如下：實際使用率＝每星期之開診數/(診間數×每天以二時段計數×每星期開診天數)×100%。\n5.人力計算時：\n(1)人力計算結果不得低於醫療機構設置標準之規定。\n(2)若評鑑基準高於醫療機構設置標準，病床數得可考量年平均佔床率計算，並以四捨五入取至整位數。\n(3)同類別人力之各項計算結果，加總後以四捨五入取至整數位。\n(4)嬰兒室、燒傷病房及嬰兒病房等單位由醫院依實際需要調整人力，並提供適當訓練，以維護照護品質。\n6.醫院設有產房者，得有助產師(士)編制至少一人以上；其人員同時具有護理人員及助產人員資格者，應優先以助產人員資格辦理執業登記。\n評量方法及建議佐證資料：\n1.護產人員執業登記名冊。(符合)\n2.護產人員年資統計資料。(符合)\n3.各部門護產人員配置統計。(符合)\n4.相關配合業務需求彈性調度人力之資料。(優良)","cs":"1.護產人力係依評量項目內容逐項計算(同一類別病床數得合併計算)，且計算結果均取至小數點以下第一位，再將計算結果逐項進行加總，並以「加總數」無條件進位取至整數位計。\n2.手術室護產人力之班台數計算，係以「當月每日各班實際開台數加總÷當月手術室實際工作日」計算之；凡醫院於當日執行手術，則依據手術執行日數(半日或全日)列計實際工作日。另，若醫師待班(on call)執行手術，醫院可自行認列待班(on call)的實際工作日。\n3.醫院如同時申請醫學中心評鑑及兒童醫院評鑑者，本條文須併同兒童醫院條文合併審查。","p":40,"ch":"1.3"},{"n":"1.3.7","tags":["必"],"t":"藥劑部門組織分工完善、人力配置適當，足以完成對病人之藥事照護，且藥事人員皆有執業登錄","ev":"目的：配置適當的藥事人員及合宜調劑工作量，確保藥事服務品質，並符合政府相關法令之規定。\n符合項目：\n1.申請地區醫院評鑑者：(原1.3.8-符合1)\n(1)一般病床：每 50床應有藥師 1人以上；如採單一劑量，每 40床至少藥師 1人。\n(2)設有下列部門者，其人員並依其規定計算：加護病房：每 20床應有藥師1人。門診作業：如提供調劑服務者，應有藥師 1人。急診作業：每 8小時一班，全天24小時均應有藥師提供服務。\n(3)開業一年以後，依前一年服務量計算人力：門診作業：日處方箋每滿 100張處方箋，應增聘 1名藥師。急診作業：日處方箋每滿 100張處方箋，應增聘 1名藥師。\n(4)特殊製劑調劑作業：全靜脈營養劑、化學治療劑、PCA、IVadmixture至少 1人。\n2.申請區域醫院評鑑者：(原1.3.8-符合2)\n(1)一般病床：每 50床應有藥師 1人以上；如採單一劑量，每 40床至少藥師 1人。\n(2)設有下列部門者，其人員並依其規定計算：加護病房：每 20床應有藥師1人。門診作業：如提供調劑服務者，應有藥師 1人。急診作業：每 8小時一班，全天24小時均應有藥師提供服務。\n(3)開業一年以後，依前一年服務量計算人力：門診作業：日處方箋每滿 80張處方箋，應增聘 1名藥師。急診作業：日處方箋每滿 100張處方箋，應增聘 1名藥師。\n(4)特殊製劑調劑作業：特殊藥品處方每15 張至少1人。\n3.申請醫學中心評鑑者：(原1.3.8-符合3)\n(1)一般病床：每 40床應有藥師 1人以上。\n(2)設有下列部門者，其人員並依其規定計算：加護病房：每 20床應有藥師1人。門診作業：如提供調劑服務者，應有藥師 1人。急診作業：每 8小時一班，全天24小時均應有藥師提供服務。\n(3)開業一年以後，依前一年服務量計算人力：門診作業：日處方箋每滿 70張處方箋，應增聘 1名藥師。急診作業：日處方箋每滿 70張處方箋，應增聘 1名藥師。\n(4)特殊製劑調劑作業：特殊藥品處方每15 張至少1人。4.24小時作業的醫院，必須配置有24小時作業的藥事人力。(原1.3.8-符合4)\n優良項目：(下述項目須全部達成)\n1.藥事人力達符合項目 3項之1.10倍。(原1.3.8-優良1-(3))\n2.藥事人員總數至少 75%(含)以上為藥師。(原 1.3.8-優良2)\n[註]\n1.本條為必要條文，必須達符合項目(含)以上。\n2.藥事人員係指領有藥師、藥劑生執照，並辦理登錄，且服務於藥劑部門者。\n3.一般病床包含：急性一般病床、精神急性一般病床及慢性一般病床。各類病床數以登記開放數計，並依實際設置情形計算人力。\n4.門、急診處方數指每日平均處方數，門診以實際門診日數計算，急診以一年 365天計算。\n5.特殊藥品係指全靜脈營養輸注液、化學治療藥品、含放射性物質藥品癌症化學治療針劑、PCA 等，每日平均特殊藥品處方以一年 270天計算。\n6.人力計算時：\n(1)人力計算結果不得低於醫療機構設置標準之規定。\n(2)若評鑑基準高於醫療機構設置標準，病床數得可考量年平均佔床率計算，並以四捨五入取至整位數。\n(3)同類別人力之各項計算結果，加總後以四捨五入取至整數位。\n7.本條文不包含中藥調劑業務；醫院設有中醫部門者，中藥調劑人員另計。\n評量方法及建議佐證資料：\n1.藥事人員及執業登記名冊。(符合)\n2.具藥師資格統計資料。(符合)\n3.藥事人員年資統計資料。(優良)\n4.藥事人員班表、人力配置表。(優良)","cs":"1.符合項目需依門診處方張數換算藥事人力，目前並未特別區分「門診處方」之類別(自費或健保就醫病人)。\n2.評量項目[註]2，執業登記於該院的藥師及藥劑生，不論其編製單位/部門，均列計藥事人力。\n3.評量項目[註]4，醫院於週六、週日或例假日僅上半天班者，以 0.5 日計算。\n4.藥事人力係依評量項目內容逐項計算，再進行加總。\n5.處方箋數參考醫院向健保署申報之數量。\n6.醫院如同時申請醫學中心評鑑及兒童醫院評鑑者，本條文須併同兒童醫院條文合併審查。","p":43,"ch":"1.3"},{"n":"1.3.8","tags":["必"],"t":"適當之營養與膳食單位或部門組織與人力配置","ev":"目的：設置膳食專責部門及配置適當的營養師，確保膳食服務品質，並符合政府相關法令之規定。\n符合項目：\n1.依醫院類型及規模設置專責人員或部門負責醫院膳食服務。(原1.3.9-符合 1)\n2.營養師人力：(原1.3.9-符合2)\n(1)急性一般病床：每 100 床應有1人以上。\n(2)加護病房、燒傷加護病房：每 30床應有 1人以上。\n(3)亞急性呼吸照護病房、慢性呼吸照護病房、燒傷病房：每 100床應有 1人以上。\n(4)提供住院病人膳食者，應有專責營養師負責。\n(5)申請醫學中心評鑑者：每 100 床至少有 1 名營養師，另至少有 3名營養人員負責膳食供應。\n優良項目：(下述項目須全部達成)\n1.營養師人力達符合項目 2之1.1倍。(原1.3.9-優良1修)\n2.所有配置膳食服務人力於錄用前皆有健康檢查紀錄，且每年定期健康檢查追蹤報告合格。(原1.3.9-優良2修)\n[註]\n1.本條為必要條文，必須達符合項目(含)以上。\n2.若設有營養部門者，其主管建議由營養師擔任為宜。\n3.各類病床數以登記開放數計，並依實際設置情形計算人力。\n4.人力計算時：\n(1)人力計算結果不得低於醫療機構設置標準之規定。\n(2)若評鑑基準高於醫療機構設置標準，病床數得可考量年平均佔床率計算，並以四捨五入取至整位數。\n(3)同類別人力之各項計算結果，加總後以四捨五入取至整數位。\n評量方法及建議佐證資料：\n1.營養師人員及執業登記名冊。(符合)\n2.營養師人員年資、人力配置、班表等資料。(優良)\n3.配置膳食服務人力健康檢查紀錄。(優良)","cs":"1.符合項目 2-(5)所提「營養人員」，係指大專以上畢業且曾修習營養學分者。\n2.醫院如同時申請醫學中心評鑑及兒童醫院評鑑者，本條文須併同兒童醫院條文合併審查。","p":46,"ch":"1.3"},{"n":"1.3.9","tags":["必"],"t":"適當之復健服務組織與人力配置","ev":"目的：配置適當的復健人員及合宜工作量，確保復健照護品質，並符合政府相關法令之規定。\n符合項目：\n1.應配置合適之專業人員以配合病人病狀實施功能恢復訓練。(原1.3.10-符合1)\n2.依據醫院住院及門診病人組成，確保適宜的工作人員以提供恰當的服務。(原1.3.10-符合2)\n3.應確認職能治療、物理治療、聽力、語言治療等各專業人員數量及具體業務內容：(原1.3.10-符合3)\n(1)提供物理治療服務者，應符合下列規定：應有物理治療人員 1人以上。急性一般病床：每 100 床應有 1 人以上；未滿 100 床者，至少1 人。至少應有 1名物理治療師具有二年執行業務之經驗。\n(2)提供職能治療服務者，應符合下列規定：應有職能治療人員 1人以上。急性一般病床：每 300床應有1人以上。精神急性一般病床、精神慢性一般病床、精神科加護病房、精神科日間照護單位：合計每 35床(服務量)應有1人以上。至少應有 1名職能治療師具有二年執行業務之經驗。\n(3)提供語言治療業務者，應符合下列規定：應有語言治療師 1人以上。一般病床每 500床應增聘1人。\n(4)提供聽力師業務者，應符合下列規定：應有聽力師 1人以上。一般病床每 500床應增聘1人。\n優良項目：(下述項目須全部達成)\n1.職能治療、物理治療、聽力、語言治療等各專業人力達符合項目3項之1.10 倍。(原1.3.10-優良1)\n[註]\n1.本條為必要條文，必須達符合項目(含)以上。\n2.各類病床數以登記開放數計，並依實際設置情形計算人力。\n3.人力計算時：\n(1)人力計算結果不得低於醫療機構設置標準之規定。\n(2)若評鑑基準高於醫療機構設置標準，病床數得可考量年平均佔床率計算，並以四捨五入取至整位數。\n(3)同類別人力之各項計算結果，加總後以四捨五入取至整數位。\n評量方法及建議佐證資料：\n1.職能治療、物理治療、聽力、語言治療等人員及執業登記名冊、年資統計資料、人力配置表。(符合)","cs":"醫院如同時申請醫學中心評鑑及兒童醫院評鑑者，本條文須併同兒童醫院條文合併審查。","p":47,"ch":"1.3"},{"n":"1.3.10","tags":["試","必"],"t":"應有社工人員提供病人輔導、諮商及社區聯繫工作，並協助解決其困難或家暴等問題","ev":"目的：配置社工人員協助解決病人就醫、資源轉介與諮詢服務，增進病人疾病適應與提升生活品質。\n符合項目：\n1.社會工作人力：(原1.3.11-符合1)\n(1)急性一般病床：每 100 床應有1人以上。\n(2)精神急性一般病床、精神慢性一般病床、精神科日間照護單位：合計每 100床(服務量)應有1人以上。\n(3)急性一般病床、精神急性一般病床合計達 300床以上醫院之社會工作人員，其社會工作師人數應達三分之ㄧ以上；但偏遠地區醫院不在此限。\n2.提供病人輔導、諮商及社區聯繫工作，並協助解決其困難，如經濟或家暴等問題，並建立相關業務處理規範及具有相關工作紀錄。(原1.3.10-符合2)\n優良項目：(下述項目須全部達成)\n1.社會工作人力達符合項目1之1.10倍，且 1/3(含)以上人力具社會工作師資格。(原1.3.10-優良2)\n2.可完善整合院內、外資源提供服務。(原1.3.10-優良3)\n3.設有獨立之社會工作部門，且由具有社工專業背景或實務經驗滿 5年之社工人員負責，且能參考各項資料(如：服務量、民眾滿意等)作為改善服務的參考，定期追蹤及檢討，改善服務品質。(原1.3.10-優良4)\n[註]\n1.本條為試評條文，評量結果不納入評鑑成績計算。\n2.各類病床數以登記開放數計，並依實際設置情形計算人力。\n3.人力計算時：\n(1)人力計算結果不得低於醫療機構設置標準之規定。\n(2)若評鑑基準高於醫療機構設置標準，病床數得可考量年平均佔床率計算，並以四捨五入取至整位數。\n(3)同類別人力之各項計算結果，加總後以四捨五入取至整數位。\n評量方法及建議佐證資料：\n1.社會工作人員及執業登記名冊、年資等資料。(符合)\n2.社會工作人員業務工作規範。(符合)\n3.年度工作計畫、活動執行紀錄及服務量統計等資料。(符合)\n4.社會工作民眾滿意及業務檢討改善資料。(優良)","cs":"1.社會工作人員，依醫療機構設置標準係指大專以上社會工作系、所、組畢業，並具有社會工作師考試資格者。\n2.醫院如同時申請醫學中心評鑑及兒童醫院評鑑者，本條文須併同兒童醫院條文合併審查。","p":48,"ch":"1.3"},{"n":"1.3.11","tags":["可"],"t":"對外包業務及人員有適當管理機制","ev":"目的：落實各項外包業務之監督管理及教育訓練，確保醫療服務品質。\n符合項目：\n1.有指派專責人員或部門負責監督管理醫院各項外包業務，並訂定外包業務管理辦法(應視醫院實際情形，包含衛生福利部公告之「醫療機構業務外包作業指引」所規定之相關內容)。(原1.3.12-符合1)\n2.明確訂定承包業者合格條件及遴選程序，並要求業者確保外包人員具備工作所須相關專業能力或資格證照，且依「職業安全衛生法」定期接受健康檢查，並備有檢查紀錄。(原 1.3.12-符合 2)\n3.應對承包業者實施業務及設備等訪查評估，作成紀錄，作為日後續約、違約處理之依據。(原1.3.12-符合3)\n4.視情形需要，明確規定外包業務相關意外事故發生時之賠償責任歸屬，以及外包業者違約時之業務即時銜接機制，以保障病人權益與安全。(原1.3.12-符合4)\n5.應對承包業者要求落實其員工之教育訓練，包含定期接受醫院有關院內感染管制、保密義務及確保病人安全等事項。(原1.3.12-符合5)\n優良項目：(下述項目僅限一項未達成)\n1.落實外包業務監督管理規範，並確實考核承包業者履行合約，備有紀錄可查。(原1.3.12-優良1)\n2.對於外包人員訂有定期針對專業能力、資格與教育訓練自主查核機制，並落實執行。(原1.3.12-優良2)\n3.至少每半年 1 次評估檢討相關承包業者對合約的執行及實際工作狀況和時效性，並與承包業者溝通協商，能定期檢討改善，並有具體事證。(原1.3.12-優良3)\n[註]\n1.未有業務外包者，可自選本條免評。\n2.於實地評鑑查證時，如發現醫院實有外包業務，卻自稱「無外包業務」之情形者，則本項評量為「待改善」。\n3.外包業務係指依衛生福利部公告之「醫療機構業務外包作業指引」應以診斷、治療、核心護理以外之非醫療核心業務為原則，如：\n(1)總務類：如膳食製作、環境清潔、廢棄物處理、救護車、保全、往生室、停車場等。\n(2)供應類：如被服清洗。\n(3)工務類：如機電、安全、消防、供水、緊急供電、醫用氣體等系統定期檢查及維修設備。\n(4)儀器類：如儀器設備租用或執行檢查、測試、保養或校正等。\n(5)資訊類：如資訊系統設計、或電腦設備維修與保養作業。\n(6)檢驗類：如委託檢驗。\n(7)照顧服務員。\n評量方法及建議佐證資料：\n1.外包業務管理辦法或規章制度。(符合)\n2.外包人員健康檢查紀錄。(符合)\n3.外包業務及設備等訪查評估紀錄。(符合)\n4.外包違約時業務即時銜接機制。(符合)\n5.外包人員教育訓練資料。(符合)\n6.外包業務監督管理規範及查核紀錄。(符合)\n7.外包人員專業能力、資格與教育訓練自主查核機制及紀錄。(優良)\n8.與外包業者溝通協商紀錄及檢討改善資料。(優良)","cs":"1.醫療照護專業人力不可外包予非醫療機構之醫療業務項目包括：急診、洗腎、呼吸治療、放射診斷、放射治療、復健、碎石、心導管、檢驗等。\n2.外包業務之醫療照護專業人力需執登於該院。\n3.外包人員係指廠商常駐於醫院之外包人員，該業務之人員每週至少來一次(含以上)，且以從事例行性業務範圍者為主。\n4.評鑑委員於實地評鑑時，可查核醫院相關外包合約。","p":50,"ch":"1.3"},{"n":"1.3.12","tags":["試","必"],"t":"適當的呼吸治療照護人力配置","ev":"目的：配置適當之呼吸治療師，確保呼吸治療照護品質，並符合政府相關法令之規定。\n符合項目：\n1.依醫院類型及規模設置人員或部門負責呼吸治療服務。\n2.亞急性呼吸照護病房：每 10床應有1人以上。(原2.4.24-符合3)\n3.慢性呼吸照護病房：每 30床應有1人以上。(原2.4.21-符合3)\n4.加護病房：每 15床應有1人以上。(原2.4.7-優良5)\n5.收治使用呼吸器之病人，應有呼吸治療師提供 24小時服務。\n優良項目：\n1.亞急性呼吸照護病房：具2年以上呼吸治療師工作經驗至少50%(含)以上。(原2.4.24-優良 2修)\n2.慢性呼吸照護病房：每 20 床應有專任呼吸治療師 1 名。(原 2.4.21-優良2 修)\n3.加護病房：每 10床應有專責呼吸治療師1 名。(原2.4.7-優良5修)\n[註]\n1.本條為試評條文，評量結果不納入評鑑成績計算。\n2.人力計算時：\n(1)人力計算結果不得低於醫療機構設置標準之規定。\n(2)若評鑑基準高於醫療機構設置標準，病床數得可考量年平均佔床率計算，並以四捨五入取至整位數。\n(3)同類別人力之各項計算結果，加總後以四捨五入取至整數位。\n評量方法及建議佐證資料：\n1.呼吸治療師執業登記名冊。(符合/優良)\n2.呼吸治療師 24小時服務紀錄。(符合)\n3.加護病房專責呼吸治療師排班表。(優良)","cs":"","p":52,"ch":"1.3"},{"n":"1.3.13","tags":["試","合"],"t":"適當的醫事放射人力配置","ev":"目的：配置適當的醫事放射人員及合理工作量，確保放射診療檢查服務品質，並符合政府相關法令之規定。\n符合項目：\n1.急性一般病床每達 20床應有醫事放射人員 1人。\n2.設加護病床者，每達 20床應有醫事放射人員 1人。\n3.有提供 24 小時緊急放射診斷作業者，全天 24 小時均有醫事放射人員提供服務：\n(1)應有醫事放射人員 4 人以上。\n(2)平均每日急診人次達 160 人次者，每達 40 人次應增聘醫事放射人員 1人。\n4.平均每日門診人次每達 800人次，應有醫事放射人員 1人。\n[註]\n1.本條為試評條文，評量結果不納入評鑑成績計算。\n2.醫事放射人員包括醫事放射師及醫事放射士。\n3.各類病床數以登記開放數計，並依實際設置情形計算人力。\n4.人力計算時，同類別人力之各項計算結果，加總後以四捨五入取至整數位。\n評量方法及建議佐證資料：\n1.醫事放射人員及執業登記名冊。(符合)\n2.放射線作業人員訓練計畫及訓練結果資料。(符合)","cs":"","p":53,"ch":"1.3"},{"n":"1.3.14","tags":["試","合"],"t":"適當的醫事檢驗人力配置","ev":"目的：配置適當的醫事檢驗人員及合理工作量，確保醫事檢驗時效及服務品質，並符合政府相關法令之規定。\n符合項目：\n1.急性一般病床每 40床應有醫事檢驗人員2 人以上。\n2.特殊病床每 50床應有醫事檢驗人員2人以上。\n3.有提供 24 小時緊急檢驗作業：每 8 小時一班，全天 24 小時均有醫事檢驗人員提供服務。\n4.平均每日門診人次每 400人次應有醫事檢驗人員 1人以上。\n5.平均每日急診人次每 40人次應有醫事檢驗人員 1人以上。\n6.設有血庫者，應有專人管理。\n[註]\n1.本條為試評條文，評量結果不納入評鑑成績計算。\n2.特殊病床包含：加護病床、燒傷加護病床、燒傷病床、亞急性呼吸照護病床、慢性呼吸照護病床、血液透析床、急性後期照護病床及整合醫學急診後送病床。\n3.「有資格者」即「有執照之人員」，醫事檢驗人力及資格均應符合醫療機構設置標準，而「負責管理」則是責任與職務的分派。\n4.醫事檢驗人員包括醫事檢驗師及醫事檢驗生。\n5.各類病床數以登記開放數計，並依實際設置情形計算人力。\n6.人力計算時，同類別人力之各項計算結果，加總後以四捨五入取至整數位。\n評量方法及建議佐證資料：\n1.醫事檢驗人員執業登記名冊。(符合)","cs":"","p":54,"ch":"1.3"},{"n":"1.3.15","tags":["試","合"],"t":"依據病房特性配置適當護產人力","ev":"目的：配置適當的護產人員，確保照護品質及病人安全，並符合政府相關法令之規定。\n符合項目：\n1.急性一般病床：每 1.8床應有1人以上。\n2.特殊病床：\n(1)加護病房：每床應有 2.5人以上。\n(2)精神科加護病房：每 1.6床應有1人以上。\n(3)燒傷加護病房：每床應有 2.5人以上。\n(4)燒傷病房：每床應有 1.5人以上。\n(5)亞急性呼吸照護病房：每床應有 1.5人以上。\n(6)手術恢復室：每班每床 0.5人以上。\n(7)急診觀察室、嬰兒病床、安寧病房：每床應有 1人以上。\n(8)嬰兒室：每床應有 0.4 人以上。\n(9)慢性呼吸照護病房：每 4床應有1人以上。\n(10)隔離病房：每 1.8 床應有1人以上。\n(11)整合醫學急診後送病房：每 1.8床應有 1人以上。\n3.血液透析：\n(1)照顧門診血液透析病人每 4人次應有1人以上。\n(2)照顧住院血液透析病人每 3人次應有1人以上。\n4.手術室：每班每床應有 2.5人以上。\n5.門診：每診療室應有 1人以上。\n6.精神病床：\n(1)精神急性一般病房：每 1.8床應有1人以上。\n(2)精神慢性一般病房：每 10床應有1人以上。\n(3)精神科日間照護單位：每 15名服務量應有 1人以上。\n7.產房：每產台應有 2人以上。\n[註]\n1.本條為試評條文，評量結果不納入評鑑成績計算。\n2.護產人員包括護理師、護士、助產師及助產士，並應辦理執業登記；護佐、照顧服務員、書記等不列計。\n3.各類病床數以登記開放數計，並依實際設置情形計算人力。\n4.開業後之門診護產人員，依診療室之實際使用率計。其計算方式如下：實際使用率＝每星期之開診數/(診間數×每天以二時段計數×每星期開診天數)×100%。\n5.人力計算時，同類別人力之各項計算結果，加總後以四捨五入取至整數位。\n6.醫院設有產房者，得有助產師(士)編制至少一人以上；其人員同時具有護理人員及助產人員資格者，應優先以助產人員資格辦理執業登記。\n評量方法及建議佐證資料：\n1.護產人員執業登記名冊。(符合)\n2.護產人員年資統計資料。(符合)\n3.各部門護產人員配置統計。(符合)","cs":"","p":55,"ch":"1.3"},{"n":"1.3.16","tags":["試","合"],"t":"適當的藥事人力配置","ev":"目的：配置適當的藥事人員及合宜調劑工作量，確保藥事服務品質，並符合政府相關法令之規定。\n符合項目：\n1.一般病床：每 40床應有藥師1人以上。\n2.設有下列部門者，其人員並依其規定計算：\n(1)加護病房：每 20床應有藥師 1人。\n(2)門診作業：如提供調劑服務者，應有藥師 1人。\n(3)急診作業：每 8小時一班，全天24小時均應有藥師提供服務，至少應有藥師 1人。\n3.開業一年以後，依前一年服務量計算人力：\n(1)門診作業：日處方箋每滿 70張處方箋，應增聘 1名藥師。\n(2)急診作業：日處方箋每滿 70張處方箋，應增聘 1名藥師。\n4.特殊製劑調劑作業：特殊藥品處方每 15張至少 1人。5.24小時作業的醫院，必須配置有 24小時作業的藥事人力。\n6.藥事管理：合計最低應有人力之 5%。\n[註]\n1.本條為試評條文，評量結果不納入評鑑成績計算。\n2.藥事人員係指領有藥師、藥劑生執照，並辦理登錄，且服務於藥劑部門者。\n3.一般病床包含：急性一般病床、精神急性一般病床及慢性一般病床。各類病床數以登記開放數計，並依實際設置情形計算人力。\n4.門、急診處方數指每日平均處方數，門診以實際門診日數計算，急診以一年 365天計算。\n5.特殊藥品係指全靜脈營養輸注液、化學治療藥品、含放射性物質藥品癌症化學治療針劑、PCA 等，每日平均特殊藥品處方以一年 270天計算。\n6.人力計算時，同類別人力之各項計算結果，加總後以四捨五入取至整數位。\n7.本條文不包含中藥調劑業務；醫院設有中醫部門者，中藥調劑人員另計。\n評量方法及建議佐證資料：\n1.藥事人員及執業登記名冊。(符合)\n2.具藥師資格統計資料。(符合)","cs":"","p":56,"ch":"1.3"},{"n":"1.3.17","tags":["試","合"],"t":"適當的營養人力配置","ev":"目的：設置膳食專責部門及配置適當的營養師，確保膳食服務品質，並符合政府相關法令之規定。\n符合項目：\n1.急性一般病床：每 90床應有營養師1人以上。\n2.慢性一般病床：每 200床應有營養師1人以上。\n3.精神急性一般病床：每 150床應有營養師 1人以上。\n4.精神慢性一般病床：每 200床應有營養師 1人以上。\n5.加護病房、燒傷加護病房合計：每 30床應有營養師 1人以上。\n6.亞急性呼吸照護病房、慢性呼吸照護病房、燒傷病房合計：每 100 床應有營養師 1人以上。\n7.提供血液透析服務者，應有專責營養師：血液透析床達 50床者，應增聘1 名營養師；若血液透析床達100床者，應再增聘 1名營養師。\n8.提供住院病人膳食服務者，至少有 3 名營養人員負責供膳業務，其中1名為營養師。\n[註]\n1.本條為試評條文，評量結果不納入評鑑成績計算。\n2.若設有營養部門者，其主管建議由營養師擔任為宜。\n3.各類病床數以登記開放數計，並依實際設置情形計算人力。\n4.人力計算時，同類別人力之各項計算結果，加總後以四捨五入取至整數位。\n評量方法及建議佐證資料：\n1.營養師人員執業登記名冊。(符合)","cs":"","p":58,"ch":"1.3"},{"n":"1.3.18","tags":["試","合"],"t":"適當的物理治療人力配置","ev":"目的：配置適當的物理治療人員及合宜工作量，確保物理治療服務品質，並符合政府相關法令之規定。\n符合項目：\n1.急性一般病床：每 100床，應有專任物理治療人員 1 人以上。\n2.平均每日門診物理治療服務人次每 25人次，應有專任物理治療人員1人以上。\n3.至少應有 1名物理治療師具有二年執行業務之經驗。\n[註]\n1.本條為試評條文，評量結果不納入評鑑成績計算。\n2.各類病床數以登記開放數計，並依實際設置情形計算人力。\n3.人力計算時，同類別人力之各項計算結果，加總後以四捨五入取至整數位。\n評量方法及建議佐證資料：\n1.物理治療人員執業登記名冊、年資統計資料、人力配置表。(符合)","cs":"","p":59,"ch":"1.3"},{"n":"1.3.19","tags":["試","合"],"t":"適當的職能治療人力配置","ev":"目的：配置適當的職能治療人員及合宜工作量，確保職能治療服務品質，並符合政府相關法令之規定。\n符合項目：\n1.應有職能治療人員 1人以上。\n2.急性一般病床、慢性一般病床合計：每達 120 床應有職能治療人員1人。\n3.精神急性一般病床、精神慢性一般病床、精神科加護病床、精神科日間照護單位合計：至少應有職能治療人員 1人，每達30床應有職能治療人員 1人。\n4.至少應有 1名職能治療師具有二年執行業務之經驗。\n[註]\n1.本條為試評條文，評量結果不納入評鑑成績計算。\n2.各類病床數以登記開放數計，並依實際設置情形計算人力。\n3.人力計算時，同類別人力之各項計算結果，加總後以四捨五入取至整數位。\n評量方法及建議佐證資料：\n1.職能治療人員執業登記名冊、年資統計資料、人力配置表。(符合)","cs":"","p":59,"ch":"1.3"},{"n":"1.3.20","tags":["試","合"],"t":"適當的語言治療人力配置","ev":"目的：配置適當的語言治療師及合宜工作量，確保語言治療業務品質，並符合政府相關法令之規定。\n符合項目：\n1.應有語言治療師 1人以上。\n2.一般病床每達 250床，應有語言治療師1人。\n3.相關業務人員：\n(1)設有早療評估和治療應增聘全職語言治療師 1人。\n(2)提供出院準備、行動早療、外展服務社區者，應增聘 1名語言治療師。\n(3)提供居家醫療服務者，應增聘 0.5名語言治療師。\n[註]\n1.本條為試評條文，評量結果不納入評鑑成績計算。\n2.各類病床數以登記開放數計，並依實際設置情形計算人力。\n3.人力計算時，同類別人力之各項計算結果，加總後以四捨五入取至整數位。\n評量方法及建議佐證資料：\n1.語言治療師執業登記名冊、年資統計資料、人力配置表。(符合)","cs":"","p":60,"ch":"1.3"},{"n":"1.3.21","tags":["試","合"],"t":"適當的聽力人力配置","ev":"目的：配置適當的聽力師及合宜工作量，確保聽力業務品質，並符合政府相關法令之規定。\n符合項目：\n1.應有聽力師 1人以上。\n2.一般病床每達 350床應增聘1人。\n[註]\n1.本條為試評條文，評量結果不納入評鑑成績計算。\n2.各類病床數以登記開放數計，並依實際設置情形計算人力。\n3.人力計算時，同類別人力之各項計算結果，加總後以四捨五入取至整數位。\n評量方法及建議佐證資料：\n1.聽力師執業登記名冊、年資統計資料、人力配置表。(符合)","cs":"","p":61,"ch":"1.3"},{"n":"1.3.22","tags":["試","合"],"t":"適當的社工人力配置","ev":"目的：配置社工人員協助解決病人就醫、資源轉介與諮詢服務，增進病人疾病適應與提升生活品質。\n符合項目：\n1.急性一般病床：每達 80床應有社會工作人員 1人以上。\n2.精神急性一般病床：每達 30床應有社會工作人員 1人以上。\n3.精神科日間照護單位(床)：每達60床應有社會工作人員 1人以上。\n4.平均每日門診人次：\n(1)達4,000 人次者，應增聘 1名社會工作人員。\n(2)達10,000 人次者，應再增聘 1名社會工作人員。\n[註]\n1.本條為試評條文，評量結果不納入評鑑成績計算。\n2.各類病床數以登記開放數計，並依實際設置情形計算人力。\n3.人力計算時，同類別人力之各項計算結果，加總後以四捨五入取至整數位。\n4.自本基準公告日起，新聘之社會工作人員應具社會工作師資格，但偏遠地區醫院不在此限。\n評量方法及建議佐證資料：\n1.社會工作人員執業登記名冊、年資等資料。(符合)\n2.社會工作人員業務工作規範。(符合)","cs":"","p":61,"ch":"1.3"},{"n":"1.3.23","tags":["試","合"],"t":"適當的臨床心理人力配置","ev":"目的：配置臨床心理協助解決病人就醫、資源轉介與諮詢服務，增進病人疾病適應與提升生活品質。\n符合項目：\n1.至少應有 2名專任臨床心理師。\n2.精神急性一般病床、精神慢性一般病床、精神科日間照護單位合計：每 30 床應有專任臨床心理師 1 名以上，未滿 30 床者，至少應有專任臨床心理師 1名。\n3.平均每月精神科門診人次，每 2,000人次應增聘 1名臨床心理師。\n4.急性一般病床：每 300床應有專任臨床心理師 1名以上。\n5.平均每月門診人次(不含精神科門診)，每 50,000 人次應增聘 1 名臨床心理師。\n[註]\n1.本條為試評條文，評量結果不納入評鑑成績計算。\n2.各類病床數以登記開放數計，並依實際設置情形計算人力。\n3.人力計算時，同類別人力之各項計算結果，加總後以四捨五入取至整數位。\n評量方法及建議佐證資料：\n1.臨床心理師執業登記名冊、年資等資料。(符合)","cs":"","p":62,"ch":"1.3"},{"n":"1.3.24","tags":["試","合"],"t":"適當的呼吸治療照護人力配置","ev":"目的：配置適當之呼吸治療師，確保呼吸治療照護品質，並符合政府相關法令之規定。\n符合項目：\n1.依醫院類型及規模設置人員或部門負責呼吸治療服務。\n2.急性一般病床：每達 200床應有呼吸治療師 1人。\n3.亞急性呼吸照護病房：每達 5床應有呼吸治療師 1人。\n4.慢性呼吸照護病房：每達 15床應有呼吸治療師 1人。\n5.加護病房：每達 7.5床應有呼吸治療師1人。\n6.有提供 24小時急診服務者，至少應有呼吸治療師 4人。\n[註]\n1.本條為試評條文，評量結果不納入評鑑成績計算。\n2.各類病床數以登記開放數計，並依實際設置情形計算人力。\n3.人力計算時，同類別人力之各項計算結果，加總後以四捨五入取至整數位。\n評量方法及建議佐證資料：\n1.呼吸治療師執業登記名冊。(符合)\n2.呼吸治療師 24小時服務紀錄。(符合)","cs":"","p":63,"ch":"1.3"},{"n":"1.4.1","tags":[],"t":"健全的病歷資訊管理制度及環境","ev":"目的：規範病歷記載的方式及格式、檔案增刪與存取查核的管理機制和設備的保存環境，以利合法完整調閱應用。\n符合項目：\n1.病歷格式一致且設計完善，易於查閱。明訂記載規則及標準作業規定。(原 1.5.1-符合1)\n2.病歷應按內容類別編排有序，檔案排列整齊易於調閱；病歷調出與歸檔有作出入庫管理與遞送時效管控。有切實追蹤查核制度，防止遺失。(原1.5.1-符合2 修)\n3.病歷經刪改，其刪改部分(含執行人員、時間及內容)應予保留，嚴防病歷遭竄改、損毀及不當取得或使用，電子病歷置有備份防止滅失，且有確保系統故障回復及緊急應變之機制。於法定保存年限內應可完整呈現病歷紀錄。(原1.5.1-符合3、4併)\n4.紙本病歷檔案空間和電子病歷儲存主機所在處應有適當門禁、防火、確保妥善運作之相關設施設備，並有定期防火演練。(原 1.5.1-符合5)\n優良項目：(下述項目(不含試評項目)須全部達成)\n1.電子病歷除特殊狀況外，應依規定上傳健保醫療資訊雲端查詢系統。(試)\n2.診療過程產生的病歷資料，不論紙本、聲音、照片或電子檔案等，應有效管理避免機構內外非相關人員不當閱覽或擷取，以尊重病人隱私權。(試)\n3.對病歷內容的保密措施(如：保密原則、規範、人員教育訓練等)嚴格要求並有定期稽查之機制。(原1.5.1-符合6 修)\n4.對於病歷調閱、釋出目的及行為應有統計分析。(原1.5.1-優良2)\n[註]\n1.全面或部分實施電子病歷之醫院，應符合「醫療法」及「醫療機構電子病歷製作及管理辦法」之規定。\n2.未向當地主管機關宣告實施電子病歷者，本條有關電子病歷之部分免評。\n3.病歷室和電子病歷儲存主機所在處應維持整齊清潔，不可堆放非屬病歷室之雜物。\n4.優良項目 1、2列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.病歷製作與管理辦法。(符合)\n2.病歷書寫規範。(符合)\n3.病歷審查作業辦法。(符合)\n4.病歷存放檔區和電子病歷主機所在處消防設備和門禁安全管理規範(含火災應變計畫與演習紀錄)。(符合)\n5.個人資料安全保護管理辦法。(符合/優良)\n6.電子病歷存取、增刪、查閱與複製管理辦法。(優良)","cs":"1.符合項目 3，醫院可採定期抽查、加蓋騎縫章等方式，來防止病歷被撕毀、竄改。\n2.符合項目 4所提「防火措施」，目前相關法令及評鑑基準並未規定防火設備類型，醫院可依其現況及安全性進行配置。\n3.[註]2係依據「醫療機構電子病歷製作及管理辦法」之第 7 條規定「醫療機構實施電子病歷，應將開始實施之日期及範圍報請直轄市、縣(市)主管機關備查，並應揭示於機構內明顯處所，於變更或停止實施時亦同」，故醫院向當地主管機關報備實施電子病歷，評鑑委員需就其實施日期及範圍進行評量，惟於該實施日期及範圍內得免以書面方式製作病歷。","p":64,"ch":"1.4"},{"n":"1.4.2","tags":[],"t":"應有專人負責管理病歷或設立病歷管理部門，人力配置、素質、教育訓練適當，作業功能良好","ev":"目的：訂有專責單位和專業人員負責病歷管理，提供良好的病歷管理相關作業。\n符合項目：\n1.應有專責人員或設有病歷管理單位，負責病歷管理。(原 1.5.2-符合1)\n2.病歷管理人員應有病歷管理或疾病分類等相關專業訓練。(原 1.5.2-符合2)\n3.人力配置符合醫院規模及業務量，並考量床數及業務量調整；每 100床有1 名病歷管理人員(以一般病床計)。(原 1.5.2-優良1)\n4.病歷管理委員會由資深醫師擔任主委，並有資訊人員擔任委員，或設有電子病歷跨單位發展組織。(原1.5.2-優良 2、5併)\n優良項目：(下述項目(不含試評項目)僅限一項未達成)\n1.所有疾病分類人員通過相關資格甄審考試，並取得證照。(原 1.5.2-優良3)\n2.若醫院每年新診斷癌症個案數達 50 案以上者(以衛生福利部最新公告之個案數為基準，由國民健康署提供醫院及其申報個案數資料)則：(原 1.5.2-優良4)\n(1)醫院每年新診斷癌症個案數達 50案以上未達 1,000案之醫院，至少有 1 人曾接受國民健康署委託辦理之癌症登記課程達 20 小時以上。(原1.5.2-優良4-(2))\n(2)醫院每年新診斷癌症個案數達 500 案之醫院，至少有 0.5 名(未滿1人以 1人計)通過認證之專責癌症登記技術員。(原1.5.2-優良4 -\n(1)修)\n(3)醫院每年新診斷癌症個案數達≤ 3,000案之醫院，至少有 1名癌症登記進階級認證人員；每年新診斷癌症個案數達 3,000 案以上則至少有 2名癌症登記進階級認證人員。(試)\n3.病歷管理委員會會議決議事項有追蹤考核，改善成效良好。(原1.5.2-優良5 修)\n[註]\n1.醫療機構設置標準：應有專責之病歷管理人員 1人以上。\n2.資深醫師係指取得專科醫師資格 5年以上且具臨床經驗者。\n3.符合項目 2所提「病歷管理或疾病分類等相關專業訓練」，得由相關學、協會認證辦理。\n4.參考衛生福利部國民健康署癌症診療品質認證基準。\n5.優良項目 2-(3)列為試評項目，評量結果不列入評鑑成績計算。\n評量方法及建議佐證資料：\n1.病歷管理部門組織圖。(符合)\n2.病歷管理和疾病分類人員，相關學協會專業訓練認證。(符合/優良)\n3.病歷管理委員會組織章程和會議紀錄(含決議與追蹤事項)。(優良)","cs":"","p":66,"ch":"1.4"},{"n":"1.4.3","tags":[],"t":"病歷應詳實記載，並作量與質的審查","ev":"目的：依相關法令規定訂定病歷記載之規範及查核改善。\n符合項目：\n1.主治醫師需親自診察且病歷記載應符合「醫師法」及「醫療法」要求。(原 1.5.3-符合1)\n2.各類醫事人員病歷紀錄要求應符合相關法規及醫院要求。記載內容及注意事項建議如下：(原1.5.3-符合2)\n(1)首頁載明病人姓名、出生年、月、日、性別及住址等基本資料。\n(2)就診日期。\n(3)病人主訴及現在病史。\n(4)過去病史、家族史、藥物過敏史、職業、旅遊史及資料提供者。\n(5)身體檢查(Physical Examination)、檢查項目及結果。\n(6)診斷或病名。\n(7)治療、處置或用藥(處方，包括藥名、劑量、天數及服用方式)等情形。\n(8)治療方式。\n(9)所有醫事人員對病歷之紀錄均有簽名或蓋章及簽註日期(已實施電子病歷之醫院應以電子簽章方式為之)。\n(10)治療效果。\n(11)其他依醫院實際所需訂定之各類紀錄方式及內容。\n3.訂定病歷量的審查作業規定，且確實執行。(原1.5.3-符合3)\n優良項目：(下述項目僅限一項未達成)\n1.相關紀錄應適當描述重點且將同意書及各類相關紀錄納入病歷，詳實記錄及持續品質審查。(原1.5.3-優良1)\n2.訂定病歷紀錄品質審查作業規定或辦法，確實對病歷紀錄之量與質執行評核並有獎懲制度。(原1.5.3-優良2)\n3.相關紀錄品質監測結果，確實檢討改善，成效良好。(原 1.5.3-優良3)\n[註]\n1.醫師法第 12 條：「醫師執行業務時，應製作病歷，並簽名或蓋章及加註執行年、月、日。前項病歷，除應於首頁載明病人姓名、出生年、月、日、性別及住址等基本資料外，其內容至少應載明下列事項：\n一、就診日期。\n二、主訴。\n三、檢查項目及結果。\n四、診斷或病名。\n五、治療、處置或用藥等情形。\n六、其他應記載事項。病歷由醫師執業之醫療機構依醫療法規定保存。」\n2.醫療法第 67條：「醫療機構應建立清晰、詳實、完整之病歷。前項所稱病歷，應包括下列各款之資料：\n一、醫師依醫師法執行業務所製作之病歷。\n二、各項檢查、檢驗報告資料。\n三、其他各類醫事人員執行業務所製作之紀錄。醫院對於病歷，應製作各項索引及統計分析，以利研究及查考。」\n3.本條文符合項目 2 至少應符合(1)、(2)、(3)、(5)、(6)、(7)、(9)為之規範；另，初診及入院紀錄(Admission Note)亦需符合(4)之規範。\n評量方法及建議佐證資料：\n1.病歷書寫規範。(符合)\n2.病歷品質管理辦法(含質、量、時效)。(符合/優良)\n3.抽查病歷至少 10本。(符合)\n4.病歷紀錄之質量審查之紀錄與分析檢討結果。(優良)","cs":"優良項目 1，病人進行手術、麻醉、侵入性檢查或治療等相關同意書，皆須納入病歷中；同意書之格式、簽署份數等原則均需符合相關法規規定。另，目前尚未明確規範自費項目之同意書須納入病歷，醫院可自行規範是否納入病歷管理範圍。","p":67,"ch":"1.4"},{"n":"1.4.4","tags":[],"t":"病歷應有系統歸檔，且每位病人只有一份病歷，以維護資料的完整性","ev":"目的：系統性保存門診和住診病歷，且重要紀錄應有註記、特殊病歷應獨立保存並有合適保護機制。\n符合項目：\n1.每位病人只有一份病歷(即每位病人在醫院僅有 1 個病歷號)。病歷應依法定年限妥善保存，且病歷號有系統的歸檔，易於調閱；病歷調離檔案後，應有紙本或資訊系統之追蹤紀錄，以利病歷追蹤。紙本病歷首頁、紙本診療紀錄或電子病歷應有該病人「藥物過敏」之紀錄。處方醫令系統應有病人「藥物過敏」之提示。若病人簽具不施行心肺復甦術(Do Not Resuscitate, DNR)，則應比照「藥物過敏」之註記。(原1.5.4-符合 1)\n2.門診、住院病歷如分開放置時，門診病歷需含出院病歷摘要，透析病歷如分開放置時，應將病人透析治療之重要資訊，整理摘要後至少每3 個月一次併入病人病歷，其內容須包括：首頁(含基本資料及診斷)，透析紀錄單，藥物醫囑單，檢查數據單，護理衛教單，血管追蹤紀錄單，住出院紀錄單等重點摘要。(原1.5.4-符合2修)\n3.特殊病歷資料應制訂辦法妥善管理，視法律規定予以獨立儲存及設有合適保護機制，並製作摘要置入病歷中或建立相關索引機制。(原1.5.4-符合 3)\n優良項目：(下述項目僅限一項未達成)\n1.具教學研究價值之病歷相關資料有特別妥善保存。(原1.5.4-優良1)\n2.訂定病歷紀錄及調閱規範，並落實執行，定期檢討改善成效良好。(原1.5.4-優良2)\n3.改善病歷資料完整性之管理、提升病歷品質。(原1.5.4-優良3)\n[註]\n1.符合項目 1所提「若病人簽具不施行心肺復甦術(DNR)，則應註記」：\n(1)其註記方式不侷限於紙本病歷，註記位置以可讓相關人員查閱即可。\n(2)DNR 註記之查閱以 100年2月以後之資料為主。\n2.血液透析紀錄若全面實施電子病歷，則不必每三個月整理重要資訊摘要。\n3.未向當地主管機關宣告實施電子病歷者，本條有關電子病歷之部分免評。\n4.特殊病歷由醫院自行定義。\n評量方法及建議佐證資料：\n1.病歷書寫規範。(符合/優良)\n2.病歷保存與借閱規範。(符合/優良)\n3.出院病歷彙整標準。(符合)\n4.個人資料安全保護管理辦法。(符合)\n5.病歷品質監測指標和審查統計表。(優良)","cs":"符合項目 3所提「特殊病歷資料」，其摘要置入病歷之頻率，醫院應自行規定並據以辦理，但需向評鑑委員說明規定之原由。","p":69,"ch":"1.4"},{"n":"1.4.5","tags":[],"t":"依據病人的請求，依法提供病歷複製本或摘要，落實分級醫療，視病人的病情需要，進行轉診病歷製作，並分析檢討","ev":"目的：為協助病人跨院醫療需求或專業諮詢，依法適時提供病歷複製本或摘要。\n符合項目：\n1.明訂提供病歷複製本或摘要之流程，對於病人之申請，不得違反醫療法第 71條規定，無故拖延或拒絕。(原1.5.5-符合1)\n2.病人資料的釋出須依一定的申請程序辦理。(原1.5.5-符合2)\n3.能依病人需求，提供中文出院病歷摘要。(原1.5.5-符合3)\n4.訂有緊急傷病患轉診辦法，及時傳遞轉診病人相關病歷資訊至轉診醫院，並落實轉診過程之風險告知，填具轉診同意書(需符合緊急傷病患轉診實施辦法之規定)。(試)\n優良項目：(下述項目(不含試評項目)須全部達成)\n1.設有稽核及改善機制，落實執行成效良好。(原1.5.5-優良1)\n2.適時檢討修訂相關流程，具體改善服務便利性及作業效率(病歷複製本應於 2 日(工作日)內提供；病歷摘要應於 5 日(工作日)內提供)。(原1.5.5-優良2修)\n3.轉診病人交接資料完整，包括院際間轉診紀錄及轉診異常事件報告。(試)\n4.針對轉診及接收病人案件紀錄進行統計、並分析檢討，提供病人優質連續照護。(試)\n[註]\n1.醫療法第 71 條規定：「醫療機構應依其診治之病人要求，提供病歷複製本，必要時提供中文病歷摘要，不得無故拖延或拒絕；其所需費用，由病人負擔」。\n2.醫療法施行細則第49-1條規定：「本法第71條所稱必要時提供中文病歷摘要，指病人要求提供病歷摘要時，除另有表示者外，應提供中文病歷摘要」。\n3.符合項目 4及優良項目3、4列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.病歷複製作業辦法。(符合)\n2.病歷複製作業時效稽核統計表。(優良)\n3.轉診及接收病人案件統計分析檢討。(優良)","cs":"符合項目 1，醫院應有便利病人的申請流程(如：在服務台接受申請)，不宜規定須先行掛號。","p":71,"ch":"1.4"},{"n":"1.4.6","tags":[],"t":"發展連續性、整合性照護之病歷管理，且對出院病歷摘要定期追蹤及檢討改善","ev":"目的：為因應人口結構改變，提升照護效能，鼓勵推展跨科共同照護的病歷記錄模式。出院病歷應重點彙整診斷與診療過程，完成出院摘要歸回病歷室以便利病人回診。\n符合項目：\n1.應規定出院作業流程及出院摘要之記載內容，包括住院原因及截至出院的診療經過，均予精簡記述。(原1.5.6-符合1)\n2.出院病歷應儘速歸回病歷室並完成病歷寫作，以利病人回診，並有管理機制與統計。(原1.5.6-符合2)\n3.出院摘要有 90%於出院日翌日起算 7 日(工作日)內完成，紙本病歷並歸回病歷室。(原1.5.6-符合3修)\n優良項目：\n1.電子病歷表單開發和執行有助推展整合性照護，落實醫病溝通和跨科共同照護，有具體成效。(試)\n2.出院前病歷能記載居家或下轉機構的連續性照護建議與服務資源，以落實出院病人準備計畫。(試)\n[註]\n1.符合項目 2所提「完成病歷寫作」係指完成所有病歷內容(量之審查內容)並上架歸檔。\n2.中文病歷摘要可參考衛生福利部公告之範本。\n3.優良項目 1、2列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.出院作業流程與出院病歷管理辦法。(符合)\n2.出院摘要複本7日(工作日)內提供達成率。(符合)\n3.個案管理與管理式照護表單和全人照護流程。(優良)","cs":"","p":72,"ch":"1.4"},{"n":"1.4.7","tags":[],"t":"建立疾病與手術檢索系統及相關統計分析","ev":"目的：對出院病人病歷重點資料作成資料庫，採通用標準分類，以利疾病統計分析、成效評估指標蒐集和營運改善應用。\n符合項目：\n1.就出院病人之病歷以病歷號、性別、年齡、診斷、手術、住/出院日期、出院時的治療結果等作為資料庫登記內容。(原1.5.7-符合1)\n2.診斷與手術名應使用當時通用之標準分類系統(如：ICD-10-CM/PCS)予以分類，並可自行訂定必要的索引項目予以檢索。(原 1.5.7-符合2)\n3.定期製作醫院疾病統計資料。(原1.5.7-符合 3)\n優良項目：(下述項目(不含試評項目)須全部達成)\n1.有年度疾病統計資料分析年報。(原1.5.7-優良 1)\n2.疾病分類人員應配合政策，正確使用分類系統和編碼指引，提供完整診斷碼或處置碼，以利醫療技術評估和健康資料分類。(試)\n3.能配合醫院需求製作成效評估指標，依據評估指標蒐集相關之資料，進行統計分析，運用於營運醫療品質改善，並有檢討機制。(原1.5.7-優良3 修)\n[註]\n1.成效評估指標，如：選定某些疾病或手術，統計分析如：死亡率、存活率、感染率(或密度)、併發症發生率、48或72小時再入院率、平均住院日等指標。\n2.優良項目 2列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.醫院疾病統計年報(含疾病與手術分類索引)。(符合)\n2.成效評估指標與檢討機制。(優良)\n3.醫院有建立協助提升疾病診斷、處置編碼正確性之機制。(優良)\n4.跨年度疾病統計資料分析比較與營運成效。(優良)","cs":"評量項目[註] 1 所提「某些疾病或手術」係由醫院依據重要或常見疾病、手術自行訂定指標並評估成效。","p":73,"ch":"1.4"},{"n":"1.4.8","tags":[],"t":"資訊部門配合臨床及行政部門建立完善作業系統，且院內各系統連線作業及院外聯繫系統功能良好","ev":"目的：運用資訊科技管理，整合建立支援病人照護、教育訓練、研究及決策系統，確保病人安全及提升品質。\n符合項目：\n1.依醫院規模，設置資訊管理專責人員或部門，且院內各系統連線作業功能運作適當。(原1.5.8-符合1)\n2.應讓適當的臨床及管理人員參與選擇、整合及使用資訊科技管理措施。(原 1.5.8-符合2)\n3.醫院應以即時的資訊支援病人照護、教育訓練及管理。(原 1.5.8-符合3)\n優良項目：(下述項目僅限一項未達成)\n1.使用部門及資訊管理部門專責人員溝通聯繫適當(如：需求單處理流程、處理時效、需求部門滿意度調查等)。(原 1.5.8-優良1)\n2.與院外其他機構(如：特約醫療機構、藥局、院外醫療站等)聯繫系統功能適當。(原1.5.8-優良2)\n3.醫院應以資訊支援研究。(原1.5.8-優良3)\n4.設有資訊安全管理委員會或相關組織，負責資訊安全工作推動及追蹤，並由現任副院長以上層級人員擔任資通安全長，訂有資訊安全管理計畫且召開跨部門之管理會議，能針對資安列管設備(含醫療儀器及其他支援設施)、臨床與行政決策系統進行討論，落實資訊安全以確保病人安全及提升醫療品質。(原1.5.8-優良4修)\n評量方法及建議佐證資料：\n1.資訊部門組織章程。(符合)\n2.醫療資訊系統架構圖。(符合)\n3.資訊安全管理委員會或相關組織之章程與會議紀錄。(符合)\n4.資訊需求單處理流程與管控規範。(優良)\n5.資訊管理滿意度調查。(優良)\n6.決策支援系統。(優良)\n7.資訊安全管理年度計畫。(優良)","cs":"","p":74,"ch":"1.4"},{"n":"1.4.9","tags":[],"t":"具備資訊管理作業規範，以確保資訊安全及維護病人隱私，並訂有緊急應變處理機制","ev":"目的：建立資訊安全管理機制，系統當機緊急應變標準和風險管理計畫，確保病人隱私和資訊安全。\n符合項目：\n1.依「資通安全管理法」，資通系統應有資訊系統使用權限設定及防止資料外洩之資訊管理相關作業規範，並具備資訊安全管理機制(如：資訊需求申請程序書、資訊系統密碼管理辦法、程式撰寫文件管理辦法、資訊系統備份作業程序書、資訊安全稽核作業程序書、網路頻寬使用管理辦法、網際網路使用規範、網路信箱管理辦法等)。(原1.5.9-符合 1修)\n2.系統應界定使用者權限，並能禁止非相關人員進入系統存取資料，以確實保障病人個人隱私。(原1.5.9-符合2)\n3.資訊設備機房應訂有門禁管制及防火設施。(原1.5.9-符合3)\n4.設有資料正確性之檢查機制，並檢討改善資料之正確性。(原 1.5.9-符合4)\n5.訂有資訊系統故障(當機)、資通安全事件及個資事件緊急應變標準作業規範。(原1.5.9-符合 5修)\n6.訂有資通安全維護計畫並有加入衛生福利部資安資訊分享與分析中心(H-ISAC)會員，並適時進行情資分享，提升其資通安全維護能量，調整資通安全應變機制，預防相關資通安全威脅之發生。(試)\n優良項目：(下述項目(不含試評項目)僅限一項未達成)\n1.針對核心資通系統故障緊急應變計畫進行演練，並有故障原因和處理紀錄檢討改善。(原1.5.9-優良1修)\n2.具有備份設施與病人資料異地備份之功能，且每日追蹤處理情形。(原1.5.9-優良2)\n3.訂有資訊系統風險管理計畫，且主動積極進行風險分析、監測及管理，並落實執行，可被廣泛應用。(原1.5.9-優良3)\n4.核心資通系統導入資訊安全管理系統標準(如：ISO27001、CNS27001或其他具有同等或以上效果之管理系統或標準)及公正第三方檢驗，並持續維持其驗證有效性。(試)\n[註]本條用詞定義如下：\n1.符合項目 4「檢查機制」係指資訊部門運用電腦輔助程式並與使用部門共同查核方式，以驗證資料之正確性。\n2.符合項目5「資通安全事件」係指系統、服務或網路狀態經鑑別而顯示可能有違反資通安全政策或保護措施失效之狀態發生，影響資通系統機能運作，構成資通安全政策之威脅。\n3.符合項目 5「個資事件」係指個人資料被竊取、竄改、毀損、滅失、洩漏或其他致個資當事人權益受侵害之事故。\n4.符合項目 6 及優良項目 4 列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.訂有資訊管理相關作業規範。(符合)\n2.使用權限申請單與各職級權限一覽表。(符合)\n3.資訊設備機房門禁管制與消防設備規範及進出紀錄。(符合)\n4.醫院資訊系統故障(當機)、資通安全事件及個資事件緊急應變標準作業規範與程序。(符合)\n5.資通安全維護計畫及實施情形文件紀錄。(符合)\n6.電腦系統故障演練紀錄與資訊安全事故報告單、資通安全事件通報單與處理紀錄(或演練通報檢討紀錄)。(優良)\n7.備份設施與病人資料異地備份規範。(優良)\n8.醫院電腦系統風險管理計畫，和風險分析與監測管理。(優良)\n9.通過 ISO27001、CNS27001 或其他具有同等或以上效果之管理系統或標準之證明文件。(優良)","cs":"","p":76,"ch":"1.4"},{"n":"1.5.1","tags":[],"t":"提供醫院交通資訊，並有安全的交通規劃","ev":"目的：病人就診時能提供交通及停車等相關服務資訊，方便病人到達醫院。\n符合項目：\n1.提供醫院周邊交通資訊。(原1.6.1-符合1)\n2.提供汽車、機車之停車相關資訊。(原1.6.1-符合2)\n3.院內公共空間有安全的交通規劃，含車輛與行人交通路線、停車空間、路面平整等。(原1.6.1-符合3)\n4.提供叫車資訊及適宜之候車場所，並視病人需求協助上下車。(原1.6.1-符合 4)\n優良項目：\n1.建立安全有效機制，確保病人上下車安全，及避免造成車流壅塞。(試)\n2.有提供孕婦及育有六歲以下兒童之專用停車位。(試)\n[註]\n1.「提供醫院周邊交通資訊」係指公告於網站或佈告欄，包括：無障礙大眾運輸交通資訊。\n2.「提供叫車資訊及適宜之候車場所」係指設有行動不便者臨停接送區域。\n3.優良項目 1、2列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.醫院周邊交通資訊相關資料。(符合)\n2.病人在未到院前與到院後可取得之汽車、機車之停車相關資訊。(符合)\n3.依「孕婦及育有六歲以下兒童者停車位設置管理辦法」設置專用車位。(優良)","cs":"","p":80,"ch":"1.5"},{"n":"1.5.2","tags":[],"t":"醫院應設置無障礙設施，並符合法令規定","ev":"目的：依相關建築法令規定，設置無障礙設施並定期檢查設施之功能，確保就醫民眾及身障失能者就醫權利與安全。\n符合項目：\n1.醫院應依相關建築法令規定，設置無障礙設施，如：醫院建築物之室外通路、連接院外通路、避難層坡道及扶手、避難層出入口、室內出入口、室內通路走廊、樓梯、昇降設備、廁所盥洗室、浴室、停車空間等。(原1.6.2-符合1)\n2.設置無障礙設施之處所，應有明顯標示。(原1.6.2-符合2)\n3.定期檢查院內無障礙設施之功能。(原1.6.2-符合3)\n4.於負壓隔離病室設有無障礙設施，以保障身心障礙者及高齡長者安全(試)。\n優良項目：(下述項目僅限一項未達成)\n1.設有專責人員負責管理院內無障礙設施，依檢查結果確實維護，確保其功能正常與安全。(原1.6.2-優良1)\n2.門診應提供身心障礙者及高齡長者友善就醫環境。營造上述特殊需求者之親善就醫環境，並提供適當醫療服務之空間與相關設施，有具體事證且可做為其他醫院之楷模。(原1.6.2-優良2修)\n3.訂有親子使用廁所或行動不便廁所兼具親子廁所之功能。(原 1.6.2-優良3)\n[註]\n1.依據醫療機構設置標準規範，於醫療法公布實施前已設立之醫療機構，其當時已使用之建築物得免受相關標準規定之限制。\n2.有關無障礙設施或行動不便者使用之設施之設置規範，可參閱「建築技術規則建築設計施工編」第十章(第167、170條)及「建築物無障礙設施設計規範」。另，建築技術規則建築設計施工編第 170條所定公共建築物且於本規則 97 年 7 月 1 日修正施行前取得建造執照而未符合其規定應改善者，即適用 101年5 月25日發布之「既有公共建築物無障礙設施替代改善計畫作業程序及認定原則」，其改善項目之優先次序，由當地主管建築機關定之。\n3.「高齡長者」由醫院依據管理需要自行定義。\n4.符合項目 4列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.醫院無障礙設施清單。(符合)\n2.無障礙設施定期維護紀錄。(符合)\n3.身心障礙者及高齡長者友善就醫環境之標準作業流程及其具體成效。(優良)","cs":"1.優良項目 3所提「親子廁所」，原則上父母會帶兒童出現的區域需要設置親子廁所。\n2.應符合相關法規之規定，如：依性別工作平等法第 23條第1項之規定，僱用受僱者 100 人以上之雇主，應提供哺(集)乳室。醫院設有小兒科者應有親子廁所。其他項目依醫院需求設置。","p":81,"ch":"1.5"},{"n":"1.5.3","tags":["合"],"t":"提供安全及安靜的病室環境","ev":"目的：提供病房內之相關安全措施與設施，並定期檢查各項功能，確保病人安全。\n符合項目：\n1.病房內之浴廁具有下列之安全措施：(原1.6.3-符合1)\n(1)病房浴廁有設置急救鈴或緊急呼救系統、防滑設施，並在適當位置裝設扶手。\n(2)病房設有供輪椅者使用之浴廁。\n(3)若有小兒科病房廁所則應提供嬰兒安全座椅。\n(4)若有蹲式廁所應設有扶手，以利病人起身。\n2.設有機制定期檢查急救鈴或緊急呼救系統、扶手及防滑設施之功能。(原1.6.3-符合2)\n3.視需要裝設防止跌落的床欄，且經常檢查床欄之安全性。(原 1.6.3-符合3)\n4.對醫院廣播之內容、音量及時間，訂有限制規範，且能有效管理病房區噪音發生源，如：收音機或電視等音響設備、病室內或走廊大聲談話、夜班護理站之工作人員談話音量。(原1.6.3-符合4)\n[註]\n符合項目 3，「經常」檢查床欄之安全性，是指新病人住院時由護理部門檢查與定期由工務維修部門進行檢查。\n評量方法及建議佐證資料：\n1.維護病室安全之管理辦法。(符合)\n2.與病室安全相關設施(如急救鈴、扶手、床欄、防滑設施等)之定期檢查與維修保養紀錄。(符合)\n3.醫院廣播之內容、音量及時間之限制規範。(符合)","cs":"1.相關設施(如：緊急呼叫系統、座式及蹲式廁所設有扶手等)之設置範圍，主要指病人使用之區域，行政區域得不強制設置。\n2.符合項目 1-(1)，不要求男廁每一個小便斗均需設緊急呼叫系統。因目前有按鈴、拉線等不同「急救鈴之設置型式」，故有設置急救鈴即可。\n3.符合項目 1-(3)，目前醫院每一間小兒科病房廁所均提供嬰兒安全座椅尚有困難，惟至少一間以上有提供嬰兒安全座椅即可。\n4.如果醫院未設置小兒科病房者，則\n符合項目 1-(3)不列入評核。\n5.符合項目 4，評鑑委員於實地評鑑時，僅須確定有訂定相關規範即可。對於室內噪音的標準國家有訂定相關的規範，醫院可參考作為閾值目標。另，對於全院廣播的內容，可訂有相關內容撥放限制，藉此達到降低噪音干擾。","p":82,"ch":"1.5"},{"n":"1.5.4","tags":["重","合"],"t":"訂定安全管理作業規範，提供病人及員工安全的環境","ev":"目的：藉由安全管理作業規範之訂定與落實執行，以保障人身(含兒童)及財物安全，並確保員工與病人安全。\n符合項目：\n1.有專責人員或單位負責醫院安全管理業務，並訂有醫院安全管理作業規範。(原1.6.4-符合 1)\n2.於工作場所、宿舍、值班人員休息場所等處，評估適當位置，設有保全監測設備、巡邏、警民連線或其他安全設施，以保障人身(含兒童)與財物安全。(原1.6.4-符合2修)\n3.對公共場所之安全設施，如：公共區域廁所應設有扶手及緊急求救鈴、標準防護設備、電梯與電扶梯防夾傷(無電扶梯者，可免評)、防止電梯意外墜落設備、受困電梯內之求救設施等，有定期檢查，以確保正常運作。(原1.6.4-符合3修)\n4.實施用電安全管理，如：對使用延長線、耗電用品、電流負荷等予以規範，並有完整定期檢點檢查紀錄可查。(原1.6.4-符合4修)\n5.建置員工工作安全異常事件通報機制，對醫院安全管理相關異常事件，進行檢討，並視需要改善。(原1.6.4-符合 5)\n[註]\n1.符合項目 1所提「醫院安全管理作業規範」，包含陪探病措施及相關標準作業流程，並內化於住院作業如下：\n(1)訂有病房門禁時段，僅限持陪病證之陪病者於病室照顧病人，且陪病證可採實體或電子化方式，進行發放及管理。\n(2)配合病房門禁時段，訂有訪客探視(病)時段與人數控管。\n(3)相關陪探病限制與調整原則及管理配套措施。\n(4)夜間出入口、及出入相關規範。\n2.「內化住院作業」係指將醫院住院陪探病措施納入住院須知及醫院公開宣導資料，並於住院中心或病房報到流程，確實向病人或其家屬進行說明。\n評量方法及建議佐證資料：\n1.醫院安全管理作業規範(含陪探病措施及相關標準作業流程、夜間出入口、門禁時間及出入相關規範、用電安全管理規範)。(符合)\n2.依據安全管理作業規範所進行之查核(如用電安全、消防安全等)、保養與維修紀錄。(符合)\n3.發生異常事件檢討之會議紀錄。(符合)\n4.地方衛生、消防與建管機關對於建築物公共與消防安全之聯合督考結果建議改善資料。(符合)","cs":"1.符合項目 2所提「工作場所」，評鑑委員於實地查證時，至少應查核急診室之工作人員安全。\n2.評鑑委員於實地評鑑時，如欲了解醫院急診單位「警民連線」之設置，以訪談急診單位工作人員之方式進行；請勿啟動警民連線(測試)，以免打擾警察局之實際勤務作業。","p":83,"ch":"1.5"},{"n":"1.5.5","tags":["重"],"t":"醫療機構應採必要措施，以確保醫事人員執行醫療業務時之安全","ev":"目的：訂定防止暴力事件管理作業規範、防範設施、通報機制與人身安全之防護教育訓練，確保執行醫療業務時安全。\n符合項目：\n1.制訂準則辨識可能發生醫院暴力之高風險場所及具有暴力傾向之病人或家屬。(原1.6.5-符合1)\n2.依據辨識結果訂定防止員工受到暴力事件傷害之安全管理作業規範。(原 1.6.5-符合2)\n3.建置醫院暴力事件之通報機制，從第一時間應變到事件後之處理皆完整通報院方。(原1.6.5-符合3修)\n4.針對可能發生暴力事件之高風險場所(如：急診)，加強門禁管制措施、裝設監視器、警民連線或其他安全設施，並妥適規劃醫事人員因應機制。(原1.6.5-符合4 修)\n5.聘用充足警衛或保全人員人力，強化該等人員之應變能力，並確保員工在遭受暴力攻擊時能以無線或有線之方式通知警衛或保全以提供人身安全之防護。(原1.6.5-符合5修)\n優良項目：(下述項目僅限一項未達成)\n1.對於受到傷害(包括實際受傷和目擊受傷)之員工，給予妥善的心理支持、輔導與提供相關之法律求償或其他協助。(原1.6.5-優良1)\n2.定期收集院內或院外之醫院暴力事件，使用適當分析方法，將分析結果進行檢討、納入員工之教育訓練(如提高員工之警覺性)，以防止發生醫院之暴力事件。(原1.6.5-優良2)\n3.落實執行安全管理作業規範。(原1.6.5-優良 3)\n4.每年針對高風險之醫院暴力發生場所進行演練。(原1.6.5-優良4)\n[註]\n1.依據 106 年 5 月 10 日總統華總一義字第 10600056441 號令修正公布醫療法第 24及106條條文。\n(1)第24 條：「醫療機構應保持環境整潔、秩序安寧，不得妨礙公共衛生及安全。為保障就醫安全，任何人不得以強暴、脅迫、恐嚇、公然侮辱或其他非法之方法，妨礙醫療業務之執行。醫療機構應採必要措施，以確保醫事人員執行醫療業務時之安全。違反第二項規定者，警察機關應排除或制止之；如涉及刑事責任者，應移送司法機關偵辦。中央主管機關應建立通報機制，定期公告醫療機構受有第二項情事之內容及最終結果。」\n(2)第106 條：「違反第二十四條第二項規定者，處新臺幣三萬元以上五萬元以下罰鍰。如觸犯刑事責任者，應移送司法機關辦理。毀損醫療機構或其他相類場所內關於保護生命之設備，致生危險於他人之生命、身體或健康者，處三年以下有期徒刑、拘役或新臺幣三十萬元以下罰金。對於醫事人員或緊急醫療救護人員以強暴、脅迫、恐嚇或其他非法之方法，妨害其執行醫療或救護業務者，處三年以下有期徒刑，得併科新臺幣三十萬元以下罰金。犯前項之罪，因而致醫事人員或緊急醫療救護人員於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑。」\n2.可參考勞動部公告之「執行職務遭受不法侵害預防指引」。\n評量方法及建議佐證資料：\n1.醫院可能發生暴力事件之作業場所風險評估結果。(符合)\n2.訂有防止員工受到暴力事件傷害之安全管理作業規範。(符合)\n3.防止暴力之員工之教育訓練資料。(符合)\n4.建置醫院暴力事件之通報程序。(符合)\n5.警衛或保全人員人力排班表。(符合)\n6.對於受到傷害(包括實際受傷和目擊受傷)員工之心理支持、輔導與提供相關之法律求償或其他協助之辦法(若有案例發生應提供實際執行結果)。(優良)\n7.落實執行安全管理作業規範之相關資料。(優良)\n8.每年針對高風險之醫院暴力發生場所進行演練紀錄。(優良)","cs":"","p":84,"ch":"1.5"},{"n":"1.5.6","tags":[],"t":"醫療器材採購及管理能符合醫療照護業務之需要，並確保品質","ev":"目的：訂定醫療器材採購及管理辦法(包括採購時效、驗收、品質管理等)並落實執行，確保醫療品質及病人安全。\n符合項目：\n1.設有專責單位(或委員會)負責醫療器材採購及管理，並定期開會，備有會議紀錄。(原1.6.6-符合1修)\n2.訂有醫療器材之採購、驗收及庫存管理辦法，以符合醫療照護業務之需要，並確保品質。(原1.6.6-符合2修)\n3.醫院應制訂醫療器材不良反應及異常情況之通報(包含退貨與換貨程序及時限)、監測、檢討改善及追蹤機制。(試)\n優良項目：(下述項目須全部達成)\n1.使用適當的庫存管理系統，其管理模式有效提升庫存週轉率與降低庫存成本。(原1.6.6-優良2)\n2.醫療器材採購及管理辦法包括醫材不良品之通報、退貨與換貨程序，且負責採購與使用單位之員工皆知悉相關作業程序。(原 1.6.6-優良3)\n[註]\n符合項目 3列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.負責醫療器材採購及管理之專責單位及人員之證明文件。(符合)\n2.醫療器材管理相關專責單位(或委員會)之組織與會議紀錄。(符合)\n3.醫療器材採購、驗收及庫存管理辦法。(符合)\n4.醫療器材不良反應及異常事件通報紀錄。(符合)\n5.庫存之管理成效證明資料。(優良)\n6.採購部門對於使用部門反應醫療器材不良品之處理結果。(優良)","cs":"","p":87,"ch":"1.5"},{"n":"1.5.7","tags":["重"],"t":"定期執行醫院設施、設備、醫療儀器或相關器材等之維護、檢查、測試、保養或校正作業，並有紀錄可查","ev":"目的：依相關法令規定訂定醫院設施、設備、醫療器材等維護管理規範，定期檢測及檢討改善，確保醫療品質與病人安全，並教育訓練院內員工了解自己在提供有效醫療儀器設備及病人醫療設施上的角色與責任。\n符合項目：\n1.設有專責人員或部門負責管理，確認相關設施、設備、儀器、器材等，能符合醫療機構設置標準及相關法令規定，及業務需求。(原1.6.7-符合 1)\n2.訂有維護規章、操作訓練規範，以及定期檢查、保養或校正計畫，特別是與病人安全相關之重要設施、設備、急救用醫療器材等(如為外包時，應依外包管理相關基準規定辦理)。(原1.6.7-符合2)\n3.確實執行檢查、測試、保養或校正等，並製作紀錄(含執行日期)；並能依據使用效能、維修、保養及校正狀況，訂定監控或評估機制，以適時更新汰換。(原1.6.7-符合3)\n4.保存完整之中文或英文使用說明書或操作手冊，且容易查閱，確實可用。(原1.6.7-符合4)\n5.操作人員皆有完善教育訓練。(原1.6.7-符合 5)\n優良項目：(下述項目(不含試評項目)僅限一項未達成)\n1.訂有故障時之因應規範，如：故障排除步驟及至少夜間、休假日時故障的維修聯絡方式。(原1.6.7-優良1)\n2.記錄故障或失靈等缺失原因，作為日後檢查、保養參考，並設定改善措施及期限。(原1.6.7-優良2)\n3.各項計畫、保養、維修、更新汰換、訓練等確實執行，且能評估檢討成效，依評估結果改善及編列必要經費搭配。(原1.6.7-優良3)\n4.專責人員具有相關專業訓練或證照。(原1.6.7-優良4)\n5.對於高風險儀器應設有相關防錯機制。(試)\n[註]\n1.本條所稱「設施、設備、儀器、器材」，係指非單次使用之耗材，且需藉由定期檢查、保養或校正，以確保其功能者，包括進行檢查或校正作業所使用之醫療器材或試劑，不包括機電、消防、供水、供電、醫用氣體等。\n2.依據衛生福利部 109 年 1 月 15 日總統華總一義字第 10900004021號令公布之醫療器材管理法第 3 條所稱醫療器材，指儀器、器械、用具、物質、軟體、體外診斷試劑及其相關物品，其設計及使用係以藥理、免疫、代謝或化學以外之方法作用於人體，而達成下列主要功能之一者：\n(1)診斷、治療、緩解或直接預防人類疾病。\n(2)調節或改善人體結構及機能。\n(3)調節生育。\n3.符合項目 2 所提「與病人安全相關之重要設施、設備、急救用醫療器材」之範疇可參考評量項目[註]2之規範；另根據衛生福利部公布之「醫療器材分類分級管理辦法」，醫療器材，依其風險程度，分級如下：\n(1)第一等級：低風險性。\n(2)第二等級：中風險性。\n(3)第三等級：高風險性。\n4.醫院可依據實際使用醫療器材之風險等級建立庫存清單與訂定相關之預防性保養、維修計畫與使用人員之教育訓練計畫以確保病人之安全。\n5.醫院可自行訂定高風險儀器設備清單或參考 ECRI(Emergency Care Research Institute)之「Top 10 Health Technology Hazards Executive Brief」、「Medical Device Safety Reports (MDSR)」。\n6.優良項目 5列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.「設施、設備、儀器、器材」之維護規章、操作訓練規範、及定期檢查、保養或校正計畫。(符合)\n2.與病人安全相關之重要高風險設施、設備、急救用醫療器材清單。(符合)\n3.設施、設備、儀器、器材之監控或評估機制。(符合)\n4.設施、設備、儀器、器材之使用說明書或操作手冊。(符合)\n5.操作人員皆有適當教育訓練資料。(符合)\n6.訂有故障時之因應規範(如：故障排除步驟及至少夜間、休假日時故障的維修聯絡方式)。(優良)\n7.故障或失靈等缺失原因之紀錄與能在期限內完成之資料。(優良)\n8.各項計畫、保養、維修、更新汰換、訓練等確實執行與定期檢討成效之紀錄。(優良)\n9.每年編列保養、維修、更新汰換、訓練之經費資料與實際執行之結果。(優良)\n10.專責人員具有相關之專業訓練或證照之證明文件。(優良)\n11.醫院自行訂定之高風險儀器設備清單。(優良)","cs":"1.如果醫療儀器或設備是委外由儀器廠商維護者，評鑑委員於實地評鑑時，係依廠商合約及檢查紀錄內容進行評核。\n2.符合項目 1所提「人員或部門」，係指管理單位，非指使用單位。","p":88,"ch":"1.5"},{"n":"1.5.8","tags":["重"],"t":"定期檢查及維修設備(機電、安全、消防、供水、緊急供電、醫用氣體等)或系統，並有紀錄可查","ev":"目的：訂定基礎設施與設備之維護管理規範，定期檢測及檢討改善並落實執行，確保照護環境安全。\n符合項目：\n1.對於機電、安全、消防、供水、緊急供電等設施訂有定期檢查、稽核及維修計畫，據以執行(如為外包時，應依外包管理相關基準規定辦理)。(原 1.6.8-符合1 修)\n2.設有專責人員或部門管理醫用氣體，訂有定期檢查及保養計畫，並符合「醫療機構醫用氣體管理原則及應注意事項」，且專責人員有參加相關教育訓練。(原1.6.8-符合2)\n3.確實執行檢查、測試、保養等，並製作紀錄(含執行日期)；並能依據使用效能、維修、保養狀況，訂定監控或評估機制，以適時更新汰換。(原 1.6.8-符合3)\n4.專責人員有參加相關教育訓練。(原1.6.8-符合 4)\n5.依「職業安全衛生管理辦法」，視醫院員工人數依法應設置之職業安全衛生委員會，應討論醫用氣體之安全管理相關事項，並有會議紀錄。(原 1.6.8-符合5)\n優良項目：(下述項目(不含試評項目)僅限一項未達成)\n1.能注意管制潛在之感染源，有相關維護紀錄(如：儲水槽之檢驗清淨實施紀錄，獨立之空調設備(如：進迴風管、進/排氣處理)之維護、保養與檢修之紀錄等)。(原1.6.8-優良1修)\n2.訂有設備故障、系統損壞或遭污染時之因應規範，含緊急應變程序、桌上演練與實際演練，以保護院內人員並儘速修復。(原 1.6.8-優良2)\n3.對醫用氣體高壓鋼瓶之常見危害事件及其他可能發生之醫用氣體意外事件之預防與因應，納入員工教育訓練，或定期辦理全院及部門單位演習。(原1.6.8-優良3)\n4.紀錄詳實及定期檢討，視情形採取改善措施，有具體成效。(原1.6.8-優良4)\n5.對可能受影響部門應進行整合性基礎設施故障之緊急應變演練。(試)\n[註]\n1.實地評鑑時，如現場選定測試之設備(如：緊急供電發電機等)，無法立即啟動或故障，則現場給予 10分鐘之修復時間。\n2.整合性緊急應變演練：係在整合性醫院管理的趨勢下，醫院緊急應變演練與準備之文件，應依法令要求，並清查現有緊急應變機制與文件，進行文件整合以及定期演練與檢討修訂。以醫院基礎設施，如：緊急發電機、氣體鋼瓶病人維生設施設備等的潛在風險與緊急應變，並不一定是單獨發生的事件，尤其一旦與天然災害，如地震、火災、風災等緊急事件等複合性發生時，醫院應預應式思考，建立事權統一的組織架構，維持適當的演練程序，尤其注意整合性的人員與物資動員、事故現場的指揮聯繫、病人與員工的緊急疏散與集結、醫療照護的持續完整性、與事後的檢討改善。\n3.優良項目 5列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.定期檢查及維修與保養計畫與落實執行之紀錄(含執行日期)；如為外包時，應附外包管理相關基準規定。(符合)\n2.負責定期檢查及維修設備(機電、安全、消防、供水、緊急供電、醫用氣體等)或系統專責人員之資格與教育訓練資料。(符合)\n3.依據「醫療機構醫用氣體管理原則及應注意事項」執行定期檢查及保養計畫之紀錄。(符合)\n4.醫療氣體安全管理規則。(符合)\n5.依據使用效能、維修、保養狀況之監控與評估機制適時執行更新汰換之資料。(符合)\n6.職業安全衛生委員會討論醫用氣體之安全管理相關事項之會議紀錄。(符合)\n7.能注意管制潛在之感染源，有相關維護紀錄(如：儲水槽之檢驗清淨實施紀錄，獨立之空調設備(如：進迴風管、進/排氣處理)之維護、保養與檢修之紀錄等)。(優良)\n8.醫院基礎設施(機電、安全、消防、供水、緊急供電、醫用氣體等)故障時之緊急應變程序與演習紀錄。(優良)\n9.對醫用氣體高壓鋼瓶之常見危害事件及其他可能發生之醫用氣體意外事件之預防與因應辦法。(優良)\n10.定期檢討醫院基礎設施(機電、安全、消防、供水、緊急供電、醫用氣體等)之性能與視情形採取改善措施，有具體成效之資料。(優良)\n11.整合性基礎設施故障之緊急應變演練紀錄。(優良)","cs":"1.如果機電、安全、消防、供水、緊急供電、醫用氣體等設備或系統，是委外由廠商維護者，則評鑑委員於實地評鑑時，係依廠商合約及檢查紀錄內容進行評核。\n2.評量項目[註]1所提緊急供電發電機測試，評鑑委員以查核測試紀錄為主，若醫院無法提供測試紀錄，則進行現場實際啟動。\n3.基準及評量項目中有關醫院建築與消防安全等內容，考量醫院設立年代，以及醫療機構設置標準、建築消防相關法規之「不溯既往的原則」，故評鑑委員實地評鑑時，硬體設施應以參閱相關主管機關年度檢查結果為主，實地查核重點則著重於軟體內容(如：人員訓練、疏散、演練等)。","p":91,"ch":"1.5"},{"n":"1.5.9","tags":[],"t":"各部門落實整潔維護，確實施行院內清潔工作，並定期消毒除蟲","ev":"目的：訂定醫院環境、病人寢具清潔消毒工作管理規範與工作計畫並落實執行，確保照護環境舒適與安全。\n符合項目：\n1.有專責人員或單位負責清潔管理，依據所訂醫院清潔(含消毒除蟲)工作計畫，督導工作人員，確實執行清潔工作。清潔工作如為外包時，應依外包管理相關基準規定辦理。(原1.6.9-符合1)\n2.醫院應經常保持整潔，如：對各類張貼物或公告應有管制，並定期實施整潔維護稽查工作。(原1.6.9-符合2)\n3.各病室或病房護理站之空調設備，可以控制並維持適宜之溫度，且空調可 24小時運作，並適當換氣；空調口應定期清潔。(原1.6.9-符合3)\n4.病床床單、枕頭套、被套或蓋被等寢具，應定期更換、清洗或消毒；但如有髒汙時，應即時更換。床墊應視需要清潔、消毒或汰換。(原1.6.9-符合 4)\n5.病室電話(含公用電話)、床旁桌椅、窗簾、隔簾、百葉窗等，應定期清潔或消毒。(原1.6.9-符合5)\n優良項目：(下述項目僅限一項未達成)\n1.清潔工作計畫詳實，並備有查核表，實施定期或不定期查核，成效良好。(原1.6.9-優良1)\n2.不定期舉辦清潔競賽或相關活動，有促進清潔維護之具體成果。(原1.6.9-優良 2)\n3.定期檢查病室清潔，視需要調查病人對病室清潔之滿意度或建議，依據調查結果進行檢討改善，成效良好。(原1.6.9-優良3)\n[註]\n優良項目 3「定期」檢查病室清潔，是指每月進行檢查。\n評量方法及建議佐證資料：\n1.醫院清潔(含消毒除蟲)工作計畫與稽核是否落實執行之紀錄(清潔工作如為外包時，應附依外包管理相關基準規定執行是否落實合約規範之查核紀錄)。(符合)\n2.維護病室清潔之管理辦法。(符合)\n3.使用清潔工作計畫查核表，實施定期或不定期查核且成效良好之紀錄。(優良)\n4.不定期舉辦清潔競賽或相關活動之成果資料。(優良)\n5.調查病人對病室清潔之滿意度或建議之資料。(優良)\n6.依查核或稽核結果，進行檢討改善之資料。(優良)","cs":"","p":93,"ch":"1.5"},{"n":"1.5.10","tags":[],"t":"膳食安全衛生管理良好","ev":"目的：依相關法令規定訂定膳食處理作業規範及廚房環境整潔、門禁、防火措施等，確保醫院食品衛生及膳食安全。\n符合項目：\n1.醫院設有廚房者，應符合下列項目：(原1.6.10-符合1)\n(1)訂定處理食品(包括準備、處理、儲存及運送)之作業標準或作業程序。\n(2)有關食材儲存及廚房(調理室)內食材搬入、暫存、調理、飯菜盛入等運送路線，均有妥善規劃，以確保安全衛生。\n(3)廚房環境整潔，通風良好，有適當門禁及防火措施(含火災預防與應變之教育訓練)。\n(4)廚房之餐具儲存、食品供應、準備和清洗等區域分開設置合乎衛生。\n(5)生鮮材料或調理過之食品未過期者，應予冷凍或冷藏保存。\n(6)烹
