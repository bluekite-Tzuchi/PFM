調之食品樣品應冷藏保存 48小時，以備查驗。\n(7)病人用膳完畢之餐具能於 2小時內回收。\n(8)工作人員持證照比率符合相關法令規定。\n2.膳食外包者，醫院應：\n(1)確認供應商(食品業者)符合食品衛生相關法令規定，如：危害分析與重要管制點(Hazard Analysis and Critical Control Point, HACCP)。(原1.6.10-符合2-(1)修)\n(2)確認供應商及醫院內食品分送場所及其設施適當、安全衛生。(原1.6.10-符合2-(2)\n優良項目：(下述項目僅限一項未達成)\n1.烹調完成之熟食於配送過程中，應妥善保溫，並控制時間。食品需熱藏(高溫貯存)者，應依食品良好衛生規範，保持溫度在 60℃以上。(原1.6.10-優良1)\n2.餐具洗淨機之洗淨溫度應設定為 80℃，並持續清洗 2分鐘以上(或可達到相同效果之設定條件)。洗淨後的餐具要烘乾，並確保儲存環境的清潔。另器具及容器需存放於距地面適當高度處，以防止地面上的污水濺濕。(原1.6.10-優良2)\n3.廚餘處理合乎衛生及環保原則。(原1.6.10-優良3)\n4.有專責人員或部門稽核檢查，並有紀錄。(原1.6.10-優良4)\n5.醫院有良好的供膳作業及環境，並通過危害分析與重要管制點(Hazard Analysis and Critical Control Point, HACCP)或ISO22000食品安全管理之認證。(原1.6.10-優良5修)\n[註]\n1.符合項目 1-(8)工作人員持證照比率，依「食品良好衛生規範準則」第25條：經營中式餐飲之餐飲業於本準則發布之日起一年內，其烹調從業人員之中餐烹調技術士證持證比率規定如下：\n(1)觀光旅館之餐廳：百分之八十。\n(2)承攬學校餐飲之餐飲業：百分之七十。\n(3)供應學校餐盒之餐盒業：百分之七十。\n(4)承攬筵席之餐廳：百分之七十。\n(5)外燴飲食業：百分之七十。\n(6)中央廚房式之餐飲業：百分之六十。\n(7)伙食包作業：百分之六十。\n(8)自助餐飲業：百分之五十。\n評量方法及建議佐證資料：\n1.處理食品(包括準備、處理、儲存及運送)之標準作業程序。(符合)\n2.廚房門禁之管制辦法。(符合)\n3.防火措施之檢查與教育訓練紀錄。(符合)\n4.有專責人員或部門稽核檢查之紀錄。(優良)\n5.通過HACCP 或ISO22000認證之證明文件。(優良)","cs":"1.符合項目 1-(7)「病人用膳完畢之餐具能於 2小時內回收」，為防止食用完畢的膳食及餐具可能引起之蚊蟲或異味，食用完畢之膳食及餐具不應留在病室內，仍應符合醫院環境清潔規範。\n2.優良項目 3，實地查證時，查證範圍至醫院做到管理之責即可。\n3.若醫院未設置廚房且未外包，僅提供牛奶及管灌，本條文不得免評，因牛奶及管灌屬提供膳食服務，評鑑委員可依符合項目 2 進行評量，惟僅得評為「符合」。","p":95,"ch":"1.5"},{"n":"1.6.1","tags":[],"t":"提供病人及家屬衛教與醫院服務資訊，並提供病人完整的就醫資訊及一般諮詢","ev":"目的：提供多元管道的就醫資訊及醫療諮詢服務，維護病人就醫的權益。\n符合項目：\n1.對民眾提供就醫資訊，對病人或訪客提供引導服務。身障病人及高齡長者，並有專人提供必要之協助。(原1.7.1-符合1修)\n2.醫院重要出入口(如：大廳、電梯出入口等)有建築配置圖、樓層平面圖，清楚易於瞭解，並有明顯、清楚、雙語之指標標示。(原1.7.1-符合2修)\n3.診間外與病床應標示主治醫師姓名。(原1.7.1-符合4)\n4.提供病床推送或輪椅借用之服務，並有完善之管理制度。(原 1.7.1-符合3、優良4併)\n優良項目：(下述項目僅限一項未達成)\n1.利用醫院網站提供服務區域民眾健康相關資訊；包括衛教宣導及社區活動訊息，並能適時更新。(原1.7.1-優良 1 修)\n2.設有諮詢服務之場所，其位置有明顯之標示；服務項目及聯絡電話於住院須知、相關手冊或網站上登載。醫療諮詢並由具相關背景及專長之專責人員提供服務。(原1.7.1-優良2 修)\n3.有走動式服務人員提供服務，並有排班制度。(原1.7.1-優良3修)\n[註]\n1.「就醫資訊」，如：診療科別、病床資訊、門診時間、主治醫師姓名及其專長或經歷簡介、相關政令宣導、掛號費、膳食費、病房費及各項醫療費用收費標準等資料。\n2.「高齡長者」由醫院依據管理需要自行定義。\n3.可依病人需求提供適切的溝通服務，如：病人慣用語言或外語之翻譯，聽障者手語翻譯、唇語、筆談、同步聽打、寫字板、溝通板，視障者點字資料、18號字體以上之資料。\n評量方法及建議佐證資料：\n1.醫院門診表。(符合)\n2.醫療費用收費標準。(符合)\n3.科室和診間標示的樓層配置圖。(符合)\n4.輪椅管理辦法，清潔、消毒、維修及保養紀錄、借用登記表。(符合)\n5.醫院健康通訊和衛教網站。(優良)\n6.住院須知。(優良)\n7.走動式服務人員排班表。(優良)","cs":"醫療諮詢服務係指病人有社服、心理、醫療之需求時，知道何處詢問即可。","p":98,"ch":"1.6"},{"n":"1.6.2","tags":[],"t":"提供病人就醫之掛號、批價收費及辦理入出院作業等便利服務","ev":"目的：提供完整的就醫作業流程和合理的收費，並公告周知及適當說明。\n符合項目：\n1.設有辦理之專責人員或部門，並具備方便病人就醫之作業流程，如：掛號、就診、檢查(驗)、批價、領藥、住/出院手續等。(原1.7.2-符合1修)\n2.對身障病人及高齡長者，設有友善櫃檯優先提供服務，並有專人提供必要之協助。(試)\n3.在掛號及繳費尖峰時段，能彈性增設櫃檯或多元掛號或繳費方式因應。(原 1.7.2-符合2修)\n4.掛號費收費符合衛生福利部公告之「醫療機構收取掛號費參考範圍」。(原1.7.2-符合3)\n5.向病人收取之費用，提供收費明細；自費服務項目如：病房差額負擔、膳食費等，有適當說明或公告周知。(原1.7.2-符合4修)\n優良項目：(下述項目僅限一項未達成)\n1.醫院所訂定之收費規範，包括下列免收「掛號費」或「病歷調閱費」之情形：(原1.7.2-優良 2)\n(1)病人單純持慢性連續處方箋領藥，且無需調閱病歷者。\n(2)因病人無法於就診當日完成檢查，須安排於他日檢查，於檢查日免收「掛號費」或「病歷調閱費」。\n(3)病人僅為取得檢查(驗)結果，並未看診者。\n2.有提供假日辦理出院服務。(原1.7.2-優良3)\n3.就醫作業流程管理導入智能化設計，能方便病人就醫及提升服務品質及效率，有具體事證者。(原1.7.2-優良4 修)\n[註]\n1.醫療法第 22 條：「醫療機構收取醫療費用，應開給載明收費項目及金額之收據。醫療機構不得違反收費標準，超額或擅立收費項目收費。」\n2.醫療法施行細則第 11 條：「本法第二十二條第一項所定醫療費用之收據，應載明全民健康保險醫療費用申報點數清單所列項目中，申報全民健康保險及自費項目之明細；非屬醫療費用之收費，並應一併載明之。前項申報全民健康保險項目，應區分自行負擔數及全民健康保險申請數。本法第二十二條第二項所稱擅立收費項目收費，指收取未經依本法第二十一條規定核定之費用。」\n3.「高齡長者」由醫院依據管理需要自行定義。\n4.符合項目 2列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.掛號、批價收費和住出院辦理單位組織章程與管理辦法。(符合)\n2.掛號、批價收費和住出院作業流程。(符合/優良)\n3.醫療費用一覽表和收費規定。(符合/優良)\n4.就醫作業流程智能化設計及成效。(優良)","cs":"","p":99,"ch":"1.6"},{"n":"1.6.3","tags":[],"t":"應準時開診，開診醫師請假或請他人代診時，應及早周知","ev":"目的：醫師按門診表準時開診，請假應及早通知，且有合宜的代診制度，維護病人權益。\n符合項目：\n1.醫師應按照門診排班表準時開診。對高齡長者，應協助優先看診、檢查(驗)及領藥。(原1.7.3-符合1修)\n2.開診時間因故遲延時，應隨即向候診病人說明理由。(原1.7.3-符合 2修)\n3.開診醫師停診或請他人代診時，應及早周知或通知病人，備有紀錄。(原1.7.3-符合3修)\n4.訂有醫師停代診及延遲開診相關處理作業規範。(原1.7.3-符合4)\n優良項目：(下述項目僅限一項未達成)\n1.指派專責人員或設有機制稽查各診開診情況，有紀錄可查。(原1.7.3-優良1)\n2.對延遲開診或未依規定辦理停、代診作業者，有具體改善措施，並落實執行。(原1.7.3-優良2)\n3.設有機制供病人查詢看診進度。(原1.7.3-優良 3)\n[註]「高齡長者」由醫院依據管理需要自行定義。\n評量方法及建議佐證資料：\n1.對高齡長者，協助優先看診、檢查(驗)及領藥之具體作法。(符合)\n2.醫師延遲開診作業規範。(符合)\n3.醫師停代診及請假管理辦法。(符合)\n4.門診開診狀況稽核和紀錄。(優良)\n5.預約掛號單提示看診時間與網路即時門診進度查詢。(優良)","cs":"符合項目 3，評鑑委員於實地評鑑時，可查閱醫院是否有相關通知病人之機制。","p":101,"ch":"1.6"},{"n":"1.6.4","tags":[],"t":"有效率地運用病床","ev":"目的：訂有合適的病床利用規範和檢討機制，善用醫療資源。\n符合項目：\n1.訂有住院病床利用規範及病人等候住院病床須知。(原 1.7.4-符合 1修)\n2.應掌握全院各科別的等候住院病人情況，且有定期檢討機制。(原1.7.4-符合 2修)\n優良項目：(下述項目僅限一項未達成)\n1.落實病人住院天數控制。(原1.7.4-優良1)\n2.訂有病人流量管理規範，急診轉住院病人待床時間過長有處理機制，確能改善急診壅塞情形，有具體績效。(原 1.7.4-優良2修)\n3.訂有病人出入院管理辦法或合適機制，鼓勵住院病人於上午出院，非緊急之新入院病人於下午小夜班前住院，以減輕小夜班醫護人力之照護負荷，並有成效評估。(原1.7.4-優良 3 修)\n[註]\n優良項目 3所稱「出入院管理辦法或合適機制」，係指如「今辦明出」提前讓病人知道上午出院時間，或出院病人無法上午離院時(如：等待家屬接送)，有安排等侯空間等因應措施。\n評量方法及建議佐證資料：\n1.住院病床利用規範。(符合)\n2.病人等候住院病床須知。(符合)\n3.各科別平均住院日檢討紀錄。(優良)\n4.病人流量管理規範。(優良)\n5.急診登記觀察床數與實際觀察床數之使用狀況(如急診每班留觀病人數)。(優良)\n6.病人出入院管理辦法。(優良)\n7.急診轉住院比率合理性檢討。(優良)\n8.住院與候床狀況管控表。(優良)","cs":"","p":102,"ch":"1.6"},{"n":"1.6.5","tags":[],"t":"對於病人或家屬的意見、抱怨、申訴設有專責單位或人員處理，並明訂處理流程","ev":"目的：建立多元的病人和家屬意見收集管道，由專人妥善追蹤處理。\n符合項目：\n1.設有專責單位或人員處理病人或家屬的意見、抱怨及申訴案件。(原1.7.5-符合 1)\n2.設立 1 種以上能完整蒐集門、急診及住院病人意見的管道，如：意見箱、專線電話、問卷調查或上網建議等。其收集意見的管道適當，如：意見箱設置於明顯處並定期收取；專線電話有管道讓民眾得知；若為問卷方式其內容應具體適當。(原1.7.5-符合2)\n3.對於病人或家屬的意見、抱怨、申訴有明確的處理流程(包括意見之收集、分析、檢討、改善等步驟)，必要時得由關懷小組協助病人與家屬，確實執行。(原1.7.5-符合3)\n4.員工(含與病人直接接觸之外包人員)及病人知道意見反應管道，員工並知道處理流程。(原1.7.5-符合4)\n優良項目：(下述項目僅限一項未達成)\n1.案件處理流程之管理資訊化，回應時效與內容合宜，並定期檢討。(原1.7.5-優良1修)\n2.員工對意見、申訴、抱怨案件能妥善處理，並視需要報備相關單位及接受處理技巧相關之教育訓練。(原1.7.5-優良2修)\n3.落實執行改善方案，並持續追蹤，成效良好者，能列入標準作業程序。(原 1.7.5-優良3修)\n[註]\n優良項目 1所提「回應時效」，依醫院之規定。\n評量方法及建議佐證資料：\n1.病人或家屬意見、抱怨、申訴處理單位組織章程和教育訓練紀錄。(符合/優良)\n2.病人或家屬意見、抱怨、申訴處理流程與作業流程檢討改善紀錄。(符合/優良)","cs":"優良項目 1 所提「回應時效」係由醫院自行訂定。","p":103,"ch":"1.6"},{"n":"1.6.6","tags":[],"t":"有效管理院內用餐、購物環境","ev":"目的：符合衛生法規，對病人、家屬和訪客購物區等訂定管控措施。\n符合項目：\n1.醫院可視本身主客觀條件，研擬方便病人、家屬或訪客用餐或購物之具體方案，或提供相關資訊。(原1.7.6-符合 1修)\n2.院內之用餐或購物區，除應符合衛生等相關法規外，須就下列事項訂有管理規範，並落實執行且有查核紀錄：(原1.7.6-符合2修)\n(1)醫院員工進入用餐、購物區之管理(如：是否限制穿著隔離衣帽、手術服與手術室拖鞋者之出入等)。\n(2)病人進入用餐、購物區之管理(如：是否限制穿著病人服、推點滴架或有其他輸液或導管者之出入等)。\n(3)用餐、購物區避免病菌污染與傳播之具體作法。\n3.用餐、購物區符合疾病管制署「醫療(事)機構商店街感染控制措施指引」相關規定，訂定內部感染管制規範，確實執行。(原 1.7.6-符合3)\n4.訂有用餐、購物區之緊急災害應變計畫，並有演練及檢討。(原1.7.6-符合4 修)\n優良項目：(下述項目僅限一項未達成)\n1.院內用餐或購物區工作人員接受在職及到職感管教育訓練。(原1.7.6-優良 1修)\n2.參考顧客滿意度調查結果，視情形改善用餐、購物區環境或作業規範。(原 1.7.6-優良2)\n3.定期檢討評估用餐、購物區之管理狀況，並作持續改善；如係外包者則以之作為續約之重要依據。(原1.7.6-優良 3)\n評量方法及建議佐證資料：\n1.醫院針對用餐區、購物區依規定執行查核之紀錄。(符合)\n2.請提供醫院近期接受感染管制查核結果報告。(符合)\n3.醫院病人、家屬或訪客用餐或購物作業管理辦法(含內部感染管制規範)。(符合/優良)\n4.用餐與購物區緊急災害應變計畫與演練紀錄。(符合)\n5.用餐與購物顧客滿意度調查與定期檢討評估紀錄。(優良)","cs":"1.評鑑委員可參考受評醫院近期之感染管制查核結果。\n2.醫院未設用餐、購物區者，則符合項目2~4 不列入評核。\n3.符合項目 2-(1)~(3)事項，若醫院訂有相關管理規範，即符合符合項目2標準。","p":104,"ch":"1.6"},{"n":"1.6.7","tags":[],"t":"定期實行病人就醫經驗調查","ev":"目的：定期實施病人就醫經驗調查並檢討改善，提升服務品質。\n符合項目：\n1.每年至少實施 1 次包括急診、門診、住院病人或家屬的就醫經驗調查。(原 1.7.7-符合1修)\n2.調查的結果整理分析，須改善部分，立即由相關部門辦理，並追蹤改善情形，成效良好。(原1.7.7-符合2修)\n優良項目：(下述項目(不含試評項目)須全部達成)\n1.問卷內容、調查數量及抽樣方法合宜，結果具代表性。(原 1.7.7-優良1修)\n2.改善成果適時公開回應民眾，展現醫院追求品質的決心。(試)\n3.使用具實證基礎之方法進行病人就醫經驗調查。(原1.7.7-優良3)\n[註]\n1.優良項目 3，具實證基礎之病人就醫經驗調查方法，有關住院部分可參考：衛生福利部醫療品質政策辦公室之「病人住院經驗調查」問卷使用手冊或國外相關問卷(如：美國聯邦醫療保險和聯邦醫療補助服務中心(Center for medicare and medicaid service, CMS)所要求之HCAHPS (Hospital Consumer Assessment of Healthcare Providers and Services)、英國國家衛生廳健康服務中心(National Health Service, NHS)所採用之 Picker institute的問卷等)。其他門診、急診等部分之調查，醫院得參考住院問卷，自行設計運用。\n2.優良項目 2列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.門診、急診、住院病人就醫經驗問卷調查作業流程。(符合)\n2.病人就醫經驗調查報告書與持續檢討改善紀錄。(符合)\n3.改善成果回應民眾之事證。(優良)\n4.病人就醫經驗調查結果。(優良)","cs":"","p":106,"ch":"1.6"},{"n":"1.7.1","tags":["重"],"t":"指派專責人員負責建立風險管理架構，且依據風險分析結果訂定減災預防與準備措施以確保照護環境之安全","ev":"目的：依據風險管理架構研擬符合醫院危機管理需要之減災預防與準備措施。\n符合項目：\n1.醫院設有專責人員負責建立風險管理架構。(原1.8.1-符合1修)\n2.應用風險分析方法，辨識醫院可能發生的災害類型、發生機率與對醫院之人員生命、財產與持續營運之衝擊。(原1.8.1-優良2修)\n3.依據災害發生機率與衝擊程度進行風險排序(由大至小)，以利於決定須優先執行之減災、預防措施與準備及所需資源分配之優先性。(試)\n4.針對已辨識之災害指定專責人員(或部門)進行監控與追蹤減災預防措施與準備之落實執行程度。(試)\n5.依據減災、預防與準備之執行缺失，辦理相關之教育訓練與宣導。(原1.8.1-符合5修)\n優良項目：(下述項目(不含試評項目)須全部達成)\n1.能依據風險分析結果每年定期檢討減災預防與準備執行之結果，有效降低災害發生機率或衝擊程度，成效良好。(原1.8.1-優良1修)\n2.員工知悉所屬部門與自己在災害之減災、預防與準備應負之責任與需具備之能力。(試)\n[註]\n1.風險管理架構包括下列要素：\n(1)建立風險管理內涵(Context)\n(2)風險辨識\n(3)風險分析\n(4)風險評價\n(5)風險處理\n(6)溝通\n(7)監督與改善\n2.風險管理架構之要素可參考下列資料：\n(1)ISO31000, 2018. Risk management-Guidelines.(https://www.iso.org/obp/ui#iso:std:iso:31000:ed-2:v1:en)\n(2)美國喬治華盛頓大學風險管理專案(The GWU ICDRM project, 2010, p1-156~176.)\n(3)ISQua, Guideline and Principles for the Development of Health and Social Care Standards, 5th Edition Version 1.0, September 2018.\n3.符合項目 2所提「風險分析方法」，至少應包括下列兩項參數，災害發生機率(Frequency)與衝擊程度(Impact)，常用之風險分析方法如：災害脆弱度分析(Hazard Vulnerability Analysis, HVA)、醫療失效模式與效應分析 (Healthcare Failure Mode and Effect Analysis, HFMEA)與營運衝擊分析(Business Impact Analysis, BIA)等。因 HVA 之評估需增加醫院減災與持續運作能力(準備措施, preparedness)之分析，故可適用於所有災害。\n4.符合項目 3、4及優良項目2列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.醫院風險管理架構之資料。(符合)\n2.醫院風險分析之結果。(符合)\n3.前5 項高風險災害之減災、預防與準備措施與執行結果。(符合)\n4.減災、預防與準備之相關宣導與員工訓練資料。(符合)\n5.減災、預防與準備之執行成效。(優良)\n6.針對發生之災害事件能進行原因分析，確實檢討改善之紀錄。(優良)","cs":"","p":108,"ch":"1.7"},{"n":"1.7.2","tags":["重"],"t":"醫院應指定專責人員研擬火災之減災、預防與準備措施","ev":"目的：建立醫院之火災發生前之預應式管理機制，加強火災之減災、預防與準備措施以確保醫院之防火安全。\n符合項目：\n1.醫院設有防火管理人，定期分析與檢討火災災害之減災、預防與準備措施之執行結果。\n2.能依據醫院之特性(如建築物之耐震能力、防火能力、樓層高度、房門寬度、防火區劃大小、煙控能力、各單位收治病人行動力特性及搭配之避難策略等)研擬火災災害之減災、預防與準備措施。\n3.醫院對於住院病人或家屬自帶電器應訂有管理辦法，並將應遵循之用電安全事項列入住院須知中，於病人入院時充分告知病人與其家屬。\n4.對於易燃物品之儲存與標示，應符合消防與職業安全衛生相關法令規範。\n5.落實執行火災之日常減災、預防與準備相關措施，包括各項宣導與員工面臨火災發生時之教育訓練。\n優良項目：(下述項目僅限一項未達成)\n1.每年定期檢討火災災害之減災、預防與準備措施之執行結果，針對所發現之缺失有具體之改善成效。\n2.針對曾發生火災之事件能進行原因分析，並研擬減災、預防與準備措施，以降低火災再發生之機率(註：若近三年內未發生火災本項免評)。\n3.病人不易疏散且宜採取就地避難之診療部門(如手術室、加護病房、呼吸照護病房等)具有適當之防火區劃及病人持續性照護之備援計畫。\n4.能依診療環境、建築、病人及第一線應變人員特性，規劃符合所需之減災、預防與準備措施。\n[註]\n1.火災之減災、預防與準備措施須包括下列項目：防止起火、火與煙之早期偵測、消防警報即時發佈功能、自動滅火設施功能、消防安全設施所需電力由緊急供電系統供應、防止火、煙與有毒氣體之擴散設施、緊急逃生動線規劃、防火安全門在火災發生時能自動關閉、緊急出入口警示、用電安全管理、醫療氣體安全管理、易燃物安全管理、防止縱火等。\n2.針對手術室、加護病房消防安全，應有防火區劃完整性等相關資料(參考地方衛生、消防與建管機關對於建築物公共與消防安全之聯合督考資料)。\n3.員工對於火災發生時之教育訓練內容須能依符合項目 2(醫院之特性)與優良項目 4(診療環境、建築、病人及第一線應變人員特性)設計相關之教育訓練課程，包括火災發生時之初期應變作為(如RACE)、起火部門之火災救災演練與院層級之火災救災演練等。RACE 之內容如下：\n(1) R (Rescue/Remove)：救護/將病人移出危險區域\n(2) A (Alert/Alarm)：警示/啟動警報(通知)\n(3) C (Confine/Close)：侷限火與煙之擴散/關閉起火房間之房門\n(4) E (Extinguish/Evacuate)：滅火/與疏散病人\n4.可參考衛生福利部於 108 年 3 月 8 日公告之「醫院住院病人使用自帶電器管理指引」及「醫療機構電器設備儀器管理指引」。\n評量方法及建議佐證資料：\n1.醫院火災災害之減災、預防與準備措施。(符合)\n2.醫院對於住院病人或家屬自帶電器之管理辦法。(符合)\n3.易燃物品之標示與儲存管理辦法。(符合)\n4.火災之減災、預防與準備措施之教育訓練相關資料。(符合)\n5.每年定期檢討火災災害之減災、預防與準備措施之執行成效。(優良)\n6.針對曾發生火災之事件進行原因分析，並研擬減災、預防與準備措施之資料(註：若未發生火災本項不需提供)。(優良)","cs":"","p":110,"ch":"1.7"},{"n":"1.7.3","tags":[],"t":"建立醫療事故預防及爭議處理機制，確保醫病間之信賴與和諧關係，且對涉及醫療爭議員工有支持及關懷措施","ev":"目的：建立醫院之醫療事故預防及爭議處理機制，且對於涉及醫療爭議之員工有支持及關懷措施等。\n符合項目：\n1.醫療機構應設醫療事故關懷小組。(原1.8.4-符合1修)\n2.建立醫療事故預防及爭議處理機制與相關之處理程序。(原 1.8.4-符合2修)\n3.能於醫療事故發生後 5 日(工作日)內與病人方說明或溝通，亦應對於醫療事故有關之所屬醫事人員，提供關懷與協助。(試)\n4.醫療事故爭議發生時，醫療機構，能應病人方之要求提供病歷等相關資料複製本。(試)\n5.能針對醫療爭議進行檢討，並製成教材提供員工教育訓練。(原1.8.4-符合4 修)\n優良項目：(下述項目(不含試評項目)須全部達成)\n1.落實執行醫療爭議處理機制，成效良好。(試)\n2.醫療機構應建立機構內風險事件管控機制，並就重大醫療事故，分析其根本原因、提出改善方案，成效良好。(試)\n3.對於醫療爭議賠償、補償、和解或慰問金等，訂有適當之補助或互助辦法，且提供醫療爭議員工支持與關懷服務，執行成效良好。(原1.8.4-符合 6修)\n[註]\n1.可參考衛生福利部公告之「醫療事故預防及爭議處理法」。\n2.符合項目 3、4 及優良項目 1、2 列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.醫療事故預防及爭議處理團隊名冊(含職務)。(符合)\n2.醫療事故預防及爭議處理機制與相關之處理程序。(符合)\n3.醫療爭議發生後與病人、家屬或其代理人之溝通內容。(符合)\n4.員工到職及定期在職訓練中關於醫療爭議預防措施之教材與相關教育訓練資料。(符合)\n5.落實執行醫療爭議處理機制之資料。(優良)\n6.醫療爭議適當之補助或互助辦法。(優良)\n7.對於醫療爭議員工之支持與關懷服務紀錄。(優良)","cs":"符合項目 5所提「教材」，泛指本院或他院的案例均可。","p":112,"ch":"1.7"},{"n":"1.8.1","tags":["重"],"t":"建立醫院緊急應變管理機制，且依據危機應變需要儲備或即時取得災害所需之醫療用品、通訊器材及其他資源，並有檢討改善機制","ev":"目的：建立醫院緊急應變管理機制，擬定緊急管理計畫以提升災害發生時之緊急應變能力，確保醫院安全。\n符合項目：\n1.醫院設有緊急應變管理專責單位(委員會)及專責人員，並能指派專責人員於災害事件發生時，收集與記錄災害事件發生之過程並保存相關文件，以利檢討。(原1.8.1-符合1修)\n2.訂有緊急管理計畫，包括減災與預防、準備、應變、復原等。(原1.8.1-符合2 修)\n3.對突發危機事件有健全之全災害緊急應變管理系統與相關應變組織之規劃。(原1.8.1-符合 3修)\n4.緊急管理計畫中應包括藥品、醫療器材、緊急通訊器材、防護裝備及其他資源之後勤補給，能確實掌握資源調度，並能確保 3 天以上之安全存量。(原1.8.1-符合4修)\n優良項目：(下述項目僅限一項未達成)\n1.每年定期檢討醫院緊急管理計畫之執行成效。(原1.8.1-優良1修)\n2.針對已發生之災害事件能進行原因分析，並研擬改善措施，確實檢討改善，成效良好(註：若近三年未發生災害事件，本項免評)。(原1.8.1-優良 4修)\n3.與其他醫療機構或供應商間訂有相互支援藥品、醫療器材及其他資源的協定。(原1.8.1-優良5)\n[註]\n1.依醫療法第 25條第2項規定訂定之「醫院緊急災害應變措施及檢查辦法」之第 3條與第4條規定：\n(1)第3 條：「醫院應訂定緊急災害應變措施計畫。其內容應包括因應災害之預防、準備、應變與復原各階段之應變體系、應變組織與工作職責。前項緊急災害應變措施計畫，醫院應於每一年度開始前送直轄市、縣(市)主管機關備查。」\n(2)第4 條：「為因應緊急災害事件，醫院應設置緊急災害應變組織與指揮架構，並依實際需要分設各組，執行下列事項：\nI. 指揮中心：整體緊急災害應變工作之決策、各應變組織部門之協調、考核與訊息之發布等。II. 參謀分析：擬定緊急災害應變策略與方案、災害狀況分析研判、人力調度與資料蒐集等。III. 醫療作業：對於病人持續提供醫療照護及災害傷患之急救等。IV. 財務及行政：採購、出納、人事管理及財務分析等。\nV. 後勤及災害控制：物資之募集與調度、器材之搬運與供應及設施與環境維護等。」\n2.符合項目所提「緊急管理計畫(Emergency Management Program, EMP)」等同於「醫院緊急災害應變措施及檢查辦法」第三條所指之「緊急災害應變措施計畫」。其內容應包括因應災害之預防、準備、應變與復原各階段之應變體系、應變組織與工作職責。\n3.緊急管理相關委員會之成員能包括與緊急應變計畫需執行之六大功能(溝通、資源與資產之取得與管理、安全與保全、員工任務指派、基礎設施營運與維護、臨床服務與相關支援功能)有關之部門代表，以確保各項減災與預防、準備、緊急應變與復原之措施符合緊急應變管理之需求。\n4.全災害緊急應變管理系統(All-hazard Incident Management System)是指醫院之緊急災害應變管理系統可依不同災害之應變需求組成符合災害特性之應變團隊(All-Hazards Incident Management Team)與整合救災所需之資源，互相協調合作，達成減災與滅災之目標。\n5.考量緊急管理計畫中之減災、預防與準備已於條文 1.7.1之風險管理中納入，故本條文之重點為評核減災與預防、準備、應變、復原等四階段之整合管理與應變執行成效(如：評估在準備階段所研擬之緊急應變計畫與演習是否符合災害發生時之緊急應變需求)。\n6.符合項目 4所提「防護裝備」，依據衛生福利部105年4月1日修訂「防疫物資及資源建置實施辦法」第 6條之規定。\n評量方法及建議佐證資料：\n1.醫院緊急應變管理相關委員會之組織與會議紀錄。(符合)\n2.緊急管理計畫。(符合)\n3.醫院之緊急災害應變組織與各項緊急應變職務之任務說明。(符合)\n4.緊急管理計畫中關於藥品、醫療器材、緊急通訊器材、防護裝備及其他資源之後勤補給清單與安全存量之資料。(符合)\n5.每年定期檢討醫院緊急管理計畫之執行成效紀錄。(優良)\n6.針對已發生之災害事件能進行原因分析，確實檢討改善之紀錄。(優良)\n7.與其他醫療機構或供應商間訂有相互支援藥品、醫療器材及其他資源的協定。(優良)","cs":"1.符合項目 4：\n(1)藥品、衛材、器材的項目，係由醫院依主管機關規定或依據醫院緊急災難應變計畫之需要自行認定。\n(2)「其他資源」係指醫院孤立時所必要的生活及醫療用品，如：飲用水、發電機柴油等。其中醫院應考量消防安全，合宜的規劃發電機柴油之備載量、存放方式，且針對柴油備載耗盡前，設有支援機制或方式(如：鄰近加油站、工廠、交通運輸站等)，以因應發生緊急災難時能即時取得燃油，維持院內電力供給。另，儲水應確保安全供應量，可參考衛生福利部公布之「醫院之旱災、停水、水短缺緊急應變指引」，建議醫院緊急狀況供水量為 72 小時，每日每床 300公升來計算；醫院應確認資源被耗用的速度，以佔床率評估資源需求量，並依各床特性提供資源，前述規範可由醫院自行訂定。\n2.優良項目 3「與其他醫療機構或供應商間訂有相互支援藥品、醫療器材及其他資源的協定」泛指有合約即可。","p":114,"ch":"1.8"},{"n":"1.8.2","tags":["重"],"t":"訂定符合醫院風險/危機管理需要之緊急災害應變計畫及作業程序，並落實演練","ev":"目的：確保緊急災害應變計畫與作業程序符合醫院之災害特性(如火災、風災、水災、地震、疫災等)，落實演練與持續之檢討改善，降低災害對醫院在生命、財產與持續營運等衝擊。\n符合項目：\n1.依據緊急管理計畫及醫院緊急災害應變措施及檢查辦法，對於火災、風災、水災、地震、疫災等緊急災害，訂有符合醫院與災害特性之緊急災害應變計畫與作業程序。(原1.8.2-符合 1修)\n2.完備之緊急聯絡網及災害應變啟動機制。(原1.8.2-符合2)\n3.具有適當的人力調度及緊急召回機制。(原 1.8.2-符合3)\n4.醫院緊急疏散圖示應明顯適當，全體員工能知悉緊急災害應變計畫，每年至少參加一次演練，明瞭應變措施、各單位病人疏散運送之順序與方法、及逃生設備使用。(原1.8.2-符合 4、5、6併)\n5.醫院應每年實施緊急災害應變演練 2 次，包括實兵演習一次及桌上模擬演練一次，並有演練之過程及檢討紀錄(含照片)。(原1.8.2-符合7)\n優良項目：(下述項目僅限一項未達成)\n1.定期檢討或修正相關計畫及作業程序，至少每年一次。(原 1.8.2-優良1修)\n2.依據演練之檢討結果，修正緊急災害應變計畫與作業程序，以符合實際需要。(原1.8.2-優良2)\n3.於實地訪查時，緊急應變相關措施與員工之認知，確實符合醫院緊急災害應變計畫的規定。(原1.8.2-優良3)\n[註]\n1.針對手術室、加護病房消防安全，可參考下列查核項目：\n(1)滅火器之設置應考量是否容易取得，兩具滅火器之距離不得低於法規之規定(步行距離每20公尺設置一具)，且有具體措施加強該單位內全體同仁操作滅火器與室內消防之熟練度，以及滅火失敗時需將起火地點門關閉之觀念。\n(2)醫院緊急災害應變措施及檢查辦法第 11 條規定：「醫院每年至少應舉行緊急災害應變措施演習及桌上模擬演練各一次，並製作成演習紀錄、演習自評表及檢討改善計畫，送直轄市、縣(市)主管機關備查。前項演習及桌上模擬演練之主題、時間與相關內容，應於醫院緊急災害應變措施計畫中載明。」\n(3)消防法施行細則第15條第1項第5款規定：「滅火、通報及避難訓練之實施；每半年至少應舉辦一次，每次不得少於四小時，並應事先通報當地消防機關。」\n2.符合項目 1 所提「緊急災害應變計畫」(Emergency Operation Plan, EOP)，係針對災害發生時之應變與復原階段初期之應變作為。\n3.緊急災害應變計畫應整合緊急應變指揮系統(如：HICS)，並依據災害衝擊大小與應變期間(Operation Period)長短決定緊急事故應變團隊(Incident Management Team, IMT)之動員規模、任務與目標。緊急災害應變計畫須包含事故存續週期(Life Cycle Stages of an Incident)各階段(災害確認、通知/啟動、動員、應變、歸建與復原)之緊急應變作業程序。\n評量方法及建議佐證資料：\n1.緊急災害應變計畫及作業程序。(符合)\n2.緊急聯絡網之名單與電話。(符合)\n3.具有適當的人力調度及緊急召回之演練紀錄。(符合)\n4.各單位病人疏散運送之順序與方法。(符合)\n5.依據演練之檢討結果，定期修訂急災害應變措施計畫之相關文件紀錄。(優良)\n6.緊急災害應變演練之過程及檢討紀錄(含照片)。(符合/優良)","cs":"1.距離核電廠 30 公里內之醫院(與台電有合約之醫院)或衛生福利部指定核災急救責任醫院，危機管理計畫應包含核災。\n2.評量項目[註]1-(1)有關手術室(開刀房)防火設備類型，依據醫療機構設置標準規定：「手術室、產房除設置ABC 乾粉滅火器外、應備有適量小型手持 CO2 滅火器」，醫院可就該規定及現況需求進行配置。\n3.評鑑委員於實地評鑑時，可查閱醫院演習紀錄及地方消防主管機關之查核紀錄。\n4.考量目前國際醫院評鑑趨勢傾向不採用「實地演練」，今年度「現場測試」，應以「口頭抽問」及「桌上模擬演練」(desktop exercise)為原則，以避免打擾醫院臨床業務。","p":117,"ch":"1.8"},{"n":"1.8.3","tags":["重"],"t":"設置大量傷患緊急應變組織與健全指揮系統","ev":"目的：訂定大量傷患緊急應變計畫，定期落實演練與後續之檢討改善，確保傷患安全。\n符合項目：\n1.大量傷患發生時的應變啟動機制、指揮體系、院內外聯絡網及到院前病人處理接軌等步驟已規範完備。(原1.8.3-符合1)\n2.定期辦理大量傷患緊急應變之演練。(原1.8.3-符合2)\n優良項目：(下述項目僅限一項未達成)\n1.依據大量傷患緊急應變演練之檢討結果，修正醫院大量傷患緊急應變計畫。(原1.8.3-優良 1)\n2.能與地方政府或相關團體共同辦理大量傷患處理之訓練。(原 1.8.3-優良2)\n3.指揮體系健全，並能配合醫院服務區域之需要。(原1.8.3-優良3)\n[註]\n1.醫院緊急災害應變措施及檢查辦法第 11 條規定：「醫院每年至少應舉行緊急災害應變措施演習及桌上模擬演練各一次，並製作成演習紀錄、演習自評表及檢討改善計畫，送直轄市、縣(市)主管機關備查。前項演習及桌上模擬演練之主題、時間與相關內容，應於醫院緊急災害應變措施計畫中載明。」\n2.符合項目 1 所提「大量傷患」，包括院內發生災害(如火災)與院外發生災害所產生之大量傷患(如車禍、地震)等。\n評量方法及建議佐證資料：\n1.大量傷患緊急應變計畫。(符合)\n2.辦理大量傷患緊急應變演練之證明(含照片)。(符合)\n3.依據大量傷患緊急應變演練之檢討結果，修正醫院大量傷患緊急應變計畫。(優良)\n4.能與地方政府或相關團體共同辦理大量傷患處理之訓練紀錄。(優良)\n5.大量傷患緊急應變組織與各項應變職務。(優良)","cs":"1.依緊急醫療網之責任區域作定義。\n2.考量目前國際醫院評鑑趨勢傾向不採用「實地演練」，今年度「現場測試」，應以「口頭抽問」及「桌上模擬演練」(desktop exercise)為原則，以避免打擾醫院臨床業務。\n3.優良項目 3 所提醫院服務區域係包含緊急醫療網之責任區域。","p":119,"ch":"1.8"},{"n":"1.8.4","tags":["重","合"],"t":"訂定醫院與媒體溝通之規範並落實執行，以維護病人之隱私與權益","ev":"目的：參照相關法令規定，訂定醫院接受媒體採訪等相關規範並落實執行與稽核，維護病人隱私與權益。\n符合項目：\n1.依據「醫療機構接受媒體採訪注意事項」及「醫療機構及醫事人員發布醫學新知或研究報告倫理守則」，訂定醫院接受媒體採訪或與媒體溝通之規範，內容可包括如：(原1.8.5-符合 1)\n(1)接受採訪或執行溝通之作業流程。\n(2)指定醫院對外發言人。\n(3)應維護病人隱私及權益，不妨礙其病情與診療，且不得藉機宣傳醫療業務。\n(4)如需揭露病人身分或個人資料，應先徵得病人同意。\n(5)防止未經授權之員工或未獲得病人同意之院外人士，取得病人之個人資料，或接觸病人或家屬，或擅自對媒體洩露病人的個人資料。\n2.醫院如有透過媒體發布醫學新知或研究報告之情形，應依據「醫療機構及醫事人員發布醫學新知或研究報告倫理守則」，訂定相關規範。(原 1.8.5-符合2)\n3.應有發言人姓名，如發言人有 1人以上，請分別說明授權範圍。(原1.8.5-符合 3)\n4.醫院訂定之相關規範，有落實執行並有稽核。(原1.8.5-符合4)\n[註]\n1.醫療機構接受媒體採訪注意事項，可參閱衛生福利部(原行政院衛生署)90 年 11 月 1 日衛署醫字第 0900071404 號公告(行政院衛生署公報第31 卷6號34頁)或衛生福利部網站。\n2.醫療機構及醫事人員發布醫學新知或研究報告倫理守則，可參閱衛生福利部(原行政院衛生署)90年11 月22日衛署醫字第 0900072518號公告(行政院衛生署公報第 31 卷 7 號 39-40 頁)或衛生福利部網站。\n評量方法及建議佐證資料：\n1.接受媒體採訪或溝通之標準作業程序。(符合)\n2.發言人姓名與授權範圍。(符合)\n3.醫院訂定之相關規範，有落實執行並有稽核之紀錄。(符合)","cs":"","p":120,"ch":"1.8"},{"n":"2.1.1","tags":[],"t":"明訂維護病人權利的政策或規範，並讓病人、家屬及員工瞭解、尊重其權利","ev":"目的：藉由明確的病人權利政策之制訂與告知，讓病人、家屬與醫院互相尊重，營造一個對等、和諧的醫病關係。\n符合項目：\n1.醫院秉持「病人為醫療的主體」的理念，為維護病人及家屬權利，訂有相關政策或規範，並公告週知，包括：具體列明就醫病人的權利內容，對住院病人應參考衛生福利部公告之「醫院住院須知參考範例」制訂住院病人的權利及義務，並納入住院須知，以利向病人或家屬說明。(原2.1.1-符合1)\n2.員工瞭解病人的權利內容，並在工作中落實尊重。(原2.1.1-符合2)\n3.若設有精神科住院病房(不含日間病房)之醫院，對強制住院與強制鑑定之病人的處置，需符合精神衛生法之規定。(原2.1.1-符合3)\n4.醫院有舉辦或外派員工出席病人權利、醫療倫理與醫事法規等教育訓練活動。(原2.1.1-符合4)\n5.有對民眾與醫療人員宣導病人自主權利法，以推廣尊重病人醫療自主、保障病人善終權益和促進醫病關係和諧。(試)\n優良項目：(下述項目僅限一項未達成)\n1.定期稽核各項政策、規範的落實程度，並據以檢討、修訂、改善，並有納入病人或家屬代表的意見。(原2.1.1-優良 1)\n2.能針對病人權利、醫療倫理與醫事法令等臨床案例，進行主題或個案討論會。(原2.1.1-優良2)\n3.能列舉出經研討後應用到醫療照護的實例。(原2.1.1-優良3)\n4.評鑑效期內沒有衛生福利部醫事管理系統登錄之裁罰紀錄。(原2.1.1-優良 4)\n[註]\n1.住院病人的權利內容的制訂，可參考衛生福利部「醫院住院須知參考範例」中之肆、病人權利，最少應包含：1.依照醫事法規，病人於住院期間應享有之權利；2.醫院於醫療前、醫療中對病人或其家屬之說明義務及事項；3.病人之同意權、自我決定權、拒絕權及隱私權之保障事項。\n2.符合項目 5列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.檢視醫院病人權利政策或規範。(符合)\n2.檢視醫院住院須知。(符合)\n3.查閱員工教育訓練活動紀錄。(符合)\n4.「病人自主權利法」推廣活動紀錄。(符合)\n5.查閱政策、規範的檢討紀錄及落實度的稽核結果。(優良)\n6.查閱臨床案例討論會紀錄與訪談主管應用實例。(優良)\n7.檢視評鑑資料有無因倫理相關事項接受裁罰的紀錄。(優良)","cs":"1.醫院應有相關規範，評鑑委員應尊重醫院的做法。\n2.查核重點應在醫院對於有關保護病人權利的落實程度。\n3.查核重點應在醫院對於「善盡保密義務」是否落實執行。\n4.符合項目 2，評鑑委員可針對院內員工以訪談之方式來進行了解。","p":122,"ch":"2.1"},{"n":"2.1.2","tags":[],"t":"應與病人溝通、適當說明病情、處置及治療方式，特別是實施侵入性檢查或治療時，應明訂作業規範並簽署同意書","ev":"目的：透過醫療人員清楚完整的說明解釋，期望病人能瞭解其病情、處置及治療方式，在表達其接受的意願後，行使醫療同意權。\n符合項目：\n1.說明內容應視情形包括下列事項：(原2.1.2-符合1)\n(1)醫療法第 81條規定之事項。\n(2)檢查或治療計畫的概要、預期效果及危險性。\n(3)可能的替代方案或病人可另外徵詢第二種參考意見。\n(4)侵入性檢查或治療之書面說明應包括：說明適應症、實施步驟、檢查或治療前、中、後注意事項及可能併發症等。\n2.說明時應注意下列事項：(原2.1.2-符合2)\n(1)用詞及場所須顧及病人立場、感受及隱私。\n(2)儘量使用病人易於理解的用詞，避免使用過多專業術語。\n(3)輔以適當圖片或書面資料，使病人易於理解。\n(4)依特殊需求者的需求，採用輔助說明方法，如筆談、寫字板、溝通板、人員陪同、聽障者手語翻譯、唇語服務等。(原 2.1.2-符合2-(4)修)\n3.對於重要醫療照護事項的說明，除依法律特別規定者(如醫療法第63條及第 64 條)外，醫院應明訂負責說明者及其紀錄方式。如需對說明過程錄音或錄影，應先徵得醫病雙方之同意。(原2.1.2-符合3)\n4.對於病人不能辨識或理解醫療法第 81條規定之告知者，醫院應明訂確認或選擇接受告知者之流程。(原2.1.2-符合 4)\n5.醫院應依醫療法第 64條規定，訂定院內侵入性檢查或治療項目及簽具同意書之作業規範，並提供書面說明，若遇未成年或無法親自簽具同意書者，應明訂確認或選擇簽具同意書者之流程(此項不適用於無侵入性檢查或治療之醫院)。(原2.1.2-符合 5)\n優良項目：(下述項目僅限一項未達成)\n1.醫療照護團隊依據規範，分工合作參與醫病溝通依規範落實執行，相關紀錄正確、完整。(原2.1.2-優良1修)\n2.定期檢討修訂相關規範及步驟，確實改善。(原2.1.2-優良2)\n3.發展適合多元病人需求的溝通與說明方式，具特色、成效。(原2.1.2-優良3)\n[註]\n1.醫療法第 81條：「醫療機構診治病人時，應向病人或其法定代理人、配偶、親屬或關係人告知其病情、治療方針、處置、用藥、預後情形及可能之不良反應。」\n2.醫療法第 63 條：「醫療機構實施手術，應向病人或其法定代理人、配偶、親屬或關係人說明手術原因、手術成功率或可能發生之併發症及危險，並經其同意，簽具手術同意書及麻醉同意書，始得為之。但情況緊急者，不在此限。前項同意書之簽具，病人為未成年人或無法親自簽具者，得由其法定代理人、配偶、親屬或關係人簽具。第一項手術同意書及麻醉同意書格式，由中央主管機關定之。」\n3.醫療法第 64 條：「醫療機構實施中央主管機關規定之侵入性檢查或治療，應向病人或其法定代理人、配偶、親屬或關係人說明，並經其同意，簽具同意書後，始得為之。但情況緊急者，不在此限。前項同意書之簽具，病人為未成年人或無法親自簽具者，得由其法定代理人、配偶、親屬或關係人簽具。」\n4.有特殊需求的族群，如高齡長者、身心障礙者及新住民等。可依病人需求提供適切的溝通服務，如：病人慣用語言或外語之翻譯，聽障者手語翻譯、唇語、筆談、同步聽打、寫字板、溝通板，視障者點字資料、18號字體以上之資料。\n評量方法及建議佐證資料：\n1.檢視執行侵入性檢查或治療之作業規範、書面說明書與同意書。(符合)\n2.輔助說明的特殊人員與相關教具清單。(符合)\n3.查閱及監測病歷紀錄。(優良)\n4.查閱規範及步驟修訂的紀錄。(優良)\n5.訪談主管有特色具成效的解說方式實例。(優良)","cs":"1.評鑑委員於實地評鑑時，詢問對象宜以照護團隊、病人(家屬)為主。\n2.使用病人可了解的語言及方式使病人理解。\n3.會談空間不一定需是獨立之專用空間，有可維護病人隱私的空間即可(如單人房)。\n4.向病人說明病情及治療方式、特殊治療及處置之說明內容不一定要製作成說明書，亦得以多元的方式進行有效的溝通。\n5.符合項目 1-(3)所提「第二種參考意見」，應為另一醫師之意見，另照會或轉介等亦認計。\n6.符合項目 2-(4)，可檢視醫院是否訂有相關標準作業流程。\n7.符合項目 5，病人或家屬簽署之同意書若有修改，宜比照醫療法第 68條規範，於增刪處簽名或蓋章及註明年、月、日；刪改部分，應以劃線去除，不得塗燬。","p":124,"ch":"2.1"},{"n":"2.1.3","tags":[],"t":"向住院病人或家屬說明住院之必要性及診療計畫，並有措施協助及鼓勵其參與醫療照護之過程及決策","ev":"目的：尊重住院病人知的權利，醫療團隊應提供並說明相關治療資訊，並讓其參與醫療決策討論，維護其醫療自主權。\n符合項目：\n1.應向住院病人說明住院理由、病情及診療計畫，並於病歷中記載。(原2.1.3-符合1)\n2.對接觸病人之工作人員，應教導有關提供病人診療資訊的意義、重要性、態度、方法及相關措施。(原2.1.3-符合 2)\n3.應於適當時機協助病人、家屬取得治療資訊及參與醫療決策討論。(原2.1.3-符合3)\n4.當病人表明欲徵詢第二意見時，應能主動提供會診或轉介，並能迅速提供適當的病歷資料，供被徵詢者參考。(原2.1.3-符合4)\n5.推動病人、家屬積極參與醫病共享決策(Shared Decision Making, SDM)，並建立醫病共識。(原2.1.3-優良1 修)\n優良項目：(下述項目(不含試評項目)須全部達成)\n1.醫院應制定有政策指引，推動病人家屬與醫療人員討論適切的醫療選項，選擇有實證而且真正需要的治療，不要求重覆的檢查，以避免無效醫療、減少醫療傷害與節制醫療浪費，如美國 Choosing Wisely運動的建議。(試)\n2.醫療照護團隊能依規範落實執行，有查核機制，並有紀錄及檢討。(原2.1.3-優良2)\n3.對於病人、家屬參與醫療照護過程及決策，有具體成效。(原 2.1.3-優良3)\n4.落實推動醫病共享決策(SDM)且有成效。(試)\n[註]\n1.優良項目 4 之執行可以參考衛生福利部台灣病人安全資訊網(https://www.patientsafety.mohw.gov.tw/)。\n2.優良項目 1、4列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.查閱病歷紀錄。(符合)\n2.查閱工作人員的教育紀錄。(符合)\n3.訪談病人或家屬。(優良)\n4.訪談主管查核機制及檢視紀錄。(優良)\n5.訪談主管具特色、成效的家屬參與方式實例。(優良)\n6.病人、家屬積極參與醫療之政策及指引。(優良)\n7.醫病共享決策(SDM)推動的成效及實例。(優良)","cs":"符合項目 4所提「第二意見」，應為另一醫師之意見，另照會或轉介等亦認計。","p":126,"ch":"2.1"},{"n":"2.1.4","tags":[],"t":"醫院能對病人、家屬提供有關生命末期醫療抉擇的相關資訊並予以尊重，以維護其權益","ev":"目的：基於尊重個人自主權及醫療倫理規範，讓病人、家屬有機會參與末期醫療決策，達到尊嚴死亡與善終的目的。\n符合項目：\n1.為尊重及維護病人的醫療自主權，針對生命末期的醫療抉擇，醫院有對病人及家屬提供相關的資訊並宣導，如：安寧緩和醫療、不施行心肺復甦術、維生醫療抉擇、器官捐贈、醫療委任代理人等。(原2.1.4-符合 1)\n2.醫院針對醫師、護理及社工人員等，有舉辦或外派有關生命末期醫療抉擇的教育訓練。(原2.1.4-符合2)\n3.工作人員會讀取病人 IC 卡內有關器官捐贈意願及安寧緩和醫療意願之註記資料。(原2.1.4-符合3)\n優良項目：(下述項目(不含試評項目)僅限一項未達成)\n1.為尊重並執行病人生命末期醫療的意願，醫院訂有相關規範或標準作業程序，如：接受安寧緩和醫療、不施行心肺復甦術、不施行維生醫療、器官捐贈、預立醫療委任代理人、撤回預立安寧緩和醫療暨維生醫療抉擇等，落實執行並有紀錄，以維護病人醫療自主權利。(原2.1.4-優良1)\n2.對病人、家屬在面對生命醫療自主抉擇時，醫院有提供相關的諮詢服務，且有紀錄，並能協助後續於健保 IC 卡註記。(原2.1.4-優良2)\n3.推動安寧緩和醫療於非癌症末期病人，卓有成效。(試)\n4.推動預立醫療照護諮商(Advance Care Planning)，醫療團隊與接受諮商的意願人、家屬召開家庭或團隊會議，充分討論與決定生命末期的醫療照護方式。(原2.1.4-優良3修)\n[註]\n1.參考「安寧緩和醫療條例」、「人體器官移植條例」及「生命末期病人臨終照護意願徵詢作業指引」、「病人自主權利法」辦理。\n2.優良項目 3列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.訪談工作人員宣導的方式。(符合)\n2.查閱相關人員教育訓練的紀錄。(符合)\n3.工作人員實地操作讀取 IC 卡註記資料。(符合)\n4.檢視相關規範或標準作業程序及執行紀錄。(優良)\n5.查閱諮詢服務紀錄。(優良)\n6.安寧緩和家庭會議紀錄。(優良)\n7.推動安寧緩和醫療的成效及實例。(優良)\n8.推動預立醫療照護的實例。(優良)","cs":"","p":127,"ch":"2.1"},{"n":"2.1.5","tags":["合"],"t":"病人於門診及住院時之檢查、處置與檢體採集和運送，皆應保障其隱私及權利","ev":"目的：醫療團隊人員在治療與照護過程中，確保病人隱私之保護。\n符合項目：\n1.與病人進行溝通、病情說明、執行觸診診療行為及徵詢病人同意時，均應考量到環境及個人隱私之保護。(原2.1.5-符合1)\n2.病人就診、檢查及處置時，應排除不相關者在場，並於場所中備有布簾、被單、治療巾等，對於較私密部位之檢查，應徵得病人同意，避免過度暴露，並依需要安排合適之醫事人員陪同，協助觀察病人、注意隱私之維護。(原2.1.5-符合2)\n3.於診療過程中呼喚病人時，宜顧慮其權利及尊嚴；候診區就診名單之公布，應尊重病人之意願，以不呈現全名為原則。對實(見)習學生在旁學習，應事先充分告知病人，若為教學醫院其教學門診應有明顯標示。(原2.1.5-符合 3)\n4.住院訂有探病及陪病之規範，床位配置及病室空間有顧及病人性別與隱私；在公開標示病人姓名前，亦有尊重病人或家屬意願的機制，並確實執行。(原2.1.5-符合4)\n5.教學醫院之教學迴診，若有受訓學員在旁學習，應事先告知病人。(原2.1.5-符合5)\n6.病人檢體(尿液、糞便等)之採集和運送，有考量病人之隱私。(原2.1.5-符合6)\n[註]參考衛生福利部104年1月30日衛部醫字第1041660364號公告修正之「醫療機構醫療隱私維護規範」。\n評量方法及建議佐證資料：\n1.實地檢視診間、檢查室與病房的環境及維護隱私的作法。(符合)\n2.查閱探病及陪病的規範。(符合)\n3.檢視公開病人姓名是否與病人意願一致。(符合)\n4.實地檢視檢體之採集和運送過程。(符合)","cs":"1.徵詢「同意」方式不限形式，有可確認病人或家屬「同意」之機制即符合。\n2.評鑑委員於實地評鑑時，可詢問病人或家屬確認其知悉。\n3.符合項目 3，若有實(見)習學生在旁學習的門診應有公告，讓病人及家屬知悉即可。\n4.查核重點應在醫院對於保護病人隱私機制是否落實執行。","p":129,"ch":"2.1"},{"n":"2.2.1","tags":[],"t":"醫院應訂定及推動全院醫療品質及病人安全計畫，並定期檢討改善","ev":"目的：藉由系統性的作為，建構全院醫療品質與病人安全管理機制。\n符合項目：\n1.醫院應建立全院性病人安全制度，並擬定病人安全目標、任務及執行方針。(原2.2.1-符合 1修)\n2.醫院應設有委員會或相關組織，明確規定負責之組織架構、單位及人員的任務、責任及權限；對醫療異常或錯誤事件，有系統地收集與分析，並研擬系統性對策。(原2.2.1-符合 2 修)\n3.有專責人員依醫院監督或治理團隊擬定關鍵議題與優先順序，協調、推動及執行全院醫療品質及病人安全計畫，並定期檢討改善，且有紀錄。(原2.2.1-符合3 修)\n4.醫院應建置不以懲罰為原則的通報系統，鼓勵同仁自願通報，以提升醫療照護及作業環境之安全性，並參與衛生福利部所委託建置之台灣病人安全通報系統(Taiwan Patient-safety Reporting System)，做外部通報。(原2.2.1-符合4、優良3併)\n5.醫院建置多元管道，蒐集民眾意見，並鼓勵民眾參與病人安全工作，確實執行並著有成效。(試)\n優良項目：(下述項目(不含試評項目)僅限一項未達成)\n1.急性一般病床每 300 床應有 1 名醫管、醫品或病安等專任人員負責品管業務。(原2.2.1-優良1修)\n2.依各類人員於醫品及病安之需求，提供教育訓練計畫與方案，並建立評估成效機制，確實執行及檢討改善。(原2.2.1-優良2)\n3.上述作業規範與執行方針皆確實執行，且能依據實際執行狀況、病人安全相關規定、異常事件分析結果等，召開跨部門品管及病安討論會議，進行檢討改善。(原2.2.1-優良4)\n4.醫院全體員工包括行政與醫療部門主管及醫師，積極參與醫療品質及病人安全持續改善活動。(原2.2.1-優良5 修)\n5.對於委員會制定之病人安全措施，應建立臨床稽核機制，以確保規範能落實執行。(試)\n[註]\n1.符合項目 5 之執行方式可參考「醫院醫療品質及病人安全工作目標手冊」的建議參考作法。\n2.符合項目 5 及優良項目 5 列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.醫品病安委員會組織章程。(符合)\n2.醫品病安委員會會議紀錄。(符合)\n3.醫品病安計畫評估及成效。(優良)\n4.病安追蹤系統、作業規範。(優良)\n5.相關醫品病安改善報告。(優良)","cs":"1.查核重點應在醫院對於有關病人安全的積極性作法之落實程度。\n2.品管業務係指全院品管(包含病安)業務。","p":131,"ch":"2.2"},{"n":"2.2.2","tags":[],"t":"應訂有醫療品質指標及病例資料年報與醫療成果資料，並有統計、分析及檢討","ev":"目的：利用監測指標之收集、分析改善，早期發現問題，有效進行風險管理。\n符合項目：\n1.訂定適當的全院性醫療品質及病人安全指標，並確實執行及評估。(原2.2.4-符合2修)\n2.對於重要疾病之診療品質，依照病人流(patient flow)訂有相關過程面與結果面品質指標，並確實執行及評估改善成效。(試)\n3.定期檢視與分析監測指標之數據，並找出問題點，適時介入管理。(試)\n優良項目：(下述項目(不含試評項目)須全部達成)\n1.指標監測有建立自動化收集之資訊系統，並能呈現結構面、過程面與結果面指標，重要之臨床指標能從集成(aggregrate)之指標數據，往下分析到病人層級。(試)\n2.指標數據有正確的統計分析，數據分析系統能彈性調整參數，可以即時進行分析。(試)\n3.有將全院或各部門品管數據，以資訊圖像化(infographics)整理製成清楚易懂的圖表，例如圖像化品質報告卡或是儀表板，召開會議確實檢討，並將醫療品質卡或儀表板向全院公布，以公告周知並形成共識。(試)\n4.監測數據有進行內外部比較，定期或適時分析成圖表或圖像化的資訊，提供同仁、主管或全院擬訂策略時參酌。(原2.2.4-優良5修)\n[註]\n符合項目 2、3及優良項目1、2、3列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.醫療品質及病人安全指標。(符合)\n2.評估改善措施成效紀錄。(符合/優良)\n3.品質指標收集與分析之資訊系統。(優良)\n4.醫療品質改善成果發表紀錄。(優良)","cs":"1.本條文針對全院品管進行查核。\n2.指標統計後之回饋，可由相關委員會開會之資料呈現進行查核。\n3.相關臨床業務指標，由醫院自行界定並評估。","p":133,"ch":"2.2"},{"n":"2.2.3","tags":[],"t":"建立醫療倫理與法律相關委員會且運作良好","ev":"目的：透過委員會機制，落實醫療倫理與法律病例與議題討論。\n符合項目：\n1.醫學倫理委員會或相關組織會議，應有討論醫療倫理或法律相關之病例與主題。(原2.2.3-符合1)\n2.醫院應制定委員資格要求及訓練機制。(試)\n3.定期舉行會議，並有會議紀錄可查。(原2.2.3-符合2修)\n優良項目：(下述項目(不含試評項目)僅限一項未達成)\n1.醫學倫理委員會會議內容，包括檢討院內實際臨床案例或人體試驗案件討論等。(原2.2.3-優良1修)\n2.檢討院內實際臨床案例或人體試驗案件，並訂出醫療照護人員依循之倫理準則。(原2.2.3-優良2修)\n3.對於院內病人照護產生的醫學倫理議題有提供諮詢功能。(原 2.2.3-優良3 修)\n4.醫學倫理委員會有推廣醫學倫理或擴大參與的機制，例如建立各科代表或顧問群，以利在全院各單位落實推動。(試)\n[註]\n1.評量重點：應討論院內病例，而非僅安排專家演講、上課。\n2.符合項目 2 及優良項目 4 列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.醫學倫理委員會或相關組織會議紀錄。(符合)\n2.醫學倫理委員會資格與訓練機制。(符合)\n3.醫療照護人員倫理準則。(優良)\n4.醫學倫理委員會諮詢紀錄。(優良)\n5.醫學倫理委員會推廣醫學倫理或擴大參與的機制。(優良)","cs":"1「. 醫學倫理委員會」之名稱係由醫院自行訂定。2「. 定期」會議係指至少三個月開會一次。","p":134,"ch":"2.2"},{"n":"2.2.4","tags":[],"t":"定期舉行醫療照護品質相關會議，應用實證醫學佐證，檢討改善實務運作，以提升醫療品質與病人安全","ev":"目的：藉由醫療照護團隊定期溝通討論機制，應用實證醫學佐證，檢討改善醫療品質與病人安全議題。\n符合項目：\n1.應定期舉辦醫療照護及品質、病安相關會議，如病例討論會、併發症及死亡病例討論會、委員會等。相關決議或結論需追蹤執行情形，並有會議紀錄。(原2.2.2-符合1修)\n2.訂有醫療照護團隊溝通機制，包括醫師跨專科聯合討論會，以及醫師與醫事人員跨領域會議，定期溝通，討論實務運作中可提升病人安全、醫療品質議題，以凝聚共識。(原2.2.2-符合2修)\n3.訂有政策與指引，檢視與檢討重要關鍵之臨床服務，要求相關部門定期召開醫療照護品質會議，例如癌症診療、手術麻醉、急診多重共病照護、多重外傷或加護病房重症病人之聯合照護。(試)\n優良項目：(下述項目(不含試評項目)僅限一項未達成)\n1.每次溝通會議能追蹤上次決議執行情形及改善成效，並提出具體提升病人安全、醫療品質措施、方案，確實運用於臨床照護。(原2.2.2-優良1 修)\n2.醫療照護依實證醫學文獻及醫療照護團隊共識，檢視及修正醫療照護指引、常規或技術手冊，以符合醫療品質、病人安全及醫療照護團隊需求，並落實執行。(原2.2.2-優良2修)\n3.根據品質指標與病人安全通報資料，對於重要之病人安全風險或傷害事件，要求醫療照護團隊召開會議，檢討並制定改善策略。(試)\n4.有實際改善醫療品質及病人安全之具體成效，並能對外發表與分享。(原2.2.2-優良3修)\n[註]\n符合項目 3及優良項目3列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.醫療照護及品質、病安相關會議，如病例討論會、併發症及死亡病例討論會、委員會等會議紀錄。(符合)\n2.決議執行情形及改善成效。(符合)\n3.具體提升病人安全、醫療品質措施、方案、成效。(優良)\n4.醫療照護指引、常規或技術手冊修訂紀錄。(優良)","cs":"「定期」會議係指至少三個月開會一次。","p":135,"ch":"2.2"},{"n":"2.2.5","tags":[],"t":"對於各種可能發生醫療不良事件之情境，訂定預防措施，並建立預警偵測的通報處理機制","ev":"目的：落實醫療不良事件的通報與處理，並檢討改善以建立預防措施與預警偵測的處理機制。\n符合項目：\n1.醫院應訂定預防各種可能發生醫療不良事件之措施，並確實執行。(原2.2.5-符合1修)\n2.建立醫療不良事件之通報與處理機制，並有向上呈報的步骤，包括夜間、假日等主治醫師不在現場時的處理方式。(原2.2.5-符合4、5併)\n3.重大醫療事故應依法通報，且進行根本原因分析、提出改善方案，以推動系統除錯提升品質。(試)\n4.加強病人安全觀念的宣導，並針對不同單位、層級提供不同內容的繼續教育，來鼓勵異常事件的通報。(原2.2.5-符合3修)\n優良項目：(下述項目(不含試評項目)須全部達成)\n1.對於嚴重度或發生率較高的醫療不良事件，有進行分析檢討，並根據分析結果提出適當的預防及改善措施。(原2.2.5-優良1、2併)\n2.可能發生或是進行中的醫療不良事件，醫院有建立預警偵測的通報處理與早期介入的臨床支持機制。(試)\n3.鼓勵病人及其家屬對其所接受的治療與處置有重大疑慮時能適時提出，並教育醫療人員以開放的態度受理意見，以及時解決問題，必要時院方應建立支援機制。(試)\n4.醫療不良事件具有教育價值者，能製成教學案例適當傳達予員工，並據以修正相關流程及規範。(原2.2.5-優良 3 修)\n5.重大醫療事故之根本原因分析結果，應與院內病人安全通報系統之資料進行比對檢討，用以強化院內病人安全之預警偵測機制。(試)\n[註]\n1.異常事件嚴重程度評估(Severity Assessment Code, SAC)：依據事件嚴重度及事件再發頻率為軸呈現之風險矩陣，以作為風險分級之用，共分成 4級，可協助規範面臨事件發生後之事件處理的優先順序。\n2.醫療事故：指病人接受醫療機構之醫事服務，發生重大傷害或死亡之結果。\n3.優良項目 3 之執行方式可參考「醫院醫療品質及病人安全工作目標手冊」的建議參考作法。\n4.符合項目 3 及優良項目 2、3、5 列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.醫療不良事件處理辦法。(符合)\n2.病人安全通報標準作業流程。(符合)\n3.重大異常事件分析檢討改善成果。(優良)\n4.異常事件員工教育及成果發表紀錄。(優良)","cs":"","p":136,"ch":"2.2"},{"n":"2.2.6","tags":[],"t":"各項檢驗、檢查異常結果報告有完整傳送與接收機制","ev":"目的：建立與執行各項檢驗、檢查結果報告之完整傳送與接收機制，以維護病人安全。\n符合項目：\n1.各項檢驗、檢查應訂有異常值通報標準程序，並定期檢討、修正或更新。(原2.8.15-符合1、優良1併)\n2.明訂檢體檢驗、影像檢查、病理診斷等結果報告之遞送路徑，包含正常、緊急作業時間等，並確實將結果報告送達主治醫師或醫療照護團隊相關人員。(原2.8.15-符合2)\n3.對於須於短時間處理重要危急值(如：檢驗之嚴重低血糖、高血鉀等；放射檢查報告之新發現主動脈剝離、氣胸等)，應有機制可確認已被完整的收到，以利能迅速運用於病人後續的醫療處置。(原2.8.15-優良3修)\n4.應建立緊急且重要之異常值或檢查報告說明及即時通報機制，相關人員對於緊急且重要之異常結果應立即通報給主治醫師。(原2.8.15-符合3)\n優良項目：(下述項目(不含試評項目)須全部達成)\n1.重要危急值應能及時傳達至醫療照護團隊之主要人員，並有交班之機制。(試)\n2.檢驗或檢查報告如果有修改，產生危急值或取消危急值，應建立再通知的機制並落實執行。(試)\n3.對於重要危急值，如果接獲報告時病人已經轉院或離院，應建立通知現在照護團隊或病人家屬的機制。(原2.8.15-優良3修)\n[註]\n優良項目 1、2列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.異常結果(如：危急項目、危急值、異常值等)通報標準作業流程及檢討修正紀錄。(符合/優良)\n2.異常結果通報與回覆統計、追蹤檢討相關紀錄。(優良)","cs":"1.醫院可以檢討異常危急值之定義，並界定真正需要通報之內容。\n2.有關異常危急值或檢查報告之通報、接收、運用與後續處置等相關規範，醫院可依狀況自訂之。評鑑委員可請醫院舉證說明。","p":138,"ch":"2.2"},{"n":"2.3.1","tags":["重"],"t":"住院病人應由主治醫師負責照護，住院病人之照護應朝向整合醫學照護制度發展","ev":"目的：主治醫師主導住院病人醫療照護計畫，病人病情有變化時，能即時獲得適當處置。醫院應建立整合醫學照護制度，從全人醫療的角度提供完善住院診療，協助處理急診病情複雜而難以分科的病人，並推動與社區醫療的垂直整合。\n符合項目：\n1.住院病人應由主治醫師負責照護並讓病人知悉其主治醫師。(原2.3.1-符合 1)\n2.若主治醫師不在時，有明確規定代理機制及排定代理人員名單。(原2.3.1-符合 2)\n3.如果病人接受二位以上主治醫師之聯合(混合)照護，應讓病人知悉照護主治醫師群，並了解其分工。(試)\n優良項目：\n1.建立整合醫學照護制度，培養不分科診療的專科醫師，能專責提供住院病人整合醫療照護。(試)\n2.有規劃整合醫學照護專責病房或區域，由急診收治住院或多重共病需跨多科別照護之病人，尤其是多重慢性病、經常性住院或末期病人。(試)\n3.能協助收治或處理急診病情複雜需跨多科別照護病人，以及時治療該類病人，減少病人不必要的急診候床。(試)\n4.整合醫學照護病房應有跨領域照護團隊之團隊查房或會議，每週至少 1 次，除醫師與護理師之外，臨床藥師、呼吸治療師、復健治療人員、社工師、營養師、臨床心理師等每次至少有 2 種職類人員參與，且成效良好。(試)\n5.推動與跨層級醫療院所或社區健康照護網絡的垂直醫療整合。(試)\n[註]\n1.整合醫學照護單位之「專責主治醫師」需專職於專屬病房工作，主要負責照護住院病人；每週門診、檢查及手術不得超過 3節(惟於專屬病房進行之約診、手術不在此限，且不含假日、夜間緊急手術與緊急照會)。\n2.符合項目 3 及優良項目 1、2、3、4、5 列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.醫師職務說明書。(符合)\n2.職務代理辦法。(符合)\n3.醫師值班表。(符合)\n4.主治醫師聯合照護規範。(優良)","cs":"符合項目 2 所提「主治醫師不在時」係指任何時候不在院之情況，非單指請假。","p":140,"ch":"2.3"},{"n":"2.3.2","tags":[],"t":"住院、急診病歷應詳實記載病況變化、治療方式及其治療依據說明等，以供事後檢討","ev":"目的：醫療照護團隊成員詳實記載之病歷，使病人照護相關資訊能正確傳遞。\n符合項目：\n1.入院紀錄應完整詳實，且包含病人主訴、病史、身體檢查、實驗室檢查、臆斷與診療計畫(plan to do)等。(原 2.3.2-符合1)\n2.主治醫師需親自診察評估病情，視病情修訂診療計畫，並有紀錄。(原2.3.2-符合2)\n3.病程紀錄能適當的反應病況變化。(原2.3.2-符合3)\n4.有定期的診療摘要紀錄或交班摘要。(原2.3.2-優良2)\n優良項目：(下述項目(不含試評項目)須全部達成)\n1.病歷記載能顯示達成診斷及實施處置之合理思考邏輯，且應適時、適當呈現特殊檢查、檢查方法、檢驗、處置之理由及影像診斷報告的臨床評估。(原2.3.2-優良1)\n2.個案討論結果應記錄於病人診療紀錄內；當病人需要轉科或轉院時，應將討論結果妥善轉予相關科別或醫院。(原2.3.2-優良3)\n3.為了完成連續性照護，病歷記載應適度整合病人過去病史、用藥紀錄與健康資訊，尤其是參考健保雲端資料。(試)\n4.醫院應制定相關流程，規範電子病歷紀錄時，複製與貼上的功能應正確使用與修改，並有稽核機制。(試)\n5.醫療團隊與病人家屬溝通之家庭會議或是溝通紀錄，應制定格式規範，並整合入病歷具體呈現，如參與醫療人員、病人家屬成員之姓名、職稱或關係，主要議題，結論或共識。(試)\n[註]\n1.診療計畫(plan to do)不需為獨立單張，亦未規定須由病人或家屬簽名。\n2.優良項目 3、4、5列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.病歷寫作規範。(符合)\n2.紙本或電子病歷。(符合/優良)\n3.病歷紀錄品質檢討的相關資料。(優良)\n4.電子病歷複製與貼上使用規範。(優良)","cs":"1.查核重點應為：病人每日診視診治後之相關紀錄。\n2.符合項目 2所提「診療計畫」，需呈現於病歷紀錄中，可不需另行新增病歷單張。","p":142,"ch":"2.3"},{"n":"2.3.3","tags":["合"],"t":"每日應有醫師迴診，並適當回應病人病情之陳述，紀錄詳實","ev":"目的：藉由醫師每日之迴診及紀錄，了解病人病況之變化以調整診療計畫。\n符合項目：\n1.每日均有醫師迴診，並訂有假日查房迴診辦法。(原2.3.3-符合1)\n2.每日病程紀錄應有主治醫師簽章，如有增刪，應於增刪處簽名或蓋章及註明年、月、日。(原2.3.3-符合2)\n3.全面或部分實施電子病歷之醫院，相關主治醫師複簽、修改紀錄、簽名應符合電子簽章規範。(原2.3.3-符合3 修)\n4.如病人病況有變化或提出相關反應，應予充分陳述及說明並適時調整診療計畫，記錄詳實。(原2.3.3-符合4)\n評量方法及建議佐證資料：\n1.醫師假日迴診之規範。(符合)\n2.紙本或電子病歷。(符合)\n3.電子病歷歷史修改紀錄。(符合)","cs":"1.符合項目 1所提「醫師」非單指「主治醫師」。\n2.本條文以 progress note 上之紀錄及訪談病人醫師查房情形為主。\n3.評鑑委員於實地評鑑時，可詢問病人或家屬，確認醫師是否每日來診。","p":143,"ch":"2.3"},{"n":"2.3.4","tags":["合"],"t":"醫療照護團隊成員應了解病人問題，並讓接班人員知悉；如有轉出至其他單位時，應製作照護摘要或交班紀錄，以達持續性照護","ev":"目的：病人主要醫療照護成員確實交接班，達到持續性之照護。\n符合項目：\n1.醫療照護團隊訂有交接班作業流程。(原2.3.4-符合1)\n2.醫療照護團隊成員能瞭解病人問題所在，且能交班清楚，使接班者亦能瞭解病人問題。(原2.3.4-符合2修)\n3.訂有轉換單位之作業流程，轉換科別或照護團隊時，轉出單位醫療照護團隊應製作照護摘要或交班紀錄，以供後續照護單位提供持續性照護。(原2.3.4-符合 3修)\n評量方法及建議佐證資料：\n1.交接班作業流程。(符合)\n2.交接班紀錄。(符合)\n3.單位間轉床作業流程。(符合)\n4.病人轉運作業規範。(符合)","cs":"1.「交班」至少包括「醫師對醫師」、「護理人員對護理人員」之交班，惟二者交班內容不可相互矛盾。\n2.符合項目 3 係查核醫院對於轉換單位之作業流程的落實程度。\n3.為確保病人安全，醫院應依病人病況分級訂定轉送規範，依其規範據以查核。","p":143,"ch":"2.3"},{"n":"2.3.5","tags":[],"t":"因應病人狀況提供適切可行的護理照護計畫，過程完整，並有適時修正","ev":"目的：護理紀錄能呈現應用護理過程，改善病人健康問題。\n符合項目：\n1.能依病人狀況，提供適切的護理照護計畫。(原2.3.5-符合1)\n2.在護理過程中至少可看出評估、計畫及措施，並有紀錄。(原 2.3.5-符合 2 修)\n優良項目：(下述項目(不含試評項目)僅限一項未達成)\n1.護理照護計畫有依病人狀況與需求，適時調整，具有個別性。(原2.3.5-優良 1)\n2.護理過程完整，有評估、計畫、措施及評值，且紀錄完整。(原2.3.5-優良2)\n3.護理紀錄品質有檢討改善，並有減輕護理人員不必要文書作業的作為。(原 2.3.5-優良3修)\n4.有資訊智慧輔助設備，簡化人員作業流程，減輕工作負荷。(試)\n[註]\n1.可聽取事例作評估或實地訪視病人。\n2.可訪談護理人員，並由病人處印證實際執行成效。\n3.護理作業智能化，例如生命徵象監測數值自動上傳、條碼運用、醫療團隊資料共享、支援決策輔助系統等。\n4.優良項目 4列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.護理紀錄。(符合/優良)\n2.護理紀錄書寫規範。(符合/優良)\n3.護理紀錄品質的檢討改善結果。(優良)\n4.有智能化運用作業資料(如生命徵象監測數值自動上傳、條碼讀取等)。(優良)","cs":"1.優良項目 2所提「評值」，針對措施或目標皆可。\n2.優良項目 3，醫院提出該期間內護理人員紀錄簡化之作為，且將相關佐證予評鑑委員參考。","p":144,"ch":"2.3"},{"n":"2.3.6","tags":["重","合"],"t":"適當的護病比","ev":"目的：規範護理人員的照護負荷，維護照護品質。\n符合項目：\n1.申請地區醫院評鑑、區域醫院評鑑者：應符合醫療機構設置標準。(原2.3.6-符合1-(1)、1-(2)修)\n2.申請醫學中心評鑑者：應符合醫療機構設置標準，且白班平均護病比不得高於 7人。(原2.3.6-符合1-(3)修)","cs":"1.有關本項基準查證方式包含：\n(1)醫院填報之醫院評鑑補充資料表數據。\n(2)實地評鑑當日抽查之急性一般病房全日護病比。\n2.有關醫院填報之補充資料表第 2 篇「四、全院全日三班護病比」：\n(1)表一「112 年全院急性一般病床各月份全日護病比」，將依醫療機構設置標準(醫學中心≦9)，以本表之「平均值」進行判定是否符合。\n(2)表二「113 年實地評鑑前急性一般病房各單位全日護病比」，將依上述標準，以本表之「總計值」進行判定是否符合。\n3.有關「實地評鑑當日各急性一般病房全日護病比」抽查方式，至少抽查全院 30%以上的急性一般病房。抽查結果採所有病房之平均數判定是否符合。\n4.上述之表一、表二及實地評鑑抽查之結果，兩者皆符合，即視為符合；至於醫學中心白班護病比的判定原則亦同。","p":145,"ch":"2.3"},{"n":"2.3.7","tags":[],"t":"醫囑之記載與確認應有標準作業，以確保醫囑安全執行","ev":"目的：醫囑開立至被執行之流程，能兼顧正確、安全及時效性。\n符合項目：\n1.明訂醫囑的具體步驟，及醫療照護團隊針對醫囑溝通之機制。(原2.3.7-符合 1修)\n2.醫療照護團隊成員落實執行醫囑確認的步驟。醫囑變更或修正時，有評估及確認步驟。對醫囑有疑慮時，除與醫師溝通外，必要時有由醫療照護團隊及主管共同確認之機制，以維護病人安全。(原2.3.7-符合 2 修)\n3.醫院應訂定接受口頭(含電話)醫囑的確認機制，且應於 24 小時內完成醫囑記述。(原2.3.7-符合3修)\n4.醫囑應適時重整及更新。(原2.3.7-符合4)\n5.依照「專科護理師於醫師監督下執行醫療業務辦法」，制定專科護理師預立醫療流程。專師及訓練專師如執行預立特定醫療流程後，監督醫師應於二十四小時內完成核簽；如執行其他監督下之醫療業務，監督醫師則應於二十四小時內完成書面醫囑紀錄。(試)\n優良項目：(下述項目僅限一項未達成)\n1.明訂口頭(含電話)醫囑的範圍及處理方式，於當班完成醫囑記述，病歷應詳實記載溝通內容及執行情形，由醫師簽名或蓋章以示負責。(原2.3.7-優良1修)\n2.對於容易發生錯誤之醫囑，應訂有預防措施，包括醫療名詞縮寫規範。(原 2.3.7-優良2)\n3.定期檢討作業程序，確實檢討改進醫囑異常事件，並有效處置不良反應。(原2.3.7-優良3 修)\n[註]\n符合項目 5列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.病歷(醫囑)書寫規範。(符合)\n2.護理給藥標準作業流程。(符合)\n3.口頭醫囑作業流程。(符合/優良)\n4.紙本或電子病歷。(符合/優良)\n5.專科護理師預立醫療流程。(符合)\n6.處方醫令系統自動稽核防錯機制範例。(優良)\n7.高警訊藥物防錯範例。(優良)\n8.醫囑異常事件通報、檢討及改善報告。(優良)","cs":"1.符合項目 1 所提「醫囑」係由醫師複核並蓋醫師章(或簽名)為準。\n2.優良項目 1所提「口頭(含電話)醫囑的範圍及處理方式」係應依醫院實際狀況制定明確規範，內容包括口頭醫囑適用範疇及處理方式。","p":146,"ch":"2.3"},{"n":"2.3.8","tags":[],"t":"依病情之需要，適切照會相關之醫療照護團隊","ev":"目的：有良好之會診，以整合各專業領域人員服務。\n符合項目：\n1.明訂會診作業規範。(原2.3.8-符合1)\n2.會診具有時效性，可於作業規範時間內完成。(原2.3.8-符合2、優良1併)\n優良項目：(下述項目僅限一項未達成)\n1.會診結果能適切解決病人的問題。(原2.3.8-優良2)\n2.會診結果及品質有檢討機制，並據以改善。(原2.3.8-優良3修)\n3.病情複雜、無法獲得正確診斷或病情快速惡化時，適時召開醫療團隊整合照護會議，並向病人家屬溝通說明，鼓勵病人或家屬參與決策過程。(原2.3.8-優良 4修)\n[註]會診具有時效性係指：\n1.緊急會診須於2小時內病人訪視。\n2.一般會診須於1個工作日內完成。\n3.營養師會診須於2個工作日內完成。\n評量方法及建議佐證資料：\n1.住院病人醫療會診作業規範。(符合)\n2.會診通知單及回覆單。(符合)\n3.逾期會診率。(優良)\n4.會診品質檢討改善會議紀錄。(優良)\n5.治療小組或整合照護會議紀錄。(優良)","cs":"1.本基準主要針對一般病房之會診，並非急診緊急會診。\n2.本基準僅規範緊急會診及一般會診之時效，特定科別之會診時效，醫院可自行規範。","p":147,"ch":"2.3"},{"n":"2.3.9","tags":[],"t":"依據病情評估結果訂定復健計畫，給予適切之復健治療及訓練","ev":"目的：提供多元整合之復健治療服務，協助病人恢復身體及社會功能。\n符合項目：\n1.訂有復健科復健治療作業規範。(原2.3.9-符合 1)\n2.有依規範執行會診、評估、制訂復健治療計畫，適切轉介相關專業，如：物理治療、職能治療、語言治療、心理治療或職前鑑定人員，並向病人說明。(原2.3.9-符合2修)\n3.有依計畫類別提供適當輔具。(原2.3.9-符合 3修)\n優良項目：(下述項目(不含試評項目)僅限一項未達成)\n1.復健團隊應對不同疾病、復健種類的病人，執行功能評估，並設定個別化訓練計畫及目標，再依功能恢復情形及訓練進度，適時再評估，復健記錄應具體呈現病人復健進展。(原2.3.9-優良1修)\n2.相關治療師能主動配合床邊復健計畫，實施病人之床邊復健。(原2.3.9-優良 2修)\n3.個案復健治療團隊與醫療照護團隊定期討論，視需要設定具體方案及改善方向。(原2.3.9-優良3)\n4.對早期療育服務能訂定評估及治療計畫，並組織相關團隊人員提供團隊照護。(原2.3.9-優良4修)\n5.對於有運動治療需求病人，如：心肺功能不全、肌少症及衰弱老人等，復健團隊提供運動處方與運動治療。(試)\n[註]\n1.復健治療團隊包含醫師及復健治療相關人員。\n2.應將復健診療紀錄、訓練紀錄與定期/不定期評估一併管理，但定期將必要的資料加入診療紀錄亦可。\n3.優良項目 5列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.復健治療作業規範。(符合)\n2.復健治療會診單及紀錄單。(符合)\n3.疾病別復健治療評估及輔具評估表單。(符合/優良)\n4.復健個案(腦中風、早期療育等)討論或整合照護會議紀錄。(優良)\n5.運動處方與運動治療個案之紀錄。(優良)","cs":"復健計畫需呈現於團隊照護之紀錄。","p":148,"ch":"2.3"},{"n":"2.3.10","tags":["試"],"t":"醫院為多重疾病或身心失能高齡病人提供跨領域整合照護，結合醫療作業與周全性評估建立整合照護計畫及評估結果","ev":"目的：醫院應針對具多重疾病或身心失能之高齡病人推動照護計畫整合，結合周全性評估及跨領域合作來改善病人疾病與身心功能，提升照護品質與改善就醫流程。\n符合項目：\n1.針對住院特定病房區域或特定條件之高齡且具有多重疾病或身心失能病人進行周全性評估。\n2.周全性評估須與醫護作業整合，做為治療計畫依據，相關評估結果與照護計畫也需提供後續轉介單位。\n3.設有專責高齡醫學團隊，由老年醫學專科醫師提供複雜高齡病人之照會，並配合畢業後不分科醫師與其他醫事人員教學訓練需求。\n4.建立急性後期照護服務連結，結合周全性評估，針對出院功能退化病人適時轉介。\n優良項目：\n1.高齡醫學團隊以專責老年醫學專科醫師為主，建立跨領域照護模式，每週至少開會一次並留有紀錄。\n2.設有高齡醫學病房以配合臨床照護及教學訓練需求。\n3.高齡醫學病房就近設有復健設施以減少病人住院期間之功能退化並預防失能。\n4.醫院設有由老年醫學專科醫師主責之高齡醫學整合門診，並建立病人周全性評估與後續追蹤機制且具成效。\n5.醫院須系統性建立各類型病人急性後期照護需求評估，積極且妥善安排下轉事宜，定期檢討並具成效。\n[註]本條為試評條文，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.周全性評估及跨領域整合照護計畫。(符合)\n2.醫院專責高齡醫學團隊。(符合)\n3.高齡醫學整合門診照護成效。(優良)\n4.高齡醫學病房照護成效。(優良)","cs":"","p":150,"ch":"2.3"},{"n":"2.3.11","tags":[],"t":"對病人提供身體、心理、社會及靈性的照護及支持措施","ev":"目的：評估病人身、心、社會及靈性之需求，提供適切的照護及支持措施。\n符合項目：\n1.對於自我照顧困難之病人能得到基本的身體清潔護理。(原2.3.10-符合1修)\n2.對病人提供適當的心理、社會及靈性的支持措施。(原2.3.10-符合2)\n3.對於癌末、臨終的病人，應有評估及心理及靈性支持措施，並尊重病人自主決定。(原2.3.10-符合3修)\n優良項目：(下述項目僅限一項未達成)\n1.對自我照顧困難之病人，照護人員能指導或協助家屬執行基本的身體護理，且能顧及病人的舒適及尊嚴。(原2.3.10-優良1修)\n2.設有固定服務之社工人員、志工或宗教師，可提供主動訪視、支持或諮詢服務。(原2.3.10-優良2修)\n3.能對病人家屬提供心理、社會及靈性的支持措施。(原2.3.10-優良3)\n[註]身體護理係指身體的清潔、排泄照護、舒適護理、協助進食、睡眠的適切照顧。\n評量方法及建議佐證資料：\n1.對病人提供身體、心理、社會及靈性的照護相關作業規範。(符合)\n2.抽查相關病歷紀錄。(符合)\n3.身心靈需要評估、照顧紀錄或輔導計畫單。(優良)\n4.社工人員、志工或宗教師訪視紀錄。(優良)\n5.個案討論會議紀錄。(優良)","cs":"","p":151,"ch":"2.3"},{"n":"2.3.12","tags":[],"t":"訂有行動限制(隔離、約束)之作業常規並執行適當","ev":"目的：執行適當的隔離、約束，並確保安全。\n符合項目：\n1.應訂定實施行動限制的作業標準。(原2.3.11-符合1修)\n2.住院時或執行前，應以書面告知住院中於醫療上有必要時可能會限制行動；執行時，再次向病人或家屬解說清楚，並有紀錄。(原2.3.11-符合2 修)\n3.醫療照護團隊應依行動限制作業標準執行約束，並有醫囑及紀錄。(原2.3.11-符合3修)\n優良項目：(下述項目僅限一項未達成)\n1.執行時確認病人或家屬充分了解行動限制的必要性，使其感受到尊重，且有詳實完整之紀錄。(原2.3.11-優良 1 修)\n2.醫囑及執行紀錄中應明確記述限制行動的必要性、形式、持續時間、注意事項等，行動限制方式應安全、適當，並有定期檢討。(原2.3.11-優良2 修)\n3.行動限制的作業品質有定期檢討改善，且有具體成效。(原2.3.11-優良3修)\n[註]\n1.行動限制包含隔離、約束；惟不含「感染管制之隔離」。\n2.行動限制的作業常規須包括：不影響病人的安全下，依照病人病情，定時探視行動限制中的病人(一般病房有人陪伴者至少 1 小時探視 1次，無人在旁陪伴者至少每 30 分鐘探視 1 次)，並能提供病人生理需求、注意呼吸及肢體循環並防範意外事件發生；每班至少有一次行動限制相關紀錄，有異常狀況時須隨時記錄。\n3.緊急狀況時，得先執行行動限制，並儘速向家屬解說清楚取得同意書。\n評量方法及建議佐證資料：\n1.病人行動限制相關作業規範。(符合)\n2.約束說明書、約束同意書、隔離說明書、隔離同意書。(符合)\n3.醫囑及執行、檢討紀錄。(符合/優良)\n4.行動限制品質討論會議紀錄。(優良)","cs":"執行約束時應開立醫囑，其有效天數則依醫院常規制定。","p":152,"ch":"2.3"},{"n":"2.3.13","tags":[],"t":"評估病人營養狀態，適切給予營養及飲食指導","ev":"目的：評估病人營養狀態，給予營養及飲食指導。\n符合項目：\n1.訂定營養篩檢、飲食指導等照會流程與機制。(原2.3.12-符合1)\n2.營養師依據營養評估之結果，予以個案營養診斷後，施予適切之營養支持、營養教育、飲食指導等，且有紀錄。(原2.3.12-符合2)\n3.營養照會紀錄完整，並適時回饋主要照護之醫療人員討論，據以擬定共同照護計畫。(原2.3.12-優良1修)\n優良項目：(下述項目僅限一項未達成)\n1.設有營養諮詢門診者，應有適當場所、必要之教具(如：食物模型或圖鑑、各類量匙量杯等容器)及設備(如：體重計、體組成分析儀等)。(原2.3.12-優良2)\n2.對於提供之營養服務應有評估機制及統計。(原2.3.12-優良3)\n3.對於接受治療餐者，能檢討其遵從用膳情形或指導其正確自備膳食，並有提升營養照護品質策略。(原2.3.12-優良 4)\n[註]\n1. 照會流程及機制指由醫護人員初步營養篩選，對無法進食或體重下降等營養不良高風險病人、特殊飲食(如：糖尿病、三高、體重過重)需飲食指導或營養介入者，轉介營養師進行營養評估。\n2. 營養照會應於 2個工作日內完成。\n3.營養衛教及飲食指導對象可涵蓋病人及其主要照顧者；指導吞嚥、功能障礙病人進食，可視需要與治療師(如：語言治療師或職能治療師等)共同協助進食操作及器具處理指導。\n評量方法及建議佐證資料：\n1.營養照護相關作業規範。(符合)\n2.營養照會單及病歷紀錄。(符合)\n3.營養相關團隊整合照護或個案討論會議紀錄。(符合)\n4.諮詢門診設備/門診營養指導紀錄/營養服務評估及統計報表。(優良)\n5.營養照護相關品質改善會議紀錄。(優良)","cs":"","p":153,"ch":"2.3"},{"n":"2.3.14","tags":[],"t":"提供病人適當之衛教指導與資料","ev":"目的：提供適當衛教，提高病人及照顧者之照護能力。\n符合項目：\n1.醫療照護團隊依病人及照顧者需要，提供衛教單張及資料。(原2.3.13-符合1修)\n2.視病人及照顧者需要，提供個別或團體衛教。(原2.3.13-符合2修)\n3.適時更新衛教指導內容。(原2.3.13-符合3 修)\n優良項目：\n1.善用醫院內外電子衛教資訊(如數位、網路及雲端等衛教資訊)。(試)\n2.衛教指導成果(含病人及家屬滿意度)應有評估機制，定期檢討且具成效。(試)\n[註]\n1.衛教資料可包括：健康促進、疾病照護、自我照護、三高、酗酒、戒菸、檳榔等議題，如：有吸菸、嚼檳榔者給予戒菸、戒檳榔之建議、衛教資料及提供治療。\n2.優良項目 1、2列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.各單位衛教資料(含衛教教具及單張)。(符合)\n2.衛教活動紀錄。(符合)\n3.電子衛教資料。(優良)\n4.衛教指導成效。(優良)","cs":"","p":154,"ch":"2.3"},{"n":"2.3.15","tags":[],"t":"明訂院內突發危急病人急救措施，且應落實執行","ev":"目的：提升員工對突發危急病人急救能力與知識，確保院內所有區域有突發危急病人時，皆能及時接受適切處置，以維護病人安全。\n符合項目：\n1.明訂院內突發危急病人急救措施之標準作業程序，定期辦理全院性教育訓練，周知全院工作人員緊急事件的代號，及其因應處理步驟。(原2.3.14-符合1、2併)\n2.急救設備及藥品應有明確管理規範，確保設備功能及藥品衛材效期，並能正確操作。(原2.3.14-符合3修)\n3.照顧病人之高風險單位，每年至少舉辦一次以上醫療團隊之急救演練，且有紀錄。(原2.3.14-符合4修)\n4.對非預期突發之急救事件進行分析，並定期檢討改善院內急救事件之成效。(原1.4.4-優良2修)\n5.全院員工(含外包人員)至少應接受基本生命復甦術(Basic Life Support, BLS)、包含AED(Automated External Defibrillator)訓練，或有接受進階生命支持術(Advanced Life Support, ALS)訓練。急重症單位(包括急診、加護病房及麻醉部門)之醫護人員應定期接受高級心臟復甦術訓練(ACLS)，或因應不同性質單位之 NRP、ATLS、ANLS、APLS、PALS 等皆可。(原1.4.4-符合2、4 併)\n優良項目：(下述項目(不含試評項目)僅限一項未達成)\n1.醫療團隊之急救處置正確熟練，針對演練或急救事件發現之缺失，確實檢討改進。(原2.3.14-優良1、2併)\n2.依據非預期突發之急救事件之分析，設置病情惡化警示系統或快速反應團隊(Rapid Response Team)，以建立預防非預期性急救發生之機制。(試)\n3.除急重症單位之醫師外，其餘醫師接受 ALS 訓練之訓練完成率達70%。(原1.4.4-優良1)\n4.藥師定期檢查及更新急救車藥品，並有紀錄。(原2.3.14-優良3修)\n[註]\n1.若急救車上鎖或貼封條則毋須每班點班，但需有定期核對急救用品有效期限之機制。\n2.本條文所稱「全院員工至少應接受基本生命復甦術(Basic Life Support, BLS)、包含AED(Automated External Defibrillator)訓練，或有接受進階生命支持術(Advanced Life Support, ALS)訓練」，身心障礙員工及志工除外。\n3.ALS 訓練需包括 BLS、進階氣道處理及電擊器操作。\n4.醫護人員視不同性質之單位所接受之 ACLS、ANLS、ATLS、ETTC、NRP、APLS 及PALS等訓練，可等同接受 ALS 訓練。\n5.優良項目 2列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.院內突發危急病人急救措施之標準作業程序。(符合)\n2.急救車管理規範。(符合)\n3.急救車點班紀錄。(符合)\n4.急救演練紀錄。(符合)\n5.全院各職類急救訓練項目、完成率資料。(符合)\n6.急救事件檢討改善會議紀錄。(優良)\n7.全院員工(含外包人員)BLS或ACLS證明。(符合/優良)\n8.教育訓練出席率統計資料。(優良)\n9.藥師查核急救車藥品紀錄。(優良)","cs":"1.評鑑委員實地訪談內容包含「不預期心跳停止」之因應方式。\n2.若醫院急救車採「上鎖」管理，其「鎖」的使用應是遇緊急狀況時，可立即破壞打開使用為原則，以免延誤急救時效。\n3.院內急救車之藥品及物品擺放位置應一致，以利新進人員及支援同仁儘快熟悉藥品位置。\n4.急救車內之藥品應以急救藥物為原則，勿放置常備藥品。\n5.實地評鑑前 6 個月內到職之全院員工(含外包人員)，暫不列入本項查核之對象，惟醫院須有後續人員接受訓練之期程規劃。","p":155,"ch":"2.3"},{"n":"2.3.16","tags":[],"t":"實施適切之轉診(介)服務，並與院外機構建立良好合作關係","ev":"目的：協助病人適切安全之轉診，達到持續性照護目標。\n符合項目：\n1.與院外機構建立適切的合作機制，並訂有轉診(介)作業流程。(原2.3.15-符合1)\n2.院內有專責人員或單位負責該項工作。(原2.3.15-符合2)\n3.轉診(介)紀錄完整。(原2.3.15-符合3)\n4.針對轉診(介)之時效、適當性、異常或特殊狀況，有定期統計分析檢討與改善。(原2.3.15-優良2、3併)\n5.有使用衛生福利部中央健康保險署的轉診資訊交換系統回覆紀錄。(試)\n優良項目：(下述項目(不含試評項目)須全部達成)\n1.對轉診(介)病人有提供原轉診醫師瞭解病人相關病況之機制。(原2.3.15-優良1、5併)\n2.與院外機構之合作關係，有促進機制，並定期檢討，執行成效良好。(原2.3.15-優良4修)\n3.針對特定疾病照護，提供轉介急性後期照護(PAC)之規劃，定期開會檢討改善，執行成效良好。(試)\n[註]\n1.轉診作業相關流程須符合醫療法施行細則第 50-52條規定。\n2.符合項目 5 及優良項目 3 列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.轉診(介)作業流程。(符合)\n2.轉診(介)紀錄。(符合)\n3.轉診(介)服務的統計分析結果。(符合)\n4.原轉診醫師瞭解病況之機制。(優良)\n5.與院外合作機構溝通的檢討紀錄。(優良)\n6.轉診(介)異常或特殊狀況分析、檢討與改善報告。(優良)","cs":"醫院應以分級醫療概念協助急診或住院病人轉介。","p":157,"ch":"2.3"},{"n":"2.3.17","tags":[],"t":"醫療照護團隊應依病人需求，提供適切、完整的出院照護計畫與指導，並有紀錄","ev":"目的：醫療照護團隊共同擬訂與執行病人出院計畫，確保病人順利轉院或返家。\n符合項目：\n1.設有出院照護計畫委員會(小組)，定期開會檢討、修訂出院照護計畫架構、流程等，並能具體解決問題，且紀錄完整。(原2.3.16-優良1修)\n2.訂有出院照護計畫流程，依病人需求，由醫療照護團隊共同擬訂出院照護計畫，並有紀錄。(原2.3.16-符合1 修)\n3.出院照護計畫至少應包括：與疾病相關之計畫及指導資訊(如：營養、復健、用藥、後續門診追蹤、緊急就醫之醫療資源與途徑等)，並提供書面資料給病人。(原2.3.16-符合2修)\n4.依病人需求，協助提供社會相關資源、轉介服務、銜接急性後期照護(PAC)或長照服務。如為長照服務需求個案，應進行長照服務需求評估，或轉介個案居住地縣市照顧管理中心進行長照需求評估。(原2.3.16-符合3修)\n5.有針對相關職類人員進行出院照護計畫之教育訓練，並有紀錄。(原2.3.16-符合4)\n優良項目：(下述項目(不含試評項目)僅限一項未達成)\n1.對於多重用藥或複雜用藥病人，有經過適當用藥整合，以方便後續照護。(試)\n2.每月至少召開 1 次跨領域團隊個案討論會，參加討論成員應有業務相關之醫療專業人員，如：個案主責照護之醫師/專科護理師、護理人員、社工師、復健相關治療人員、藥師、營養師等；會中能針對特殊需求個案之照護計畫，適時檢討修訂，並有紀錄。(原2.3.16-優良2修)\n3.提供之出院照護計畫適切、完整，有評估品質及成效，且有紀錄。(原2.3.16-優良3修)\n4.醫院應為身心障礙者設置服務窗口，提供溝通服務或其他有助於就醫之相關服務。(原2.3.16-優良4修)\n[註]\n1.出院照護計畫係指能評估病人長期性問題的出院準備服務計畫。\n2.若病人為身心障礙者時，應依據身心障礙者權益保障法第 23條之規定，為住院之身心障礙者提供出院準備計畫。身心障礙者權益保障法第 23條內容：「醫院應為住院之身心障礙者提供出院準備計畫；出院準備計畫應包括下列事項：\n(1)居家照護建議。\n(2)復健治療建議。\n(3)社區醫療資源轉介服務。\n(4)居家環境改善建議。\n(5)輔具評估及使用建議。\n(6)轉銜服務。\n(7)生活重建服務建議。\n(8)心理諮商服務建議。\n(9)其他出院準備相關事宜。」\n3.醫院應提供相關保險及社會資源相關資訊或告知院內相關專責部門聯繫方式。\n4.社區資源係指未來可支援的醫院或居家服務等之連繫合作、照護保險、社會資源的申請手續、諮商業務等。\n5.優良項目 1列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.出院照護計畫委員會(小組)會議紀錄。(符合)\n2.出院照護計畫流程。(符合)\n3.病人出院照護計畫。(符合)\n4.相關職類人員出席出院照護計畫之教育訓練紀錄。(符合)\n5.跨領域團隊個案討論會會議紀錄。(優良)\n6.出院病人諮詢服務紀錄。(優良)","cs":"","p":158,"ch":"2.3"},{"n":"2.3.18","tags":["可"],"t":"有適當安寧緩和醫療團隊提供安寧照護服務","ev":"目的：安寧緩和醫療有適當之專業團隊，提供多元化、高品質的安寧照護服務。\n符合項目：1-a.安寧病房：(原2.3.18-符合1-a)\n(1)應有受過安寧緩和醫學訓練之專責主治醫師 1 名，負責安寧緩和醫療團隊相關業務。(原2.3.18-符合1-a-(1)修)\n(2)每床應有護理人員 1 名以上。(原2.3.18-符合1-a-(2)修)1-b.安寧居家療護：(原 2.3.18-符合1-b)\n(1)應有專責主治醫師 1 名以上。\n(2)應有專責護理人員至少 1名，且每月每45 訪視人次應有專任安寧居家療護護理人員 1名以上。(原2.3.18-符合1-b-(2)修)\n(3)應提供安寧療護護理專業人員 24小時電話諮詢服務。\n(4)訂有居家訪視醫療人員的安全保障措施，並有專責之醫護主管負責管理相關事務。(原2.3.18-符合1-b-(4)修)1-c.安寧共同照護：(原 2.3.18-符合1-c)\n(1)應有專責主治醫師 1 名以上。\n(2)應有專責護理人員至少 1名，且每月每30 新收案人數應有專任安寧共同照護護理人員 1名以上。(原2.3.18-符合1-c(2)修)\n2.應有1 名專責社工人員。(原2.3.18-符合2)\n3.安寧居家療護及安寧共同照護護理人員，需具備至少 2 年之內外科(或安寧病房)相關臨床經驗。(原2.3.18-符合 3修)\n4.上述人員均需受過安寧療護教育訓練 80 小時以上。(原 2.3.18-符合4)\n5.安寧緩和醫療團隊組織架構明確，定期召開跨領域專業團隊會議，整合團隊共識，並擬定跨專業的處置計畫。(原2.3.18-符合5修)\n優良項目：(下述項目 1(1-a 至 1-c)依提供之服務，為可選項目，且 1至4項僅限一項未達成)1-a.安寧病房：(原2.3.18-優良1-a)\n(1)50%以上護理人員具 1年以上臨床安寧療護護理經驗。\n(2)夜間及假日能有主治醫師待命，且其需受過安寧療護教育訓練 80小時以上。1-b.安寧居家療護：專任安寧居家護理人員休假時，有明確職務代理制度提供出勤服務。(原2.3.18-優良1-b修)1-c.安寧共同照護：每月每 25新收案人數應有專任安寧共同照護護理人員 1名以上。(原2.3.18-優良1-c修)\n2.安寧緩和醫療團隊之醫師、護理人員及社工人員，每 3 年應接受至少60小時安寧療護相關繼續教育，並有紀錄。(原2.3.18-優良2修)\n3.有受過安寧療護教育訓練專責心理師、志工或靈性關懷人員提供服務，並有紀錄。(原2.3.18-優良3修)\n4.有為各新進專業醫療團隊成員，提供完整標準作業手冊、自學教材(書面或視聽)、輔導計畫及輔導機制。(原 2.3.18-優良4修)\n[註]\n1.未登記設有安寧病房(床)或未向健保署申報甲類安寧居家療護/安寧共同照護給付者，可自選本條全部或部分免評。\n2.護理人力計算結果不得低於醫療機構設置標準之規定。\n3.「內外科相關臨床經驗」：現職醫院及院外其他醫院之工作年資得合併計算。\n4.「臨床安寧療護護理經驗」：包含安寧病房、安寧居家療護及安寧共同照護之工作年資，現職醫院及院外其他醫院之安寧療護工作年資得合併計算。\n5.「靈性關懷人員」之角色任務可包含：\n(1)心靈陪伴：探訪、關懷病人和家屬藉著聆聽、溝通、協談以了解病人和家屬的需求，提供病人和家屬在心靈上的支持、疏導和鼓勵。\n(2)轉介團隊其他人員給予個案安慰與支持。\n(3)關懷臨終者及家屬的哀傷，協助提供喪葬事宜的資訊。\n(4)參與病房之個案討論會議，提出困難個案的看法。\n評量方法及建議佐證資料：\n1.安寧療護工作手冊。(符合)\n2.安寧緩和醫療團隊組織圖。(符合)\n3.居家訪視醫療人員安全保障措施。(符合)\n4.安寧緩和醫療團隊成員證照或受訓、服務紀錄。(符合/優良)\n5.安寧緩和醫療團隊人員排班表。(符合/優良)","cs":"實地評鑑前 6 個月內到職之新進人員，暫不列入本項查核之對象，惟醫院須有後續人員接受教育訓練之期程規劃。","p":160,"ch":"2.3"},{"n":"2.3.19","tags":["可"],"t":"安寧病房應有適當之設施、設備、儀器管理機制，並確實執行保養管理","ev":"目的：安寧病房有適當及功能良好的設施、設備，滿足末期病人需求。\n符合項目：\n1.安寧病房設施、設備、儀器應符合醫療機構設置標準之規定。(原2.3.19-符合1)\n2.有恆溫控制及方便搬運病人進出之臥浴浴缸(如：洗澡機)，並有使用紀錄。(原2.3.19-符合 2修)\n3.有明確制訂各項儀器設備維護的管理保養制度，並確實執行。(原2.3.19-符合3修)\n4.專業人員能正確操作各項儀器設備，瞭解故障排除處理流程，並熟悉相關表格記錄方式。(原2.3.19-符合4)\n優良項目：(下述項目僅限一項未達成)\n1.病房公共區域及病室注重人性化環境之營造，例如：於日常活動空間有可供病人會客的處所與餐桌椅設置，及供家屬準備膳食的場所。(原2.3.19-優良1修)\n2.能提供音樂、藝術、芳香治療或志工工作室等任一種以上服務設施。(原2.3.18-優良2修)\n3.具特色創新服務，具有成效。(原2.3.19-優良 3)\n[註]\n1.未登記設有安寧病房(床)者，可自選本條免評。\n2.病房設施：\n(1)應為可區隔之區域。\n(2)應有供病人坐浴或臥浴之浴廁設備；病室內可提供者，則免設。\n(3)可供面談及供家屬與瀕死病人最後相聚或默禱助念，及家屬度過急性哀傷之獨立空間。\n(4)視需要設置活動治療室。\n(5)應有污物污衣室。\n3.應設病室並符合下列規定：\n(1)應有浴廁設備，並有扶手及緊急呼叫系統。\n(2)每一病室至多設 4 床；每床最小面積(不含浴廁)應有 7.5 平方公尺；如設單床病室者，每床最小面積(不含浴廁)應有9.3平方公尺。\n(3)床尾與牆壁間之距離至少 1.2公尺。\n(4)床邊與鄰床之距離至少 1公尺。\n(5)床邊與牆壁距離至少 0.8公尺。\n(6)床與床之間，應備有隔離視線之屏障物。\n(7)每床應具有床頭櫃及與護理站之呼叫器。\n(8)病床應有床欄並可調整高低。\n(9)每床應有醫用氣體及抽吸設備。\n4.可提供下列儀器設備：輸液幫浦、病人自控式止痛裝置、床旁便盆器、翻身/擺位器材及各式枕頭與床墊、超音波噴霧器、搬運推床及床旁洗頭器具等。\n5.可提供病人日常活動場所，按病床數計，平均每床應有 4.5平方公尺以上(同一平面有戶外活動場所者，得免設)。\n評量方法及建議佐證資料：\n1.安寧病房設施、設備、儀器一覽表、操作手冊及維修保養規範。(符合)\n2.安寧病房設施、設備、儀器維修保養紀錄。(符合)\n3.安寧病房設施、設備、儀器使用紀錄。(優良)\n4.安寧病房環境改善範例。(優良)","cs":"","p":163,"ch":"2.3"},{"n":"2.3.20","tags":["可"],"t":"適當的安寧照護服務管理、收案評估、照護品質、團隊合作與紀錄","ev":"目的：安寧緩和照護組織與團隊運作良好，有效管理相關流程。\n符合項目：\n1.設有行政相關組織，訂定年度目標，並定期召開行政會議檢討安寧照護服務之管理，且作成紀錄。(原2.3.20-符合1)\n2.有明確的收案流程；安寧居家療護收案病人有再入院評估標準。病人收案前，能提供安寧照顧服務理念的書面介紹，及病人/家屬之權利義務說明書。(原2.3.20-符合2)\n3.病人/家屬之照護過程：(原2.3.20-符合3)\n(1)有標準流程以提供舒適護理、疼痛及其他常見症狀臨床評估處置計畫。\n(2)能依病人個別性之需求，提供社會心理靈性需求評估與處置照顧計畫。\n(3)病歷紀錄表格內容，能與病人實際臨床照護連結。\n(4)如設有安寧病房者：有家庭會議召開之標準流程；有出院病人準備計畫(含病危自願返家病人家屬衛教)標準流程。\n(5)如設有安寧居家療護者：有因應病人所需檢驗、治療、及藥物取得之簡化流程，並能為病人代採檢體、代領藥；有完整的安寧居家訪視包攜帶物品清單及管理。\n優良項目：(下述項目僅限一項未達成)\n1.每3個月至少召開一次行政會議，有完整會議紀錄及工作追蹤。(原2.3.20-優良1修)\n2.病歷紀錄內容能呈現包括身、心、社會、靈性層面的評估與處置，病歷有定期審閱檢討機制。(原2.3.20-優良 2 修)\n3.定期舉辦家屬支持團體，可包含成長性、治療性、教育性或社會社交性質的活動，並提供高危險喪親家屬篩選及哀傷輔導之服務或轉介。(原2.3.20-優良3)\n4.對合作醫療機構有雙向的溝通與訓練交流，並提供為末期病人醫療團隊人員教育訓練場所。(原2.3.20-優良4)\n5.訂有全院安寧療護整合照護計畫，及服務品質檢討改善機制，定期針對品質指標及年度目標進行檢討改善。(原2.3.20-優良5)\n[註]\n1.未登記設有安寧病房(床)或未向健保署申報甲類安寧居家療護、安寧共同照護給付者，可自選本條全部或部分免評。\n2.安寧病房、安寧居家療護及安寧共同照護相關議題之會議得合併進行，會議紀錄形式由醫院決定，但內容應有所區分。\n評量方法及建議佐證資料：\n1.安寧療護工作手冊及組織圖。(符合)\n2.安寧療護小組年度工作目標。(符合)\n3.安寧療護簡介單張。(符合)\n4.病人/家屬權利義務說明書。(符合)\n5.紙本或電子病歷。(符合/優良)\n6.家屬支持團體活動紀錄。(優良)\n7.安寧照護相關會議紀錄。(優良)","cs":"","p":165,"ch":"2.3"},{"n":"2.3.21","tags":["合"],"t":"訂有病人臨終前、後之處理流程","ev":"目的：醫療照護團隊尊重臨終病人意願，協助家屬善終處置，並提供哀傷輔導。\n符合項目：\n1.明訂病人臨終前、後之處理規範，尊重臨終病人意願，並提供家屬協助，包含善終(死亡)準備及遺體護理等。(原2.3.21-符合1修)\n2.相關醫療照護團隊成員應接受哀傷輔導的教育訓練。(原2.3.21-符合2修)\n3.協助家屬面對病人臨終的事實，並能依家屬需要，提供探視的環境、哀傷輔導及關懷服務。(原2.3.21-符合3)\n評量方法及建議佐證資料：\n1.病人臨終前、後之處理規範。(符合)\n2.臨終關懷及哀傷輔導相關教育訓練紀錄。(符合)\n3.醫護或社工人員哀傷輔導紀錄。(符合)","cs":"","p":166,"ch":"2.3"},{"n":"2.4.1","tags":[],"t":"適當之急診人力配置及訓練","ev":"目的：依作業量配置具特定資格及能力之急診醫護人員，提供急診醫療服務。\n符合項目：\n1.應有5名以上專任醫師，前三年急診病人就診人次年平均大於20,000人次者，每逾 5,000 人次應增加 1 名專任醫師，前三年每月平均留觀人次每逾600人次應增加1名專任醫師(以健保申報留觀人次為計算基準)；前揭專任醫師中，一半以上需具有急診醫學科專科醫師或兒科專科醫師且受過至少二年兒童急診訓練課程。緊急醫療資源不足地區之醫院，除 5 名專任醫師外，餘可以專科醫師兼任或支援方式為之。(原2.4.1-符合 1修)\n2.兒童急診人次前三年年平均達 10,000人次以上，每 5,000人次應有1名兒科專科醫師，但緊急醫療資源不足地區之醫院不在此限：\n(1)10,000-18,000人次，每個月至少 20%時段。\n(2)18,000-30,000人次，每個月至少 50%時段。\n(3)30,000 人次以上，24 小時全時段。\n3.設有急診加護病房者，應增加 1 名專任醫師，登記之急診加護病床數超過 10 床時，每達 10 床應增加 1 名專任醫師。但緊急醫療資源不足地區之醫院不在此限。\n4.前三年每日平均急診就醫人次每 12 人次應有護理人員 1 名。(原2.4.1-符合 2修)\n5.設有急診觀察床者，每床應增加護理人員 1名。(試)\n6.急診就醫病人應先由急診部門之專科醫師做初步診察排除立即之風險病情後，視需要會診其他專科醫師，一般生產及牙科不在此限。(試)\n優良項目：(下述項目須全部達成)\n1.專任醫師數，其中 75%以上需具有急診醫學科專科醫師或兒童急診醫師資格。(原2.4.1-優良4修)\n[註]\n1.「專任」係指具部定專科醫師資格，且執業執照登記執業場所為該院，執業科別為急診醫學科；每週至多 2個半天(至多8小時)從事非急診部門相關之醫療業務。\n2.人力計算結果不得低於醫療機構設置標準之規定。\n3.專科護理師不列計護理人力。\n4.觀察室登記之急診觀察病床，依據醫療機構設置標準規定，以每月1日於衛生局登記之床數為計算護理人力基準。\n5.設有兒童醫院或本分院者，兩院人力分開計算。\n6.專任醫師數計算公式：\n(1)(前 3年之年平均急診人次-20,000) / 5,000) + 5，以小數點後一位無條件進位方式計算。\n(2)前 3 年每月平均急診留觀人次/600，以小數點後一位無條件進位方式計算。\n(3)專任專科醫師數= (1) + (2)\n7.參與衛生福利部「醫學中心或重度級急救責任醫院支援離島及醫療資源不足地區醫院緊急醫療照護服務獎勵計畫」之支援醫師可納入人力計算。\n8.符合項目 5、6列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.急診醫師清冊。(符合/優良)\n2.急診主治醫師、住院醫師、護理師值班表。(符合/優良)\n3.急診病人就診人次以醫院申報健保「檢傷分類或急診診察費」代碼統計。(符合/優良)\n4.急診留觀人次以醫院申報健保「急診觀察床病房費」代碼計算人日次。(符合/優良)","cs":"「專科醫師」係指領有部定專科醫師證書者，非僅指具急診專科之醫師。","p":168,"ch":"2.4"},{"n":"2.4.2","tags":[],"t":"急診應有適當之設施及完備之設備、儀器、機器，並確實執行保養管理及清潔管理","ev":"目的：急診配置適當之設施、設備及儀器，並有完善管理機制，確保其功能正常，維護照護品質。\n符合項目：\n1.具備施行心肺復甦術或相當處置所需之設備、儀器(確保氣管、人工呼吸器、輸液、輸血及給藥之準備、去顫器(defibrillator)等)，且經常備妥於確實可用狀態。(原2.4.2-符合1)\n2.應有部門或單位負責急診之設施、設備、儀器、機器之保養、檢查及安全管理，並訂有規範，落實執行，有紀錄可查。(原2.4.2-符合2)\n3.明訂保養、檢查的排程，並有紀錄。(原2.4.2-符合3)\n4.訂有異常之管理機制，以因應儀器設備如發生故障時之作業流程。(原2.4.2-符合4修)\n5.急救室、留觀區與急診處內其他作業單位有明確區隔。(原 2.4.2-優良1)\n優良項目：(下述項目(不含試評項目)須全部達成)\n1.對於有特殊需求之病人，如小兒、高齡、身障病人，能提供友善就醫之環境設施與設備。(試)\n2.對疑似家暴性侵害犯罪情事者，有適當區隔空間，以維護病人隱私。(原2.4.2-優良2)\n3.針對上述兩項訂有改善方案，且具成效。(原2.4.2-優良3)\n[註]\n優良項目 1列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.醫療儀器、設備清單。(符合)\n2.醫療儀器、設備、機器負責人名單。(符合)\n3.醫療儀器、設備保養作業標準及查檢紀錄。(符合)\n4.醫療儀器、設備故障異常管理之作業流程及維修紀錄。(符合)","cs":"","p":170,"ch":"2.4"},{"n":"2.4.3","tags":[],"t":"依醫院的角色任務，提供急救病人處置能力","ev":"目的：訂有符合急診病人醫療需求及轉診之各項處置流程，並依法處理有特殊需求之病人，提供特殊服務。\n符合項目：\n1.依醫院定位訂有急診病人的就醫準則與流程，提供緊急檢查、診斷、住院、手術等急救的醫療處置能力。(原2.4.3-符合1)\n2.在醫院無法接受病人時，應先給予適當之急救，並依相關機制聯絡，及運送病人至其他醫療機構。(原2.4.3-符合 2)\n3.應訂定有急診精神科病人之醫療作業處理準則與流程，及病人轉介系統，包含：(原2.4.3-符合3修)\n(1)遵守精神衛生相關法規，並依適當程序呈報或進行相關醫療事宜。\n(2)急診病人安排住院或轉介他院之流程。\n4.對於急診就醫個案，知其有疑似遭家庭暴力(含兒童與少年虐待及疏忽)或性侵害犯罪情事者，應訂有處理作業準則，並依法通報。(原2.4.3-符合 4)\n5.轉出時應提供轉診病歷摘要。(原2.4.3-符合 5)\n優良項目：(下述項目僅限一項未達成)\n1.對需急救病人訂有緊急處置流程，及定期檢討評估機制。(原 2.4.3-優良1)\n2.可完成檢查及報告、住院、手術等相關緊急處置作業。(原 2.4.3-優良2)\n3.對特殊病人(如家暴、性侵受害人)訂有處理流程，且提供社工諮商和轉介服務。 (原2.4.3-優良3修)\n4.轉送病人過程皆有評估紀錄，必要時有醫師指導救護人員，執行緊急醫療救護行為。(原2.4.3-優良4)\n5.定期檢討評估，訂有改善方案，且具成效。(原2.4.3-優良5)\n[註]\n1.救護人員包括醫師、護理人員、救護技術員。\n2.醫療法第 60條第1項：醫院、診所遇有危急病人，應先予適當之急救，並即依其人員及設備能力予以救治或採取必要措施，不得無故拖延。\n3.醫療法第 73條：醫院、診所因限於人員、設備及專長能力，無法確定病人之病因或提供完整治療時，應建議病人轉診。但危急病人應依第六十條第一項規定，先予適當之急救，始可轉診。前項轉診，應填具轉診病歷摘要交予病人，不得無故拖延或拒絕。\n4.應依家庭暴力防治法第 50 條、性侵害犯罪防治法第 11 條、兒童及少年福利與權益保障法第 53條規定辦理。\n評量方法及建議佐證資料：\n1.急診病人就醫準則與流程。(符合)\n2.急診病人轉診或轉出作業流程或規範。(符合)\n3.急診精神科病人醫療作業處理準則與流程。(符合)\n4.急診疑似遭家庭暴力(含兒童與少年虐待及疏忽)或性侵害犯罪情事處理作業準則。(符合)\n5.病人轉送之評估紀錄。(符合/優良)\n6.急診委員會或全院性急診品質審查會議相關會議紀錄。(符合)\n7.急救病人緊急處置流程。(優良)\n8.特殊病人急診處理準則及流程。(優良)","cs":"","p":171,"ch":"2.4"},{"n":"2.4.4","tags":[],"t":"建置適當的急診診療科支援機制","ev":"目的：依任務提供適當之急診會診，以因應就診病人完整醫療需求。\n符合項目：\n1.應依醫院之角色任務，建置適當的會診機制。(原2.4.4-符合1修)\n2.急診得視醫療業務需要提供適當專科會診，如有會診重大傷病(如急性缺血性腦中風、ST段上升之急性心肌梗塞、緊急外傷)，70%以上應於 30 分鐘到場。(原2.4.4-符合2修)\n優良項目：(下述項目須全部達成)\n1.會診機制：(以下須達成至少兩項)(原2.4.4-優良1、2併)\n(1)急性缺血性腦中風病人接受靜脈血栓溶解治療時間＜60 分鐘之比例達 30%以上。\n(2)急性缺血性腦中風個案，醫院可常規執行動脈內取栓治療。\n(3)ST 段上升之急性心肌梗塞病人執行緊急冠狀動脈介入術(Primary PCI)時，Door to wire time小於90 min 之達成率需符合 75%以上；接收同一醫療體系之分院或院區之轉診者，其 Door to wire time應小於 60分鐘，達成率需符合70%以上。\n(4)緊急外傷手術於 30 分鐘內進入手術室比率，達成率需符合 80%以上。\n2.針對上述兩項有定期檢討評估並訂有改善方案，且具成效。(原2.4.4-優良3)\n[註]\n1.急性缺血性腦中風病人接受靜脈血栓溶解劑治療時間，係指病人抵達急診之時間與護理紀錄開始施打靜脈血栓溶解劑時間之差。\n2. Primary PCI 之計算標準：以病人抵達急診至導絲(wire)通過的時間計算。\n3.緊急外傷手術係指重大胸腹部外傷，致生命徵象不穩定需緊急手術者。本項係指手術通知至病人進入手術室內所需時間之達成比率。\n4.「手術通知」係指緊急外傷手術由急診通知手術室之作業，可於急診醫師開立醫囑或是手術室手術通知單呈現(時間紀錄方式由醫院自行規範)起計算。\n5.以上急診會診計算係以診療區之急性病人，觀察區不列入計算。\n評量方法及建議佐證資料：\n1.急診會診規範。(符合)\n2.急診照會科別之值班清單。(符合)\n3.急診會診個案統計表及時效分析等。(符合/優良)\n4.提供急性缺血性中風病人處置流程，及急性缺血性腦中風發作 2 小時內抵達醫院之病人之 NIHSS 評分表。(符合)\n5.提供急性冠心症病人處置流程，應含：(1)急診處置流程、(2)心導管室處置流程、(3)住加護病房流程等。(符合)\n6.提供急診病人中接受靜脈血栓溶解劑(rt-PA)治療之病人人次及比例。(優良)\n7.提供全年全院冠狀動脈介入術(PCI)及緊急冠狀動脈介入術(Primary PCI)之案例數及比例。(優良)\n8.提供醫院每月之手術與緊急外傷手術統計資料。(符合/優良)","cs":"","p":173,"ch":"2.4"},{"n":"2.4.5","tags":[],"t":"具備完善的急診醫事人員與警衛輪班制度","ev":"目的：訂有合宜之急診醫事人員輪班制度，及預防危機之管理機制，維護病人服務品質及工作人員安全。\n符合項目：\n1.應有適當醫事人員輪班或支援制度，有藥師、醫事檢驗師、醫事放射師、呼吸治療師等醫事人員輪班或支援制度。(原2.4.5-符合1、優良1-(1)併)\n2.應有24小時警衛或保全人員，且設有警民連線或報案機制。(原2.4.5-符合2)\n優良項目：(下述項目(不含試評項目)須全部達成)\n1.對於重大緊急傷病的緊急治療，如緊急心導管或介入性動脈栓塞治療，應安排適當醫事人員支援，成效良好。(試)\n2.具有完整之輪班制度及對突發事件有危機管理機制，並定期檢討改善。(原 2.4.5-優良2)\n[註]\n優良項目 1列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.醫事人員班表。(符合)\n2.醫事人員輪班或支援制度。(符合)\n3.警衛或保全人員班表。(符合)\n4.與輪班制度相關之會議討論及檢討紀錄或實例呈現。(優良)\n5.急診突發事件處理流程與檢討會議。(優良)","cs":"","p":175,"ch":"2.4"},{"n":"2.4.6","tags":[],"t":"應有急診病人醫療、救護處理之適當性及品質檢討分析與改善","ev":"目的：針對急診各項醫療服務品質，有適當之管理機制，確保照護品質。\n符合項目：\n1.設有急診委員會或相關組織，每季舉行全院性急診品質審查會議，並有會議紀錄與檢討改進，確保急診管理與品質促進。(原 2.4.6-符合1、優良 1併)\n2.訂有急診醫療品質相關指標，包含：(原2.4.6-符合2)\n(1)病人置留急診 24及 48小時以上之比率。\n(2)72小時內回診病人比率。\n(3)急診等候入住加護病房超過 6 小時以上之比率。(原 2.4.6-符合 2-\n(3)修)\n(4)等候手術時間超過 60分鐘的人數及比率。\n3.上述指標應定期收集分析，製成報告。(原 2.4.6-符合3)\n優良項目：(下述項目須全部達成)\n1.對急診病人醫療處理之適當性有做檢討與分析。(原2.4.6-優良2)\n2.有具體急診醫療處置、緊急救護品質及轉診病人適當性之改善方案或措施。(原2.4.6-優良 3)\n[註]急診等候手術時間之收案對象，係指醫囑開立為緊急手術之急診病人，其等候時間以開立醫囑或是手術室手術通知單呈現(時間紀錄方式由醫院自行規範)之時間起算。\n評量方法及建議佐證資料：\n1.急診委員會或相關組織的會議紀錄。(符合)\n2.急診品質審查會議紀錄。(符合)\n3.急診相關醫療品質指標監測紀錄、統計資料及會議討論紀錄。(符合)\n4.急診相關病例討論會議紀錄或實例呈現。(優良)\n5.急診品質改善方案佐證資料，如：品管圈、教案教學、得獎紀錄等。(優良)","cs":"有關急診醫療品質相關指標可依醫院自行定義。","p":176,"ch":"2.4"},{"n":"2.4.7","tags":[],"t":"適當之加護病房組織及人力配置","ev":"目的：依加護病房床數配置醫護人員，並設有行政及值班機制，提供適當醫療照護。\n符合項目：\n1.醫師人力：\n(1)全院加護病床每 10 床應有1名專責專科主治醫師以上。(原2.4.7-符合 1修)\n(2)設置一個以上加護病房時，每一加護病房至少應有 1 名專責專科醫師之配置。\n(3)專責專科醫師應有重症加護相關訓練或接受相關訓練。(試)\n(4)應設有加護病房主任，負責行政相關業務。(原2.4.7-符合3修)\n(5)24 小時有醫師(不含第一年畢業後一般醫學訓練醫師)於加護病房值班，醫師於加護病房值班不得兼值其他病房、一般會診及手術(緊急會診不在此限)。\n2.護理人力：(原2.4.7-符合2)\n(1)申請地區醫院評鑑者：每床應有 1.5人。\n(2)申請區域醫院評鑑者：每床應有 2人。\n(3)申請醫學中心評鑑者：每床應有 2.5人。\n優良項目：(下述項目僅限一項未達成)\n1.專責住院醫師或值班醫師須領有高級心臟復甦術(ACLS)證書，或因應不同性質之加護病房 NRP、ATLS、ANLS、APLS、PALS 等皆可。(原2.4.7-優良2修)\n2.假日、夜間為專科訓練第二年以下住院醫師值班者，應有較資深醫師二線值班(須有二線排班表佐證)。(原2.4.7-優良3修)\n3.護理人力應符合項目要求之 1.10倍。(原2.4.7-優良4修)\n[註]\n1.專責係指執業登記於該院之專科醫師，每週(週一至週五)至多 3 個半天可從事其他醫療業務或手術，其餘時間皆負責加護病房業務。但新生兒科加護病床少於 10床者，不在此限。\n2.專責專科醫師須接受重症加護相關訓練：\n(1)須具內科、兒科、外科、神經外科、神經科、麻醉科、急診醫學科或職業醫學科專科醫師資格。\n(2)應接受一年以上重症加護專業訓練，並領有證明。\n(3)領有進階生命支持術(ALS)證書，或因應不同性質之加護病房ACLS、NRP、ATLS、ANLS、APLS、PALS 等皆可。\n3.人力計算基準：\n(1)人力計算結果不得低於醫療機構設置標準之規定。\n(2)若評鑑基準高於醫療機構設置標準，病床數得考量年平均佔床率計算，並以四捨五入取至整數位。\n(3)加護病房每 10 床應有專責專科醫師 1 人以上之計算方式：全院加護病床數/10。(專責專科醫師數取整數，以小數點第一位無條件進位)。\n4.符合項目 1-(3)列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.加護病房醫師人力配置及值班表。(符合)\n2.加護病房護理人力配置及班表。(符合)\n3.加護病房專責住院醫師與值班醫師高級心臟復甦術(ACLS)證書。(優良)\n4.加護病房專責主治醫師重症加護相關證書或接受相關訓練證書。(優良)","cs":"1.護理人力計算，共有下列二種認計原則，醫院可擇一列計：\n(1)醫院各加護病房需分開評量，且至少有七成之加護病房符合相關要求。\n(2)以各加護病房之床數加總後合併計算人力，需符合相關要求。\n2.有關本項基準查證方式包含：\n(1)醫院填報之醫院評鑑補充資料表數據。\n(2)實地評鑑當日抽查之加護病房護理人力。\n3.可參考醫院填報之補充資料表第 2篇「八、加護病房 3.加護病房護理人力及素質資料表」，及當日加護病房實際護理人力數據判定是否符合。\n4.上述之補充資料表數據、及實地評鑑當日抽查之結果，兩者皆符合，即視為符合。","p":177,"ch":"2.4"},{"n":"2.4.8","tags":[],"t":"加護病房備齊相關設施、設備及儀器，並應定期保養、維護，且有紀錄可查","ev":"目的：加護病房設置適當之設施、設備及儀器，並有完善管理機制，確保其功能正常，維護病人隱私及照護品質。\n符合項目：\n1.病床床距間隔適當，且有隔離視線之隔簾或隔間，以保障隱私。(原2.4.8-符合 1修)\n2.應有部門負責加護病房之設施、設備、儀器之保養、檢查及安全管理，訂有規範與排程，且有紀錄可查。(原 2.4.8-符合2、3併)\n3.設置儀器異常管理機制，以因應故障時之作業流程。(原 2.4.8-符合4)\n4.每床均有洗手設備(含乾洗手)，每2床有1 個濕洗手設備。(原2.4.8-符合5、6併)\n5.具有移動式數位 X 光機、超音波、血液透析的設備。(原 2.4.8-優良4修)\n優良項目：(下述項目須全部達成)\n1.設有隔離室。(原2.4.8-優良2)\n2.對於設施設備的安全操作，需有防錯機制，如：血液透析、超音波、呼吸器的使用等。(試)\n3.運用智能化相關設備，增進病人安全與照護品質。(試)\n[註]\n優良項目 2、3列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.醫療儀器、設備保養作業標準及查檢紀錄。(符合)\n2.醫療儀器、設備故障異常管理之作業流程及維修紀錄。(符合)\n3.參考衛生局督導考核查證結果。(符合/優良)","cs":"所稱「濕洗手設備」以訪查成人加護病房為主，新生兒及兒科加護病房除外。","p":179,"ch":"2.4"},{"n":"2.4.9","tags":[],"t":"良好的加護病房管理","ev":"目的：訂有加護病房之各項作業規範、品質指標，及定期會議檢討執行成效，確保服務品質。\n符合項目：\n1.設有加護病房管理委員會，定期開會檢討加護病房管理與品質指標監測機制。(原2.4.9-符合1修)\n2.訂定加護病房轉入轉出及運用原則(含轉入優先順序)、具體步驟及客觀評估標準並確實執行且有紀錄。(原2.4.9-符合2)\n3.出入加護病房時及進入加護病房 24小時內，使用評估工具評估疾病嚴重程度，並應監測下列各項醫療品質指標、定期分析檢討：(原2.4.9-符合 4、優良1併)\n(1)收案適當性與嚴重度。\n(2)急診等候入加護病房超過 6小時以上比率。\n(3)48小時重返加護病房比率。\n(4)住院超過 14天人次。\n(5)加護病房死亡原因。\n(6)加護病房感染率(或密度)。\n(7)轉院及自動出院。\n優良項目：\n1.能針對加護病房品質指標的監測結果，檢討改善並具有成效。(試)\n2.應推動各項組合式感染管制措施(bundle intervention)，如：BSI、VAP、UTI、SSI、ASP 等，且持續檢討改善。(試)\n[註]\n優良項目 1、2列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.加護病房管理委員會或相關組織設置辦法及會議紀錄。(符合)\n2.加護病房轉入轉出及運用原則。(符合)\n3.加護病房抽查個案或定期收治病人適當性統計資料。(符合)\n4.加護病房相關醫療品質指標監測紀錄及統計資料及會議討論紀錄。(符合/優良)\n5.品質改善活動佐證資料，如：品管圈、教案教學、得獎紀錄等。(優良)","cs":"","p":180,"ch":"2.4"},{"n":"2.4.10","tags":[],"t":"良好的加護病房醫療團隊照護","ev":"目的：透過加護病房團隊照護，提供重症病人跨領域與跨科別之醫療需求。\n符合項目：\n1.加護病房醫師每日應查房至少 2 次，並有紀錄。(原 2.4.9-優良 3-(1)修)\n2.加護病房醫師對病人轉出入，及每日交接班應有交班並有紀錄。(原2.4.9-符合 3修)\n3.呼吸器的使用有治療參數與連續照顧之紀錄。(原2.4.9-符合5修)\n4.應有跨領域照護團隊溝通與合作機制(醫師、護理師、臨床藥師、呼吸治療師、復健治療人員、社工師、營養師等)，如團隊查房、團隊會議等，並有紀錄。(試)\n5.召開病人家庭會議，參與醫病共享決策(SDM)，決定重大醫療計畫或協助病人出院準備計畫，並有紀錄。(試)\n6.定期舉行病例討論會、死亡病例及異常事件檢討。(原 2.4.9-優良 4-\n(1)修)\n優良項目：(下述項目(不含試評項目)須全部達成)\n1.具備呼吸治療品質監測指標，且有具體改善成效。(原 2.4.9-優良 2修)\n2.跨領域照護團隊之團隊查房，每週至少 3次，除醫師與護理師之外，臨床藥師、呼吸治療師、復健治療人員、社工師、營養師等每次至少有2 種職類人員參與，且成效良好。(試)\n3.如有跨科別醫師共同照護，應有溝通合作機制，且成效良好。(試)\n4.運用實證醫學與醫病共享決策(SDM)，實施成效良好。(試)\n5.推動重症安寧療護，落實病人自主。(試)\n[註]\n符合項目 4、5及優良項目2、3、4、5列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.加護病房跨領域照護團隊照護計畫。(符合/優良)\n2.加護病房跨領域照護團隊清冊、病歷紀錄與團隊會議紀錄。(符合/優良)\n3.加護病房跨科別醫師共同照護計畫與紀錄。(符合/優良)\n4.跨領域照護團隊實際照護計畫、病歷紀錄、團隊會議紀錄。(優良)\n5.生命末期出院病人準備計畫、病歷紀錄、家庭會議紀錄。(優良)","cs":"","p":181,"ch":"2.4"},{"n":"2.4.11","tags":[],"t":"加護病房護理人員須依其特性及護理人員需要，安排在職教育訓練，並評核其能力","ev":"目的：加護病房護理人員應具一定資歷，並接受在職訓練，提供適當護理服務。\n符合項目：\n1.依單位特性及護理人員需要，每年應有院內外之重症照護相關訓練至少12 小時。(原2.4.10-符合1、優良1併)\n2.加護病房工作 2 年以上且領有加護訓練證書及 ACLS 證書，或因應不同性質之加護病房 NRP、ATLS、ANLS、APLS、PALS 等皆可，佔加護病房護理人員數之比例≧50%。(原 2.4.10-符合 2修)\n優良項目：(下述項目須全部達成)\n1.加護病房工作 2 年以上且領有加護訓練證書及 ACLS 證書，或因應不同性質之加護病房 NRP、ATLS、ANLS、APLS、PALS 等皆可，佔加護病房護理人員數之比例≧60%。(原 2.4.10-優良2修)\n2.定期進行能力評估之檢討改善。(原2.4.10-優良3修)\n[註]護理人員應具備加護護理能力，包括：重症護理知能、儀器操作、危急狀況之預測、緊急處置能力、病人問題的評估與處理等。\n評量方法及建議佐證資料：\n1.加護病房護理人員重症照護相關訓練紀錄。(符合)\n2.加護病房護理人員加護訓練證書及 ACLS 證書。(符合)","cs":"1.若加護病房的新進護理人員於當年度所接受的加護訓練，若其課程內容與該加護病房特性之課程相關，即可列計。\n2.若為多個加護病房，其護理人員之重症照護相關訓練、年資及證書比例應分開列計。\n3.護理人員可附加計算院外同等級或以上醫院之加護病房臨床年資及訓練。","p":182,"ch":"2.4"},{"n":"2.4.12","tags":["試","必"],"t":"適當之精神照護人力配置","ev":"目的：依醫院層級及精神醫療服務量，配置適當專業人力，確保照護品質。\n符合項目：\n1.精神醫療人力：(原2.4.11-符合1)\n(1)申請地區醫院評鑑者：精神醫療職能治療人員：有專責精神醫療職能治療人員；且精神醫療職能治療人員數：精神急性一般病床、精神慢性一般病床、精神科加護病床及精神科日間照護單位合計，每 35床應有1 名。(35 床以下可以特約人員兼任，惟每週需工作 8 小時以上。)精神醫療社會工作人員：有專責精神醫療社會工作人員；且精神醫療社會工作人員數：精神急性一般病床每 30 床應有1名、精神慢性一般病床及精神科日間照護單位每 75床應有1名。臨床心理人員：有專責臨床心理人員；且臨床心理人員數：精神急性一般病床、精神慢性一般病床、精神科加護病床及精神科日間照護單位合計，每75床應有1 名。(75 床以下可以特約人員兼任，惟每週需工作 8小時以上。)\n(2)申請區域醫院評鑑者：精神醫療職能治療人員：有專任精神醫療職能治療人員；且精神醫療職能治療人員數：精神急性一般病床、精神慢性一般病床、精神科加護病床及精神科日間照護單位合計，每 35床應有1 名，其中職能治療師比例應達1/2。精神醫療社會工作人員：有專任精神醫療社會工作人員；且精神醫療社會工作人員數：精神急性一般病床每 30 床應有1名、精神慢性一般病床及精神科日間照護單位每 60床應有1名。臨床心理人員：有專責臨床心理人員；且臨床心理人員數：精神急性一般病床、精神慢性一般病床、精神科加護病床及精神科日間照護單位合計，每 50床應有1 名。\n(3)申請醫學中心評鑑者：精神醫療職能治療人員：專任精神醫療職能治療人員至少應有2 名；且精神醫療職能治療人員數：精神急性一般病床、精神慢性一般病床、精神科加護病床及精神科日間照護單位合計，每30 床應有1名、精神科門診每月平均5,000 人次以上需增1名。精神醫療社會工作人員：專任精神醫療社會工作人員至少有 2名；且精神醫療社會工作人員數：精神急性一般病床每 30床應有 1名、精神科日間照護單位每60床應有 1名、精神科門診每月平均 3,000人次以上需增1名。臨床心理人員：專任臨床心理人員至少有 2 名；且臨床心理人員數：精神急性一般病床、精神慢性一般病床、精神科加護病床及精神科日間照護單位合計，每 30 床應有1名、精神科門診每月平均 3,000 人次以上需增 1 名，其中經臨床心理師考試及格並依心理師法領有臨床心理師證書者、或具臨床心理學碩士學位以上者合計佔 75%以上。\n2.依據醫院住院及門診病人組成，確保備有適宜的工作人員以提供恰當的服務。(原2.4.11-符合2)\n優良項目：(下述項目僅限一項未達成)\n1.精神醫療人力達符合項1-(3)之1.10倍以上(含)。(原2.4.11-優良1修)\n2.依精神衛生法及醫療法之規定，訂定病人權利與病人安全相關作業及流程，且工作人員均知悉。(原2.4.11-優良 2)\n3.工作人員確實遵行優良項目 2 所述之相關作業及流程，定期業務檢討改善，改善成效良好。(原2.4.11-優良3)\n[註]\n1.本條為試評條文，評量結果不納入評鑑成績計算。\n2.各類病床數以登記開放數計，並依實際設置情形計算人力。\n3.人力計算時：\n(1)人力計算結果不得低於醫療機構設置標準之規定。\n(2)若評鑑基準高於醫療機構設置標準，病床數得可考量年平均佔床率計算，並以四捨五入取至整數位。\n(3)同類別人力之各項計算結果，加總後以四捨五入取至整數位。\n評量方法及建議佐證資料：\n1.依申請評鑑類別之門診、住院、精神科加護病房、日間病房等服務資料，提供其精神醫療人力(近四年逐年統計)。(符合/優良)\n2.病人權利與病人安全之相關作業內容，實施流程、定期檢討改善，並有成效之事證。(優良)","cs":"","p":183,"ch":"2.4"},{"n":"2.4.13","tags":["可"],"t":"精神科日間照護業務應提供以病人為中心之治療模式","ev":"目的：提供以病人為中心的精神科日間照護，確保病人安全。\n符合項目：\n1.醫療團隊提供個別生活訓練、服藥訓練、工作能力訓練、社交技巧訓練、家庭關係強化等復健服務。(原2.4.12-符合1)\n2.於從事勞務作業前，應經團隊審慎評估，及向病人說明。\n3.訂有入出院標準及流程。(原2.4.12-符合2)\n4.日間照護環境需要注重病人安全相關措施(如防自殺、防跌等)。(原2.4.12-符合3修)\n優良項目：(下述項目僅限一項未達成)\n1.作業環境優良。(原2.4.12-優良1)\n2.業務執行能符合個別化之復健治療目標。(原2.4.12-優良2)\n3.有定期的業務檢討改善或創新服務模式。(原2.4.12-優良3修)\n[註]未設有精神科日間照護單位者，可自選本條免評。\n評量方法及建議佐證資料：\n1.日間照護治療服務簡介。(符合)\n2.入出院標準及流程。(符合)\n3.符合病人安全環境的相關措施資料及現場查證。(符合)\n4.建立及保持環境優良的相關資料及現場查證。(優良)\n5.個別化之復健治療評估和服務計畫，及實際查證時可抽查病歷。(優良)\n6.業務檢討改善之紀錄和成效分析，或創新服務之具體服務內容和成效分析。(優良)","cs":"","p":186,"ch":"2.4"},{"n":"2.4.14","tags":[],"t":"精神科能提供特殊病例治療業務","ev":"目的：配合政策，提供家暴、性侵害、酒藥癮、自殺防治等治療業務。\n符合項目：\n1.提供家暴(含兒少保護)或性侵害被害人之身心治療。(原 2.4.13-符合1)\n2.提供酒藥癮或自殺防治等特殊治療業務。(原2.4.13-符合2)\n優良項目：(下述項目(不含試評項目)僅限一項未達成)\n1.能提供家暴(含兒少保護)、性侵害加害人之身心治療或輔導教育業務。(原 2.4.13-優良1)\n2.成立藥癮、酒癮及自殺防治中心，提供 24 小時對外諮商服務，並有相關業務成果。(原2.4.13-優良2)\n3.定期業務檢討改善，成效良好。(原2.4.13-優良3修)\n4.積極參與藥癮、酒癮及自殺防治預防治療之相關研究。(試)\n[註]\n優良項目 4列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.家暴(含兒少保護)或性侵害被害人之身心治療服務方案內容，及服務統計資料。(符合)\n2.酒藥癮或自殺防治服務方案內容，及服務統計資料。(符合)\n3.家暴(含兒少保護)、性侵害加害人之身心治療或輔導教育之方案內容，及服務統計資料。(優良)\n4.成立酒癮、藥癮及自殺防治中心之事實資料，及提供相關業務成果之資料。(優良)\n5.業務檢討改善之紀錄及成效分析。(優良)\n6.提供藥癮、酒癮及自殺防治預防治療之相關研究佐證。(優良)","cs":"","p":187,"ch":"2.4"},{"n":"2.4.15","tags":[],"t":"依病人需求提供適宜的精神科職能治療服務","ev":"目的：精神科職能治療服務訂有作業流程並落實執行。\n符合項目：\n1.職能治療業務應訂有詳細的職能治療工作手冊，內含各類業務標準化作業流程、活動/團體企劃書、評估、治療和檢討等。(原2.4.14-符合1)\n2.提供合適的職能治療活動及服務時數，並公布活動時間表，且確實執行。(原2.4.14-符合 2修)\n3.應有病人出席職能治療活動之紀錄，並將紀錄和報告夾貼病歷或記入電子病歷內。(原2.4.14-符合3)\n優良項目：(下述項目僅限一項未達成)\n1.職能治療作業應於期限內(急性 3~7 天，慢性 1~3 月)對病人有涵蓋生理、心理、社會層面之評估與治療。(原 2.4.14-優良1)\n2.提供或轉介社區復健、職業復健和有預防慢性化之措施。(原2.4.14-優良2 修)\n3.有評估及改善上項措施成效之機制，成效良好。(原2.4.14-優良3)\n評量方法及建議佐證資料：\n1.職能治療工作手冊(含詳細內容)。(符合)\n2.職能治療活動及服務時數之執行資料。(符合)\n3.評鑑時依委員指示提供病歷佐證病人參加職能治療活動及內容。(符合)\n4.病人住院後接受職能治療之生理、心理、社會評估與治療內容。(優良)\n5.社區復健、職業復健和有預防慢性化之措施之方案內容。(優良)\n6.社區復健、職業復健和有預防慢性化之評估和改善機制，及分析成效。(優良)","cs":"","p":188,"ch":"2.4"},{"n":"2.4.16","tags":[],"t":"依病人需求提供適宜的精神科社會工作服務與服務品質","ev":"目的：精神科社會工作服務訂有作業流程並落實執行，符合病人要求。\n符合項目：基本服務事項完備，包含：\n1.訂有精神社工作業手冊(內含專業倫理守則)，且落實執行。(原2.4.15-符合 1)\n2.提供個別、夫妻、家族治療或團體治療服務。(原2.4.15-符合2)\n3.主動協助病人及家屬獲得社會資源及提供病人社區轉介服務。(原2.4.15-符合3)\n4.應訂有出院準備服務計畫之流程，並依病人需求提供服務。(原2.4.15-符合4)\n5.社工作業應備有接案評估、處遇過程及結案紀錄。(原 2.4.15-符合5)\n優良項目：(下述項目僅限一項未達成)\n1.紀錄完備，並有定期追蹤檢討。(原2.4.15-優良1)\n2.針對服務檢討改善，改善成效良好。(原2.4.15-優良2)\n3.有創新服務措施，成效卓著。(原2.4.15-優良 3修)\n評量方法及建議佐證資料：\n1.精神科社工作業手冊，含完整之服務內容，服務流程及報告內容。(符合)\n2.社工服務紀錄。(符合/優良)\n3.業務檢討改善及成效分析之資料。(優良)\n4.創新服務之具體服務內容及成效分析。(優良)","cs":"","p":189,"ch":"2.4"},{"n":"2.4.17","tags":[],"t":"依病人需求提供適宜的精神科臨床心理服務與服務品質","ev":"目的：精神科臨床心理服務訂有作業流程並落實執行，符合病人要求。\n符合項目：\n1.訂有臨床心理作業手冊(內含專業倫理守則)，且落實執行。(原2.4.16-符合1)\n2.醫院應依病人特性，發展適當之心理衡鑑與心理治療作業。(原2.4.16-符合2)\n3.心理衡鑑與心理治療服務種類各有四種以上。(原2.4.16-符合3)\n4.針對病人特性提供包含預防性、治療性或復健性之心理衡鑑與心理治療業務。(原2.4.16-符合4)\n5.心理衡鑑及心理處置紀錄，應依法規獨立妥善管理，並將衡鑑報告及處置摘要置入病歷中。(原2.4.16-符合5)\n優良項目：(下述項目僅限一項未達成)\n1.病歷之記載完整、詳實，並有定期追蹤檢討。(原2.4.16-優良1)\n2.依病人需要正確執行心理衡鑑，並於報告單上記錄處置內容、具體結論與建議，以提供醫療團隊參考。(原2.4.16-優良2)\n3.有創新服務措施，成效卓著。(原2.4.16-優良 3修)\n評量方法及建議佐證資料：\n1.臨床心理作業手冊(含完整之服務內容、服務流程及報告內容)。(符合)\n2.臨床心理服務報告/紀錄。(符合/優良)\n3.創新服務之具體服務內容及成效分析。(優良)","cs":"","p":190,"ch":"2.4"},{"n":"2.4.18","tags":[],"t":"由適當醫療照護團隊提供透析照護服務","ev":"目的：依透析床數及業務量，配置符合資格及完成相關訓練之醫護人員，提供適當的照護服務。\n符合項目：\n1.每15 張血液透析治療床應有專科醫師 1名以上，且其中應有 1/2 具有內科或兒科專科醫師資格，並經完整腎臟醫學訓練與血液透析治療訓練，其餘醫師亦應經血液透析治療訓練，並領有證明文件。(原2.4.17-符合1)\n2.每位血液透析護理人員照顧 4 位門診血液透析病人。每位腹膜透析護理人員至多照顧 35位腹膜透析病人。(原 2.4.17-符合2)\n3.每位護理人員(含血液透析及腹膜透析)應於到職一年內完成至少 16小時血液透析基礎訓練課程，三年內完成 24 小時進階訓練課程，之後每年至少接受 4小時之在職專業教育。(原2.4.17-符合3修)\n優良項目：(下述項目僅限一項未達成)\n1.每15 張血液透析治療床應有內科專科醫師 1名以上，且全部接受過完整腎臟醫學訓練。(原2.4.17-優良1修)\n2.每位護理人員照顧至多3位住院血液透析病人(包含急重症及加護病房)，且每位腹膜透析護理人員至多照顧 30 位腹膜透析病人。(原2.4.17-優良2修)\n3.前項符合條文中之護理人員，60%(含)以上具備臨床透析護理工作三年以上經驗。(原2.4.17-優良3修)\n評量方法及建議佐證資料：\n1.透析人員(醫師、護理師)證照及教育訓練資料。(符合)\n2.透析床數、服務量。(優良)\n3.醫護排班表。(符合/優良)","cs":"1.符合項目 2 所提「每位血液透析護理人員照顧 4位血液透析病人」，以「護病比」進行查核。\n2.符合項目 3：\n(1)有關 16 小時血液透析基礎訓練課程只要上過一次課即可，惟請於到職一年內完成。\n(2)24 小時進階訓練課程可參考繼續教育訓練的時數或積分。\n(3)教育訓練時數之認定，均以「小時」計；若採學分制之教育訓練，則請醫院以該學分所對應之課程表時數進行統計。\n(4)訓練方式可包括如院內訓練、院外 訓 練 或 實 務 訓 練 (on site training)…等；另，課程內容可參考腎臟相關學會(如：臺灣腎臟護理學會及台灣腎臟醫學會)之認證。","p":190,"ch":"2.4"},{"n":"2.4.19","tags":[],"t":"建立透析照護服務設施、設備、儀器管理機制，確實執行","ev":"目的：配置適當之透析照護設施、設備及儀器，並有完善管理機制，確保其功能正常，維護照護品質。\n符合項目：\n1.各項儀器設備皆備有相關說明書及操作手冊，並制訂有明確的各項儀器設備維護相關規章管理制度及確實執行。(原2.4.18-符合1修)\n2.應有合格之醫技人員(醫工)或合約廠商，負責定期執行透析機之檢查、日常保養及維修，並有故障排除處理流程與紀錄。(原2.4.18-符合2)\n3.應有合格之醫技人員(醫工)或合約廠商，負責每月定期檢查及實施管路保養、消毒，且備有管路有效消毒濃度與殘留檢測之規範文件及紀錄，耗材應依規定定期更換，並有紀錄。(原2.4.18-符合3)\n4.水處理室環境合宜，系統設備與管路固定良好，單位有專責人員負責 RO 水處理系統，日常檢視餘氯檢驗、食鹽添加之抄表紀錄並有異常故障排除處理流程，且耗材應依規定定期更換，並有紀錄。(原2.4.18-符合4修)\n5.針對血液透析單位，至少每週檢測一次水中殘餘物質，包括硬度、導電度、餘氯等，每年檢測一次水中重金屬含量，結果並至少符合AAMI (Association for the Advancement of Medical Instrumentation)之標準，備有完整紀錄供評估。(原2.4.18-符合 5修)\n6.全院可施行血液透析的單位，各種管路接頭應標示清楚，且有防呆設計，避免誤接；透析機使用之各種溶液空桶應定期回收，避免改盛其他液體。(試)\n優良項目：\n1.透析照護之各項設施、設備、儀器管理落實，成效良好。(試)\n2.為因應設施設備發生重大事故，有建立備援計畫或機制，並有演練紀錄。(試)\n[註]\n符合項目 6 及優良項目 1、2 列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.各項儀器設備相關說明書及操作手冊。(符合)\n2.各項儀器設備維護管理相關規章辦法。(符合)\n3.各項儀器設備專責醫工(技術)人員或合作廠商名單或清單。(符合)\n4.各項儀器設備檢查、保養及維修紀錄。(符合)\n5.水質檢測相關紀錄。(符合)\n6.管理成效良好事證。(優良)\n7.備援計畫及演練紀錄。(優良)","cs":"","p":191,"ch":"2.4"},{"n":"2.4.20","tags":[],"t":"透析照護服務之醫療照護品質適當","ev":"目的：訂有透析照護之各項品質指標，並定期監測檢討，確保照護品質。\n符合項目：對90%以上門診透析病人有監測下列指標：1.90%以上血液透析病人 Kt/V≧1.2及URR≧0.65；65%以上腹膜透析病人每週 Kt/V≧1.7。(原2.4.20-符合1修)2.70%以上血液透析病人，65%以上腹膜透析病人，達到血清白蛋白(Albumin)之標準。(原 2.4.20-符合2)3.55歲以下病人移植登錄率≧5%。(原2.4.20-符合4)\n4.腹膜透析比血液透析病人數≧15%。(原2.4.20-優良5)\n優良項目：(下述項目(不含試評項目)僅限一項未達成)1.95%以上血液透析病人 Kt/V≧1.2及URR≧0.65；70%以上腹膜透析病人每週 Kt/V≧1.7。(原2.4.20-優良1修)2.75%以上血液透析病人，70%以上腹膜透析病人，達到血清白蛋白(Albumin)之標準；65%以上透析病人Hb≧10g/ dL。(原2.4.20-優良2修)3.55歲以下病人移植登錄率≧10%。(原2.4.20-優良4)\n4.有提升透析照護品質或病人安全的具體方案，並有成效。(試)\n[註]\n1.血清白蛋白(Albumin)標準：以 BCG 法為≧3.5g/dl，以 BCP 法為≧3.0g/dl。\n2.優良項目 4列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.透析照護規範與作業程序。(符合)\n2.透析單位訂有品質與指標管理的規章，並定期開會，有開會資料備查。(符合)\n3.指標監測紀錄或專案改善會議紀錄。(符合)\n4.透析病人移植登錄資料。(符合)\n5.每月腹膜透析病人的佔率。(優良)\n6.團隊討論會紀錄。(優良)\n7.品質改善方案佐證資料，如：品管圈、專案、得獎紀錄等。(優良)","cs":"符合項目 4 係指腹膜透析人數佔所有透析人數(腹膜透析及血液透析)之比率，公式如下：腹膜透析比率=腹膜透析人數/(腹膜透析人數+血液透析人數)。","p":193,"ch":"2.4"},{"n":"2.4.21","tags":["可"],"t":"慢性呼吸照護病房(RCW)應由適當醫療照護團隊提供呼吸照護服務","ev":"目的：依慢性呼吸照護病房床數配置符合資歷之照護團隊成員，提供適當的照護服務。\n符合項目：\n1.每40 床應有專責內科專科醫師 1名負責每日病房迴診，接受胸腔醫學訓練之內科專科醫師每週迴診三次。(原 2.4.21-符合1)\n2.有內科住院醫師或內科專科醫師負責夜間及假日值班。(原2.4.21-符合2)\n3.每 4 床應有 1 人以上且 50%以上護理人員有 2 年以上臨床護理經驗。(原 2.4.21-符合3)\n4.個案管理師可由呼吸治療師、護理師、或社工師兼任。(原2.4.21-符合4)\n優良項目：(下述項目僅限一項未達成)\n1.每 30 床有接受胸腔醫學訓練之內科專科醫師一名負責每日病房迴診。(原 2.4.21-優良1)\n2.每 3 床應有 1 人以上且 50%以上護理人員有 2 年以上臨床護理經驗。(原 2.4.21-優良3)\n3.個案管理師由呼吸治療師或護理師擔任，有完整之個案管理紀錄。且有定期會議檢討全院個案管理品質。(原 2.4.21-優良4)\n[註]\n1.未登記設有慢性呼吸照護病房(RCW)，可自選本條免評。\n2.人力計算結果不得低於醫療機構設置標準之規定。\n評量方法及建議佐證資料：\n1.本病房各職類人事資料、班表。(符合/優良)\n2.個案管理紀錄。(優良)","cs":"1.符合項目 1所提「專責醫師」，不規範其於單位內執行業務時間，惟須符合評量項目所規定之作業事項。\n2.符合項目 1 及優良項目 1 所提「接受胸腔醫學訓練之內科專科醫師」係指取得內科專科醫師後，取得胸腔暨重症專科醫師證書者。","p":194,"ch":"2.4"},{"n":"2.4.22","tags":["可"],"t":"慢性呼吸照護病房(RCW)應建立呼吸照護服務設施設備管理機制，確實執行","ev":"目的：慢性呼吸照護病房配置適當之設施及設備，並有完善管理機制，確保其功能正常，維護照護品質。\n符合項目：\n1.具下列功能呼吸器比例適當(≧10%)：(原2.4.22-符合1)\n(1)同時具備 A/CMV、SIMV、PS 等呼吸型態設定模式。\n(2)可以監測吐氣潮氣量。\n2.具備血壓、心跳或血氧濃度之生理監視器數量≧床數1/6。(原2.4.22-符合2)\n3.呼吸照護設施設備有定期維修保養紀錄。(原2.4.22-符合3)\n優良項目：(下述項目僅限一項未達成)\n1.具下列功能呼吸器比例適當(≧50%)：(原2.4.22-優良1)\n(1)同時具備 A/CMV、SIMV、PS 等呼吸型態設定模式。\n(2)可以監測吐氣潮氣量。\n2.具備血壓、心跳或血氧濃度之生理監視器數量≧床數1/3。(原2.4.22-優良2)\n3.呼吸照護設備之保養實施分級管理，成效良好。(原2.4.22-優良3)\n[註]\n1.未登記設有慢性呼吸照護病房(RCW)，可自選本條免評。\n2.病床數係以登記開放數計。\n評量方法及建議佐證資料：\n1.呼吸器及監視設備功能型號清單。(符合/優良)\n2.設施設備保養紀錄。(符合/優良)","cs":"","p":195,"ch":"2.4"},{"n":"2.4.23","tags":["可"],"t":"慢性呼吸照護病房(RCW)之醫療照護品質適當","ev":"目的：定期執行呼吸器病人營養狀態及呼吸器脫離再評估等措施，確保照護品質。\n符合項目：\n1.呼吸器病人營養品質：每月有營養師定期訪視；每兩週有定期評估病人體重及營養狀況，含營養診斷、營養介入、評估與監測；每三個月有檢測病人白蛋白及基本電解質狀況。(原2.4.23-符合1)\n2.呼吸器病人治療計畫妥適：病人每兩週有進行呼吸器脫離之再評估，提供適當之復健訓練，對末期病人可提供適當之安寧照護。(原2.4.23-符合2)\n優良項目：(下述項目僅限一項未達成)\n1.呼吸器病人營養品質：每兩週有定期評估病人體重及營養狀況，並能提供適當之營養補充及追蹤調整後成效。依據病人評估狀況照會營養師提供專業之飲食調整。(原2.4.23-優良 1)\n2.呼吸器病人治療計畫妥適(包含呼吸器脫離訓練)，呈現呼吸器脫離訓練成效。(原2.4.23-優良2)\n3.評估病情穩定無法脫離呼吸器病人，下轉居家照護具有成效。(原2.4.23-優良3)\n4.對拒絕氣切病人及家屬有進行積極之溝通及衛教說明。(原2.4.23-優良4)\n5.對末期病人及其家屬提供完整之安寧照護服務。(原2.4.23-優良5)\n[註]未登記設有慢性呼吸照護病房(RCW)，可自選本條免評。\n評量方法及建議佐證資料：\n1.營養師定期訪視紀錄。(符合/優良)\n2.呼吸器脫離評估紀錄。(符合/優良)\n3.拒絕氣切病人衛教紀錄。(優良)\n4.下轉居家照護紀錄。(優良)\n5.安寧照護服務紀錄。(優良)","cs":"","p":196,"ch":"2.4"},{"n":"2.4.24","tags":["可"],"t":"亞急性呼吸照護病房(RCC)應由適當醫療照護團隊提供呼吸照護服務","ev":"目的：依亞急性呼吸照護病房床數配置符合資歷之照護團隊成員，提供適當的照護服務。\n符合項目：\n1.每 24 床有接受胸腔醫學訓練之內科專科醫師 1 名負責診療業務。(原2.4.24-符合1)2.24小時均有受過高級心臟復甦術訓練，並具二年以上執業經驗之醫師值班。(原2.4.24-符合2)\n3.每床應有 1.5 名護理人員且 60%以上具 2 年以上臨床護理經驗。(原2.4.24-符合4)\n4.個案管理師可由呼吸治療師、護理師或社工師兼任，且訂有個案管理之作業流程與規範。(原2.4.24-符合5)\n優良項目：(下述項目須全部達成)\n1.每16 床有接受胸腔醫學訓練之內科專責專科醫師 1名，提供品質優良之呼吸照護。(原2.4.24-優良1)\n2.呼吸治療師或護理師擔任，且有完善之個案管理紀錄，並定期會議檢討全院呼吸照護品質。(原2.4.24-優良3)\n[註]\n1.未登記設有亞急性呼吸照護病房(RCC)，可自選本條免評。\n2.人力計算結果不得低於醫療機構設置標準之規定。\n評量方法及建議佐證資料：\n1.本病床各職類人事資料、班表。(符合/優良)\n2.ACLS 證照。(符合)\n3.個案管理紀錄。(優良)\n4.會議紀錄。(優良)\n5.個案管理作業流程及規範。(符合/優良)","cs":"1.符合項目 2 所提「具二年以上執業經驗之醫師」，係指須取得醫師執照，具有兩年以上執業經驗之醫師即可(可包含 PGY年資)。\n2.優良項目 1所提「專責醫師」，不規範其於單位內執行業務時間，惟須符合評量項目所規定之作業事項。\n3.符合項目 1 及優良項目 1 所提『有接受胸腔醫學訓練之內科專科醫師』係指取得內科專科醫師後，取得胸腔暨重症專科醫師證書者。","p":197,"ch":"2.4"},{"n":"2.4.25","tags":["可"],"t":"亞急性呼吸照護病房(RCC)應建立呼吸照護服務設施設備管理機制，確實執行","ev":"目的：亞急性呼吸照護病房配置適當之設施及設備，並有完善管理機制，確保其功能正常，維護照護品質。\n符合項目：\n1.呼吸器數量(含備機)適當，且都具有容積型及壓力型的呼吸模式。(原2.4.25-符合1修)\n2.每床皆具備血壓、心跳與血氧濃度之生理監視器。(原 2.4.25-符合 2修)\n3.呼吸照護設施設備有定期維修保養紀錄。(原2.4.25-符合3)\n優良項目：(下述項目(不含試評項目)須全部達成)\n1.呼吸照護設備之保養實施分級管理，成效良好。(原2.4.25-優良3)\n2.為因應設施設備發生重大事故，有建立備援計畫或機制，並有演練紀錄。(試)\n[註]\n1.未登記設有亞急性呼吸照護病房(RCC)，可自選本條免評。\n2.病床數係以登記開放數計。\n3.優良項目 2列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.呼吸器及監視設備功能型號清單。(符合)\n2.設施設備保養紀錄。(符合/優良)\n3.備援計畫及演練紀錄。(優良)","cs":"","p":198,"ch":"2.4"},{"n":"2.4.26","tags":["可"],"t":"亞急性呼吸照護病房(RCC)之醫療照護品質適當","ev":"目的：定期執行呼吸器病人營養狀態評估及呼吸器脫離等措施，確保照護品質。\n符合項目：\n1.呼吸器病人營養品質：每兩週有營養師定期訪視；評估病人體重及營養狀況，含營養診斷、營養介入、評估與監測並檢測病人白蛋白及基本電解質狀況。(原2.4.26-符合1)\n2.脫離呼吸器評估計畫及確實執行脫離計畫適當：有訂定單位內呼吸器脫離指引，規範呼吸器脫離訓練流程，且單位內醫師、呼吸治療師、護理師皆能熟悉了解病人之呼吸器脫離方式並能確實執行。(原2.4.26-優良1)\n3.定期檢討院內呼吸器脫離率：呼吸器脫離率平均≧40%。(原2.4.26-符合3)\n4.病情穩定病人能適時即早下轉，降低醫療資源耗損；平均 RCC 住院日數≦35日。(原2.4.26-符合4)\n優良項目：(下述項目(不含試評項目)僅限一項未達成)\n1.定期檢討院內呼吸器脫離率：呼吸器脫離率平均≧50%，且有定期會議檢討單位呼吸器脫離率。(原2.4.26-優良 2)\n2.對於可能需要氣切病人及家屬，有運用醫病共享決策(SDM)模式積極之溝通及衛教說明。(原2.4.26-優良3修)\n3.對於可能需要長期依賴呼吸器病人及家屬，有提供安寧緩和醫療的諮詢服務，必要時召開家庭會議。(試)\n4.有專責人員提供病人相關資源，並協助下轉至後續照護機構。平均RCC 住院日數≦28日。(原2.4.26-優良4修)\n[註]\n1.未登記設有亞急性呼吸照護病房(RCC)，可自選本條免評。\n2.呼吸器脫離成功率之計算方式可參考醫院評鑑持續性監測指標之「HA09-04亞急性呼吸照護病房呼吸器脫離成功率」。\n3.優良項目 3列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.營養師定期訪視紀錄。(符合)\n2.呼吸器脫離評估紀錄。(優良)\n3.拒絕氣切病人衛教紀錄。(優良)\n4.轉介紀錄。(符合/優良)","cs":"","p":199,"ch":"2.4"},{"n":"2.4.27","tags":[],"t":"適當之牙科人力配置，且設有牙科專科或各專業學會認定之診療科","ev":"目的：配置足夠且適當的牙科照護人力，確保照護品質。\n符合項目：\n1.至少應有 6 名牙醫師，其中至少 50%為專任醫師且至少 2 名具負責醫師資格。(原2.4.28-符合2修)\n2.設有診療科 3 科以上，且各診療科應有該科訓練 2 年以上之專任牙醫師1 名(含)以上，其中需包含「牙醫專科醫師分科及甄審辦法」，所訂之口腔顎面外科。(原2.4.28-優良1修)\n3.每 3 台牙科治療台至少應有 1 名經相關訓練之牙科輔助人員。(原2.4.28-符合3修)\n優良項目：(下述項目僅限一項未達成)\n1.設有診療科 5 科以上，且各診療科應有該科訓練 2 年以上之專任牙醫師1 名(含)以上。其中需包含「牙醫專科醫師分科及甄審辦法」所訂之口腔顎面外科。(原2.4.28-優良1修)\n2.每 2 台牙科治療台應有牙科輔助人員 1 名以上，其中每 8 台牙科治療台之輔助人員應包含有 1名護理人員。(原2.4.28-優良2修)\n3.牙科治療台數 20 台(含)以上者，應設有牙體技術室，並有牙體技術師1名(含)以上。(原2.4.28-優良3)\n[註]\n1.診療科係指：(1)全科(一般)牙科、(2)家庭牙醫科、(3)牙體復形科、\n(4)牙髓病科、(5)牙周病科、(6)補綴(膺復)牙科、(7)兒童牙科、(8)齒顎矯正科、(9)口腔顎面外科、(10)口腔病理科/口腔診斷、(11)身心障礙者牙科。\n2.牙科專科係指衛生福利部 112 年 5 月 2 日公告修訂牙醫專科醫師分科及甄審辦法第 6條， 牙醫師之專科分科如下：(1)口腔顎面外科、\n(2)口腔病理科、(3)齒顎矯正科、(4)牙周病科、(5)兒童牙科、(6)牙髓病科、(7)膺復補綴牙科、(8)牙體復形科、(9)家庭牙醫科、(10)特殊需求者口腔醫學科、(11)植牙科、(12)其他經中央主管機關認定之牙醫專科。\n3.符合項目 1所提「具負責醫師資格」，係指牙醫師受滿兩年以上醫師訓練，且能獨立執業者即可認定。\n4.「牙科輔助人員」僅以門診牙科治療台數計算所需之人力；其人員不一定須具備護理人員執照，惟應經過相關訓練或為相關科系畢業(如：口腔衛生學系等)者，由醫院提供相關證明或紀錄即可。前述牙科輔助人員應有實際執行作業(如：門診櫃檯作業、治療前口腔清潔、清洗器械、傳遞器械等)始可認列人力。\n5.「各診療科應有該科訓練 2 年以上之專任牙醫師 1 名(含)以上」，係指牙醫師應於該診療科有 2 年以上之訓練或服務，醫院能提出證明即可。\n6.優良項目 3所提「牙體技術室」，依據醫療機構設置標準，應具下列設施：\n(1)有明顯區隔之獨立作業場所。\n(2)明顯劃分成品區，並設有清洗設備、污物處理設備、吸塵設備及金屬、石膏研磨機。\n(3)有通風設備、防塵及採光照明設備。\n(4)其他足以執行牙體技術業務之設備及保存執行業務紀錄之設施。\n評量方法及建議佐證資料：\n1.檢視牙科人力配置表及相關證書、證明。(符合/優良)","cs":"","p":201,"ch":"2.4"},{"n":"2.4.28","tags":[],"t":"牙醫部門應有完備之設施、設備、儀器，並確實執行保養管理及清潔管理","ev":"目的：配置足夠數量的牙科照護設施、設備及儀器，並有妥善管理機制，確保其功能正常，維護照護品質。\n符合項目：\n1.至少應設有牙科治療台 6 台以上，且牙科治療台附近設有濕洗手設備。(原 2.4.29-符合1 修)\n2.設有治療區、候診區、掛號(報到)櫃檯、器械整備區；診療區內應有適宜之空間區隔。(原2.4.29-符合2)\n3.依診療科別備有適當且足夠並符合感染控制要求之醫療設備。(原2.4.29-符合3修)\n4.儀器設備應有清潔、感染控制、檢查、保養及維修，且有紀錄可查。(原2.4.29-符合4修)\n5.放射線之儀器設備應符合游離輻射防護法之規定，且對於牙科門診之放射作業訂有安全作業指引且符合資訊安全要求，包含照射人員資格及操作規範、設備之定期安全檢測、牙科病人照射應注意事項等。(原 2.4.29-符合5 修)\n優良項目：(下述項目僅限一項未達成)\n1.病歷、影像及醫材管理制度完備，能有效提供醫療照護業務之需要，且有紀錄可查且符合資訊安全要求。(原2.4.29-優良1修)\n2.建立合適與有效的備援機制及處理流程，以利因應突發狀況。(原2.4.29-優良3)\n3.完成影像數位化系統，並定期檢討系統之缺失、維修與資訊安全措施，且有完備紀錄可查。(原2.4.29-優良4)\n[註]\n符合項目 5所提「照射人員資格」係指取得(1)放射性物質可發生游離輻射設備操作執照、(2)輻安證書、(3) 18 小時輻射防護訓練結業證書等其一證書之牙醫師、放射師及實習牙醫學生；惟實習牙醫學生若取得該其一證書，仍須經由取得證書之醫師或放射師在旁指導。\n評量方法及建議佐證資料：\n1.觀察診療環境的空間與規劃。(符合)\n2.檢視相關設備與儀器及清潔、保養紀錄。(符合)\n3.查閱放射安全作業指引。(符合)\n4.查閱病歷及醫材管理紀錄。(優良)\n5.訪談主管備援機制及處理流程。(優良)\n6.檢視影像數位化系統定期檢討、維修紀錄。(優良)\n7.照射人員資格相關資料。(優良)","cs":"","p":202,"ch":"2.4"},{"n":"2.4.29","tags":[],"t":"牙醫部門具有完備之品質管理政策及病人安全措施","ev":"目的：制訂完備的牙科照護品管政策及病安措施，確保其醫療品質與病人安全。\n符合項目：\n1.依照牙科照護特性，訂有適用的品質管理政策與程序。(原2.4.31-符合1)\n2.應針對各牙科診療科之不同治療屬性，訂定病人安全作業指引，以保障病人安全及治療品質。(原2.4.31-符合 2)\n3.在「防止意外吞入之安全作業指引」，載明防止意外吞入事件及其醫療處置之標準作業流程。(原2.4.31-符合3)\n4.執行口腔手術前，醫師應詳盡說明，且由病人簽具同意書；並訂有病人辨識及部位確認機制。(原2.4.31-符合 4)\n5.牙科治療區內備有足夠之氧氣及急救設備，其功能及供應正常，且人員能正確操作。(原2.4.31-符合5)\n優良項目：(下述項目僅限一項未達成)\n1.訂有牙科品質監測機制，定期檢討、改善，成效良好。(原2.4.31-優良1)\n2.針對牙科品質管理政策與程序以及病人安全作業指引，定期評估、檢討及修訂，並傳達給同仁周知且落實執行。(原2.4.31-優良2)\n3.在執行口腔手術前，應有「作業靜止期」(time-out)之程序，並紀錄完整。(原2.4.31-優良3)\n[註]\n1.符合項目 1所提「訂有適用的品管政策與程序」，係指醫院針對目前牙科照護現況所需，訂定及規劃相關之品管政策與程序，如：(1)一般通則、病歷管理及牙科業務諮詢窗口、(2)牙科感染管制安全作業指引、(3)牙周病統合照護計畫、(4)牙科醫療機構重大事件緊急應變作業指引、(5)防止意外吞入之安全作業指引、(6)隱私維護等。\n2.醫療法第 64 條第 1 項規定：「醫療機構實施中央主管機關規定之侵入性檢查或治療，應向病人或其法定代理人、配偶、親屬或關係人說明，並經其同意，簽具同意書後，始得為之。但情況緊急者，不在此限。」\n3.符合項目 4所提「執行口腔手術」，係包含：人工牙根植入術、單純齒切除術、複雜齒切除術，另，口腔顎面外科手術及牙周病手術亦須比照辦理。\n4.優良項目 3所提「執行口腔手術」，應有「作業靜止期」(time-out)之程序，包括：\n(1)先由操作者或助手相互核對病人身分(如病人姓名及出生年月日)。\n(2)病人身分確認無誤後，核對病歷上記載之手術部位及術式、X 光片上之部位。\n(3)確認手術文件(如手術同意書、手術說明書或局部麻醉同意書等)簽署之完整性。\n(4)確認手術器械之完備性。\n(5)確認預防性抗生素施打之必要性；如需施打，則需確認完成施打之時間。\n(6)上述步驟完成後，應由參與人員簽名，然後進行手術作業。\n評量方法及建議佐證資料：\n1.檢視品管政策與程序。(符合)\n2.查閱牙科病人安全作業指引。(符合)\n3.查閱防止意外吞入之標準作業流程。(符合)\n4.急救設備的點班、檢測紀錄及操作示範。(符合)\n5.病歷紀錄與口腔手術的同意書及紀錄。(符合/優良)\n6.檢視品管政策、程序及病安作業指引修訂紀錄。(優良)\n7.查閱品質監測之紀錄。(優良)","cs":"符合項目 5 所提牙科治療區內之「急救設備」醫院可自行規範。","p":204,"ch":"2.4"},{"n":"2.4.30","tags":[],"t":"設置特殊需求者牙科門診，並提供適切之服務","ev":"目的：為維護特殊需求者之牙科就醫權益，依個別需求提供適切的醫療設備及服務。\n符合項目：\n1.應設置獨立之特殊需求者牙科門診，每週達 2 診次以上，並設有特殊需求者服務窗口，有適當之人員，提供引導、溝通、協助就醫等服務。(原2.4.32-符合 1修)\n2.特殊需求者牙科門診應提供臨櫃、語音及網路掛號服務。(原2.4.32-符合2 修)\n3.特殊需求者牙科門診應有適合輪椅乘坐者使用之櫃台，及方便輪椅、推床進出之適當空間；櫃台及進出動線應有明顯之引導標示。(原2.4.32-符合3修)\n4.訂有特殊需求者牙科門診跨醫療科別之會診流程。(原 2.4.32-符合 4修)\n5.對治療後的病人提供適當之衛教指導。(原 2.4.32-符合5)\n優良項目：(下述項目僅限一項未達成)\n1.具備特殊需求者牙科完整訓練資格之專任牙醫師至少 1 名或兼任牙醫師至少 2 名，且至少 1 人具有 ALS 證書資格。(原 2.4.32-優良 1修)\n2.特殊需求者牙科門診得視照護需要，由科內各診療科依其專長提供醫療支援。(原2.4.32-優良2修)\n3.醫院應設置鎮靜/全身麻醉室，可供特殊需求者進行鎮靜/全身麻醉下之牙科醫療，並由麻醉專科醫師提供全身麻醉服務。(原2.4.32-優良3修)\n4.設有特殊需求者牙醫醫療轉診流程。(原2.4.32-優良4修)\n5.設有發展遲緩者牙醫醫療轉診流程，與院內小兒科、院內外聯合評估中心或發展遲緩療育單位有合作機制。(原2.4.32-優良5)\n[註]\n1.「獨立之特殊需求者牙科門診」係指門診時刻表上揭示之診療科別，於該診療時段、空間、地點僅提供予特殊需求者使用，且負責特殊需求者牙科診次的牙醫師不得於同時段並掛診兩科。\n2.「具備特殊需求者牙科完整訓練資格」係指牙醫師須接受相關專業學會或醫院自行舉辦之訓練，且取得證書或訓練學分者(如醫院自行舉辦課程，須經相關專業學會認定之)。\n評量方法及建議佐證資料：\n1.查閱牙科門診表。(符合)\n2.觀察特殊需求者牙科門診環境、空間、動線與標示。(符合)\n3.檢視跨醫療科別的會診流程與衛教指導單張。(符合)\n4.檢視牙醫師訓練證明及 ALS 證書。(優良)\n5.檢視鎮靜/全身麻醉室及麻醉執行的狀況。(優良)\n6.檢視特殊需求者牙醫轉診流程。(優良)\n7.檢視發展遲緩者牙醫醫療轉診流程與相關單位合作機制。(優良)","cs":"","p":206,"ch":"2.4"},{"n":"2.4.31","tags":["可"],"t":"適當之中醫人力配置及訓練","ev":"目的：依中醫服務科別及服務量，配置符合資格之中醫師、護理人員及中藥調劑人員，從事醫療業務。\n符合項目：\n1.至少具有 2個診療科。(試)\n2.中醫師：(原2.4.33-符合1修)\n(1)經 2 年以上訓練之專任中醫師 4人(含)以上。\n(2)若有設置中醫病床則每 10床應有中醫師 1名以上。\n3.中藥調劑人員：濃縮中藥調劑作業，每月處方箋總數平均每日 60張，應有1 名以上藥事人員。(原2.4.33-符合2 修)\n4.護理人員：每診療室應有 1名以上。(原2.4.33-符合3)\n優良項目：(下述項目僅限一項未達成)\n1.中醫師須符合：(原2.4.33-優良1修)\n(1)具有 4個診療科以上。\n(2)有執行一年以上傷科專職業務之專任中醫師 1名以上。\n2.中藥調劑人員：(原2.4.33-優良2修)\n(1)人力需符合以下 4項條件：(原2.4.33-優良 2修)濃縮中藥調劑作業，每月處方箋總數平均每日 50張，應有1名以上藥師。飲片中藥調劑作業，每月處方箋總數平均每日 20張，應有1名藥師。有中醫會診或住院作業，濃縮中藥每月處方箋總數平均每日 30張，飲片煎劑每月處方箋總數平均每日 10張，應有1名藥師。藥品管理及藥物諮詢，至少需 1名藥師。\n(2)需有飲片中藥調劑人員。\n3.中醫護理人員至少應有 75%以上完成中醫基本護理訓練(七科九學分)合格認證。(原2.4.33-優良3修)\n4.訂有在職進修辦法，能有計畫派員參與院外教育訓練活動，成果顯著。(原 2.4.33-優良4)\n[註]\n1.中醫部門未達 4名中醫師者，本條免評。\n2.專任中醫師係指執業登記於本院之醫師，且開診數多於其他醫療機構之支援業務。\n3.診療科別指內科、外科、眼科、兒科、婦科、傷科、針灸科、痔科。\n4.中藥調劑人員包括中醫師、修習中藥課程達適當標準之藥師及藥事法第一百零三條第一項所定人員等三類。\n5.中醫護理人員完成七科九學分人數比例=中醫護理部門完成七科九學分護理人員人數÷中醫護理部門護理人員總人數×100%。\n6.符合項目 1列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.中醫師、中藥調劑人員及護理人員人力配置。(符合/優良)\n2.中藥調劑人員修習中藥課程及護理人員修習中醫基本護理訓練(七科九學分)合格認證證明。(符合/優良)\n3.在職進修辦法及成效。(優良)","cs":"","p":208,"ch":"2.4"},{"n":"2.4.32","tags":["可"],"t":"應由適當中醫醫療團隊提供中醫及跨團隊醫療照護","ev":"目的：建置明確的中西醫會診、中醫轉診及中醫住院病人之照護流程，維護治療品質。\n符合項目：\n1.明訂中西醫會診治療模式，建置適當會診流程等相關規定。(原2.4.34-符合1)\n2.明訂中醫轉診治療模式，建置適當轉診流程等相關規定。(原2.4.34-符合2)\n優良項目：(下述項目(不含試評項目)須全部達成)\n1.落實會診(轉診)流程等相關規定，且會診(轉診)結果具時效性及持續性。(原 2.4.34-優良1)\n2.建置適當中西醫共同照護流程等相關規定並予落實，且結果具時效性及持續性。(原2.4.34-優良2修)\n3.中西醫跨領域團隊照護合作良好，有具體成效。(試)\n[註]\n1.中醫部門未達 4名中醫師者，本條免評。\n2.會診係指西醫與中醫間會診治療模式；轉診係指中醫與中醫跨科之轉診治療模式。\n3.優良項目 3列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.中西醫會診流程及規範。(符合)\n2.中醫轉診流程及規範。(符合)\n3.中西醫共同照護流程。(符合/優良)\n4.病歷紀錄。(符合/優良)\n5.中西醫跨領域團隊照護具體成效之事證。(優良)","cs":"","p":209,"ch":"2.4"},{"n":"2.4.33","tags":["可"],"t":"中醫部門應有完備之設施、設備、儀器，並確實執行保養管理及清潔管理","ev":"目的：配置完備之中醫醫療設施、設備及儀器，並有妥善管理機制，確保其功能正常，維護病人隱私及照護品質。\n符合項目：\n1.應有獨立診療室及候診場所，並有適當維護隱私之設施。(原2.4.35-符合1)\n2.儀器、設備適當、足夠，並有清潔、檢查、保養、校正及維修管理，且有紀錄可查。(原2.4.35-符合2修)\n3.訂有故障時之因應規範，如：故障排除步驟及夜間、假日時故障的維修聯絡方式。(試)\n優良項目：(下述項目須全部達成)\n1.設備及機器運作良好，並針對設施、設備、儀器所致之病人安全事件進行檢討及改善。(原2.4.35-優良1修)\n2.針對環境安全及空氣清潔方面，有明確處理措施及辦法，以提供舒適之診療環境。(原2.4.35-優良2修)\n[註]\n1.中醫部門未達 4名中醫師者，本條免評。\n2.中醫部門各種設備及機器，係如：針傷處置使用之電針機、遠紅外線機、薰洗機、雷射針灸機及中醫輔助診斷醫療儀器(脈診儀、舌診儀、聞診儀)等。\n3.符合項目 3列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.中醫部門各種設備及機器保養規範。(符合)\n2.故障時之因應規範。(符合)\n3.中醫部門病人安全事件檢討分析報告。(優良)\n4.診區環境空氣檢測報告。(優良)","cs":"","p":210,"ch":"2.4"},{"n":"2.4.34","tags":["可"],"t":"中醫部門具有完備的病人安全措施","ev":"目的：制訂中醫醫療安全作業規範，以利工作人員遵循，確保病人安全。\n符合項目：\n1.依「中醫醫療院所安全作業參考指引」擬訂單位的照護安全作業規範，供人員查詢、執行。(原2.4.36-符合1)\n2.對於針刺及特殊療法事件之預防及處置訂有作業流程及規範。(原2.4.36-符合2)\n3.對異常事件有進行通報，並有進行原因分析及檢討。(原2.4.36-優良3修)\n4.治療區內備有足夠之氧氣及急救設備，其功能及供應正常，且人員能正確操作。(原2.4.36-符合3)\n優良項目：(下述項目(不含試評項目)須全部達成)\n1.上述作業規範步驟定期檢討修訂，並有代表參與全院醫品病安相關會議。(原2.4.36-優良 1修)\n2.對於異常事件之發生有改善措施且落實執行，成效良好。(原2.4.36-優良2 修)\n3.對中醫常見之醫療不良事件，有具體有效之防範措施，並落實執行。(試)\n[註]\n1.中醫部門未達 4名中醫師者，本條免評。\n2.中醫醫療不良事件係指遺針、斷針、針刺後血腫、氣胸等情形。\n3.「特殊療法」係指穴位埋線、皮內針、小針刀及放血等處置。\n4.優良項目 3列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.中醫安全作業參考指引。(符合)\n2.中醫醫療異常事件(不良事件)通報紀錄。(符合)\n3.急救設備的點班、檢測紀錄及操作示範。(符合)\n4.中醫醫療異常事件(不良事件)檢討會議紀錄。(優良)\n5.防範不良事件的具體事證。(優良)","cs":"符合項目 4 所提治療區內之「急救設備」醫院可自行規範。","p":211,"ch":"2.4"},{"n":"2.5.1","tags":[],"t":"藥劑部門之設備及設施應符合業務所需，並妥善保養及維護","ev":"目的：藥劑部門應有安全合宜的環境及完備的設施設備，保障藥事作業品質。\n符合項目：\n1.應有足夠之空間、設備以提供藥事作業。(原2.5.1-符合1)\n2.工作場所之環境，如空調、採光(照明)及作業動線等皆適當，減少發生調劑錯誤可能性。(原2.5.1-符合2)\n3.應有獨立之藥品儲存空間、配以適當的空調及安全設施。(原 2.5.1-符合3)\n4.藥品冷藏用之冰箱，應隨時維持適當的溫度，備有不斷電裝置或接緊急電源，且有溫度紀錄。(原2.5.1-符合4)\n5.藥事作業使用之資訊軟體、硬體設備應符合需求。(原 2.5.1-優良 1修)\n優良項目：(下述項目(不含試評項目)須全部達成)\n1.調劑室視需要設置收塵設備、局部排氣等設備，定期保養及檢查並有紀錄可查。(原2.5.1-優良2修)\n2.導入自動化與資訊化系統以提升藥事作業效率與減少調劑錯誤，成效良好。(試)\n[註]\n1.「獨立之藥品儲存空間」係指存放藥品的空間內應只存放藥品，儘量勿再堆放其他雜物。\n2.藥品儲存空間/盒/箱之標示應與所存放之藥品一致。\n3.優良項目 2列為試評項目，評量結果不納入評鑑成績計算。\n評量方法及建議佐證資料：\n1.藥品冷藏用冰箱溫度查核紀錄。(符合)\n2.藥品資訊軟體及硬體設備。(符合)\n3.調劑室收塵設備、局部排氣設備等之定期保養及檢查紀錄。(優良)","cs":"如醫院有提供藥品磨粉服務，皆應注意藥物調劑環境之清潔，避免微生物或塵粒等之污染，以維護病人安全。","p":213,"ch":"2.5"},{"n":"2.5.2","tags":[],"t":"管制藥品相關作業規範適當，並有具體成效","ev":"目的：醫院之管制藥品使用應符合法規及病人臨床需要。\n符合項目：\n1.訂有符合法規之管制藥品使用管理機制。\n2.應制訂管制藥品異常情況之通報(包含程序及時限)、監測、檢討改善及追蹤機制。\n3.落實非癌症慢性頑固性疼痛病人長期使用成癮性麻醉藥品之定期臨床評估。\n優良項目：(下述項目須全部達成)\n1.對有長期使用管制藥品有成癮疑慮之個案，醫院之處方醫令系統或類似機制，應有效限制個案取得相關藥品。\n2.對容易濫用或成癮之管制藥品，醫院訂有政策與使用指引，以避免濫用管制藥品。\n[註]\n1.管制藥品管理需符合管制藥品管理條例及施行細則規定。\n2.管制藥品管理條例及施行細則規定：(原2.5.2-註3)\n(1)第一級至第三級管制藥品設有專櫃加鎖儲藏。\n(2)使用第一級至第三級管制藥品之醫師應領有管制藥品使用執照，並開立管制藥品專用處方箋。\n(3)調劑、使用後之殘餘管制藥品，由管制藥品管理人會同有關人員銷燬，並製作紀錄備查。\n(4)訂有管制藥品遺失、失竊或破損時的處理作業程序，予以記錄、呈報，並有紀錄可查。\n3.本條所稱異常情況包含違反法規、不符合管制藥品使用指引及注意事項、不當處方等。\n評量方法及建議佐證資料：\n1.管制藥品管理相關作業規範。(符合)\n2.管制藥品異常情況之通報、監測、檢討改善及追蹤之紀錄。(符合)\n3.非癌症慢性頑固性疼痛病人管制藥品使用之定期臨床評估紀錄。(符合)\n4. 醫院之處方醫令系統或類似機制，可以有效限制長期使用管制藥品有成癮疑慮個案取得相關藥品之紀錄。(優良)\n5.醫院避免管制藥品濫用之政策與使用指引。(優良)","cs":"單位使用後之殘餘管制藥品有會同有關人員(如：護理師)，雙人互證之後丟棄、並簽章；惟最後應由管制藥品管理人蓋章，以符合管制藥品管理條例之規定。","p":214,"ch":"2.5"},{"n":"2.5.3","tags":["合"],"t":"藥事委員會運作良好，並有具體成效","ev":"目的：藥事委員會功能運作良好，落實監督管理藥事作業。\n符合項目：\n1.藥事委員會有適當組織並訂有章程。(原2.5.2-符合1)\n2.藥事委員會成員應涵蓋藥劑、醫療及管理部門。(原2.5.2-符合2)\n3.藥事委員會定期開會並留有紀錄。(原2.5.2-符合3)\n4.定期檢討不適用藥品，並維持適當藥品種類。(原2.5.2-符合4修)\n5.藥事委員會應訂有符合規定之藥品使用、管理標準與規定，包含一般藥品及特殊藥品。(原2.5.2-符合5)\n6.藥劑部門分析藥品使用趨勢資訊作為醫院用藥之參考，並有檢討改善措施。(原2.5.2-符合 6)\n7.醫院應制訂藥物(藥品及醫療器材)不良反應及異常情況之通報(包含程序及時限)、監測、檢討改善及追蹤機制。(原2.5.2-符合7)\n[註]\n1.本條所稱藥品包含一般藥品、管制藥品、高警訊藥品、疫苗、血液製劑、生物製劑等。\n2.一般及特殊藥品管理均應依政府相關規定辦理，如：管制藥品管理需符合管制藥品管理條例及施行細則規定；放射性製劑及化療藥品之儲存、運送、配置及廢棄物處理，應符合相關法規並定有規章規範。\n3.本條所稱異常情況包含處方錯誤、調劑錯誤、給藥錯誤。\n4.藥物不良反應通報內容應包含：藥品、醫療器材不良反應及不良品通報。\n評量方法及建議佐證資料：\n1.藥事委員會組織章程。(符合)\n2.藥事委員會會議紀錄。(符合)\n3.藥品管理作業規範。(符合)\n4.藥物不良反應及異常事件通報紀錄。(符合)","cs":"","p":216,"ch":"2.5"},{"n":"2.5.4","tags":[],"t":"應有藥品識別方法、步驟、及作業程序","ev":"目的：藥劑部門應定期檢討藥品辨識及防誤機制，減低調劑異常。\n符合項目：\n1.應明訂藥品識別方法、步驟及作業程序。(原2.5.3-符合1)\n2.應定期檢討藥品外觀、包裝、標示或名稱發音相似的藥品清單，並注意其擺設位置及標示，加強人員教育，避免發生錯誤。(原 2.5.3-符合2)\n3.對於高警訊藥品應訂有管理機制，與其他常備藥品區隔存放並明顯標示，且在處方或藥袋上有特殊標記以供辨識。(原2.5.3-符合3)\n4.藥品最小單位包裝應有藥名、單位含量(針劑標示有效期限)。(原2.5.3-符合 4)\n優良項目：(下述項目僅限一項未達成)\n1.處方時藥名同時顯示商品名、成分名(複方藥品除外)及單位含量。電腦處方時，醫師能迅速點選顯示藥品外觀，方便向病人說明。(原2.5.3-優良 1)\n2.藥劑部門內調劑台上之藥品以原瓶、原包裝上架為原則。若需分裝，應在分裝容器上清楚標示藥名、單位含量、保存方式及使用期限。(原2.5.3-優良2)\n3.藥袋之標示完整，符合衛生福利部公告規定並加印中文藥名及藥袋上印有藥品外觀之描述，並考量特殊需求族群之用藥安全，提供輔助說明，如：「圖示」或放大字體版之藥袋或衛教單張。(原2.5.3-優良3)\n4.有考量兒童用藥的安全性，提供兒童專用藥。(
